<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AJ Power ERP - Enterprise Core System</title>
<style>
:root{
  --bg:#F6F9FB; --card:#FFFFFF; --ink:#081822; --muted:#465865; --faint:#7B8D9B;
  --line:#D3E0EA; --line-2:#ECF3F8; --input:#D9E7F1;
  --brand:#00877B; --brand-dark:#006C61; --brand-soft:#DDF0ED;
  --ok:#179765; --ok-soft:#DCF3E8; --warn:#D58D25; --warn-soft:#FCEFDC;
  --bad:#D74745; --bad-soft:#FBE3E3;
  --r:8px; --r-lg:12px; --r-pill:999px;
  --sh:0 2px 8px rgba(8,24,34,.06);
  --sh-lg:0 8px 24px rgba(8,24,34,.14);
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:13px;line-height:1.5}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
.sidebar{background:#041E2F;color:#CFDCE5;padding:18px 0;display:flex;flex-direction:column}
.sidebar .brand{padding:0 20px 18px;font-size:16px;font-weight:800;color:#fff;border-bottom:1px solid #13334A;display:flex;align-items:center;gap:8px}
.sidebar nav{margin-top:14px;display:flex;flex-direction:column}
.sidebar a{padding:10px 20px;display:flex;align-items:center;gap:10px;color:#9AB1C2;text-decoration:none;font-weight:600;font-size:12.5px;cursor:pointer}
.sidebar a:hover,.sidebar a.on{background:#082B42;color:#fff}
.sidebar a.on{border-left:3px solid var(--brand)}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{height:54px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 24px;gap:14px}
.content{padding:24px;max-width:1300px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:18px}

.mono{font-variant-numeric:tabular-nums;font-family:monospace}
.rt{text-align:right}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh);overflow:hidden}
.card header{padding:14px 18px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:10px}
.card header h3{margin:0;font-size:14.5px;font-weight:700}
.sp{flex:1}
.pad{padding:18px}

.inp{width:100%;border:1px solid var(--input);border-radius:var(--r);padding:8px 11px;font-size:13px;outline:none;background:#fff}
.inp:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.btn{border:1px solid var(--line);background:#fff;border-radius:var(--r);padding:8px 14px;font-weight:600;font-size:12.5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn.pri{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.sm{padding:4px 8px;font-size:11.5px}

.tag{display:inline-flex;align-items:center;padding:2px 8px;border-radius:var(--r-pill);font-size:11px;font-weight:700}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}

table{width:100%;border-collapse:collapse}
th{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:9px 12px;border-bottom:1px solid var(--line);background:#FBFDFE;text-align:left}
td{padding:9px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.tw{overflow-x:auto}
.banner{padding:12px 16px;border-radius:var(--r);font-size:13px;display:flex;align-items:center;gap:10px;background:var(--brand-soft);border:1px solid #B8E5DF;color:var(--brand-dark)}

/* Pipeline Steps */
.pipeline{display:flex;align-items:center;padding:14px 18px;background:#FAFDFD;border-top:1px solid var(--line-2);gap:6px}
.pipe-step{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--muted)}
.pipe-step .dot{width:20px;height:20px;border-radius:50%;background:var(--line);color:#fff;display:grid;place-items:center;font-size:11px}
.pipe-step.done{color:var(--ink)}
.pipe-step.done .dot{background:var(--ok)}
.pipe-step.now{color:var(--brand)}
.pipe-step.now .dot{background:var(--brand)}
.pipe-line{flex:1;height:2px;background:var(--line);margin:0 4px}
.pipe-line.done{background:var(--ok)}

/* Slide Out Drawers */
.drawer-scrim{position:fixed;inset:0;background:rgba(8,24,34,.4);opacity:0;pointer-events:none;transition:opacity .2s;z-index:90}
.drawer-scrim.active{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:-720px;width:min(700px,100%);height:100vh;background:#fff;box-shadow:var(--sh-lg);z-index:100;display:flex;flex-direction:column;transition:right .25s ease-out}
.drawer.active{right:0}
.drawer header{padding:18px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.drawer .drawer-body{flex:1;overflow-y:auto;padding:20px 24px;background:var(--bg);display:flex;flex-direction:column;gap:16px}
.close-btn{border:0;background:var(--line-2);border-radius:var(--r);width:30px;height:30px;cursor:pointer;display:grid;place-items:center}
</style>
</head>
<body>

<div class="app">
  <!-- Navigation Sidebar -->
  <aside class="sidebar">
    <div class="brand">⚡ AJ POWER ERP</div>
    <nav id="navMenu">
      <a class="on" onclick="navigate('site_wo')">1. Site & Work Order</a>
      <a onclick="navigate('boq_breakdown')">2. Pure Qty BOQ</a>
      <a onclick="navigate('site_indent')">3. Site Indent (PRN)</a>
      <a onclick="navigate('procure_po')">4. Procurement PO</a>
      <a onclick="navigate('store_grn_dc')">5. Store GRN & Issue</a>
      <a onclick="navigate('site_store')">6. Daily Site Store</a>
      <a onclick="navigate('client_bill')">7. Client RA Billing</a>
      <a onclick="navigate('reconciliation')">8. Stock Reconciliation</a>
    </nav>
  </aside>

  <!-- Main View Area -->
  <div class="main">
    <header class="topbar">
      <b>Branch: Hyderabad (HYD)</b>
      <div class="sp"></div>
      <div>User: <b>Imran Sheikh (Project Manager)</b></div>
    </header>

    <div class="content" id="mainContent">
      <!-- Injected Views -->
    </div>
  </div>
</div>

<!-- UNIVERSAL SLIDE DRAWER -->
<div class="drawer-scrim" id="drwScrim" onclick="closeDrawer()"></div>
<aside class="drawer" id="sideDrawer">
  <header>
    <div id="drwIcon" style="font-size:22px">📦</div>
    <div>
      <h3 id="drwTitle">Drawer</h3>
      <p id="drwSub" style="color:var(--muted);font-size:12px;margin:2px 0 0">Traceability Record</p>
    </div>
    <div class="sp"></div>
    <button class="close-btn" onclick="closeDrawer()">✕</button>
  </header>
  <div class="drawer-body" id="drwBody"></div>
</aside>

<script>
const money = v => '₹' + (+v||0).toLocaleString('en-IN', {minimumFractionDigits:2, maximumFractionDigits:2});

// SYSTEM STATE DATA STORAGE
let STATE = {
  activeSite: {
    id: "ST-HYD-01",
    name: "GMR Aerocity — Block C",
    branch: "HYD",
    client: "GMR Infra Ltd",
    billingAddress: "Survey No 99, Shamshabad International Airport Zone, Hyderabad, Telangana 500081",
    storeId: "GD-SITE-01",
    storeName: "GMR Aerocity - Site Store",
    storekeeper: "Sunil More",
    pm: "Imran Sheikh"
  },
  workOrder: {
    woNo: "GMR/EL/2026/114",
    lines: [
      { id: "W1", sno: 1, scope: "Primary Point wiring in 25mm PVC conduit with 6A switch", uom: "Point", contractQty: 100, estQty: 105, supplyRate: 1300, instRate: 200, billedQty: 0 },
      { id: "W2", sno: 2, scope: "Installation of 18W Commercial LED Recessed Downlights", uom: "Nos", contractQty: 50, estQty: 52, supplyRate: 1400, instRate: 150, billedQty: 0 }
    ]
  },
  boqBreakdown: {
    "W1": [
      { itemId: "SWG-0001", ratio: 1.0 },  // 1 switch per point
      { itemId: "CVL-0001", ratio: 3.5 },  // 3.5m conduit per point
      { itemId: "CBL-0001", ratio: 12.0 }  // 12m wire per point
    ],
    "W2": [
      { itemId: "LIT-0001", ratio: 1.0 }   // 1 downlight per unit
    ]
  },
  itemMaster: {
    "SWG-0001": { code: "SWG-0001", name: "6A Modular Switch with Plate", uom: "Nos", storeRate: 110.00 },
    "CVL-0001": { code: "CVL-0001", name: "25mm Heavy Duty PVC Conduit", uom: "Mtr", storeRate: 45.00 },
    "CBL-0001": { code: "CBL-0001", name: "1.5 sqmm Copper FRLS Wire", uom: "Mtr", storeRate: 28.50 },
    "LIT-0001": { code: "LIT-0001", name: "18W Commercial LED Downlight", uom: "Nos", storeRate: 950.00 }
  },
  centralStoreStock: { "SWG-0001": 200, "CVL-0001": 600, "CBL-0001": 1500, "LIT-0001": 80 },
  siteStoreStock: { "SWG-0001": 0, "CVL-0001": 0, "CBL-0001": 0, "LIT-0001": 0 },
  indentedTotals: { "SWG-0001": 0, "CVL-0001": 0, "CBL-0001": 0, "LIT-0001": 0 },
  dailyWorkerTransactions: [
    { date: "2026-09-10 10:00", worker: "Ramesh Kumar (Electrician)", itemId: "SWG-0001", type: "ISSUE", qty: 25, rate: 110.00 },
    { date: "2026-09-10 16:30", worker: "Ramesh Kumar (Electrician)", itemId: "SWG-0001", type: "RETURN", qty: 2, rate: 110.00 }
  ]
};

let currentTab = "site_wo";

function navigate(tab) {
  currentTab = tab;
  document.querySelectorAll("#navMenu a").forEach((a, i) => a.classList.toggle("on", a.getAttribute("onclick").includes(tab)));
  render();
}

function render() {
  const container = document.getElementById("mainContent");
  if (currentTab === "site_wo") renderSiteWoView(container);
  else if (currentTab === "boq_breakdown") renderBoqView(container);
  else if (currentTab === "site_indent") renderIndentView(container);
  else if (currentTab === "procure_po") renderPoView(container);
  else if (currentTab === "store_grn_dc") renderStoreMoveView(container);
  else if (currentTab === "site_store") renderSiteStoreView(container);
  else if (currentTab === "client_bill") renderClientBillView(container);
  else if (currentTab === "reconciliation") renderReconView(container);
}

// 1. SITE & WO VIEW
function renderSiteWoView(c) {
  c.innerHTML = `
    <div class="banner"><span>⌂</span><div>Site Created & Linked Store Auto-Generated: <b>${STATE.activeSite.name}</b> (Store: <b>${STATE.activeSite.storeName}</b>)</div></div>
    <div class="card">
      <header><h3>Step 1 & 2: Client Work Order Details (Commercial Ceiling)</h3><div class="sp"></div><span class="tag ok">WO Locked</span></header>
      <div class="tw">
        <table>
          <thead>
            <tr><th>#</th><th>Client Tender Scope</th><th>Unit</th><th class="rt">Contract Qty</th><th class="rt">Est. Qty</th><th class="rt">Supply Rate</th><th class="rt">Inst. Rate</th><th class="rt">Total Contract Val</th></tr>
          </thead>
          <tbody>
            ${STATE.workOrder.lines.map(w => `
              <tr>
                <td><b>${w.sno}</b></td>
                <td><b>${w.scope}</b></td>
                <td>${w.uom}</td>
                <td class="rt mono">${w.contractQty}</td>
                <td class="rt mono"><b>${w.estQty}</b></td>
                <td class="rt mono">${money(w.supplyRate)}</td>
                <td class="rt mono">${money(w.instRate)}</td>
                <td class="rt mono"><b>${money(w.contractQty * (w.supplyRate + w.instRate))}</b></td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
      <div class="pad" style="display:flex;justify-content:flex-end">
        <button class="btn pri sm" onclick="navigate('boq_breakdown')">View Pure Quantity BOQ Breakdown ›</button>
      </div>
    </div>
  `;
}

// 2. PURE QTY BOQ BREAKDOWN
function renderBoqView(c) {
  c.innerHTML = `
    <div class="banner"><span>▤</span><div><b>Pure Quantity Execution Schedule (BOM)</b> — Zero rate fields. Multipliers drive child item quantities from parent WO quantities.</div></div>
    <div class="card">
      <header><h3>Allocated Items by Work Order Scope</h3><div class="sp"></div><span class="tag ok">BOQ Locked</span></header>
      <div class="tw">
        <table>
          <thead>
            <tr><th>WO Line</th><th>Allocated Component Item</th><th>UOM</th><th class="rt">Qty / WO Unit</th><th class="rt">Contract Item Qty</th><th class="rt" style="color:var(--brand-dark)">Est. Item Qty</th></tr>
          </thead>
          <tbody>
            ${STATE.workOrder.lines.map(w => {
              const items = STATE.boqBreakdown[w.id] || [];
              return items.map((it, idx) => {
                const item = STATE.itemMaster[it.itemId];
                return `
                  <tr>
                    <td><b>Line ${w.sno}</b></td>
                    <td><b>${item.code}</b> — ${item.name}</td>
                    <td>${item.uom}</td>
                    <td class="rt mono"><b>${it.ratio}</b></td>
                    <td class="rt mono">${w.contractQty * it.ratio}</td>
                    <td class="rt mono" style="font-weight:700;color:var(--brand-dark)">${w.estQty * it.ratio}</td>
                  </tr>
                `;
              }).join('');
            }).join('')}
          </tbody>
        </table>
      </div>
      <div class="pad" style="display:flex;justify-content:flex-end">
        <button class="btn pri sm" onclick="navigate('site_indent')">Proceed to Site Indent (PRN) ›</button>
      </div>
    </div>
  `;
}

// 3. SITE INDENT VIEW
function renderIndentView(c) {
  c.innerHTML = `
    <div class="banner"><span>↗</span><div>Site Engineer Requisition: Indent against BOQ Lines. The system rolls up identical items for Store & Procurement.</div></div>
    <div class="card">
      <header><h3>Raise Material Indent (PRN)</h3><div class="sp"></div><button class="btn pri sm" onclick="submitIndent()">Approve & Dispatch PRN</button></header>
      <div class="tw">
        <table>
          <thead>
            <tr><th>WO Scope</th><th>Material</th><th class="rt">Est. Item Qty</th><th class="rt">Indented To Date</th><th class="rt">Indent Now</th><th class="rt">Variation (+Excess)</th></tr>
          </thead>
          <tbody>
            ${STATE.workOrder.lines.flatMap(w => STATE.boqBreakdown[w.id].map(it => {
              const item = STATE.itemMaster[it.itemId];
              const est = w.estQty * it.ratio;
              const prev = STATE.indentedTotals[it.itemId];
              return `
                <tr>
                  <td>Line ${w.sno} (${w.scope.slice(0,30)}...)</td>
                  <td><b>${item.code}</b> — ${item.name}</td>
                  <td class="rt mono">${est}</td>
                  <td class="rt mono">${prev}</td>
                  <td class="rt"><input class="inp rt mono" id="ind_${w.id}_${it.itemId}" type="number" value="${est - prev > 0 ? est - prev : 0}" style="width:80px"></td>
                  <td class="rt mono" style="color:var(--muted)">0.00</td>
                </tr>
              `;
            })).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

function submitIndent() {
  STATE.workOrder.lines.forEach(w => {
    STATE.boqBreakdown[w.id].forEach(it => {
      const el = document.getElementById(`ind_${w.id}_${it.itemId}`);
      if (el) STATE.indentedTotals[it.itemId] += (+el.value || 0);
    });
  });
  alert("PRN Approved! Identical items are consolidated for Procurement and Store dispatch.");
  navigate('procure_po');
}

// 4. PROCUREMENT PO VIEW
function renderPoView(c) {
  c.innerHTML = `
    <div class="banner" style="background:#EFF6FF;border-color:#BFDBFE;color:#1E40AF">
      <span>🛍️</span>
      <div><b>Procurement Desk</b>: Consolidated items from PRNs. New PO rates will overwrite Central Store rates upon receipt.</div>
    </div>
    <div class="card">
      <header><h3>Generate Purchase Order against Indents</h3><div class="sp"></div><button class="btn pri sm" onclick="issuePo()">Issue PO to Vendor</button></header>
      <div class="tw">
        <table>
          <thead>
            <tr><th>Item Code</th><th>Description</th><th class="rt">Central Stock</th><th class="rt">Indented Qty</th><th class="rt">Order Qty</th><th class="rt">New PO Rate (Overwrite)</th><th class="rt">PO Amount</th></tr>
          </thead>
          <tbody>
            ${Object.keys(STATE.itemMaster).map(k => {
              const it = STATE.itemMaster[k];
              const ind = STATE.indentedTotals[k] || 100;
              return `
                <tr>
                  <td class="mono"><b>${it.code}</b></td>
                  <td>${it.name}</td>
                  <td class="rt mono">${STATE.centralStoreStock[k]}</td>
                  <td class="rt mono"><b>${ind}</b></td>
                  <td class="rt mono"><b>${ind}</b></td>
                  <td class="rt mono"><input class="inp rt mono" id="porate_${k}" type="number" value="${it.storeRate + 2.50}" style="width:90px"></td>
                  <td class="rt mono"><b>${money(ind * (it.storeRate + 2.50))}</b></td>
                </tr>
              `;
            }).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

function issuePo() {
  Object.keys(STATE.itemMaster).forEach(k => {
    const el = document.getElementById(`porate_${k}`);
    if (el) STATE.itemMaster[k].storeRate = +el.value; // OVERWRITE RULE
  });
  alert("Purchase Order Issued! New PO rates will officially update the Central Store catalog on GRN posting.");
  navigate('store_grn_dc');
}

// 5. STORE GRN & DC VIEW
function renderStoreMoveView(c) {
  c.innerHTML = `
    <div class="banner"><span>🏬</span><div><b>Store Logistics</b>: Receive PO into Central Store, then issue Delivery Challan (DC) to Site Store.</div></div>
    <div class="card">
      <header><h3>1. Inward GRN (Central Store Stock Increment)</h3><div class="sp"></div><button class="btn sm" onclick="receiveGrn()">Post GRN (Central Store)</button></header>
      <div class="pad">Central Store received full shipments. Rates overwritten with active PO pricing.</div>
    </div>
    <div class="card" style="margin-top:14px">
      <header><h3>2. Outward Delivery Challan (DC) to Site Store</h3><div class="sp"></div><button class="btn pri sm" onclick="dispatchDc()">Dispatch DC to Site Store</button></header>
      <div class="pad">Dispatches required material. Goods transition to <b>IN-TRANSIT</b> until acknowledged at the site gate.</div>
    </div>
  `;
}

function receiveGrn() {
  Object.keys(STATE.centralStoreStock).forEach(k => STATE.centralStoreStock[k] += 200);
  alert("GRN Posted! Stock added to Central Store and catalog rates updated.");
}

function dispatchDc() {
  Object.keys(STATE.siteStoreStock).forEach(k => {
    STATE.siteStoreStock[k] += 50; // Inward to site
  });
  alert("Delivery Challan DC/26-27/0114 dispatched and acknowledged at site gate! Material now available in Site Store.");
  navigate('site_store');
}

// 6. SITE STORE VIEW
function renderSiteStoreView(c) {
  let gross = 0, ret = 0;
  STATE.dailyWorkerTransactions.forEach(t => {
    if (t.type === "ISSUE") gross += t.qty * t.rate;
    else ret += t.qty * t.rate;
  });
  const dailyLabor = 2500;
  const netExpense = (gross - ret) + dailyLabor;

  c.innerHTML = `
    <div class="banner"><span>👷‍♂️</span><div><b>Site Store Daily Ledger</b>: Issue = Consumption (Costed at Central Store Price). Returns reverse cost.</div></div>
    
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px">
      <div class="card pad"><small>Gross Material Issued</small><div class="mono" style="font-size:16px;font-weight:700">${money(gross)}</div></div>
      <div class="card pad"><small>Returns Deducted</small><div class="mono" style="font-size:16px;font-weight:700;color:var(--ok)">-${money(ret)}</div></div>
      <div class="card pad"><small>Daily Labor Wages</small><div class="mono" style="font-size:16px;font-weight:700">${money(dailyLabor)}</div></div>
      <div class="card pad" style="background:#FAFDFD;border-color:var(--brand)"><small>Total Daily Site Expense</small><div class="mono" style="font-size:16px;font-weight:700;color:var(--brand-dark)">${money(netExpense)}</div></div>
    </div>

    <div class="card">
      <header>
        <h3>Issue to Worker (Consumed) or Record Return</h3>
      </header>
      <div class="pad" style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr auto;gap:10px;align-items:end">
        <div><label>Worker Name</label><input class="inp" id="txWorker" value="Ramesh Kumar (Electrician)"></div>
        <div><label>Item</label>
          <select class="inp" id="txItem">
            ${Object.values(STATE.itemMaster).map(i => `<option value="${i.code}">${i.code} — ${i.name}</option>`).join('')}
          </select>
        </div>
        <div><label>Action</label>
          <select class="inp" id="txType"><option value="ISSUE">Issue to Worker (Consumed)</option><option value="RETURN">Return by Worker (Reverse Cost)</option></select>
        </div>
        <div><label>Qty</label><input class="inp rt mono" id="txQty" type="number" value="10"></div>
        <button class="btn pri sm" onclick="postDailyWorkerTx()">Post Entry</button>
      </div>
    </div>

    <div class="card" style="margin-top:14px">
      <header><h3>Material Issue & Return Daily Ledger</h3></header>
      <div class="tw">
        <table>
          <thead><tr><th>Date & Time</th><th>Worker</th><th>Action</th><th>Item</th><th class="rt">Qty</th><th class="rt">Store Price</th><th class="rt">Cost Impact</th></tr></thead>
          <tbody>
            ${STATE.dailyWorkerTransactions.map(t => `
              <tr>
                <td class="mono">${t.date}</td>
                <td><a style="color:var(--brand);font-weight:700;cursor:pointer" onclick="openPersonDrawer('${t.worker}')">${t.worker} 🔍</a></td>
                <td><span class="tag ${t.type === 'RETURN' ? 'ok' : 'warn'}">${t.type}</span></td>
                <td><a style="color:var(--brand);font-weight:700;cursor:pointer" onclick="openItemDrawer('${t.itemId}')">${STATE.itemMaster[t.itemId].name} 🔍</a></td>
                <td class="rt mono"><b>${t.qty}</b></td>
                <td class="rt mono">${money(t.rate)}</td>
                <td class="rt mono" style="font-weight:700;color:${t.type === 'RETURN' ? 'var(--ok)' : 'var(--bad)'}">${t.type === 'RETURN' ? '-' : '+'}${money(t.qty * t.rate)}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

function postDailyWorkerTx() {
  const worker = document.getElementById("txWorker").value;
  const itemId = document.getElementById("txItem").value;
  const type = document.getElementById("txType").value;
  const qty = +document.getElementById("txQty").value || 0;
  const rate = STATE.itemMaster[itemId].storeRate;

  STATE.dailyWorkerTransactions.unshift({
    date: "2026-09-11 11:30",
    worker, itemId, type, qty, rate
  });
  render();
}

function submitClientBill() {
  STATE.workOrder.lines.forEach(w => {
    const el = document.getElementById(`bill_qty_${w.id}`);
    if (el) w.billedQty += (+el.value || 0);
  });
  alert("RA Bill Certified & Submitted! Reverse-Engineering Engine is now checking theoretical material usage against Site Store physical stock.");
  navigate('reconciliation');
}

// 8. STOCK RECONCILIATION VIEW
function renderReconView(c) {
  // REVERSE ENGINEERING CALCULATION
  const billedItemTotals = { "SWG-0001": 0, "CVL-0001": 0, "CBL-0001": 0, "LIT-0001": 0 };
  STATE.workOrder.lines.forEach(w => {
    (STATE.boqBreakdown[w.id] || []).forEach(it => {
      billedItemTotals[it.itemId] += (w.billedQty * it.ratio);
    });
  });

  c.innerHTML = `
    <div class="banner"><span>⇄</span><div><b>Post-Billing Physical Material Reconciliation Audit</b></div></div>
    <div class="card">
      <header>
        <div>
          <h3>Reconcile Site Store Stock Against Certified Billed Quantities</h3>
          <p>Theoretical Audit Stock = Cumulative Indents (PRN) − Reverse-Engineered Billed Material. Compared directly against Site Store Physical Stock.</p>
        </div>
      </header>
      <div class="tw">
        <table>
          <thead>
            <tr>
              <th>Item Code</th>
              <th>Description</th>
              <th class="rt">Cumulative Indented (PRN)</th>
              <th class="rt">Reverse-Engineered Billed Qty</th>
              <th class="rt" style="color:var(--brand-dark)">Theoretical Audit Stock</th>
              <th class="rt">Site Store Physical Stock</th>
              <th class="rt">Variance</th>
              <th>Status / Action</th>
            </tr>
          </thead>
          <tbody>
            ${Object.keys(STATE.itemMaster).map(k => {
              const it = STATE.itemMaster[k];
              const ind = STATE.indentedTotals[k] || 105;
              const billed = billedItemTotals[k];
              const theoretical = ind - billed;
              const actual = STATE.siteStoreStock[k] || 48;
              const variance = actual - theoretical;
              const isMatch = Math.abs(variance) < 5;

              return `
                <tr>
                  <td class="mono"><b>${it.code}</b></td>
                  <td>${it.name}</td>
                  <td class="rt mono">${ind}</td>
                  <td class="rt mono"><b>${billed}</b></td>
                  <td class="rt mono" style="font-weight:700;color:var(--brand-dark)">${theoretical}</td>
                  <td class="rt mono"><b>${actual}</b></td>
                  <td class="rt mono" style="font-weight:700;color:${isMatch ? 'var(--ok)' : 'var(--bad)'}">${variance}</td>
                  <td>
                    ${isMatch 
                      ? '<span class="tag ok">Matched / Balanced</span>' 
                      : `<button class="btn sm" onclick="alert('Discrepancy alert sent to Site Storekeeper Sunil More for explanation!')">Send to Storekeeper</button>`}
                  </td>
                </tr>
              `;
            }).join('')}
          </tbody>
        </table>
      </div>
      <div class="pipeline">
        <div class="pipe-step done"><span class="dot">✓</span><span>RA Bill Certified</span></div>
        <div class="pipe-line done"></div>
        <div class="pipe-step done"><span class="dot">✓</span><span>Reverse Engineering Computed</span></div>
        <div class="pipe-line done"></div>
        <div class="pipe-step now"><span class="dot">•</span><span>Physical Audit Reconciled</span></div>
      </div>
    </div>
  `;
}
