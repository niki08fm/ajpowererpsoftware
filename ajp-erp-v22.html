/* ---------------- the Excel / CSV drop ----------------
   The client sends their work order as a sheet; retyping it is
   where the mistakes come from. Headers are matched on wording,
   so most client formats import untouched. ------------------- */
const WO_COLS=[
  ['name', ['line name','description','particular','item','scope','work','nature']],
  ['uom',  ['unit','uom','u o m','units']],
  ['qty',  ['qty','quantity','nos','no.of','number']],
  ['supplyRate',['supply rate','supply','material rate','rate supply','basic rate','sup rate']],
  ['instRate',  ['installation','inst rate','inst.','erection','labour rate','labor rate','fixing']]
];
function nsDrop(e,el){e.preventDefault();el.classList.remove('hot');
  const f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];if(f)nsFile(f)}
function nsFile(f){
  if(!f)return;
  const ext=f.name.split('.').pop().toLowerCase();
  const r=new FileReader();
  if(ext==='csv'||ext==='txt'){
    r.onload=()=>nsRows(csvGrid(r.result),f.name);r.readAsText(f);return;
  }
  if(typeof XLSX==='undefined'){
    document.getElementById('wo_imp').innerHTML=
      `<div class="banner warn">⚠ <div>The spreadsheet reader didn't load — you're probably offline. Save the sheet as <b>CSV</b> and drop that in instead; it imports exactly the same.</div></div>`;
    return;
  }
  r.onload=()=>{try{
      const wb=XLSX.read(new Uint8Array(r.result),{type:'array'});
      const sh=wb.Sheets[wb.SheetNames[0]];
      nsRows(XLSX.utils.sheet_to_json(sh,{header:1,blankrows:false,defval:''}),f.name+' · '+wb.SheetNames[0]);
    }catch(err){document.getElementById('wo_imp').innerHTML=`<div class="banner bad">✕ <div>Couldn't read that file. Try saving it as CSV.</div></div>`}};
  r.readAsArrayBuffer(f);
}
function csvGrid(text){
  const rows=[];let row=[],cell='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cell+='"';i++}else q=false}else cell+=c}
    else if(c==='"')q=true;
    else if(c===','||c===';'||c==='\t'){row.push(cell);cell=''}
    else if(c==='\n'){row.push(cell);rows.push(row);row=[];cell=''}
    else if(c!=='\r')cell+=c;}
  if(cell!==''||row.length){row.push(cell);rows.push(row)}
  return rows.filter(r=>r.some(c=>String(c).trim()!==''));
}
function nsRows(grid,label){
  const box=document.getElementById('wo_imp');
  if(!grid||!grid.length){box.innerHTML='<div class="banner bad">✕ <div>That file had nothing in it.</div></div>';return}
  /* find the header row: the first row whose cells match at least two known columns */
  let hdr=-1,map={};
  for(let r=0;r<Math.min(grid.length,15);r++){
    const m={},cells=grid[r].map(c=>String(c||'').toLowerCase().trim());
    WO_COLS.forEach(([key,words])=>{
      cells.forEach((c,ci)=>{if(m[key]===undefined&&c&&words.some(w=>c.includes(w)))m[key]=ci});});
    if(m.name!==undefined&&(m.qty!==undefined||m.supplyRate!==undefined)){hdr=r;map=m;break}
  }
  let lines=[];
  if(hdr>=0){
    for(let r=hdr+1;r<grid.length;r++){
      const g=grid[r],pick=k=>map[k]===undefined?'':String(g[map[k]]==null?'':g[map[k]]).trim();
      const name=pick('name');if(!name||/^(total|grand total|sub total|subtotal)/i.test(name))continue;
      lines.push(nsClean(name,pick('uom'),pick('qty'),pick('supplyRate'),pick('instRate')));
    }
  } else {
    /* no header the sheet recognises — fall back to column order,
       skipping a leading serial-number column if there is one */
    const off=grid.every(g=>/^\d+\.?$/.test(String(g[0]||'').trim()))?1:0;
    grid.forEach(g=>{const name=String(g[off]||'').trim();
      if(!name||/^(s\.?no|sr|description|particular|total)/i.test(name))return;
      lines.push(nsClean(name,g[off+1],g[off+2],g[off+3],g[off+4]));});
  }
  lines=lines.filter(l=>l.name);
  if(!lines.length){box.innerHTML=`<div class="banner bad">✕ <div>No work order lines found in <b>${esc(label)}</b>. Check that there's a description column and a quantity column.</div></div>`;return}
  NS.imported=lines;
  const val=woTotal(lines),blank=lines.filter(l=>!l.qty||!l.supplyRate).length;
  box.innerHTML=`<div class="banner ok" style="align-items:flex-start">✓ <div>
      <b>${lines.length} line(s)</b> read from ${esc(label)} — ${money(val)}.
      ${blank?`<br><small>${blank} line(s) came in without a quantity or supply rate. They'll import, and you can fill them in before submitting.</small>`:''}
      <div style="margin-top:9px;display:flex;gap:8px">
        <button class="btn sm pri" onclick="nsApplyImport(1)">Replace the lines</button>
        <button class="btn sm" onclick="nsApplyImport(0)">Add to what's there</button>
        <button class="btn sm" onclick="document.getElementById('wo_imp').innerHTML=''">Cancel</button>
      </div></div></div>
    <div class="tw" style="margin-top:10px;max-height:230px;overflow:auto"><table><thead><tr>
      <th>#</th><th>Line name</th><th>Unit</th><th class="rt">Qty</th><th class="rt">Supply</th><th class="rt">Inst.</th><th class="rt">Total</th></tr></thead>
      <tbody>${lines.slice(0,40).map((l,i)=>`<tr><td class="sn">${i+1}</td><td>${esc(l.name)}</td><td>${esc(l.uom)}</td>
        <td class="rt mono">${qty(l.qty)}</td><td class="rt mono">${money(l.supplyRate)}</td>
        <td class="rt mono">${money(l.instRate)}</td><td class="rt mono">${money(woLineTot(l))}</td></tr>`).join('')}
      </tbody></table>${lines.length>40?`<div class="empty" style="padding:10px">and ${lines.length-40} more</div>`:''}</div>`;
}
function nsClean(name,uom,q,sr,ir){
  const num=v=>{const n=parseFloat(String(v==null?'':v).replace(/[^0-9.\-]/g,''));return isFinite(n)?n:0};
  const u=String(uom||'').trim();
  const known=DB.uoms.find(x=>x.toLowerCase()===u.toLowerCase())
           ||DB.uoms.find(x=>u&&x.toLowerCase().startsWith(u.toLowerCase().slice(0,3)));
  return {name:String(name).trim().replace(/\s+/g,' '),uom:known||(u?u:DB.uoms[0]),
    qty:num(q),supplyRate:num(sr),instRate:num(ir)};
}
function nsApplyImport(replace){
  if(!NS.imported)return;
  /* a unit the sheet used that we don't stock yet becomes a unit we do */
  NS.imported.forEach(l=>{if(l.uom&&!DB.uoms.includes(l.uom))DB.uoms.push(l.uom)});
  NS.lines=replace?NS.imported.slice():NS.lines.filter(l=>l.name.trim()).concat(NS.imported);
  if(!NS.lines.length)NS.lines=[woLine()];
  const n=NS.imported.length;NS.imported=null;nsPersist();render();
  toast(`${n} line(s) ${replace?'imported':'added'}`,'ok');
}

/* ---------------- submit ----------------
   One item, one code: a work order line reuses the master item if
   its name normalises to one already there, and creates a new one
   with a system code if it doesn't. So the same scope written two
   ways on two client sheets still lands on one item. ----------- */
function ensureItem(name,uom){
  const k=normKey(name);
  const hit=DB.products.find(p=>p.key===k);
  if(hit)return hit;
  let cat=DB.cats.find(c=>c.code==='WO');
  if(!cat){cat={id:'C-WO',name:'Work order scope',code:'WO'};DB.cats.push(cat)}
  DB.counters.CAT=DB.counters.CAT||{};
  DB.counters.CAT.WO=(DB.counters.CAT.WO||0)+1;
  const p={id:uid('P'),code:'WO-'+String(DB.counters.CAT.WO).padStart(4,'0'),name,key:k,
    cat:cat.id,uom:uom||'Nos',gst:18,hsn:'',rate:0,status:'ACTIVE',fromWo:true};
  DB.products.push(p);return p;
}
function nsSubmit(){
  const lines=NS.lines.filter(l=>l.name.trim());
  if(!lines.length)return toast('Add at least one work order line','bad');
  const bad=lines.find(l=>!l.qty||(!l.supplyRate&&!l.instRate));
  if(bad)return toast(`"${bad.name}" needs a quantity and a rate`,'bad');
  const dup=lines.map(l=>normKey(l.name)).find((k,i,a)=>a.indexOf(k)!==i);
  if(dup&&!confirm('Two work order lines describe the same thing. Submit anyway?'))return;
  if(DB.sites.find(x=>normKey(x.name)===normKey(NS.name)))return toast('A site by that name already exists','bad');

  const s={id:uid('ST'),name:NS.name.trim(),branch:NS.branch,type:'SITE',status:'ACTIVE',
    client:NS.client,head:NS.head,keeper:NS.keeper,viewers:NS.viewers.slice(),
    loc:NS.loc,addr:NS.loc,bill:NS.bill,start:NS.start,finish:NS.finish,createdBy:DB.session.user,createdOn:today()};
  DB.sites.push(s);

  const boqLines=lines.map((l,i)=>{
    const p=ensureItem(l.name.trim(),l.uom);   // links only if it already exists; never creates
    return {id:uid('L'),sno:i+1,name:l.name.trim(),uom:l.uom,prod:p.id||null,make:'',
      work:(+l.supplyRate>0?'Supply':'Installation'),boqQty:+l.qty,
      supplyRate:+l.supplyRate||0,supplyGst:18,instRate:+l.instRate||0,instGst:18,
      estRate:n2((+l.supplyRate||0)*0.85)};
  });
  const b={id:uid('WO'),no:doc(DB,'WO'),kind:'WO',date:NS.start||today(),site:s.id,branch:s.branch,
    woNo:NS.woNo||'—',woValue:woTotal(lines),status:'LOCKED',lines:boqLines};
  DB.boqs.push(b);

  log('SITE',s.name,'Created',`${byId(DB.branches,s.branch).name} · ${byId(DB.clients,s.client).name}`);
  log('WO',b.no,'Work order loaded and locked',`${boqLines.length} lines · ${money(woTotal(lines))}`);
  const name=s.name,branch=s.branch,id=s.id;
  nsClear();
  if(myBranches().includes(branch)&&DB.session.branch!=='ALL'&&DB.session.branch!==branch){
    DB.session.branch=branch;save();
  }
  save();justAdded=name;toast(`${name} is live — work order locked at ${money(woTotal(lines))}`,'ok');
  location.hash='#sites';render();
}


/* ============================================================
   WORK ORDER vs BOQ — they are two different documents.

   The work order is the client's: their wording, their quantity,
   their rate. It cannot be edited, only amended.

   The BOQ is ours: each work order line prepared into items
   from the master, which is what actually gets indented, bought
   and consumed. One work order line becomes one or more BOQ
   lines, numbered 1a, 1b, 1c under work order line 1.

   A BOQ cannot be submitted until every work order line has been
   prepared. Until then it saves as a draft.
   ============================================================ */

/* every document written before this split was a work order */
DB.boqs.forEach(b=>{if(!b.kind)b.kind='WO'});
function woOf(siteId){return DB.boqs.find(b=>b.site===siteId&&b.kind==='WO')}
function wosOf(siteId){return DB.boqs.filter(b=>b.site===siteId&&b.kind==='WO')}
function boqDocOf(siteId){return DB.boqs.find(b=>b.site===siteId&&b.kind==='BOQ')}
/* downstream still measures against the contract, so this keeps returning the WO */
function boqOf(siteId){return DB.boqs.find(b=>b.site===siteId&&b.kind!=='BOQ')}

const woLineValue=l=>n2((+l.boqQty||0)*((+l.supplyRate||0)+(+l.instRate||0)));

      <td class="rt mono">${money(boqValue(wo))}</td>
      <td class="rt">${canEdit('boq')?`<button class="btn sm pri" onclick="boqStart('${wo.site}','${wo.id}')">Prepare BOQ</button>`:''}</td></tr>`).join('');
  return viewBanner('boq')+`<div class="banner info">▤ <div>The <b>work order</b> is the client's document — their wording, their quantity, their rate, and it can only change through an amendment. The <b>BOQ</b> is ours: each work order line prepared into items from the master, which is what gets indented, bought and consumed. A line splits into 1a, 1b, 1c and the BOQ only submits once every line is covered.</div></div>
    ${waiting?tableCard('Work orders waiting for a BOQ','Nothing can be indented against these until they are prepared',
      ['Site','Branch',{t:'WO lines',r:1},{t:'WO value',r:1},{t:'',r:1}],waiting):''}
    ${tableCard('BOQs','',['BOQ','Site','Date',{t:'Lines',r:1},'Prepared',{t:'BOQ value',r:1},'Status'],rows)}`;
};

/* ---- pick the site: only sites with a work order and no BOQ yet ---- */
function boqPick(){
  const open=scoped(DB.sites).filter(s=>s.type==='SITE'&&s.status!=='CLOSED'&&woOf(s.id)&&!boqDocOf(s.id));
  if(!open.length){
    const noWo=scoped(DB.sites).filter(s=>s.type==='SITE'&&!woOf(s.id));
    return Sheet.open('New BOQ','',
      `<div class="banner warn">⚠ <div>${noWo.length
        ? `Every site with a work order already has a BOQ. ${noWo.length} site(s) have no work order yet — a BOQ is built from one, so load the work order first.`

      `<button class="btn" onclick="Sheet.close()">Close</button>
       ${noWo.length?`<button class="btn pri" onclick="Sheet.close();location.hash='#sites'">Go to sites</button>`:''}`);
  }
  Sheet.open('New BOQ','Pick the site — its work order is picked up automatically',
    field('Site',sel('bp_s',open.map(s=>({v:s.id,t:s.name+' — '+(byId(DB.clients,s.client).name||'')})),'','onchange="boqPickWo(this.value)"'))
    +`<div id="bp_wo"></div>`,
    `<button class="btn" onclick="Sheet.close()">Cancel</button>
     <button class="btn pri" onclick="boqPickGo()">Open the work order ›</button>`);

}
function boqPickWo(siteId){
  const box=document.getElementById('bp_wo');if(!box)return;
  const wos=wosOf(siteId);
  const s=site(siteId);
  box.innerHTML=field('Work order',
      wos.length>1?sel('bp_w',wos.map(w=>({v:w.id,t:w.woNo+' — '+money(boqValue(w))+' · '+w.lines.length+' lines'})),wos[0].id)
        :`<input class="inp" id="bp_w_t" value="${esc(wos[0].woNo)}" disabled><input type="hidden" id="bp_w" value="${wos[0].id}">`,
      wos.length>1?`${wos.length} work orders on this site — pick the one to break down.`:'Picked up from the site. It cannot be edited here.')
    +`<div class="card"><header><div><h3>What you're breaking down</h3></div></header>
      <div class="tw"><table><thead><tr><th style="width:44px">S.No</th><th>Work order line</th><th>Unit</th>
        <th class="rt">Qty</th><th class="rt">Rate</th><th class="rt">Value</th></tr></thead><tbody>
        ${wos[0].lines.map((l,i)=>`<tr><td class="sn">${l.sno||i+1}</td>
          <td>${esc(l.name||lineName(l))}</td><td>${esc(l.uom||prod(l.prod).uom||'')}</td>
          <td class="rt mono">${qty(l.boqQty)}</td>
          <td class="rt mono">${money(l.supplyRate)}${+l.instRate?`<small>inst ${money(l.instRate)}</small>`:''}</td>
          <td class="rt mono">${money(woLineValue(l))}</td></tr>`).join('')}
      </tbody><tfoot><tr><th colspan="5" class="rt">Work order value</th>
        <th class="rt mono">${money(wos[0].lines.reduce((a,l)=>a+woLineValue(l),0))}</th></tr></tfoot></table></div></div>
    <div class="banner info" style="margin-top:12px">⌂ <div>${esc(s.name)} · ${esc(byId(DB.clients,s.client).name||'')}${s.loc?' · '+esc(s.loc):''}</div></div>`;
}
function boqPickGo(){const s=V('bp_s'),w=V('bp_w');if(!s||!w)return toast('Pick a site','bad');Sheet.close();boqStart(s,w)}

/* ---------------- the builder ---------------- */
let BQ=null;
function bqPersist(){DB.boqWip=BQ;save()}
function boqStart(siteId,woId){
  BQ={id:null,site:siteId,wo:woId,splits:{},open:null};
  const wo=DB.boqs.find(x=>x.id===woId);
  if(wo&&wo.lines[0]){BQ.open=wo.lines[0].id;bqSeed(BQ.open)}   // the first line is open, ready to split
  bqPersist();location.hash='#boqbuild';render();
}
function boqOpen(id){
  const b=DB.boqs.find(x=>x.id===id);
  if(b.status==='LOCKED')return boqDocView(id);
  BQ={id:b.id,site:b.site,wo:b.wo,splits:{},open:null};
  b.lines.forEach(l=>{(BQ.splits[l.woLine]=BQ.splits[l.woLine]||[]).push(
    {prod:l.prod,make:l.make,uom:l.uom,qty:+l.boqQty,supplyRate:+l.supplyRate,instRate:+l.instRate||0})});
  bqPersist();location.hash='#boqbuild';render();
}
function bqWo(){return DB.boqs.find(x=>x.id===BQ.wo)}
function bqRows(lid){return BQ.splits[lid]||[]}
function bqCover(l){
  const tgt=woLineValue(l),got=bqRows(l.id).reduce((a,r)=>a+splitValue(r),0);
  return {tgt,got,pct:tgt?got/tgt*100:0,done:tgt?got>=tgt*0.995:bqRows(l.id).length>0};
}
function boqCoverAll(b){   // for the list: how many WO lines the BOQ covers
  const wo=DB.boqs.find(x=>x.id===b.wo);
  if(!wo)return {done:b.lines.length,total:b.lines.length};
  const covered=wo.lines.filter(l=>{
    const tgt=woLineValue(l),got=b.lines.filter(x=>x.woLine===l.id)
      .reduce((a,x)=>a+splitValue({qty:x.boqQty,supplyRate:x.supplyRate,instRate:x.instRate}),0);
    return tgt?got>=tgt*0.995:got>0}).length;
  return {done:covered,total:wo.lines.length};
}

PAGES.boqbuild=()=>{
  if(!BQ)BQ=DB.boqWip||null;
  if(!BQ||!bqWo()){setTimeout(()=>location.hash='#boq',0);return ''}
  const wo=bqWo(),s=site(BQ.site);
  if(BQ.open&&!bqRows(BQ.open).length)bqSeed(BQ.open);
  const done=wo.lines.filter(l=>bqCover(l).done).length;
  const all=done===wo.lines.length;
  const boqVal=wo.lines.reduce((a,l)=>a+bqRows(l.id).reduce((x,r)=>x+splitValue(r),0),0);
  const woVal=wo.lines.reduce((a,l)=>a+woLineValue(l),0);
  document.getElementById('pgActions').innerHTML=
    `<button class="btn" onclick="bqQuit()">Close</button>
     <button class="btn" onclick="bqSaveDraft()">Save draft</button>
     <button class="btn pri" onclick="bqSubmit()" ${all?'':'disabled style="opacity:.45;cursor:not-allowed"'}>Submit BOQ</button>`;
  return `<div class="banner info" style="align-items:center">▤
      <div><b>${esc(s.name)}</b> · WO ${esc(wo.woNo)} · ${esc(byId(DB.clients,s.client).name||'')}</div>
      <div class="sp"></div>
      <div style="min-width:210px">${bar(done,wo.lines.length)}
        <small>${done} of ${wo.lines.length} work order lines prepared</small></div></div>
    ${all?'':`<div class="banner warn">⚠ <div>Every work order line has to be prepared before this BOQ can be submitted. Until then, <b>Save draft</b> keeps what you've done.</div></div>`}
    ${tableCard('Work order lines','Click a line to split it into items from the master',
      ['S.No','Work order line','Unit',{t:'Qty',r:1},{t:'Value',r:1},'Prepared',{t:'BOQ value',r:1},{t:'',r:1}],
      wo.lines.map((l,i)=>bqLineRow(l,i)).join(''))}
    <div class="card" style="margin-top:16px"><div style="padding:16px 18px;display:flex;align-items:center;gap:14px">
      <div><b>BOQ value against the work order</b>
        <div style="color:var(--muted)">work order ${money(woVal)} · BOQ ${money(boqVal)}</div></div>
      <div class="sp"></div>
      <div class="rt"><div class="mono" style="font-size:19px;font-weight:700;color:${boqVal>woVal?'var(--bad)':'var(--ok)'}">${money(woVal-boqVal)}</div>
        <small style="color:var(--muted)">${boqVal>woVal?'over the contract':'left against the contract'}</small></div></div></div>`;
};

function bqLineRow(l,i){
  const c=bqCover(l),rows=bqRows(l.id),isOpen=BQ.open===l.id;
  const tag=c.done?'<span class="tag ok">Done</span>'
    :(rows.length?`<span class="tag warn">${Math.round(c.pct)}%</span>`:'<span class="tag">Not started</span>');
  const head=`<tr class="row-open" onclick="bqToggle('${l.id}')" style="${isOpen?'background:var(--brand-soft)':''}">
    <td class="sn"><b>${l.sno||i+1}</b></td>
    <td><b>${esc(l.name||lineName(l))}</b><small>${rows.length?rows.length+' BOQ line(s)':'not split yet'}</small></td>
    <td>${esc(l.uom||prod(l.prod).uom||'')}</td>
    <td class="rt mono">${qty(l.boqQty)}</td>
    <td class="rt mono">${money(c.tgt)}</td>
    <td style="min-width:130px">${bar(Math.min(c.got,c.tgt),c.tgt)}<small>${tag}</small></td>
    <td class="rt mono">${money(c.got)}${c.got>c.tgt*1.005?'<small style="color:var(--bad)">over</small>':''}</td>
    <td class="rt">${isOpen?'▾':'▸'} ${rows.length?'Edit split':'Split'}</td></tr>`;
  return head+(isOpen?bqSplitRow(l,i):'');
}
function bqSplitRow(l,i){
  const rows=bqRows(l.id),c=bqCover(l);
  return `<tr><td colspan="8" style="padding:0;background:var(--line-2)">
    <div style="padding:14px 16px">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
        <b>Line ${l.sno||i+1} — pick the items this scope is actually made of</b>
        <div class="sp"></div>
        <button class="btn sm" onclick="bqNewItem('${l.id}')">＋ New item in the master</button>
        <button class="btn sm pri" onclick="bqAdd('${l.id}')">＋ Add another item</button>
      </div>
      <div class="tw wo-tbl"><table><thead><tr>
        <th style="width:52px">S.No</th><th style="min-width:260px">Item from the master</th><th style="width:92px">Unit</th>
        <th class="rt" style="width:88px">Qty</th><th class="rt" style="width:104px">Supply rate</th><th class="rt" style="width:112px">Supply amt</th>
        <th class="rt" style="width:104px">Inst. rate</th><th class="rt" style="width:112px">Inst. amt</th>
        <th class="rt" style="width:116px">Total</th><th style="width:38px"></th></tr></thead>
        <tbody>${rows.map((r,j)=>{const p=prod(r.prod);
          return `<tr>
          <td class="sn"><b>${(l.sno||i+1)}${sfx(j)}</b></td>
          <td><input class="inp" id="bq_p${j}" list="bq_master" value="${esc(p.code?p.code+' — '+p.name:'')}"
              placeholder="type a code or part of the name" onchange="bqPickItem('${l.id}',${j},this.value)"></td>
          <td>${sel('bq_u'+j,DB.uoms.map(u=>({v:u,t:u})),r.uom,`onchange="bqSet('${l.id}',${j},'uom',this.value)"`)}</td>
          <td><input class="inp rt" type="number" min="0" step="any" value="${r.qty||''}" oninput="bqSet('${l.id}',${j},'qty',this.value)" onchange="bqPersist()"></td>
          <td><input class="inp rt" type="number" min="0" step="any" value="${r.supplyRate||''}" oninput="bqSet('${l.id}',${j},'supplyRate',this.value)" onchange="bqPersist()"></td>
          <td class="rt mono" id="bq_sa${j}">${money((+r.qty||0)*(+r.supplyRate||0))}</td>
          <td><input class="inp rt" type="number" min="0" step="any" value="${r.instRate||''}" oninput="bqSet('${l.id}',${j},'instRate',this.value)" onchange="bqPersist()"></td>
          <td class="rt mono" id="bq_ia${j}">${money((+r.qty||0)*(+r.instRate||0))}</td>
          <td class="rt mono" id="bq_lt${j}"><b>${money(splitValue(r))}</b></td>
          <td><button class="btn sm bad" onclick="bqDel('${l.id}',${j})">✕</button></td></tr>`}).join('')}
        </tbody>
        <tfoot><tr><th colspan="5" class="rt">Prepared</th>
          <th class="rt mono" colspan="3" id="bq_got">${money(c.got)} of ${money(c.tgt)}</th>
          <th class="rt mono" id="bq_gap" style="color:${c.done?'var(--ok)':'var(--warn)'}">${c.done?'covered':money(c.tgt-c.got)+' left'}</th><th></th></tr></tfoot></table></div>
      <datalist id="bq_master">${DB.products.filter(p=>p.status!=='INACTIVE').map(p=>
        `<option value="${esc(p.code+' — '+p.name)}">${esc(p.uom)}</option>`).join('')}</datalist>
      <div style="display:flex;gap:9px;margin-top:11px;align-items:center">
        <small style="color:var(--muted)">Rates default to the work order line. Change them if the item is priced differently.</small>
        <div class="sp"></div>
        <button class="btn sm" onclick="bqMatchRest('${l.id}')">Put the remainder on the last line</button>
        <button class="btn sm pri" onclick="bqSaveLine('${l.id}')">Save this line</button>
      </div>
    </div></td></tr>`;
}

/* opening a line for the first time starts it with one row, pre-filled
   from the work order — if it needs no splitting, pick the item and save */
function bqToggle(lid){
  BQ.open=BQ.open===lid?null:lid;
  if(BQ.open&&!bqRows(lid).length)bqSeed(lid);
  bqPersist();render();
}
function bqSeed(lid){
  const l=bqWo().lines.find(x=>x.id===lid);
  BQ.splits[lid]=[{prod:l.prod||'',make:l.make||'Generic',uom:l.uom||prod(l.prod).uom||DB.uoms[0],
    qty:+l.boqQty,supplyRate:+l.supplyRate||0,instRate:+l.instRate||0}];
}
function bqAdd(lid){
  const l=bqWo().lines.find(x=>x.id===lid),c=bqCover(l);
  const left=Math.max(0,c.tgt-c.got),rate=(+l.supplyRate||0)+(+l.instRate||0);
  BQ.splits[lid].push({prod:'',make:'Generic',uom:l.uom||DB.uoms[0],
    qty:rate?n2(left/rate):0,supplyRate:+l.supplyRate||0,instRate:+l.instRate||0});
  bqPersist();render();
}
function bqDel(lid,j){BQ.splits[lid].splice(j,1);bqPersist();render()}
function bqSet(lid,j,f,v){
  const r=BQ.splits[lid][j];
  r[f]=(f==='uom'||f==='make')?v:(v===''?0:+v);
  const l=bqWo().lines.find(x=>x.id===lid),c=bqCover(l);
  const put=(id,val)=>{const e=document.getElementById(id);if(e)e.innerHTML=val};
  put('bq_sa'+j,money((+r.qty||0)*(+r.supplyRate||0)));
  put('bq_ia'+j,money((+r.qty||0)*(+r.instRate||0)));
  put('bq_lt'+j,'<b>'+money(splitValue(r))+'</b>');
  put('bq_got',money(c.got)+' of '+money(c.tgt));
  const g=document.getElementById('bq_gap');
  if(g){g.textContent=c.done?'covered':money(Math.max(0,c.tgt-c.got))+' left';
    g.style.color=c.done?'var(--ok)':'var(--warn)'}
}
function bqPickItem(lid,j,text){
  const t=(text||'').trim();
  if(!t){BQ.splits[lid][j].prod='';bqPersist();return}
  const low=t.toLowerCase();
  const p=DB.products.find(x=>(x.code+' — '+x.name).toLowerCase()===low)
       ||DB.products.find(x=>x.code.toLowerCase()===low)
       ||DB.products.find(x=>x.key===normKey(t))
       ||DB.products.filter(x=>(x.code+' '+x.name).toLowerCase().includes(low))[0];
  if(!p){toast('No item by that name — pick from the list, or add it to the master','bad');render();return}
  const r=BQ.splits[lid][j];r.prod=p.id;if(p.uom)r.uom=p.uom;
  bqPersist();render();
}
function bqNewItem(lid){
  Sheet.open('New item in the master','It gets a system code, and the duplicate guard checks it first',
    field('Item name',txt('ni_n','','text','placeholder="e.g. Copper Flexible Cable 1C x 10 sqmm"'))
    +`<div class="row2">${field('Unit',sel('ni_u',DB.uoms.map(u=>({v:u,t:u})),DB.uoms[0]))}
      ${field('GST %',txt('ni_g',18,'number'))}</div>`,
    `<button class="btn" onclick="Sheet.close()">Cancel</button>
     <button class="btn pri" onclick="bqSaveItem('${lid}')">Add to the master</button>`);
}
function bqSaveItem(lid){
  const n=V('ni_n').trim();if(!n)return toast('Give the item a name','bad');
  const before=DB.products.length;
  const p=ensureItem(n,V('ni_u'));p.gst=+V('ni_g')||18;
  save();Sheet.close();
  toast(DB.products.length>before?`${p.code} added to the master`:`Already in the master as ${p.code}`,'ok');
  const rows=bqRows(lid),empty=rows.findIndex(r=>!r.prod);
  if(empty>=0){rows[empty].prod=p.id;rows[empty].uom=p.uom}
  bqPersist();render();
}
function bqMatchRest(lid){
  const l=bqWo().lines.find(x=>x.id===lid),rows=bqRows(lid);
  if(!rows.length)return;
  const last=rows[rows.length-1];
  const others=rows.slice(0,-1).reduce((a,r)=>a+splitValue(r),0);
  const rate=(+last.supplyRate||0)+(+last.instRate||0);
  if(!rate)return toast('Put a rate on the last line first','bad');
  last.qty=n2(Math.max(0,(woLineValue(l)-others)/rate));
  bqPersist();render();toast('Remainder put on the last line','ok');
}
function bqSaveLine(lid){
  const rows=bqRows(lid).filter(r=>r.prod&&+r.qty>0);
  if(!rows.length)return toast('Pick an item and give it a quantity','bad');
  BQ.splits[lid]=rows;
  const l=bqWo().lines.find(x=>x.id===lid),c=bqCover(l);
  /* move on to the next line that still needs work */
  const next=bqWo().lines.find(x=>!bqCover(x).done&&x.id!==lid);
  BQ.open=c.done&&next?next.id:(c.done?null:lid);
  if(BQ.open&&!bqRows(BQ.open).length)bqSeed(BQ.open);
  bqPersist();render();
  toast(c.done?(next?`Line saved — on to line ${next.sno||''}`:'Line saved — every line is covered'):
    `Saved, but ${money(c.tgt-c.got)} of this line is still not prepared`,c.done?'ok':'warn');
}
function bqQuit(){
  if(confirm('Close this BOQ? Anything not saved as a draft is lost.')){BQ=null;delete DB.boqWip;save();location.hash='#boq'}
}
function bqFlatten(){
  const wo=bqWo(),lines=[];
  wo.lines.forEach((l,i)=>bqRows(l.id).forEach((r,j)=>{
    if(!r.prod||!+r.qty)return;
    const p=prod(r.prod);
    lines.push({id:uid('L'),sno:(l.sno||i+1)+sfx(j),woLine:l.id,woSno:l.sno||i+1,
      prod:r.prod,make:r.make||'Generic',uom:r.uom||p.uom,work:(+r.supplyRate>0?'Supply':'Installation'),
      boqQty:+r.qty,supplyRate:+r.supplyRate||0,supplyGst:p.gst||18,
      instRate:+r.instRate||0,instGst:p.gst||18,estRate:n2((+r.supplyRate||0)*0.85)});
  }));
  return lines;
}
function bqWrite(status){
  const wo=bqWo(),lines=bqFlatten();
  if(!lines.length){toast('Nothing to save yet','bad');return null}
  let b=BQ.id&&DB.boqs.find(x=>x.id===BQ.id);
  if(b){Object.assign(b,{lines,status,date:b.date||today()})}
  else{
    b={id:uid('BOQ'),no:doc(DB,'BOQ'),kind:'BOQ',site:BQ.site,branch:wo.branch,wo:wo.id,woNo:wo.woNo,
      date:today(),status,lines};
    DB.boqs.push(b);BQ.id=b.id;
  }
  return b;
}
function bqSaveDraft(){
  const b=bqWrite('DRAFT');if(!b)return;
  log('BOQ',b.no,'Saved as draft',`${b.lines.length} lines against WO ${b.woNo}`);
  bqPersist();save();toast(`${b.no} saved as a draft`,'ok');render();
}
function bqSubmit(){
  const wo=bqWo();
  const short=wo.lines.filter(l=>!bqCover(l).done);
  if(short.length)return toast(`${short.length} work order line(s) still not fully prepared`,'bad');
  const blank=bqFlatten().length!==Object.values(BQ.splits).flat().filter(r=>r.prod&&+r.qty>0).length;
  if(blank)return toast('Every BOQ line needs an item and a quantity','bad');
  const b=bqWrite('LOCKED');if(!b)return;
  const val=b.lines.reduce((a,l)=>a+splitValue({qty:l.boqQty,supplyRate:l.supplyRate,instRate:l.instRate}),0);
  log('BOQ',b.no,'Submitted and locked',`${b.lines.length} lines · ${money(val)} against WO ${b.woNo}`);
  BQ=null;delete DB.boqWip;save();
  toast(`${b.no} locked — ${b.lines.length} BOQ lines`,'ok');
  location.hash='#boq';render();
}

/* ---------------- reading a finished BOQ ---------------- */
function boqDocView(id){
  const b=DB.boqs.find(x=>x.id===id),wo=DB.boqs.find(x=>x.id===b.wo);
  const rows=(wo?wo.lines:[]).map((l,i)=>{
    const kids=b.lines.filter(x=>x.woLine===l.id);
    const got=kids.reduce((a,x)=>a+splitValue({qty:x.boqQty,supplyRate:x.supplyRate,instRate:x.instRate}),0);
    return `<tr style="background:var(--line-2)"><td class="sn"><b>${l.sno||i+1}</b></td>
        <td colspan="4"><b>${esc(l.name||lineName(l))}</b><small>work order line · ${qty(l.boqQty)} ${esc(l.uom||'')}</small></td>
        <td class="rt mono">${money(woLineValue(l))}</td><td class="rt mono">${money(got)}</td></tr>`
      +kids.map(x=>`<tr><td class="sn">${esc(x.sno)}</td>
        <td>${esc(lineName(x))}</td><td>${esc(x.uom||'')}</td>
        <td class="rt mono">${qty(x.boqQty)}</td>
        <td class="rt mono">${money(x.supplyRate)}${+x.instRate?`<small>inst ${money(x.instRate)}</small>`:''}</td>
        <td></td><td class="rt mono">${money(splitValue({qty:x.boqQty,supplyRate:x.supplyRate,instRate:x.instRate}))}</td></tr>`).join('');
  }).join('');
  Sheet.open(b.no,`${site(b.site).name} · against WO ${b.woNo}`,
    `<div class="card"><div class="tw"><table><thead><tr><th>S.No</th><th>Item</th><th>Unit</th>
      <th class="rt">Qty</th><th class="rt">Rate</th><th class="rt">WO value</th><th class="rt">BOQ value</th></tr></thead>
      <tbody>${rows}</tbody></table></div></div>`,
    `<button class="btn" onclick="Sheet.close()">Close</button>`);
}


/* ============================================================
   BOQ, REWORKED TO THE AGREED SHEET
     Sl No | Item Code | Description | Unit | Item Qty | BOQ Qty
           | Est Qty | Make
   A work order line is a scope — "1No 6/16A Socket controlled by
   16A switch with back box". Breaking it down lists what one of
   those is actually made of: a metal box, a front plate, a switch,
   a socket. Item Qty is how many go into ONE, so:

       BOQ Qty = Item Qty × the work order line quantity
       Est Qty = entered by hand — the estimate that gets procured

   No rates anywhere in here. The work order carries the client's
   money; the BOQ carries the material. It is the BOQ that indents
   and purchase orders are raised against.
   ============================================================ */

/* the material spine reads the BOQ once there is one; money still reads the WO */
function matBoq(siteId){
  const b=DB.boqs.find(x=>x.site===siteId&&x.kind==='BOQ'&&x.status==='LOCKED');
  return b||woOf(siteId);
}
/* what a line may be indented against: the estimate if it has one */
var capQty=l=>l.estQty!=null?n2(+l.estQty):amendedQty(l);

/* ---------- builder state ---------- */
function bqHead(lid){
  BQ.heads=BQ.heads||{};
  if(!BQ.heads[lid]){const l=bqWo().lines.find(x=>x.id===lid);
    BQ.heads[lid]={estQty:+l.boqQty};}
  return BQ.heads[lid];
}
var childBoqQty=(r,l)=>n2((+r.itemQty||0)*(+l.boqQty||0));
function childEstQty(r,l,lid){
  if(r.estManual)return n2(+r.est||0);
  return n2((+r.itemQty||0)*(+bqHead(lid).estQty||0));
}
/* a work order line counts as prepared once it has at least one
   item against it — there is no value to measure it against */
function bqCover(l){
  const rows=bqRows(l.id).filter(r=>r.prod&&+r.itemQty>0);
  return {rows:rows.length,done:rows.length>0&&+bqHead(l.id).estQty>0};
}
function boqCoverAll(b){
  const wo=DB.boqs.find(x=>x.id===b.wo);
  if(!wo)return {done:b.lines.length,total:b.lines.length};
  return {done:wo.lines.filter(l=>b.lines.some(x=>x.woLine===l.id)).length,total:wo.lines.length};
}

function boqStart(siteId,woId){
  BQ={id:null,site:siteId,wo:woId,splits:{},heads:{},open:null};
  const wo=DB.boqs.find(x=>x.id===woId);
  if(wo&&wo.lines[0]){BQ.open=wo.lines[0].id;bqHead(BQ.open);bqSeed(BQ.open)}
  bqPersist();location.hash='#boqbuild';render();
}
function boqOpen(id){
  const b=DB.boqs.find(x=>x.id===id);
  if(b.status==='LOCKED')return boqDocView(id);
  BQ={id:b.id,site:b.site,wo:b.wo,splits:{},heads:{},open:null};
  b.lines.forEach(l=>{
    BQ.heads[l.woLine]={estQty:+l.headEst||0};
    (BQ.splits[l.woLine]=BQ.splits[l.woLine]||[]).push(
      {prod:l.prod,make:l.make,itemQty:+l.itemQty||1,est:+l.estQty,estManual:!!l.estManual});});
  bqPersist();location.hash='#boqbuild';render();
}
function bqSeed(lid){
  /* the row starts empty on purpose: the work order line is a scope,
     not an item, so nothing counts as prepared until a real item
     from the master is picked. An untouched line never looks done. */
  bqHead(lid);
  BQ.splits[lid]=[{prod:'',make:'',itemQty:1,estManual:false}];
}
function bqAdd(lid){
  bqHead(lid);
  (BQ.splits[lid]=BQ.splits[lid]||[]).push({prod:'',make:'',itemQty:1,estManual:false});
  bqPersist();render();
}

PAGES.boqbuild=()=>{
  if(!BQ)BQ=DB.boqWip||null;
  if(!BQ||!bqWo()){setTimeout(()=>location.hash='#boq',0);return ''}
  BQ.heads=BQ.heads||{};
  const wo=bqWo(),s=site(BQ.site);
  if(BQ.open&&!bqRows(BQ.open).length)bqSeed(BQ.open);
  const done=wo.lines.filter(l=>bqCover(l).done).length;
  const all=done===wo.lines.length;
  document.getElementById('pgActions').innerHTML=
    `<button class="btn" onclick="bqQuit()">Close</button>
     <button class="btn" onclick="bqSaveDraft()">Save draft</button>
     <button class="btn pri" onclick="bqSubmit()" ${all?'':'disabled style="opacity:.45;cursor:not-allowed"'}>Submit BOQ</button>`;
  return `<div class="banner info" style="align-items:center">▤
      <div><b>${esc(s.name)}</b> · WO ${esc(wo.woNo)} · ${esc(byId(DB.clients,s.client).name||'')}</div>
      <div class="sp"></div>
      <div style="min-width:220px">${bar(done,wo.lines.length)}
        <small>${done} of ${wo.lines.length} work order lines prepared</small></div></div>
    ${all?'<div class="banner ok">✓ <div>Every line is prepared. Submitting locks the BOQ, and indents and purchase orders are raised against it from then on.</div></div>'
      :`<div class="banner warn">⚠ <div><b>Item Qty</b> is how many go into one of the work order line — BOQ Qty works itself out from there. <b>Est Qty</b> is yours to enter: what you actually expect to procure. Every line has to be prepared before this can be submitted; until then, <b>Save draft</b>.</div></div>`}
    <div class="card"><header><div><h3>BOQ (Bill of Quantity)</h3><p>Click a work order line to prepare it</p></div></header>
      <div class="tw wo-tbl"><table><thead><tr>
        <th style="width:60px">Sl No</th><th style="width:104px">Item Code</th><th style="min-width:280px">Description</th>
        <th style="width:88px">Unit</th><th class="rt" style="width:88px">Item Qty</th>
        <th class="rt" style="width:96px">BOQ Qty</th><th class="rt" style="width:96px">Est Qty</th>
        <th style="width:130px">Make</th><th style="width:40px"></th></tr></thead>
        <tbody>${wo.lines.map((l,i)=>bqLineRow(l,i)).join('')}</tbody></table></div></div>`;
};

function bqLineRow(l,i){
  const sn=l.sno||i+1,c=bqCover(l),isOpen=BQ.open===l.id,h=bqHead(l.id);
  const tag=c.done?'<span class="tag ok">Done</span>'
    :(c.rows?'<span class="tag warn">In progress</span>':'<span class="tag">Not started</span>');
  const head=`<tr class="row-open" onclick="bqToggle('${l.id}')" style="background:${isOpen?'var(--brand-soft)':'var(--line-2)'}">
    <td class="sn"><b>${sn}</b></td>
    <td></td>
    <td><b>${esc(l.name||lineName(l))}</b><small>${isOpen?'▾ ':'▸ '}${c.rows?c.rows+' item(s)':'work order line — click to prepare it'} ${tag}</small></td>
    <td>${esc(l.uom||prod(l.prod).uom||'')}</td>
    <td></td>
    <td class="rt mono"><b>${qty(l.boqQty)}</b></td>
    <td onclick="event.stopPropagation()">
      <input class="inp rt" type="number" min="0" step="any" value="${h.estQty||''}"
        oninput="bqHeadEst('${l.id}',this.value)" onchange="bqPersist()" title="Entered by hand"></td>
    <td></td><td></td></tr>`;
  return head+(isOpen?bqSplitRows(l,i):'');
}
function bqSplitRows(l,i){
  const sn=l.sno||i+1,rows=bqRows(l.id);
  const body=rows.map((r,j)=>{
    const p=prod(r.prod);
    return `<tr>
      <td class="sn"><b>${sn}${sfx(j)}</b></td>
      <td class="mono">${p.code?esc(p.code):'<small style="color:var(--faint)">—</small>'}</td>
      <td><input class="inp" list="bq_master" value="${esc(p.name||'')}"
          placeholder="pick the item from the master" onchange="bqPickItem('${l.id}',${j},this.value)"></td>
      <td>${p.uom?esc(p.uom):'<small style="color:var(--faint)">—</small>'}</td>
      <td><input class="inp rt" type="number" min="0" step="any" value="${r.itemQty!=null?r.itemQty:''}"
          oninput="bqSet('${l.id}',${j},'itemQty',this.value)" onchange="bqPersist()" title="how many go into one"></td>
      <td class="rt mono" id="bq_bq${j}">${qty(childBoqQty(r,l))}</td>
      <td><input class="inp rt" id="bq_es${j}" type="number" min="0" step="any" value="${childEstQty(r,l,l.id)||''}"
          oninput="bqSet('${l.id}',${j},'est',this.value)" onchange="bqPersist()"></td>
      <td>${sel('bq_mk'+j,[{v:'',t:'— any —'}].concat(DB.makes.map(m=>({v:m,t:m}))),r.make||'',`onchange="bqSet('${l.id}',${j},'make',this.value)"`)}</td>
      <td><button class="btn sm bad" onclick="bqDel('${l.id}',${j})">✕</button></td></tr>`}).join('');
  return body+`<tr><td colspan="9" style="padding:10px 14px;background:var(--line-2)">
      <div style="display:flex;gap:9px;align-items:center">
        <small style="color:var(--muted)">Item Qty is per one of line ${sn}. BOQ Qty = Item Qty × ${qty(l.boqQty)}. Est Qty follows the estimate on the line above until you change it.</small>
        <div class="sp"></div>
        <button class="btn sm" onclick="bqNewItem('${l.id}')">＋ New item in the master</button>
        <button class="btn sm" onclick="bqAdd('${l.id}')">＋ Add item</button>
        <button class="btn sm pri" onclick="bqSaveLine('${l.id}')">Save this line</button>
      </div>
      <datalist id="bq_master">${DB.products.filter(p=>p.status!=='INACTIVE').map(p=>
        `<option value="${esc(p.name)}">${esc(p.code)} · ${esc(p.uom)}</option>`).join('')}</datalist>
    </td></tr>`;
}
function bqToggle(lid){
  BQ.open=BQ.open===lid?null:lid;
  if(BQ.open){bqHead(BQ.open);if(!bqRows(BQ.open).length)bqSeed(BQ.open)}
  bqPersist();render();
}
function bqHeadEst(lid,v){
  bqHead(lid).estQty=v===''?0:+v;
  const l=bqWo().lines.find(x=>x.id===lid);
  bqRows(lid).forEach((r,j)=>{if(!r.estManual){
    const e=document.getElementById('bq_es'+j);if(e)e.value=childEstQty(r,l,lid)||''}});
}
function bqSet(lid,j,f,v){
  const r=BQ.splits[lid][j],l=bqWo().lines.find(x=>x.id===lid);
  if(f==='make'){r.make=v;return}
  if(f==='est'){r.estManual=true;r.est=v===''?0:+v;return}
  r.itemQty=v===''?0:+v;
  const q=document.getElementById('bq_bq'+j);if(q)q.textContent=qty(childBoqQty(r,l));
  if(!r.estManual){const e=document.getElementById('bq_es'+j);if(e)e.value=childEstQty(r,l,lid)||''}
}
function bqPickItem(lid,j,text){
  const t=(text||'').trim();
  if(!t){BQ.splits[lid][j].prod='';bqPersist();render();return}
  const low=t.toLowerCase();
  const p=DB.products.find(x=>x.name.toLowerCase()===low)
       ||DB.products.find(x=>x.code.toLowerCase()===low)
       ||DB.products.find(x=>x.key===normKey(t))
       ||DB.products.filter(x=>(x.code+' '+x.name).toLowerCase().includes(low))[0];
  if(!p){toast('No item by that name — pick from the list, or add it to the master','bad');render();return}
  BQ.splits[lid][j].prod=p.id;bqPersist();render();
}
function bqSaveItem(lid){
  const n=V('ni_n').trim();if(!n)return toast('Give the item a name','bad');
  const before=DB.products.length;
  const p=ensureItem(n,V('ni_u'));p.gst=+V('ni_g')||18;
  save();Sheet.close();
  toast(DB.products.length>before?`${p.code} added to the master`:`Already in the master as ${p.code}`,'ok');
  const rows=bqRows(lid),empty=rows.findIndex(r=>!r.prod);
  if(empty>=0)rows[empty].prod=p.id;
  bqPersist();render();
}
function bqSaveLine(lid){
  const rows=bqRows(lid).filter(r=>r.prod&&+r.itemQty>0);
  if(!rows.length)return toast('Pick an item and give it an item quantity','bad');
  if(!(+bqHead(lid).estQty>0))return toast('Enter the estimated quantity on the work order line','bad');
  BQ.splits[lid]=rows;
  const next=bqWo().lines.find(x=>!bqCover(x).done&&x.id!==lid);
  BQ.open=next?next.id:null;
  if(BQ.open){bqHead(BQ.open);if(!bqRows(BQ.open).length)bqSeed(BQ.open)}
  bqPersist();render();
  toast(next?`Line saved — on to line ${next.sno||''}`:'Line saved — every line is prepared','ok');
}
function bqFlatten(){
  const wo=bqWo(),lines=[];
  wo.lines.forEach((l,i)=>{
    const h=bqHead(l.id);
    bqRows(l.id).forEach((r,j)=>{
      if(!r.prod||!+r.itemQty)return;
      const p=prod(r.prod);
      lines.push({id:uid('L'),sno:(l.sno||i+1)+sfx(j),woLine:l.id,woSno:l.sno||i+1,
        prod:r.prod,code:p.code,make:r.make||'',uom:p.uom,work:l.work||'Supply',
        itemQty:+r.itemQty,boqQty:childBoqQty(r,l),
        estQty:childEstQty(r,l,l.id),estManual:!!r.estManual,headEst:+h.estQty||0,
        supplyRate:0,supplyGst:p.gst||18,instRate:0,instGst:p.gst||18,estRate:0});
    });
  });
  return lines;
}
function bqSubmit(){
  const wo=bqWo();
  const short=wo.lines.filter(l=>!bqCover(l).done);
  if(short.length)return toast(`${short.length} work order line(s) still not prepared`,'bad');
  const b=bqWrite('LOCKED');if(!b)return;
  log('BOQ',b.no,'Submitted and locked',`${b.lines.length} lines against WO ${b.woNo}`);
  BQ=null;delete DB.boqWip;save();
  toast(`${b.no} locked — indents are raised against it from now on`,'ok');
  location.hash='#boq';render();
}

/* ============================================================
   INDENT AND CONSUMPTION now read the BOQ.
   A site with a locked BOQ indents its items, capped at the
   estimated quantity. A site that has only a work order still
   works exactly as before.
   ============================================================ */
const bqLabel=l=>(l.sno?l.sno+'  ':'')+(l.prod?lineName(l):(l.name||''))+(l.make?' · '+l.make:'');

function indentSheet(){
  const sites=liveSites().filter(s=>matBoq(s.id)&&matBoq(s.id).status==='LOCKED');
  if(!sites.length)return toast('No locked BOQ in this branch yet','bad');
  TMP={lines:[],site:sites[0].id};
  Sheet.open('Raise an indent','Only items on this site\'s BOQ, only up to the estimate left',
    `<div class="row2">${field('Site',sel('in_s',sites.map(s=>({v:s.id,t:s.name})),'',`onchange="TMP.site=this.value;TMP.lines=[];indentDraw()"`))}
      ${field('Date',txt('in_d',today(),'date'))}</div>
     ${field('Needed by',txt('in_need',addDays(today(),14),'date'))}
     <div class="card"><header><div><h3>Lines</h3><p id="in_boq"></p></div><div class="sp"></div>
       <button class="btn sm pri" onclick="indentAdd()">＋ Add line</button></header><div id="in_lines"></div></div>`,
    `<button class="btn" onclick="Sheet.close()">Cancel</button><button class="btn pri" onclick="saveIndent()">Send for approval</button>`);
  indentDraw();
}
function boqBal(b,l){return n2(capQty(l) - indentedQty(b.id,l.id) - requestedQty(b.id,l.id))}
function indentAdd(){
  const b=matBoq(TMP.site);const avail=b.lines.filter(l=>boqBal(b,l)>0&&!TMP.lines.some(t=>t.boqLine===l.id));
  if(!avail.length)return toast('Every BOQ line is fully indented','bad');
  const l=avail[0];
  TMP.lines.push({id:uid('L'),boqLine:l.id,woLine:l.woLine||l.id,prod:l.prod,make:l.make||'',qty:0,remark:''});
  indentDraw();
}
function indentSet(i,f,v){const b=matBoq(TMP.site);
  if(f==='boqLine'){const l=b.lines.find(x=>x.id===v);
    Object.assign(TMP.lines[i],{boqLine:v,woLine:l.woLine||l.id,prod:l.prod,make:l.make||'',qty:0});indentDraw();return}
  if(f==='qty'){const l=b.lines.find(x=>x.id===TMP.lines[i].boqLine);const max=boqBal(b,l);
    let q=+v;if(q>max){q=max;toast(`Capped at the balance of ${qty(max)}`,'bad')}TMP.lines[i].qty=q;indentDraw();return}
  TMP.lines[i][f]=v;
}
function indentDraw(){
  const b=matBoq(TMP.site);const el=document.getElementById('in_lines');if(!el)return;
  const hdr=document.getElementById('in_boq');
  if(hdr)hdr.textContent=`Against ${b.no}${b.kind==='BOQ'?'':' (work order — no BOQ on this site yet)'} — ${site(TMP.site).name}`;
  if(!TMP.lines.length){el.innerHTML=emptyBox('No lines yet','Add a BOQ line to indent against.');return}
  el.innerHTML=`<div class="tw"><table><thead><tr><th style="min-width:260px">BOQ line</th>

        <td><button class="btn sm bad" onclick="TMP.lines.splice(${i},1);indentDraw()">✕</button></td></tr>`}).join('')

}
function saveIndent(){
  if(!TMP.lines.length)return toast('Add at least one line','bad');
  if(TMP.lines.some(l=>!l.qty))return toast('Every line needs a quantity','bad');
  const s=site(TMP.site),b=matBoq(TMP.site);
  const d={id:uid('IND'),no:doc(DB,'IND'),date:V('in_d'),need:V('in_need'),site:s.id,branch:s.branch,boq:b.id,
    by:DB.session.user,lines:TMP.lines,appr:newAppr('INDENT'),amount:0};

}

/* consumption books against the same document, and keeps the work
   order line alongside so the contract view still adds up */
function consumeAdd(){
  const s=siteStock().filter(r=>!TMP.lines.some(t=>t.prod===r.prod&&t.make===r.make));
  if(!s.length)return toast('Everything at site is already on this entry','bad');
  const b=matBoq(TMP.site);const bl=b?(b.lines.find(l=>l.prod===s[0].prod)||b.lines[0]):null;
  TMP.lines.push({prod:s[0].prod,make:s[0].make,qty:0,boqLine:bl?bl.id:'',woLine:bl?(bl.woLine||bl.id):''});
  consumeDraw();
}
function consumeSet(i,f,v){
  const b=matBoq(TMP.site);
  if(f==='key'){const [p,m]=v.split('||');
    const bl=b?(b.lines.find(l=>l.prod===p)||b.lines[0]):null;
    Object.assign(TMP.lines[i],{prod:p,make:m,qty:0,boqLine:bl?bl.id:'',woLine:bl?(bl.woLine||bl.id):''});
    consumeDraw();return}
  if(f==='boqLine'){const bl=b&&b.lines.find(x=>x.id===v);
    TMP.lines[i].boqLine=v;TMP.lines[i].woLine=bl?(bl.woLine||bl.id):'';return}
  const max=stockAt(TMP.site,TMP.lines[i].prod,TMP.lines[i].make);let q=+v;
  if(q>max){q=max;toast(`Only ${qty(max)} at site`,'bad')}TMP.lines[i].qty=q;consumeDraw();
}
function consumeDraw(){
  const el=document.getElementById('cs_lines');if(!el)return;
  const av=siteStock(),b=matBoq(TMP.site);
  if(!av.length){el.innerHTML=emptyBox('No stock at this site','Issue material from the store first.');return}
  if(!TMP.lines.length){el.innerHTML=emptyBox('No lines yet','Add what was used.');return}
  el.innerHTML=`<div class="tw"><table><thead><tr><th style="min-width:220px">Item</th><th class="rt">At site</th>
    <th class="rt">Used</th><th style="min-width:220px">Book to BOQ line</th><th class="rt">Cost</th><th></th></tr></thead><tbody>${
    TMP.lines.map((t,i)=>`<tr><td>${sel('cl_p'+i,av.map(r=>({v:r.prod+'||'+r.make,t:pname(r.prod)+' · '+r.make})),t.prod+'||'+t.make,`onchange="consumeSet(${i},'key',this.value)"`)}</td>
      <td class="rt mono">${qty(stockAt(TMP.site,t.prod,t.make))}</td>
      <td>${txt('cl_q'+i,t.qty,'number',`onchange="consumeSet(${i},'qty',this.value)" style="width:88px"`)}</td>
      <td>${b?sel('cl_b'+i,b.lines.map(l=>({v:l.id,t:bqLabel(l)})),t.boqLine,`onchange="consumeSet(${i},'boqLine',this.value)"`):'<span class="tag">no BOQ</span>'}</td>
      <td class="rt mono">${money(t.qty*lastRate(t.prod,t.make))}</td>
      <td><button class="btn sm bad" onclick="TMP.lines.splice(${i},1);consumeDraw()">✕</button></td></tr>`).join('')
  }</tbody></table></div>`;
}
/* a BOQ line and its parent work order line both count as consumed */
function consumedQty(siteId,lineId){
  let q=0;DB.consumes.forEach(c=>{if(c.site!==siteId)return;
    c.lines.forEach(l=>{if(l.boqLine===lineId||l.woLine===lineId)q+=+l.qty});});return q;
}

function installMaster(){
  if(DB.masterVer===MASTER_VER)return 0;
  const old=DB.products||[];

  DB.cats=MASTER.c.map((n,i)=>({id:'C'+i,name:n,code:'C'+i}));
  DB.makes=MASTER.m.slice();
  DB.uoms=MASTER.u.slice();
  DB.products=MASTER.i.map(r=>({
    id:'P'+r[0],code:r[0],name:r[1],key:normKey(r[1]),
    cat:'C'+r[2],uom:MASTER.u[r[3]],type:r[4]?'CONSUMABLE':'BILLABLE',
    makes:r[5].map(m=>MASTER.m[m]),gst:18,hsn:'',rate:r[6],opening:r[7],status:'ACTIVE'}));

  /* the demo documents point at the trial items by id, so every one of
     them is remapped onto the closest real item — nothing is left
     dangling, and no trial item survives the swap */
  const byKey={};DB.products.forEach(p=>{byKey[p.key]=p});
  const tok=s=>normKey(s).split(' ').filter(Boolean);
  const map={};
  old.forEach(o=>{
    const hit=byKey[normKey(o.name)];
    if(hit){map[o.id]=hit.id;return}
    const want=tok(o.name);let best=null,score=0;
    DB.products.forEach(p=>{
      const have=tok(p.name);
      const n=want.filter(w=>have.includes(w)).length/Math.max(1,want.length);
      if(n>score){score=n;best=p}});
    map[o.id]=(best&&score>=0.25?best:DB.products[0]).id;
  });
  let moved=0;
  const fix=l=>{if(l&&l.prod&&map[l.prod]){l.prod=map[l.prod];moved++}
    if(l&&l.make&&!DB.makes.includes(l.make))l.make='';};
  const walk=arr=>(arr||[]).forEach(d=>(d.lines||[]).forEach(fix));
  walk(DB.boqs);walk(DB.indents);walk(DB.pos);walk(DB.grns);walk(DB.issues);
  walk(DB.consumes);walk(DB.supbills);walk(DB.clientbills);walk(DB.subwos);
  walk(DB.subbills);walk(DB.returns);walk(DB.transfers);walk(DB.audits);walk(DB.quotes);
  (DB.quotes||[]).forEach(q=>(q.lines||[]).forEach(fix));

  DB.masterVer=MASTER_VER;save();
  return moved;
}
installMaster();

itemQ='';let itemCat='All',itemType='All',itemPage=0;
const ITEM_PAGE=60;
function itemList(){
  const q=itemQ.trim().toLowerCase();
  return DB.products.filter(p=>{
    if(itemCat!=='All'&&p.cat!==itemCat)return false;
    if(itemType!=='All'&&p.type!==itemType)return false;
    if(!q)return true;
    return (p.code+' '+p.name+' '+(p.makes||[]).join(' ')).toLowerCase().includes(q);
  });
}
PAGES.items=()=>{
  document.getElementById('pgActions').innerHTML=
    `<input class="inp" id="itq" placeholder="Search code, name or make" value="${esc(itemQ)}"
       oninput="itemQ=this.value;itemPage=0;itemsRedraw()">
     ${canAddItem()?`<button class="btn pri" onclick="itemSheet()">＋ New item</button>`:''}`;
  return `<div id="itemsWrap">${itemsBody()}</div>`;
};
function itemsRedraw(){
  const w=document.getElementById('itemsWrap');if(!w)return;
  w.innerHTML=itemsBody();
  const b=document.getElementById('itq');if(b&&document.activeElement!==b)b.value=itemQ;
}

  const page=all.slice(itemPage*ITEM_PAGE,(itemPage+1)*ITEM_PAGE);
  const stock=stockRows();
  const rows=page.map(p=>{
    const st=stock.filter(s=>s.prod===p.id).reduce((a,s)=>a+s.bal,0)+(+p.opening||0);
    return `<tr><td><span class="tag brand mono">${esc(p.code)}</span></td>
      <td><b>${esc(p.name)}</b><small>${esc(byId(DB.cats,p.cat).name)}${(p.makes||[]).length?' · '+esc(p.makes.slice(0,4).join(', '))+(p.makes.length>4?' +'+(p.makes.length-4):''):' · make not specified'}</small></td>
      <td>${esc(p.uom)}</td>
      <td><span class="tag ${p.type==='CONSUMABLE'?'warn':'ok'}">${p.type==='CONSUMABLE'?'Consumable':'Billable'}</span></td>
      <td class="rt mono">${p.rate?money(p.rate):'—'}</td>
      <td class="rt mono">${st?qty(st):'—'}</td>
      <td class="rt">${canAddItem()?`<button class="btn sm" onclick="itemSheet('${p.id}')">Edit</button>`:''}</td></tr>`}).join('');
  const pages=Math.ceil(total/ITEM_PAGE);
  const nav=pages>1?`<div style="display:flex;gap:8px;align-items:center;padding:12px 18px;border-top:1px solid var(--line-2)">

      <button class="btn sm" onclick="itemPage=Math.min(${pages-1},itemPage+1);itemsRedraw()" ${itemPage>=pages-1?'disabled':''}>Next ›</button>
    </div>`:'';
  const cats=DB.cats.slice().sort((a,b)=>a.name.localeCompare(b.name));
  return viewBanner('items')
    +`<div class="banner info">◆ <div><b>Items are picked, never typed.</b> Every other screen selects from this list, so the same thing can't enter twice under two spellings.

/* ---------------- picking an item out of 2,600 ----------------
   A datalist with every item in it is unusable, so this searches
   as you type and shows the first handful that match. ---------- */
function itemPick(inputId,resId,onPick,q){
  const box=document.getElementById(resId);if(!box)return;
  q=(q||'').trim().toLowerCase();
  if(q.length<2){box.classList.remove('on');box.innerHTML='';return}
  const hits=[];
  for(const p of DB.products){
    if((p.code+' '+p.name).toLowerCase().includes(q)){hits.push(p);if(hits.length>=12)break}
  }
  box.innerHTML=hits.length
    ? hits.map(p=>`<a onmousedown="${onPick}('${p.id}')"><b class="mono">${esc(p.code)}</b> ${esc(p.name)}
        <small>${esc(byId(DB.cats,p.cat).name)} · ${esc(p.uom)}</small></a>`).join('')
    : '<a><b>No item matches</b><small>Only Store can add a new one</small></a>';
  box.classList.add('on');
}

/* ============================================================
   v9 — three corrections
   1. Item codes follow our own scheme, not the sheet's numbers:
      the category's three-letter code and a running number, and
      a new item Store adds continues that category's sequence.
   2. Opening a BOQ shows every breakdown already on it. Nothing
      is folded away behind a click.
   3. Work order lines are added one at a time to the bottom of
      the sheet, and the count of what is done and what is left
      sits at the top.
   ============================================================ */
MASTER_VER='AJP-2026-08c';

installMaster=function(){
  if(DB.masterVer===MASTER_VER)return 0;
  const old=DB.products||[];
  DB.cats=MASTER.c.map((n,i)=>({id:'C'+MASTER.k[i],name:n,code:MASTER.k[i]}));
  DB.makes=MASTER.m.slice();
  DB.uoms=MASTER.u.slice();
  DB.products=MASTER.i.map(r=>({
    id:'P'+r[0],code:r[0],name:r[1],key:normKey(r[1]),
    cat:'C'+MASTER.k[r[2]],uom:MASTER.u[r[3]],type:r[4]?'CONSUMABLE':'BILLABLE',
    makes:r[5].map(m=>MASTER.m[m]),gst:18,hsn:'',rate:r[6],opening:r[7],status:'ACTIVE'}));

  /* the running number per category, so anything Store adds later
     carries on where the master left off */
  DB.counters=DB.counters||{};DB.counters.CAT={};
  DB.products.forEach(p=>{const c=p.code.split('-')[0];
    DB.counters.CAT[c]=Math.max(DB.counters.CAT[c]||0,+p.code.split('-')[1]||0)});

  const byKey={};DB.products.forEach(p=>{byKey[p.key]=p});
  const tok=s=>normKey(s).split(' ').filter(Boolean);
  const map={};
  old.forEach(o=>{
    const hit=byKey[normKey(o.name)];
    if(hit){map[o.id]=hit.id;return}
    const want=tok(o.name);let best=null,score=0;
    DB.products.forEach(p=>{const have=tok(p.name);
      const n=want.filter(w=>have.includes(w)).length/Math.max(1,want.length);
      if(n>score){score=n;best=p}});
    map[o.id]=(best&&score>=0.25?best:DB.products[0]).id;
  });
  let moved=0;
  const fix=l=>{if(l&&l.prod&&map[l.prod]){l.prod=map[l.prod];moved++}
    if(l&&l.code)l.code=prod(l.prod).code||l.code;
    if(l&&l.make&&!DB.makes.includes(l.make))l.make='';};
  const walk=arr=>(arr||[]).forEach(d=>(d.lines||[]).forEach(fix));
  ['boqs','indents','pos','grns','issues','consumes','supbills','clientbills',
   'subwos','subbills','returns','transfers','audits','quotes'].forEach(k=>walk(DB[k]));
  DB.masterVer=MASTER_VER;save();
  return moved;
};
installMaster();

/* ============================================================
   THE BUILDER — nothing folded, lines added to the bottom
   ============================================================ */
function bqShown(){
  BQ.shown=BQ.shown||[];
  return BQ.shown.map(id=>bqWo().lines.find(l=>l.id===id)).filter(Boolean);
}
function bqPending(){return bqWo().lines.filter(l=>!(BQ.shown||[]).includes(l.id))}

boqStart=function(siteId,woId){
  BQ={id:null,site:siteId,wo:woId,splits:{},heads:{},shown:[]};
  const wo=DB.boqs.find(x=>x.id===woId);
  if(wo&&wo.lines[0]){BQ.shown=[wo.lines[0].id];bqHead(wo.lines[0].id);bqSeed(wo.lines[0].id)}
  bqPersist();location.hash='#boqbuild';render();
};
boqOpen=function(id){
  const b=DB.boqs.find(x=>x.id===id);
  if(b.status==='LOCKED')return boqDocView(id);
  BQ={id:b.id,site:b.site,wo:b.wo,splits:{},heads:{},shown:[]};
  const wo=DB.boqs.find(x=>x.id===b.wo);
  b.lines.forEach(l=>{
    BQ.heads[l.woLine]={estQty:+l.headEst||0};
    (BQ.splits[l.woLine]=BQ.splits[l.woLine]||[]).push(
      {prod:l.prod,make:l.make,itemQty:+l.itemQty||1,est:+l.estQty,estManual:!!l.estManual});});
  /* everything the BOQ already covers opens visible — nothing is hidden */
  BQ.shown=wo.lines.filter(l=>BQ.splits[l.id]).map(l=>l.id);
  if(!BQ.shown.length&&wo.lines[0]){BQ.shown=[wo.lines[0].id];bqHead(wo.lines[0].id);bqSeed(wo.lines[0].id)}
  bqPersist();location.hash='#boqbuild';render();
};
function bqAddWoLine(){
  const next=bqPending()[0];
  if(!next)return toast('Every work order line is already on the sheet','ok');
  BQ.shown.push(next.id);bqHead(next.id);bqSeed(next.id);
  bqPersist();render();
  setTimeout(()=>{const el=document.getElementById('wl_'+next.id);if(el&&el.scrollIntoView)el.scrollIntoView({block:'center'})},40);
}
function bqDropWoLine(lid){
  if(bqRows(lid).some(r=>r.prod)&&!confirm('Take this work order line off the sheet? What you typed into it is lost.'))return;
  BQ.shown=BQ.shown.filter(x=>x!==lid);delete BQ.splits[lid];delete BQ.heads[lid];
  bqPersist();render();
}

        <small style="color:var(--muted)">${shown.length} on the sheet${pending.length?` · ${pending.length} not added yet`:' · all added'}</small></div>
      ${all?'<span class="tag ok">Ready to submit</span>':'<span class="tag warn">Submit locked until every line is done</span>'}
    </div></div>
    <div class="card"><header><div><h3>BOQ (Bill of Quantity)</h3>
        <p>Item Qty is how many go into one of the work order line — BOQ Qty follows. Est Qty is yours to type.</p></div></header>
      <div class="tw wo-tbl"><table><thead><tr>
        <th style="width:60px">Sl No</th><th style="width:112px">Item Code</th><th style="min-width:280px">Description</th>
        <th style="width:88px">Unit</th><th class="rt" style="width:88px">Item Qty</th>
        <th class="rt" style="width:96px">BOQ Qty</th><th class="rt" style="width:96px">Est Qty</th>

function bqSearch(lid,j,v){
  const k=lid+'_'+j;
  itemPick('bqi_'+k,'bqr_'+k,`bqChoose('${lid}',${j},`+'',v);
}
function bqChoose(lid,j,pid){
  BQ.splits[lid][j].prod=pid;
  const p=prod(pid),r=BQ.splits[lid][j];
  if(r.make&&p.makes&&p.makes.length&&!p.makes.includes(r.make))r.make='';
  bqPersist();render();
}
function bqSet(lid,j,f,v){
  const r=BQ.splits[lid][j],l=bqWo().lines.find(x=>x.id===lid),k=lid+'_'+j;
  if(f==='make'){r.make=v;bqPersist();return}
  if(f==='est'){r.estManual=true;r.est=v===''?0:+v;return}
  r.itemQty=v===''?0:+v;
  const q=document.getElementById('bq_bq_'+k);if(q)q.textContent=qty(childBoqQty(r,l));
  if(!r.estManual){const e=document.getElementById('bq_es_'+k);if(e)e.value=childEstQty(r,l,lid)||''}
}
function bqHeadEst(lid,v){
  bqHead(lid).estQty=v===''?0:+v;
  const l=bqWo().lines.find(x=>x.id===lid);
  bqRows(lid).forEach((r,j)=>{if(!r.estManual){
    const e=document.getElementById('bq_es_'+lid+'_'+j);if(e)e.value=childEstQty(r,l,lid)||''}});
}
function bqAdd(lid){
  bqHead(lid);
  (BQ.splits[lid]=BQ.splits[lid]||[]).push({prod:'',make:'',itemQty:1,estManual:false});
  bqPersist();render();
  setTimeout(()=>{if(!BQ||!BQ.splits[lid])return;const el=document.getElementById('bqi_'+lid+'_'+(BQ.splits[lid].length-1));if(el&&el.focus)el.focus()},40);
}
function bqDel(lid,j){
  BQ.splits[lid].splice(j,1);
  if(!BQ.splits[lid].length)bqSeed(lid);
  bqPersist();render();
}
/* rows are kept as typed; the tidy-up happens when it is written */
function bqSaveLine(lid){
  BQ.splits[lid]=bqRows(lid).filter(r=>r.prod&&+r.itemQty>0);
  if(!BQ.splits[lid].length)bqSeed(lid);
  bqPersist();render();
}
function bqSaveDraft(){
  const b=bqWrite('DRAFT');if(!b)return;
  log('BOQ',b.no,'Saved as draft',`${b.lines.length} lines against WO ${b.woNo}`);
  bqPersist();save();toast(`${b.no} saved — ${b.lines.length} line(s)`,'ok');render();
}


/* ============================================================
   v10 — the item picker actually picks.

   The result list built its click handler by gluing strings
   together, and the pieces did not close:

       bqChoose('L1',0,   +   ('P123')   →   bqChoose('L1',0,('P123')

   One parenthesis short, so every click threw a syntax error and
   nothing was ever selected. Handlers are now real callbacks and
   the hit list is held in one place instead of being re-encoded
   into HTML. Typing a full code or name and tabbing out selects
   too, so the keyboard works without touching the list.
   ============================================================ */
let PICK={hits:[],onPick:null};
function itemPick(inputId,resId,onPick,q){
  const box=document.getElementById(resId);if(!box)return;
  PICK.onPick=onPick;
  q=(q||'').trim().toLowerCase();
  if(q.length<2){box.classList.remove('on');box.innerHTML='';PICK.hits=[];return}
  /* every word has to appear, in any order: "wire red 1.5" finds
     1.5 SQMM WIRE RED (FR) just as "1.5 sqmm wire red" does */
  const words=q.split(/\s+/).filter(Boolean);
  const hits=[];
  for(const p of DB.products){
    const hay=(p.code+' '+p.name).toLowerCase();
    if(words.every(w=>hay.includes(w))){hits.push(p);if(hits.length>=12)break}
  }
  PICK.hits=hits;
  box.innerHTML=hits.length
    ? hits.map((p,n)=>`<a onmousedown="pickHit(${n})"><b class="mono">${esc(p.code)}</b> ${esc(p.name)}
        <small>${esc(byId(DB.cats,p.cat).name)} · ${esc(p.uom)}</small></a>`).join('')
    : '<a><b>No item matches</b><small>Only Store can add a new one</small></a>';
  box.classList.add('on');
}
function pickHit(n){
  const p=PICK.hits[n];
  if(p&&PICK.onPick)PICK.onPick(p.id);
}
function bqSearch(lid,j,v){
  const k=lid+'_'+j;
  itemPick('bqi_'+k,'bqr_'+k,pid=>bqChoose(lid,j,pid),v);
}
/* typed and tabbed away: resolve it without needing the list */
function bqTyped(lid,j,text){
  const t=(text||'').trim();
  const r=BQ&&BQ.splits[lid]&&BQ.splits[lid][j];if(!r)return;
  if(!t){if(r.prod){r.prod='';bqPersist();render()}return}
  if(r.prod&&prod(r.prod).name===t)return;             // unchanged
  const low=t.toLowerCase(),words=low.split(/\s+/).filter(Boolean);
  const p=DB.products.find(x=>x.name.toLowerCase()===low)
       ||DB.products.find(x=>x.code.toLowerCase()===low)
       ||DB.products.find(x=>x.key===normKey(t))
       ||DB.products.find(x=>{const h=(x.code+' '+x.name).toLowerCase();return words.every(w=>h.includes(w))});
  if(!p){toast('No item matches that — pick one from the list','bad');render();return}
  bqChoose(lid,j,p.id);
}
function bqChoose(lid,j,pid){
  if(!BQ||!BQ.splits[lid]||!BQ.splits[lid][j])return;
  const r=BQ.splits[lid][j],p=prod(pid);
  /* the same item twice on one work order line is a mistake, not a split */
  const dup=BQ.splits[lid].findIndex((x,n)=>n!==j&&x.prod===pid);
  if(dup>=0){toast(`${p.code} is already on this line — change its item quantity instead`,'bad');render();return}
  r.prod=pid;
  if(r.make&&p.makes&&p.makes.length&&!p.makes.includes(r.make))r.make='';
  const box=document.getElementById('bqr_'+lid+'_'+j);if(box)box.classList.remove('on');
  bqPersist();render();
  toast(p.code+' — '+p.name,'ok');
}

/* the row markup, with the typed fallback wired in */
function bqBlock(l){
  const i=bqWo().lines.indexOf(l),sn=l.sno||i+1,c=bqCover(l),h=bqHead(l.id),rows=bqRows(l.id);
  const tag=c.done?'<span class="tag ok">Done</span>'
    :(c.rows?'<span class="tag warn">In progress</span>':'<span class="tag">Needs an item</span>');
  const head=`<tr id="wl_${l.id}" style="background:var(--line-2)">
    <td class="sn"><b>${sn}</b></td><td></td>
    <td><b>${esc(l.name||lineName(l))}</b><small>work order line · ${tag}</small></td>
    <td>${esc(l.uom||'')}</td><td></td>
    <td class="rt mono"><b>${qshow(l.boqQty)}</b></td>
    <td><input class="inp rt" type="text" inputmode="text" placeholder="qty or RA" value="${raIn(h.estQty)}"
        oninput="bqHeadEst('${l.id}',this.value)" onchange="bqPersist()" title="a number, or RA for a rate-only line"></td>
    <td></td>
    <td><button class="btn sm" onclick="bqDropWoLine('${l.id}')" title="Take this line off the sheet">✕</button></td></tr>`;
  const kids=rows.map((r,j)=>{
    const p=prod(r.prod);
    const mk=(p.makes&&p.makes.length)?p.makes:DB.makes;
    const k=l.id+'_'+j;
    return `<tr>
      <td class="sn"><b>${sn}${sfx(j)}</b></td>
      <td class="mono">${p.code?esc(p.code):'<small style="color:var(--faint)">—</small>'}</td>
      <td><div class="ipick">
          <input class="inp" id="bqi_${k}" value="${esc(p.name||'')}" autocomplete="off"
            placeholder="type any part of the code or name"
            oninput="bqSearch('${l.id}',${j},this.value)"
            onfocus="bqSearch('${l.id}',${j},this.value)"
            onchange="bqTyped('${l.id}',${j},this.value)"
            onkeydown="bqKey(event,'${l.id}',${j})"
            onblur="setTimeout(()=>{const b=document.getElementById('bqr_${k}');if(b)b.classList.remove('on')},200)">
          <div class="gres" id="bqr_${k}"></div></div></td>
      <td>${p.uom?esc(p.uom):'<small style="color:var(--faint)">—</small>'}</td>
      <td><input class="inp rt" type="number" min="0" step="any" value="${r.itemQty!=null?r.itemQty:''}"
          oninput="bqSet('${l.id}',${j},'itemQty',this.value)" onchange="bqPersist()"></td>
      <td class="rt mono" id="bq_bq_${k}">${qshow(childBoqQty(r,l))}</td>
      <td><input class="inp rt" id="bq_es_${k}" type="text" inputmode="text" placeholder="qty or RA" value="${raIn(childEstQty(r,l,l.id))}"
          oninput="bqSet('${l.id}',${j},'est',this.value)" onchange="bqPersist()"></td>
      <td>${sel('bq_mk_'+k,[{v:'',t:'— any —'}].concat(mk.map(m=>({v:m,t:m}))),r.make||'',`onchange="bqSet('${l.id}',${j},'make',this.value)"`)}</td>
      <td><button class="btn sm bad" onclick="bqDel('${l.id}',${j})">✕</button></td></tr>`}).join('');
  const foot=`<tr><td colspan="9" style="padding:8px 14px 14px">
      <button class="btn sm" onclick="bqAdd('${l.id}')">＋ Add item to line ${sn}</button>
      <button class="btn sm" onclick="remarkSheet('items','item missing for work order line ${sn}')">Item missing? Ask Store</button>
    </td></tr>`;
  return head+kids+foot;
}
/* Enter takes the first match, Escape closes the list */
function bqKey(e,lid,j){
  if(e.key==='Enter'){e.preventDefault();
    if(PICK.hits.length&&document.getElementById('bqr_'+lid+'_'+j).classList.contains('on'))bqChoose(lid,j,PICK.hits[0].id);
    else bqTyped(lid,j,e.target.value);}
  else if(e.key==='Escape'){const b=document.getElementById('bqr_'+lid+'_'+j);if(b)b.classList.remove('on')}
}


/* ============================================================
   v11
   1. It is "prepare the BOQ", not "prepare it", everywhere.
   2. Submitting a BOQ asks whether the site may indent past the
      estimate, and by how much. That answer is stored on the BOQ.
   3. An indent that goes past the estimate is flagged: the line
      shows ▲ and the percentage over, and the BOQ itself turns
      to AMENDMENT DUE until the excess is regularised.
   4. A BOQ amendment adds a variation quantity to the line. The
      BOQ then reads normal again and shows the variation.
   5. Indents are a cart: saved as a draft, edited, then sent for
      approval when the site is ready.
   6. A site manager sees only their own projects. Nothing else.
   ============================================================ */

/* ---------- 1. wording ---------- */
TITLES.boqbuild=['Prepare the BOQ','One work order line at a time — its items, quantities and makes'];
TITLES.boq=['BOQ','Every work order line prepared as items from the master'];

/* ---------- 2 & 4. what a line allows ---------- */
var varQty=l=>n2(+l.varQty||0);                     // added by BOQ amendment
var estOf=l=>n2((+l.estQty||0)+varQty(l));          // the estimate as it stands now
function overPolicy(b){return {allow:!!(b&&b.overAllow),pct:+(b&&b.overPct)||0}}
function allowedQty(b,l){
  const est=estOf(l);
  if(l.estQty==null)return amendedQty(l);              // work-order-only sites, unchanged
  const p=overPolicy(b);
  if(!p.allow)return est;
  return p.pct>0?n2(est*(1+p.pct/100)):Infinity;
}
/* how far past the estimate a line has already been taken */
function overRun(b,l){
  const est=estOf(l);if(!est)return {qty:0,pct:0};
  const used=indentedQty(b.id,l.id)+requestedQty(b.id,l.id);
  const over=n2(used-est);
  return {qty:over>0.0001?over:0,pct:over>0?n2(over/est*100):0,used,est};
}
function boqOverLines(b){
  return (b.kind==='BOQ'?b.lines:[]).filter(l=>overRun(b,l).qty>0);
}
/* a BOQ that has been indented past its estimate needs regularising */
function boqState(b){
  if(b.status!=='LOCKED')return {tag:'DRAFT',cls:'warn',text:'Draft'};
  const over=boqOverLines(b);
  if(!over.length)return {tag:'LOCKED',cls:'ok',text:'Locked'};
  const worst=over.reduce((a,l)=>Math.max(a,overRun(b,l).pct),0);
  return {tag:'AMEND',cls:'bad',text:`▲ Amendment due · ${worst.toFixed(1)}% over`,over};
}
capQty=l=>l.estQty!=null?estOf(l):amendedQty(l);
function boqBal(b,l){
  const a=allowedQty(b,l);
  if(a===Infinity)return Infinity;
  return n2(a-indentedQty(b.id,l.id)-requestedQty(b.id,l.id));
}
/* what is left before the estimate is breached, which is a different number */
function estBal(b,l){return n2(estOf(l)-indentedQty(b.id,l.id)-requestedQty(b.id,l.id))}

/* ---------- 2. the question asked at submit ---------- */
bqSubmit=function(){
  const wo=bqWo();
  const short=wo.lines.filter(l=>!bqCover(l).done);
  if(short.length)return toast(`${short.length} work order line(s) not prepared yet`,'bad');
  Sheet.open('Submit the BOQ','One decision before it locks',
    `<div class="banner info">▤ <div>Once locked, every indent from this site is measured against the <b>estimated quantity</b> on each BOQ line. Decide now what happens when the site needs more than that.</div></div>
     ${field('Can the site indent beyond the estimate?',
       sel('ov_a',[{v:'NO',t:'No — the estimate is a hard stop'},{v:'YES',t:'Yes — allow it, and flag it'}],'NO','onchange="bqOverToggle(this.value)"'))}
     <div id="ov_more" style="display:none">
       ${field('By how much?',sel('ov_p',[{v:'10',t:'Up to 10% over the estimate'},{v:'15',t:'Up to 15%'},
         {v:'25',t:'Up to 25%'},{v:'50',t:'Up to 50%'},{v:'0',t:'No ceiling — any quantity'}],'10'))}
       <div class="banner warn">⚠ <div>Anything past the estimate is flagged the moment it is raised. The BOQ goes to <b>▲ Amendment due</b> and stays there until a BOQ amendment adds the variation quantity.</div></div>
     </div>`,
    `<button class="btn" onclick="Sheet.close()">Cancel</button>
     <button class="btn pri" onclick="bqSubmitGo()">Lock the BOQ</button>`);
};
function bqOverToggle(v){const el=document.getElementById('ov_more');if(el)el.style.display=v==='YES'?'':'none'}
function bqSubmitGo(){
  const allow=V('ov_a')==='YES',pct=allow?+V('ov_p'):0;
  const b=bqWrite('LOCKED');if(!b)return;
  b.overAllow=allow;b.overPct=pct;
  log('BOQ',b.no,'Submitted and locked',
    `${b.lines.length} lines · beyond estimate: ${allow?(pct?pct+'% allowed':'allowed, no ceiling'):'not allowed'}`);
  BQ=null;delete DB.boqWip;save();Sheet.close();
  toast(`${b.no} locked — ${allow?(pct?`indents may go ${pct}% past the estimate`:'indents may exceed the estimate'):'the estimate is a hard stop'}`,'ok');
  location.hash='#boq';render();
}

/* ---------- the BOQ list, with the over-run state ---------- */
PAGES.boq=()=>{

      <td><span class="tag ${st.cls}">${st.text}</span>${st.over?`<small>${st.over.length} line(s) over</small>`:''}</td></tr>`}).join('');

        ${amend.map(b=>`<button class="btn sm" onclick="boqAmendSheet('${b.id}')">${esc(b.no)} · ${esc(site(b.site).name)}</button>`).join(' ')}</div></div>`:'')
    +`<div class="banner info">▤ <div>The <b>work order</b> is the client's. The <b>BOQ</b> is ours — every work order line prepared as items from the master. Indents come off the BOQ and are measured against each line's estimated quantity.</div></div>
    ${waiting?tableCard('Work orders waiting for a BOQ','Nothing can be indented against these yet',
      ['Site','Branch',{t:'WO lines',r:1},{t:'',r:1}],waiting):''}
    ${tableCard('BOQs','',['BOQ','Site','Date',{t:'Lines',r:1},'Prepared','Beyond estimate','Status'],rows)}`;
};

/* ---------- 4. the BOQ amendment ---------- */
function boqAmendSheet(id){
  const b=DB.boqs.find(x=>x.id===id),over=boqOverLines(b);
  if(!over.length)return toast('Nothing on this BOQ is over its estimate','ok');
  TMP={boq:id,var:{}};
  over.forEach(l=>{TMP.var[l.id]=overRun(b,l).qty});
  Sheet.open('BOQ amendment',`${b.no} · ${site(b.site).name}`,
    `<div class="banner bad">▲ <div>${over.length} line(s) have been indented past their estimate. Adding the variation quantity brings the BOQ back to normal and leaves a record of what changed and why.</div></div>
     <div class="card"><div class="tw"><table><thead><tr><th>Sl No</th><th>Item</th>
       <th class="rt">Est qty</th><th class="rt">Indented</th><th class="rt">Over</th><th class="rt">Variation qty</th><th class="rt">New estimate</th></tr></thead>
       <tbody>${over.map(l=>{const o=overRun(b,l);
         return `<tr><td class="sn">${esc(l.sno)}</td><td>${esc(pname(l.prod))}<small class="mono">${esc(prod(l.prod).code)}</small></td>
         <td class="rt mono">${qty(estOf(l))}</td><td class="rt mono">${qty(o.used)}</td>
         <td class="rt mono" style="color:var(--bad)">▲ ${qty(o.qty)} · ${o.pct.toFixed(1)}%</td>
         <td><input class="inp rt" id="av_${l.id}" type="number" min="0" step="any" value="${o.qty}"
             oninput="TMP.var['${l.id}']=+this.value||0;document.getElementById('an_${l.id}').textContent=qty(${estOf(l)}+(+this.value||0))"></td>
         <td class="rt mono" id="an_${l.id}"><b>${qty(estOf(l)+o.qty)}</b></td></tr>`}).join('')}
       </tbody></table></div></div>
     ${field('Why',`<textarea class="inp" id="am_why" rows="2" placeholder="e.g. site conditions needed extra cable pulls on the east riser"></textarea>`)}`,
    `<button class="btn" onclick="Sheet.close()">Cancel</button>
     <button class="btn pri" onclick="boqAmendSave()">Record the amendment</button>`);
}
function boqAmendSave(){
  const b=DB.boqs.find(x=>x.id===TMP.boq);
  const why=V('am_why').trim();
  if(!why)return toast('Say why the quantity changed','bad');
  let n=0;
  Object.keys(TMP.var).forEach(lid=>{
    const l=b.lines.find(x=>x.id===lid),add=+TMP.var[lid]||0;
    if(!l||add<=0)return;
    l.varQty=n2(varQty(l)+add);
    (l.varTrail=l.varTrail||[]).push({date:today(),by:DB.session.user,qty:add,why});
    n++;
  });
  if(!n)return toast('Nothing to amend','bad');
  b.amendedOn=today();
  log('BOQ',b.no,'Amended',`${n} line(s) given a variation quantity · ${why}`);
  save();Sheet.close();toast(`${b.no} amended — ${n} line(s) regularised`,'ok');render();
}
