/* ============================================================
   v17 — amend the work order line, not fifteen items.

   A variation order from the client never arrives item by item. It
   says line 1 went from 400 metres to 500. The fifteen BOQ items
   sitting under that line were derived from it in the first place —
   each one is itemQty per work order unit — so making somebody
   retype all fifteen is both slow and a chance to get one wrong.

   So the quantity is entered once, on the work order line, and
   every item under it moves with it: a child's new quantity is its
   itemQty times the revised work order quantity, which is exactly
   the arithmetic the BOQ was built with. Any single item can still
   be overridden by hand afterwards, and it is marked when it has
   been.

   Getting there is now two steps rather than a dropdown of every
   BOQ in the branch: pick the site, pick the work order, then the
   sheet opens.
   ============================================================ */

/* ---------- the work order line's own sanctioned quantity ---------- */
function amdWoLines(a){return (a&&a.wolines)||[]}
function woSanctionOf(wl){
  let q=wl.boqQty;
  (DB.amendments||[]).filter(a=>isApproved(a)&&amdWoLines(a).some(x=>x.line===wl.id))
    .sort((a,b)=>String(a.date).localeCompare(String(b.date)))
    .forEach(a=>{const x=amdWoLines(a).find(y=>y.line===wl.id);if(x&&x.toQty!==undefined)q=x.toQty});
  return q;
}
const amdWoOf=b=>(b.kind==='BOQ'&&b.wo)?DB.boqs.find(x=>x.id===b.wo):null;
function amdWoLine(b,l){
  const wo=amdWoOf(b);
  return wo?wo.lines.find(w=>w.id===l.woLine):null;
}
/* what was typed against a work order line, and what it becomes */
function amdWoPreview(b,wl){
  const from=woSanctionOf(wl);
  const raw=(AM.w||{})[wl.id];
  const has=raw!==undefined&&String(raw).trim()!=='';
  const A=has?qparse(String(raw).trim()):null;
  let to=from;
  if(has){
    if(isRA(from))to=A;              // RA is replaced
    else if(isRA(A))to=RA;
    else to=n2(qn(from)+qn(A));
  }
  return {from,to,add:A,has,set:isRA(from),changed:has&&String(to)!==String(from)};
}
/* the change that cascades down to one item, unless it was overridden */
function amdChildAdd(b,l){
  if(AM.q&&AM.q[l.id]!==undefined)return {raw:AM.q[l.id],by:'hand'};
  const wl=amdWoLine(b,l);
  if(!wl)return {raw:'',by:null};
  const p=amdWoPreview(b,wl);
  if(!p.changed)return {raw:'',by:null};
  const per=+l.itemQty||0;
  if(!per)return {raw:'',by:null};
  /* the work order line was RA, so the child is set outright;
     otherwise the child moves by its share of the change */
  if(p.set)return {raw:String(n2(per*qn(p.to))),by:'wo',set:true};
  return {raw:String(n2(per*qn(p.add))),by:'wo'};
}

/* amdPreview now reads the cascade instead of only what was typed */
amdPreview=function(b,l){
  const from=sanctionOf(l);
  const src=amdChildAdd(b,l);
  const typed=String(src.raw==null?'':src.raw).trim();
  const has=typed!=='';
  const A=has?qparse(typed):null;
  let to=from;
  if(has){
    if(src.set)to=A;                 // cascaded from an RA work order line
    else if(isRA(from))to=A;         // this item is itself RA
    else if(isRA(A))to=RA;
    else to=n2(qn(from)+qn(A));
  }
  const committed=committedQty(b,l);
  const varNow=isRA(from)?committed:n2(Math.max(0,committed-qn(from)));
  const varThen=isRA(to)?committed:n2(Math.max(0,committed-qn(to)));
  const eFrom=estQtyOf(l);
  let eTo=eFrom;
  if(has&&eFrom!=null){
    if(src.set||isRA(eFrom))eTo=A;
    else if(isRA(A))eTo=RA;
    else eTo=n2(qn(eFrom)+qn(A));
  }
  return {from,to,add:A,has,committed,varNow,varThen,eFrom,eTo,by:src.by,
    changed:has&&String(to)!==String(from)};
};

function amdWoSet(wlid,v){
  AM.w=AM.w||{};
  if(String(v).trim()==='')delete AM.w[wlid];else AM.w[wlid]=v;
  /* a fresh work order figure supersedes anything typed by hand under it */
  const b=DB.boqs.find(x=>x.id===AM.boq);
  b.lines.filter(l=>l.woLine===wlid).forEach(l=>{if(AM.q)delete AM.q[l.id]});
  amdDraw();
}
function amdResetLine(lid){if(AM.q)delete AM.q[lid];amdDraw()}

/* ---------- the sheet ---------- */
amdDraw=function(){
  const b=DB.boqs.find(x=>x.id===AM.boq),el=document.getElementById('am_lines');if(!el)return;
  const on=!!AM.on;
  const q=(AM.filter||'').toLowerCase().trim();
  const rows=inRowsOf(b);
  const match=r=>!q||[r.sno,r.code,r.name,r.make,r.wo].join(' ').toLowerCase().includes(q);
  const cols=on?12:9;
  let body='',changed=0,varLines=0;

  for(let i=0;i<rows.length;i++){
    const r=rows[i];
    if(r.group){
      let any=false;
      for(let j=i+1;j<rows.length&&!rows[j].group;j++)if(match(rows[j]))any=true;
      if(!any)continue;
      const wl=(amdWoOf(b)||{lines:[]}).lines.find(w=>String(w.sno||'')===r.sno)
        ||(amdWoOf(b)||{lines:[]}).lines.find(w=>(w.name||lineName(w))===r.name);
      const p=wl?amdWoPreview(b,wl):null;
      const kids=wl?b.lines.filter(l=>l.woLine===wl.id).length:0;
      body+=`<tr style="background:var(--line-2)${p&&p.changed?';box-shadow:inset 3px 0 0 var(--ok)':''}">
        <td class="sn"><b>${esc(r.sno)}</b></td><td></td>
        <td><b>${esc(r.name)}</b><small>work order line · ${kids} item(s) follow it</small></td>
        <td>${esc(r.uom||'')}</td><td></td>
        <td class="rt mono"><b>${qshow(p?p.from:r.boqQty)}</b></td>
        <td colspan="${on?2:cols-6}"></td>
        ${on&&wl?`<td><input class="inp rt" id="amw_${wl.id}" style="width:104px;font-weight:600" inputmode="text"
              placeholder="${p.set?'set a qty':'+ / −'}" value="${esc(String((AM.w||{})[wl.id]||''))}"
              title="${p.set?'this work order line is RA — what you type replaces it, and every item under it follows'

          <td class="rt mono">${p.changed?`<b>${qshow(p.to)}</b>`:'<span style="color:var(--muted)">—</span>'}</td>
          <td>${p.changed?`<span class="tag ok">${kids} item(s) follow</span>`:''}</td>`
        :(on?'<td colspan="3"></td>':'')}
      </tr>`;
      continue;
    }
    if(!match(r))continue;
    const l=r.line, p=amdPreview(b,l);
    if(p.changed)changed++;
    if(p.varNow>0)varLines++;
    const makesVar=p.changed&&p.varThen>p.varNow;
    const clears=p.changed&&p.varThen<p.varNow;
    const stripe=p.changed?`box-shadow:inset 3px 0 0 var(--${makesVar?'bad':'ok'})`
      :(p.varNow>0?'box-shadow:inset 3px 0 0 var(--warn)':'');
    const auto=p.by==='wo';

    body+=`<tr ${stripe?`style="${stripe}"`:''} ${on?'':`class="row-open" onclick="amdOpen('${l.id}')" title="Amend this line"`}>

      <td class="rt mono">${qty(p.committed)}</td>
      <td class="rt mono" style="color:${p.varNow>0?'var(--bad)':'var(--muted)'}">${p.varNow?qty(p.varNow):'—'}</td>
      ${on?`<td><input class="inp rt" id="amq_${l.id}" style="width:104px${auto?';background:var(--brand-soft);border-color:var(--brand)':''}"
            inputmode="text" placeholder="${isRA(p.from)?'set a qty':'+ / −'}"
            value="${esc(String(p.has?(AM.q&&AM.q[l.id]!==undefined?AM.q[l.id]:amdChildAdd(b,l).raw):''))}"
            title="${auto?`${l.itemQty||0} per work order unit — filled in from the line above. Type over it to fix this one item.`:'added to the present quantity; type a minus to reduce it'}"
            onchange="amdSet('${l.id}',this.value)"></td>
        <td class="rt mono">${p.changed?`<b>${qshow(p.to)}</b>`:'<span style="color:var(--muted)">—</span>'}</td>
        <td>${!p.changed?''
          :`${auto?`<span class="tag">from the WO line · ${qty(+l.itemQty||0)} per unit</span>`
                  :(p.by==='hand'?`<span class="tag warn">set by hand</span>
                     <button class="btn sm" onclick="amdResetLine('${l.id}')" title="Go back to what the work order line gives">↺</button>`:'')}
             ${makesVar?`<span class="tag bad">leaves ${qty(p.varThen)} as variation</span>`
              :clears?`<span class="tag ok">clears ${qty(n2(p.varNow-p.varThen))}</span>`:''}`}</td>`:''}

  const byWo=Object.keys(AM.w||{}).length, byHand=Object.keys(AM.q||{}).length;

      <div class="sp"></div>

        ? `<span style="color:var(--muted)"><b>${changed}</b> item(s) amended${byWo?` from ${byWo} work order line(s)`:''}${byHand?` · ${byHand} set by hand`:''}</span>

        : `<span style="color:var(--muted)">${varLines?`<b>${varLines}</b> line(s) carry variation · `:''}click a line to amend it</span>

        ${on?'<th class="rt">Amend by</th><th class="rt">Becomes</th><th>Effect</th>':''}</tr></thead>
      <tbody>${body}</tbody></table></div>`;

  const btn=document.getElementById('am_go');
  if(btn){btn.disabled=!on||!changed;btn.style.display=on?'':'none'}
  const hint=document.getElementById('am_hint');

amdClose=function(){

/* the work order line change is recorded too, so the sanctioned
   quantity at that level moves with its items */
amdSave=function(){
  const b=DB.boqs.find(x=>x.id===AM.boq);
  const why=V('am_why').trim();
  if(!why)return toast('Say why the quantity changed — this is the audit record','bad');
  const cover=V('am_cov'), ref=V('am_ref').trim();
  if(cover==='VARIATION'&&!ref)return toast('A client variation needs its reference','bad');
  const lines=[],wolines=[];
  const wo=amdWoOf(b);
  if(wo)wo.lines.forEach(wl=>{
    const p=amdWoPreview(b,wl);
    if(!p.changed)return;
    wolines.push({line:wl.id,sno:wl.sno||'',name:wl.name||lineName(wl),
      fromQty:p.from,addQty:p.add,toQty:p.to,wasRA:isRA(p.from)||undefined});
  });
  b.lines.forEach(l=>{
    const p=amdPreview(b,l);
    if(!p.changed)return;
    lines.push({line:l.id,sno:l.sno||'',name:lineName(l),
      fromQty:p.from,addQty:p.add,toQty:p.to,fromEst:p.eFrom,toEst:p.eTo,
      wasRA:isRA(p.from)||undefined, from:p.by==='wo'?'WO':'HAND',
      committed:p.committed,varFrom:p.varNow,varTo:p.varThen});
  });
  if(!lines.length&&!wolines.length)return toast('Nothing to amend','bad');
  const amount=n2(lines.reduce((a,x)=>a+(qn(x.toQty)-qn(x.fromQty))*(+((b.lines.find(l=>l.id===x.line)||{}).supplyRate)||0),0));
  const a={id:uid('AM'),by:DB.session.user,no:doc(DB,'AMD'),date:V('am_d'),boq:b.id,site:b.site,branch:b.branch,
    lines,wolines,reason:why,cover,ref,appr:newAppr('AMEND'),amount};
  DB.amendments.push(a);
  log('AMEND',a.no,`${wolines.length?wolines.length+' work order line(s), ':''}${lines.length} item(s) amended on ${b.no}`,why);
  save();Sheet.close();
  toast(`${a.no} sent for approval — ${lines.length} item(s)`,'ok');
  render();
};

/* ============================================================
   v18 — indent the work order line, and the columns line up.

   Two things.

   First, a fault worth naming. The indent sheet had ten headings
   over eleven cells: the Make column was drawn but never given a
   heading, and the work order group row spanned twelve. So every
   figure from Make rightwards sat one column left of its heading —
   BOQ Qty appeared under Unit, the group row's quantity landed
   under Est Qty. The numbers were right; the sheet was lying about
   which column they were in.

   Second, the thing that was asked for. Preparing a BOQ, you enter
   a quantity once against the work order line and every item under
   it follows by its itemQty. Amending, the same. Indenting was the
   odd one out — item by item, fifteen boxes for what is really one
   decision. So the group row now carries an Indent Qty box of its
   own: type the work order quantity you need and every item under
   it fills in at its own rate. Any single item can still be typed
   over, and it is marked when it has been.
   ============================================================ */

/* enter against the work order line; every item under it follows */
function inWoSet(wlid,v){
  const b=matBoq(TMP.site);
  const kids=b.lines.filter(l=>l.woLine===wlid);
  TMP.wo=TMP.wo||{}; TMP.hand=TMP.hand||{};
  const s=String(v==null?'':v).trim();
  const tw=document.getElementById('in_tw'),top=tw?tw.scrollTop:0;
  if(s===''){
    delete TMP.wo[wlid];
    kids.forEach(l=>{inSetQty(l.id,0,true);delete TMP.hand[l.id]});
  }else{
    const n=qn(qparse(s));
    TMP.wo[wlid]=s;
    let capped=0,blocked=0;
    kids.forEach(l=>{
      delete TMP.hand[l.id];
      const want=n2((+l.itemQty||0)*n);
      const res=inSetQty(l.id,want,true);
      if(res.capped)capped++;
      if(want>0&&(!res.qty||res.qty<=0))blocked++;
    });
    if(blocked)toast(`${blocked} item(s) could not take anything — the estimate is a hard stop on those lines`,'bad');
    else if(capped)toast(`${capped} item(s) capped at their ceiling`,'bad');
  }
  indentDraw();
  const t2=document.getElementById('in_tw');if(t2)t2.scrollTop=top;
}
/* typing on one item marks it as set by hand, so the sheet can say so */
inType=function(lineId,v){
  const tw=document.getElementById('in_tw'),top=tw?tw.scrollTop:0;
  TMP.hand=TMP.hand||{};
  const l=matBoq(TMP.site).lines.find(x=>x.id===lineId);
  if(l&&TMP.wo&&TMP.wo[l.woLine]!==undefined)TMP.hand[lineId]=1;
  inSetQty(lineId,v);
  indentDraw();
  const t2=document.getElementById('in_tw');if(t2)t2.scrollTop=top;
};
function inResetLine(lineId){
  const b=matBoq(TMP.site),l=b.lines.find(x=>x.id===lineId);
  if(!l)return;
  TMP.hand=TMP.hand||{};delete TMP.hand[lineId];
  const v=(TMP.wo||{})[l.woLine];
  inSetQty(lineId,v===undefined?0:n2((+l.itemQty||0)*qn(qparse(v))),true);
  indentDraw();
}

indentDraw=function(){
  const b=matBoq(TMP.site),el=document.getElementById('in_lines');if(!el)return;
  const pol=overPolicy(b),st=boqState(b);
  TMP.wo=TMP.wo||{};TMP.hand=TMP.hand||{};
  const hdr=document.getElementById('in_boq');
  if(hdr)hdr.textContent=`${b.no} — ${site(TMP.site).name} · ${b.lines.length} line(s) prepared`;
  const pl=document.getElementById('in_pol');
  if(pl)pl.innerHTML=`<div class="banner ${st.tag==='AMEND'?'bad':(pol.allow?'warn':'info')}">${st.tag==='AMEND'?'▲':(pol.allow?'⚠':'▤')}
    <div>${st.tag==='AMEND'?`<b>This BOQ is already past its estimate on ${st.over.length} line(s)</b> and is waiting on an amendment. `:''}
      ${pol.allow?`This BOQ allows indenting beyond the estimate${pol.pct?` up to <b>${pol.pct}%</b>`:' with <b>no ceiling</b>'}. Anything past the estimate is flagged and still needs an amendment.`
                 :'This BOQ does not allow indenting beyond the estimate — the estimated quantity is a hard stop.'}</div></div>`;

  const q=(TMP.filter||'').toLowerCase().trim();
  const rows=inRowsOf(b);
  const match=r=>!q||[r.sno,r.code,r.name,r.make,r.wo].join(' ').toLowerCase().includes(q);
  const wanted=r=>!TMP.onlyPicked||inQty(r.id)!=='';
  const wo=(b.kind==='BOQ'&&b.wo)?DB.boqs.find(x=>x.id===b.wo):null;

  let body='',shown=0;
  for(let i=0;i<rows.length;i++){
    const r=rows[i];

    if(r.group){
      let any=false;
      for(let j=i+1;j<rows.length&&!rows[j].group;j++)if(match(rows[j])&&wanted(rows[j]))any=true;
      if(!any)continue;
      const wl=wo?(wo.lines.find(x=>String(x.sno||'')===r.sno)||wo.lines.find(x=>(x.name||lineName(x))===r.name)):null;
      const kids=wl?b.lines.filter(l=>l.woLine===wl.id):[];
      const picked=kids.filter(l=>inQty(l.id)!=='').length;
      body+=`<tr style="background:var(--line-2)">
        <td class="sn"><b>${esc(r.sno)}</b></td>
        <td></td>
        <td colspan="3"><b>${esc(r.name)}</b><small>work order line · ${kids.length} item(s)${picked?` · ${picked} filled`:''}</small></td>
        <td class="rt mono"><b>${qshow(r.boqQty)}</b></td>
        <td colspan="3"></td>
        ${wl?`<td class="rt"><input class="inp rt" id="iw_${wl.id}" inputmode="decimal" style="width:96px;font-weight:600"
              value="${esc(String(TMP.wo[wl.id]||''))}" placeholder="${esc(r.uom||'qty')}"
              title="the work order quantity you need — every item under this line fills in at its own rate"
              onchange="inWoSet('${wl.id}',this.value)"></td>
          <td>${TMP.wo[wl.id]?`<span class="tag ok">${kids.length} item(s) follow</span>`:'<small style="color:var(--muted)">enter once here</small>'}</td>`
        :'<td></td><td></td>'}
      </tr>`;
      continue;
    }

    if(!match(r)||!wanted(r))continue;
    shown++;
    const on=inQty(r.id), over=inOver(r.id), l=r.line;
    const ra=r.ra, vnow=r.variation||0;
    const pct=(!ra&&over&&qn(r.est))?over/qn(r.est)*100:0;
    const cls=over>0?(ra?'bad':(pol.allow&&pol.pct>0&&pct<=pol.pct?'warn':'bad')):'';
    const auto=on!==''&&TMP.wo[l.woLine]!==undefined&&!TMP.hand[l.id];
    const hand=on!==''&&TMP.hand[l.id];
    const bal=r.free===Infinity?'no ceiling':(r.free<0?'▲ '+qty(-r.free)+' over':qty(r.free));

    body+=`<tr ${cls?`style="box-shadow:inset 3px 0 0 var(--${cls})"`:(on!==''?'style="background:var(--brand-soft)"':'')}>
      <td class="sn">${esc(r.sno)}</td>
      <td class="mono">${esc(r.code||'—')}</td>
      <td>${esc(r.name)}</td>
      <td>${esc(r.uom)}</td>
      <td>${esc(r.make||'—')}</td>
      <td class="rt mono">${qshow(r.boqQty)}</td>
      <td class="rt mono"><b>${qshow(r.est)}</b>${vnow?`<small>+${qty(vnow)} variation</small>`:(r.estimated?'':'<small>work order qty</small>')}</td>
      <td class="rt mono">${qty(r.used)}</td>
      <td class="rt mono" style="color:${r.free===Infinity?'var(--muted)':(r.free<0?'var(--bad)':(r.free>0?'inherit':'var(--muted)'))}">${bal}</td>
      <td class="rt"><input class="inp rt" id="iq_${l.id}" inputmode="decimal"
            style="width:96px${auto?';background:var(--brand-soft);border-color:var(--brand)':''}"
            value="${on===''?'':on}" placeholder="—"
            title="${auto?`${qty(+l.itemQty||0)} per work order unit — filled in from the line above. Type over it to fix this one item.`:'quantity for this item'}"
            onchange="inType('${l.id}',this.value)"></td>
      <td>${on===''?'<span class="tag" style="opacity:.45">not indented</span>'
            :`${ra?'<span class="tag bad">RA · all of it is variation</span>'
                 :(over>0?`<span class="tag ${cls}">${qty(over)} over · ${pct.toFixed(1)}%</span>`
                         :'<span class="tag ok">within estimate</span>')}
              ${auto?`<small>from the WO line · ${qty(+l.itemQty||0)} per unit</small>`:''}
              ${hand?`<span class="tag warn">set by hand</span>
                 <button class="btn sm" onclick="inResetLine('${l.id}')" title="Go back to what the work order line gives">↺</button>`:''}`}</td>
    </tr>`;
  }

  const picked=TMP.lines.length, overN=TMP.lines.filter(l=>+l.overQty>0).length;
  const byWo=Object.keys(TMP.wo).length;
  el.innerHTML=`
    <div class="pad" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line)">
      <input class="inp" id="in_q" placeholder="Find a line — code, description or make" style="max-width:290px"
        value="${esc(TMP.filter||'')}" oninput="inFilter(this.value)">
      <button class="btn sm ${TMP.onlyPicked?'pri':''}" onclick="TMP.onlyPicked=!TMP.onlyPicked;indentDraw()">
        ${TMP.onlyPicked?'Showing what I filled':'Only what I filled'}</button>
      <div class="sp"></div>
      <span style="color:var(--muted)">${shown} line(s) shown · <b>${picked}</b> on this indent${byWo?` from ${byWo} work order line(s)`:''}${overN?` · <span style="color:var(--bad)">${overN} past the estimate</span>`:''}</span>
    </div>
    <div class="tw" id="in_tw" style="max-height:56vh;overflow:auto"><table>
      <thead><tr>
        <th>Sl No</th><th>Item Code</th><th style="min-width:210px">Description</th>
        <th>Unit</th><th>Make</th>
        <th class="rt">BOQ Qty</th><th class="rt">Est Qty</th><th class="rt">Indented</th><th class="rt">Balance</th>
        <th class="rt">Indent Qty</th><th style="min-width:150px">Against estimate</th></tr></thead>
      <tbody>${body||`<tr><td colspan="11">${emptyBox('Nothing matches','Clear the search to see the whole BOQ.')}</td></tr>`}</tbody>
    </table></div>`;

};

/* a quantity goes to Excel as a number so it can be summed there;
   only RA has to travel as a word */
const xlq=v=>isRA(v)?'RA':qn(v);

/* the make column is read-only on the indent now — it is the BOQ's
   choice, and it was the unlabelled column throwing the sheet out */
inGrid=function(){
  const b=matBoq(TMP.site),s=site(TMP.site),pol=overPolicy(b),st=boqState(b);
  const g=[];
  g.push(['Raise an indent']);
  g.push([`${s.name} · ${b.no} · ${b.lines.length} line(s) prepared`]);
  g.push([`Indent date ${dmy(V('in_d')||today())}     Needed by ${dmy(V('in_need')||today())}`]);
  g.push([(st.tag==='AMEND'?`This BOQ is already past its estimate on ${st.over.length} line(s) and is waiting on an amendment. `:'')
    +(pol.allow?`Beyond the estimate: allowed${pol.pct?` up to ${pol.pct}%`:' with no ceiling'} — anything past it is flagged.`
               :'Beyond the estimate: not allowed — the estimated quantity is a hard stop.')]);
  g.push([]);
  const hdr=g.length;
  g.push(IN_HEAD.slice());
  const groups=[];
  inRowsOf(b).forEach(r=>{
    if(r.group){groups.push(g.length);
      g.push([r.sno,'',r.name+'   (work order line)',r.uom,xlq(r.boqQty),'','','','','']);return}
    const on=inQty(r.id);
    g.push([r.sno,r.code,r.name+(r.make?' · '+r.make:''),r.uom,
            xlq(r.boqQty),xlq(r.est),r.used,r.free===Infinity?'no ceiling':r.free,
            on===''?'':+on,inStatusText(r)]);
  });
  g.push([]);
  g.push(['','','Fill the Indent Qty column only. A line left blank stays as it is; a 0 takes it off the indent.']);
  g.push(['','','Sl No is what each line is matched on when this sheet is dropped back into the ERP.']);
  return {grid:g,hdr,groups};
};
inStatusText=function(r){
  const on=inQty(r.id),over=inOver(r.id);
  if(on==='')return 'not indented';
  if(r.ra)return 'RA — all of it is variation';
  if(over>0){const pct=qn(r.est)?over/qn(r.est)*100:0;return `${qty(over)} over · ${pct.toFixed(1)}%`}
  return 'within estimate';
};


/* ============================================================
   v19 — an indent, once approved, stops being a list of BOQ lines.

   The site raises against the BOQ, so an indent can carry the same
   cable three times over — once under each work order line it was
   estimated on. That is right for the site and useless for everyone
   after them: the buyer negotiates one quantity, the storekeeper
   picks one heap. So from the moment it is approved, Store and
   Procurement see the indent added up by item.

   And nobody could see how far it had got. Procurement could not
   tell whether a PO covered an indent fully or in part; the store
   could not tell whether an indent had been issued out completely;
   the site could not tell either. Each document knew its own step.
   Now every indent carries two states, one per department:

       Procurement   not ordered / part ordered / fully ordered
       Store         not issued  / part issued  / fully issued

   with the remaining quantity spelled out, which is the only thing
   a follow-up is ever about.

   Three flows change with it. A purchase order can be raised across
   several indents at once, against the combined requirement. A GRN
   can be posted against a PO as many times as the deliveries come,
   until it is full. And an issue can be raised against an indent,
   showing only what is still to go to site — so the second issue
   naturally offers the leftovers of the first.
   ============================================================ */

/* ---------- what a document did for a specific indent line ---------- */
function recvQtyOfIndentLine(indId,lineId){
  let q=0;
  DB.pos.forEach(p=>{if(isRejected(p))return;
    (p.lines||[]).forEach(l=>{if(l.indent===indId&&l.indentLine===lineId)q+=grnQtyOfPoLine(p.id,l.id)});});
  return n2(q);
}
/* issues raised against the indent name it, so these are exact */
function linkedIssue(indId,lineId){
  let del=0,tr=0;
  allMoves().filter(m=>m.kind!=='return').forEach(m=>(m.lines||[]).forEach(l=>{
    if(l.indent===indId&&l.indentLine===lineId){
      if(m.status==='RECEIVED')del+=+l.qty;else tr+=+l.qty;}}));
  return {delivered:n2(del),transit:n2(tr)};
}
/* arrivals at a site that name no indent — still allocated oldest
   first, because a challan raised the old way carries no link */
trkArrivals=function(siteId){
  const m={};
  allMoves().filter(x=>x.kind!=='return'&&x.toSite===siteId).forEach(x=>
    (x.lines||[]).forEach(l=>{
      if(l.indent)return;                       // linked, counted exactly
      const k=l.prod+'||'+(l.make||'');
      const b=m[k]=m[k]||{delivered:0,transit:0};
      const f=x.status==='RECEIVED'?'delivered':'transit';
      b[f]=n2(b[f]+ +l.qty);
    }));
  return m;
};

trkRows=function(){
  const rows=[];
  const inds=minePerSite(DB.indents).filter(i=>!i.draft&&!isRejected(i))
    .sort((a,b)=>String(a.date).localeCompare(String(b.date)));
  const pool={};
  inds.forEach(i=>{
    (i.lines||[]).forEach(l=>{
      const ordered=n2(poQtyOfIndentLine(i.id,l.id));
      const received=recvQtyOfIndentLine(i.id,l.id);
      const q=+l.qty||0;
      const link=linkedIssue(i.id,l.id);
      let del=link.delivered,tr=link.transit;
      if(isApproved(i)&&del+tr<q-0.001){
        pool[i.site]=pool[i.site]||trkArrivals(i.site);
        const k=l.prod+'||'+(l.make||''),b=pool[i.site][k]||{delivered:0,transit:0};
        const wantD=Math.min(q-del-tr,b.delivered); b.delivered=n2(b.delivered-wantD); del=n2(del+wantD);
        const wantT=Math.min(q-del-tr,b.transit);   b.transit  =n2(b.transit-wantT);   tr =n2(tr+wantT);
        pool[i.site][k]=b;
      }
      rows.push({ind:i,line:l,qty:q,ordered,received,
        delivered:n2(del),transit:n2(tr),pending:n2(q-del-tr),
        pos:trkPoLines(i.id,l.id)});
    });
  });
  return rows;
};

/* ---------- the indent, added up by item ---------- */
function indCum(ids){
  const want=[].concat(ids);
  const m={};
  trkRows().filter(r=>want.includes(r.ind.id)).forEach(r=>{
    const k=r.line.prod+'||'+(r.line.make||'');
    const x=m[k]=m[k]||{prod:r.line.prod,make:r.line.make||'',uom:r.line.uom||(prod(r.line.prod).uom||''),
      qty:0,ordered:0,received:0,transit:0,delivered:0,parts:[]};
    x.qty=n2(x.qty+r.qty); x.ordered=n2(x.ordered+r.ordered); x.received=n2(x.received+r.received);
    x.transit=n2(x.transit+r.transit); x.delivered=n2(x.delivered+r.delivered);
    x.parts.push(r);
  });
  return Object.values(m).map(x=>({...x,
    toOrder:n2(Math.max(0,x.qty-x.ordered)),
    toIssue:n2(Math.max(0,x.qty-x.delivered-x.transit)),
    atStore:n2(Math.max(0,x.received-x.delivered-x.transit))}))
    .sort((a,b)=>pname(a.prod).localeCompare(pname(b.prod)));
}
/* the two states an indent carries, one per department */
function indDept(i){
  const c=indCum(i.id), e=0.001;
  const need=c.reduce((a,x)=>a+x.qty,0);
  const ord=c.reduce((a,x)=>a+Math.min(x.qty,x.ordered),0);
  const del=c.reduce((a,x)=>a+x.delivered,0);
  const tr=c.reduce((a,x)=>a+x.transit,0);
  const po = ord<=e?{k:0,t:'Not ordered',cls:'bad'}
    : ord>=need-e?{k:2,t:'Fully ordered',cls:'ok'}
    : {k:1,t:`Part ordered · ${qty(n2(need-ord))} left`,cls:'warn'};
  /* the store's question is whether anything is still to go out, which
     is not the same as whether the site has it yet — a challan in
     transit is off the store's plate and not yet on the site's */
  const store = del<=e&&tr<=e?{k:0,t:'Not issued',cls:'bad'}
    : del>=need-e?{k:2,t:'Fully issued',cls:'ok'}
    : del+tr>=need-e?{k:2,t:`Fully issued · ${qty(n2(tr))} in transit`,cls:'warn'}
    : {k:1,t:`Part issued · ${qty(n2(need-del-tr))} left`,cls:'warn'};
  return {po,store,need:n2(need),ordered:n2(ord),delivered:n2(del),transit:n2(tr),
    left:n2(Math.max(0,need-del-tr)),items:c.length};
}
const indFull=i=>indDept(i).store.k===2;

/* ---------- the indent as Store and Procurement see it ---------- */
function indOpen(id){
  const i=DB.indents.find(x=>x.id===id);if(!i)return;
  const c=indCum(id), s=indDept(i);
  const late=i.need&&String(i.need)<today()&&s.left>0;
  Sheet.open(i.no,
    `${site(i.site).name} · raised ${dmy(i.date)}${i.need?` · needed by ${dmy(i.need)}`:''} · ${c.length} item(s)`,
    `<div class="banner ${s.store.k===2?'ok':(late?'bad':'info')}">${s.store.k===2?'✓':(late?'▲':'▤')}
       <div><b>${i.lines.length} BOQ line(s) added up to ${c.length} item(s).</b>
         The site raises against the BOQ, so the same item can appear more than once — here it is one line,
         which is what gets bought and what gets picked.${late?' <b>This indent is past the date the site asked for.</b>':''}</div></div>
     <div class="row2">
       ${field('Procurement',`<div class="inp" style="background:var(--line-2)">
          <span class="tag ${s.po.cls}">${s.po.t}</span></div>`)}
       ${field('Store',`<div class="inp" style="background:var(--line-2)">
          <span class="tag ${s.store.cls}">${s.store.t}</span></div>`)}</div>
     <div class="card"><header><div><h3>What this indent asks for</h3>
       <p>added up by item — every quantity below is the total across its BOQ lines</p></div></header>
       <div class="tw"><table><thead><tr><th style="min-width:220px">Item</th><th>Unit</th>
         <th class="rt">Required</th><th class="rt">Ordered</th><th class="rt">At store</th>
         <th class="rt">In transit</th><th class="rt">Delivered</th><th class="rt">Still to come</th>
         <th style="min-width:150px">Where it is</th></tr></thead>
         <tbody>${c.map(x=>{
           const st=x.delivered>=x.qty-0.001?{t:'Delivered at site',cls:'ok'}
             :x.atStore>0.001?{t:`At store, ${qty(x.atStore)} to issue`,cls:'warn'}
             :x.transit>0?{t:'In transit to site',cls:'warn'}
             :x.ordered>=x.qty-0.001?{t:'On order',cls:'warn'}
             :x.ordered>0?{t:'Part ordered',cls:'bad'}:{t:'Not ordered yet',cls:'bad'};
           return `<tr><td>${esc(pname(x.prod))}<small class="mono">${esc(prod(x.prod).code||'')}${x.make?' · '+esc(x.make):''}</small>
               ${x.parts.length>1?`<small>from ${x.parts.length} BOQ lines</small>`:''}</td>
             <td>${esc(x.uom)}</td>
             <td class="rt mono"><b>${qty(x.qty)}</b></td>
             <td class="rt mono">${x.ordered?qty(x.ordered):'—'}</td>
             <td class="rt mono">${x.atStore?qty(x.atStore):'—'}</td>
             <td class="rt mono">${x.transit?qty(x.transit):'—'}</td>
             <td class="rt mono">${x.delivered?qty(x.delivered):'—'}</td>
             <td class="rt mono" style="color:${x.toIssue>0?'var(--bad)':'var(--ok)'}"><b>${x.toIssue>0?qty(x.toIssue):'nil'}</b></td>
             <td><span class="tag ${st.cls}">${st.t}</span></td></tr>`}).join('')}
         </tbody></table></div></div>`,
    `<button class="btn" onclick="Sheet.close()">Close</button>
     ${canEdit('po')&&s.po.k<2?`<button class="btn" onclick="Sheet.close();setTimeout(()=>poSheet('${i.id}'),80)">Raise a PO</button>`:''}
     ${canEdit('issue')&&s.store.k<2?`<button class="btn pri" onclick="Sheet.close();setTimeout(()=>issueSheet('${i.id}'),80)">Issue to site</button>`:''}`);
}

/* ============================================================
   PURCHASE ORDER — against one indent or several at once
   ============================================================ */
function poIndents(){
  return scoped(DB.indents).filter(i=>isApproved(i)&&i.lines.some(l=>indentBal(i.id,l.id)>0.001))
    .sort((a,b)=>String(a.date).localeCompare(String(b.date)));
}
/* the combined requirement across whatever indents are ticked */
function poReq(){
  const m={};
  (TMP.indents||[]).forEach(id=>{
    const i=byId(DB.indents,id);
    (i.lines||[]).forEach(l=>{
      const bal=indentBal(i.id,l.id);
      if(bal<=0.001)return;
      const k=l.prod+'||'+(l.make||'');
      const x=m[k]=m[k]||{prod:l.prod,make:l.make||'',uom:l.uom||prod(l.prod).uom||'',bal:0,parts:[],inds:{}};
      x.bal=n2(x.bal+bal);
      x.parts.push({ind:i,line:l,bal});
      x.inds[i.no]=n2((x.inds[i.no]||0)+bal);
    });
  });
  return Object.values(m).sort((a,b)=>pname(a.prod).localeCompare(pname(b.prod)));
}
function poToggle(id){
  TMP.indents=TMP.indents||[];
  TMP.indents=TMP.indents.includes(id)?TMP.indents.filter(x=>x!==id):TMP.indents.concat([id]);
  TMP.order={};poDraw();
}
function poReqSet(key,v){
  const r=poReq().find(x=>x.prod+'||'+x.make===key);if(!r)return;
  let q=+v||0;if(q<0)q=0;
  if(q>r.bal){q=r.bal;toast(`Capped at the combined balance of ${qty(r.bal)}`,'bad')}
  TMP.order=TMP.order||{};
  if(q<=0)delete TMP.order[key];else TMP.order[key]={qty:q,rate:(TMP.order[key]||{}).rate};
  poDraw();
}
function poRateSet(key,v){TMP.order=TMP.order||{};if(TMP.order[key])TMP.order[key].rate=+v||0;poDraw()}
function poRateOf(r){
  const k=r.prod+'||'+r.make, o=(TMP.order||{})[k];
  if(o&&o.rate!==undefined&&o.rate!==null&&o.rate!=='')return +o.rate;
  for(const p of r.parts){const q=quoteRate(p.ind.id,p.line.id);if(q)return q}
  const lr=lastRate(r.prod,r.make);
  return lr>0?lr:(+prod(r.prod).rate||0);
}

poSheet=function(seedIndent){
  const inds=poIndents();
  if(!inds.length)return toast('No approved indent with balance left','bad');
  const seed=seedIndent&&inds.some(i=>i.id===seedIndent)?seedIndent:inds[0].id;
  const sups=DB.suppliers.filter(s=>s.type==='SUPPLIER');
  const stores=scoped(DB.sites);
  TMP={indents:[seed],order:{},lines:[]};
  Sheet.open('New purchase order','One order can cover several indents — the requirement is added up by item',
    `<div class="row2">${field('Supplier',sel('po_s',sups.map(s=>({v:s.id,t:s.name}))))}
      ${field('Deliver to',sel('po_to',stores.map(s=>({v:s.id,t:s.name+(s.type==='STORE'?' (store)':'')}))))}</div>
     <div class="row2">${field('PO date',txt('po_d',today(),'date'))}${field('Delivery by',txt('po_dl',addDays(today(),10),'date'))}</div>
     <div class="card"><header><div><h3>Indents to cover</h3>
       <p>tick as many as this order is for — their requirements are added together</p></div></header>
       <div id="po_inds"></div></div>
     <div class="card"><header><div><h3>The combined requirement</h3><p id="po_hint"></p></div></header>
       <div id="po_lines"></div></div>`,
    `<button class="btn" onclick="Sheet.close()">Cancel</button>
     <button class="btn pri" id="po_go" onclick="savePo()">Send for approval</button>`);
  poDraw();
};

poDraw=function(){
  const box=document.getElementById('po_inds');
  const inds=poIndents();
  if(box)box.innerHTML=`<div class="tw"><table><thead><tr><th style="width:44px"></th><th>Indent</th><th>Site</th>
      <th>Raised</th><th>Needed by</th><th class="rt">Items left</th><th>Procurement</th></tr></thead>
      <tbody>${inds.map(i=>{
        const on=(TMP.indents||[]).includes(i.id), s=indDept(i);
        const left=i.lines.filter(l=>indentBal(i.id,l.id)>0.001).length;
        const late=i.need&&String(i.need)<today();
        return `<tr class="row-open" onclick="poToggle('${i.id}')" ${on?'style="background:var(--brand-soft)"':''}>
          <td style="text-align:center">${on?'<span class="tag ok">✓</span>':'<span class="tag" style="opacity:.4">＋</span>'}</td>
          <td><b>${esc(i.no)}</b></td><td>${esc(site(i.site).name)}</td>
          <td>${dmy(i.date)}</td>
          <td>${i.need?dmy(i.need):'—'}${late?' <span class="tag bad">late</span>':''}</td>
          <td class="rt mono">${left}</td>
          <td><span class="tag ${s.po.cls}">${s.po.t}</span></td></tr>`}).join('')}
      </tbody></table></div>`;

  const el=document.getElementById('po_lines');if(!el)return;
  const req=poReq();
  const h=document.getElementById('po_hint');
  if(h)h.textContent=(TMP.indents||[]).length>1
    ? `${req.length} item(s) across ${TMP.indents.length} indents — an item wanted by more than one is a single line here`
    : `${req.length} item(s) still to order on this indent`;
  if(!req.length){el.innerHTML=emptyBox('Nothing to order','Tick an indent above, or everything on it is already ordered.');
    const g=document.getElementById('po_go');if(g)g.disabled=true;return}

  let val=0;
  const rows=req.map(r=>{
    const k=r.prod+'||'+r.make, o=(TMP.order||{})[k], q=o?+o.qty:0;
    const rate=poRateOf(r), gst=+prod(r.prod).gst||0;
    val+=q*rate*(1+gst/100);
    const many=Object.keys(r.inds).length>1;
    return `<tr ${q>0?'style="background:var(--brand-soft)"':''}>
      <td>${esc(pname(r.prod))}<small class="mono">${esc(prod(r.prod).code||'')}${r.make?' · '+esc(r.make):''}</small>
        <small>${Object.keys(r.inds).map(n=>esc(n)+' '+qty(r.inds[n])).join(' · ')}${many?' <span class="tag">combined</span>':''}</small></td>
      <td>${esc(r.uom)}</td>
      <td class="rt mono"><b>${qty(r.bal)}</b></td>
      <td class="rt"><input class="inp rt" style="width:96px" inputmode="decimal" value="${q||''}" placeholder="—"
          onchange="poReqSet('${k}',this.value)"></td>
      <td class="rt"><input class="inp rt" style="width:104px${!(rate>0)&&q>0?';border-color:var(--bad)':''}"
          inputmode="decimal" value="${rate||''}" placeholder="rate?"
          title="${lastRate(r.prod,r.make)>0?'what this item last cost on average':'never bought before — type the rate'}"
          onchange="poRateSet('${k}',this.value)"></td>
      <td class="rt mono">${gst}%</td>
      <td class="rt mono">${q?money(q*rate*(1+gst/100)):'—'}</td></tr>`;
  }).join('');

  el.innerHTML=`<div class="pad" style="border-bottom:1px solid var(--line);display:flex;gap:9px;align-items:center;flex-wrap:wrap">
      <button class="btn sm" onclick="poFillAll()">Order the whole balance</button>
      <button class="btn sm" onclick="TMP.order={};poDraw()">Clear</button>
      <div class="sp"></div><span style="color:var(--muted)">rates come from the selected comparison, then from what the item last cost</span></div>
    <div class="tw"><table><thead><tr><th style="min-width:230px">Item</th><th>Unit</th>
      <th class="rt">Still to order</th><th class="rt">Order qty</th><th class="rt">Rate</th>
      <th class="rt">GST</th><th class="rt">Amount</th></tr></thead><tbody>${rows}</tbody>
      <tfoot><tr><th colspan="6" class="rt">PO value incl. GST</th><th class="rt mono">${money(val)}</th></tr></tfoot>
    </table></div>`;
  const missing=req.filter(r=>{const k=r.prod+'||'+r.make;const o=(TMP.order||{})[k];
    return o&&+o.qty>0&&!(poRateOf(r)>0)});
  const g=document.getElementById('po_go');
  if(g){g.disabled=!Object.keys(TMP.order||{}).length||missing.length>0;
    g.title=missing.length?`${missing.length} item(s) still need a rate`:''}
  if(missing.length)el.insertAdjacentHTML('afterbegin',
    `<div class="pad" style="border-bottom:1px solid var(--line)"><div class="banner warn">⚠ <div>
      <b>${missing.length} item(s) have no rate.</b> ${esc(missing.slice(0,3).map(r=>pname(r.prod)).join(', '))}${missing.length>3?' …':''}
      — nothing has been bought at a price before and no comparison is selected, so the rate has to be typed.</div></div></div>`);
};
function poFillAll(){
  TMP.order={};
  poReq().forEach(r=>{TMP.order[r.prod+'||'+r.make]={qty:r.bal}});
  poDraw();
}

/* an ordered quantity is spread back across the indent lines it came
   from, oldest first, so every indent line keeps its own balance */
savePo=function(){
  const req=poReq(), order=TMP.order||{};
  const lines=[];
  req.forEach(r=>{
    const k=r.prod+'||'+r.make, o=order[k];
    if(!o||!(+o.qty>0))return;
    let left=+o.qty;
    const rate=poRateOf(r), gst=+prod(r.prod).gst||0;
    r.parts.slice().sort((a,b)=>String(a.ind.date).localeCompare(String(b.ind.date))).forEach(p=>{
      if(left<=0.001)return;
      const take=Math.min(left,p.bal);
      if(take<=0.001)return;
      left=n2(left-take);
      lines.push({id:uid('L'),indent:p.ind.id,indentLine:p.line.id,prod:r.prod,make:r.make,
        qty:n2(take),rate,gst});
    });
  });
  if(!lines.length)return toast('Enter a quantity against at least one item','bad');
  const noRate=lines.filter(l=>!(+l.rate>0));
  if(noRate.length)return toast(`${pname(noRate[0].prod)} has no rate — nothing has been bought at this price before, so type one`,'bad');
  const first=byId(DB.indents,lines[0].indent);
  const ids=[...new Set(lines.map(l=>l.indent))];
  const p={id:uid('PO'),by:DB.session.user,no:doc(DB,'PO'),date:V('po_d'),due:V('po_dl'),sup:V('po_s'),
    indent:first.id,indents:ids,site:V('po_to'),forSite:first.site,branch:first.branch,
    lines,appr:newAppr('PO'),amount:0};
  p.amount=poValue(p);DB.pos.push(p);
  log('PO',p.no,'Raised',`${sup(p.sup).name} · ${lines.length} line(s) across ${ids.length} indent(s)`);
  save();Sheet.close();
  toast(`${p.no} sent for approval — covering ${ids.length} indent(s)`,'ok');render();
};

/* ---------- how far a PO has been received ---------- */
function poRecvState(p){
  const ord=n2((p.lines||[]).reduce((a,l)=>a+ +l.qty,0));
  const got=n2((p.lines||[]).reduce((a,l)=>a+grnQtyOfPoLine(p.id,l.id),0));
  const pend=n2(ord-got);
  if(!isApproved(p))return {t:'Awaiting approval',cls:'warn',ord,got,pend};
  if(pend<=0.001)return {t:'Received in full',cls:'ok',ord,got,pend};
  if(got>0.001)return {t:`Part received · ${qty(pend)} pending`,cls:'warn',ord,got,pend};
  return {t:'Nothing received',cls:'bad',ord,got,pend};
}

/* ============================================================
   ISSUE — against an indent, showing what is still to go
   ============================================================ */
function issIndents(siteId){
  return scoped(DB.indents).filter(i=>isApproved(i)&&(!siteId||i.site===siteId))
    .filter(i=>indDept(i).left>0.001)
    .sort((a,b)=>String(a.date).localeCompare(String(b.date)));
}
function issReq(){
  const m={};
  (TMP.indents||[]).forEach(id=>{
    const i=byId(DB.indents,id);
    trkRows().filter(r=>r.ind.id===id&&r.pending>0.001).forEach(r=>{
      const k=r.line.prod+'||'+(r.line.make||'');
      const x=m[k]=m[k]||{prod:r.line.prod,make:r.line.make||'',uom:r.line.uom||prod(r.line.prod).uom||'',
        left:0,parts:[],inds:{}};
      x.left=n2(x.left+r.pending);
      x.parts.push({ind:i,line:r.line,left:r.pending});
      x.inds[i.no]=n2((x.inds[i.no]||0)+r.pending);
    });
  });
  return Object.values(m).map(x=>({...x,stock:n2(stockAt(TMP.from,x.prod,x.make))}))
    .sort((a,b)=>pname(a.prod).localeCompare(pname(b.prod)));
}
function issToggle(id){
  TMP.indents=(TMP.indents||[]).includes(id)?TMP.indents.filter(x=>x!==id):(TMP.indents||[]).concat([id]);
  const i=byId(DB.indents,TMP.indents[0]||id);
  if(TMP.indents.length===1)TMP.to=i.site;
  TMP.send={};issueDraw();
}
function issSet(key,v){
  const r=issReq().find(x=>x.prod+'||'+x.make===key);if(!r)return;
  let q=+v||0;if(q<0)q=0;
  const cap=Math.min(r.left,r.stock);
  if(q>cap){q=cap;toast(q<=0?`Nothing of this in ${site(TMP.from).name}`
    :`Capped at ${qty(cap)} — ${r.stock<r.left?'that is all the store holds':'that is all the indent still needs'}`,'bad')}
  TMP.send=TMP.send||{};
  if(q<=0)delete TMP.send[key];else TMP.send[key]=q;
  issueDraw();
}
function issFillAll(){
  TMP.send={};
  issReq().forEach(r=>{const q=n2(Math.min(r.left,r.stock));if(q>0)TMP.send[r.prod+'||'+r.make]=q});
  issueDraw();
}

/* what is sent is allocated back to the indent lines it satisfies, so
   the next challan opens on the true leftovers rather than guessing */
saveIssue=function(){
  const req=issReq(), send=TMP.send||{};
  const lines=[];
  req.forEach(r=>{
    const k=r.prod+'||'+r.make;
    let left=+send[k]||0;
    if(left<=0.001)return;
    r.parts.slice().sort((a,b)=>String(a.ind.date).localeCompare(String(b.ind.date))).forEach(p=>{
      if(left<=0.001)return;
      const take=Math.min(left,p.left);
      if(take<=0.001)return;
      left=n2(left-take);
      lines.push({prod:r.prod,make:r.make,qty:n2(take),indent:p.ind.id,indentLine:p.line.id});
    });
  });
  if(!lines.length)return toast('Enter a quantity against at least one item','bad');
  if(!TMP.to)return toast('Pick an indent so the challan knows where it is going','bad');
  const from=site(TMP.from),to=site(TMP.to);
  const i={id:uid('DC'),by:DB.session.user,no:doc(DB,'DC'),date:V('is_d'),fromSite:from.id,toSite:to.id,
    branch:from.branch,lines,indents:[...new Set(lines.map(l=>l.indent))],status:'DISPATCHED'};
  DB.issues.push(i);
  const closed=i.indents.filter(id=>indDept(byId(DB.indents,id)).left<=0.001);
  log('ISSUE',i.no,'Dispatched to '+to.name,`${lines.length} line(s) against ${i.indents.length} indent(s)`);
  save();Sheet.close();
  toast(closed.length?`Dispatched — ${closed.length} indent(s) now fully issued`
                     :'Dispatched — in transit until the site acknowledges','ok');
  render();
};

/* ============================================================
   v21 — bill what was drawn, then count what is left.

   Two corrections to how a bill closes out.

   First, the ceiling. Billing against the work order quantity lets
   a site bill for work it has not drawn material for. The real
   ceiling is the cumulative indent: you cannot have laid more cable
   than you took off the store. So the bill caps at what was
   indented, and the work order quantity is shown beside it as the
   contract limit rather than the working one.

   Second, the reconciliation. The system used to decide what was
   missing by reading its own stock figure, which is exactly the
   number nobody trusts — it is right only if every issue and every
   consumption was posted. So it no longer decides. When a bill goes
   out, a reconciliation sheet is raised automatically and handed to
   the site:

       cumulative indented  −  cumulative billed  =  should be here

   The site walks the store, counts, and writes what is actually
   there in one column. Whatever the count cannot account for
   becomes the missing report, and that goes to the GM to approve.
   On approval the counted figure becomes the site's stock, because
   a physical count outranks a ledger.
   ============================================================ */

if(!DB.recons)DB.recons=[];
CHAINS.RECON=[{role:'R-GM',label:'GM'}];

/* a reconciliation waits in the approvals inbox like anything else */
const __myDocs21=myDocs;
myDocs=function(){return __myDocs21().concat(
  (DB.recons||[]).filter(d=>d&&d.appr&&inScope(d.branch)))};

/* an approved count corrects the site's stock — a physical count
   outranks the ledger, so the ledger is made to agree with it */
const __mov21=movements;
movements=function(){
  const m=__mov21();
  (DB.recons||[]).filter(r=>r.appr&&isApproved(r)&&r.adjust).forEach(r=>
    (r.adjust||[]).forEach(l=>{
      if(!l.qty)return;
      m.push({site:r.site,prod:l.prod,make:l.make,qty:+l.qty,rate:0,
        kind:'RECON',ref:r.no,date:r.approvedOn||r.date,branch:r.branch});
    }));
  return m;
};

/* ---------- work order lines and the items under them ---------- */
function cbWo(b){return (b&&b.kind==='BOQ'&&b.wo)?DB.boqs.find(x=>x.id===b.wo):(b&&b.kind==='WO'?b:null)}
function cbItems(b,wlId){return (b.lines||[]).filter(l=>l.woLine===wlId)}
function cbBilledWo(wlId){
  let q=0;
  (DB.clientbills||[]).forEach(x=>{if(isRejected(x))return;
    (x.wolines||[]).forEach(l=>{if(l.woLine===wlId)q+=+l.qty||0});});
  return n2(q);
}
/* how much of a work order line the site drew material for. Each item
   under it implies a figure — itemQty per work order unit. */
function cbPrnWo(b,wl){
  const items=cbItems(b,wl.id).filter(l=>+l.itemQty>0);
  if(!items.length)return {qty:0,items:[],spread:false,lo:0,hi:0};
  const each=items.map(l=>{
    const ind=n2(indentedQty(b.id,l.id));
    return {line:l,indented:ind,implies:n2(ind/(+l.itemQty))};
  });
  const vals=each.map(x=>x.implies);
  const hi=Math.max(...vals), lo=Math.min(...vals);
  return {qty:n2(hi),items:each,spread:n2(hi-lo)>0.01,lo:n2(lo),hi:n2(hi)};
}
/* the ceiling: what was drawn, less what has already been billed */
function cbCap(b,wl){return n2(Math.max(0,cbPrnWo(b,wl).qty-cbBilledWo(wl.id)))}

/* ---------- the bill ---------- */
cbSheet=function(){
  const boqs=scoped(DB.boqs).filter(b=>b.kind==='BOQ'&&b.status==='LOCKED'&&cbWo(b));
  if(!boqs.length)return toast('No locked BOQ with a work order behind it','bad');
  TMP={boq:boqs[0].id,bill:{}};
  Sheet.open('Raise RA bill','Measured against the work order, capped at what the site has drawn',
    `<div class="row3">${field('BOQ',sel('cb_b',boqs.map(b=>({v:b.id,t:(b.woNo?'WO '+b.woNo+' — ':'')+b.no+' · '+site(b.site).name})),'',
        'onchange="TMP.boq=this.value;TMP.bill={};cbDraw()"'))}
      ${field('Bill date',txt('cb_d',today(),'date'))}${field('Retention %',txt('cb_r',5,'number'))}</div>
     <div class="banner info">▤ <div>Quantity goes against the <b>work order line</b> — that is what the client signed.
       The ceiling is not the work order quantity but the <b>cumulative indent</b>: you cannot bill for more than the
       site drew material for. The work order figure is shown beside it as the contract limit.</div></div>
     <div class="card"><header><div><h3>Measured quantity</h3><p id="cb_hint"></p></div></header>
       <div id="cb_lines"></div></div>`,
    `<button class="btn" onclick="Sheet.close()">Cancel</button>
     <button class="btn pri" id="cb_go" onclick="saveCb()">Send for approval</button>`);
  cbDraw();
};
function cbSet(wlId,v){
  const b=DB.boqs.find(x=>x.id===TMP.boq),wo=cbWo(b);
  const wl=wo.lines.find(x=>x.id===wlId);

  if(q>cap){q=cap;toast(cap<=0
    ? 'Nothing drawn on this line yet — an indent has to come first'
    : `Capped at ${qty(cap)} — that is what the site has drawn material for`,'bad')}
  TMP.bill=TMP.bill||{};
  if(q<=0)delete TMP.bill[wlId];else TMP.bill[wlId]=q;

}
function cbFillPrn(){
  const b=DB.boqs.find(x=>x.id===TMP.boq),wo=cbWo(b);
  TMP.bill={};
  wo.lines.forEach(wl=>{const q=cbCap(b,wl);if(q>0)TMP.bill[wl.id]=q});
  cbDraw();
}
cbDraw=function(){
  const el=document.getElementById('cb_lines');if(!el)return;
  const b=DB.boqs.find(x=>x.id===TMP.boq),wo=cbWo(b);
  const h=document.getElementById('cb_hint');
  if(h)h.textContent=`${wo.lines.length} work order line(s) on ${wo.woNo||wo.no}`;
  let val=0,spread=0;
  const rows=wo.lines.map(wl=>{
    const san=woSanctionOf(wl), billed=cbBilledWo(wl.id), p=cbPrnWo(b,wl), cap=cbCap(b,wl);
    if(p.spread)spread++;
    const q=+(TMP.bill||{})[wl.id]||0;
    const rate=n2((+wl.supplyRate||0)+(+wl.instRate||0));
    const gst=+wl.supplyGst||18;
    val+=q*rate*(1+gst/100);
    const overWo=!isRA(san)&&n2(billed+q)>qn(san)+0.001;
    return `<tr ${q>0?'style="background:var(--brand-soft)"':''}>
      <td class="sn">${esc(wl.sno||'')}</td>
      <td><b>${esc(wl.name||lineName(wl))}</b><small>${cbItems(b,wl.id).length} item(s) under it</small></td>
      <td>${esc(wl.uom||'')}</td>
      <td class="rt mono" style="color:var(--muted)">${qshow(san)}</td>
      <td class="rt mono">${qty(p.qty)}${p.spread?`<small style="color:var(--warn)">items imply ${qty(p.lo)}–${qty(p.hi)}</small>`:''}</td>
      <td class="rt mono">${billed?qty(billed):'—'}</td>
      <td class="rt mono"><b>${qty(cap)}</b></td>
      <td class="rt"><input class="inp rt" style="width:100px" inputmode="decimal" value="${q||''}" placeholder="—"
          ${cap<=0?'disabled title="nothing drawn on this line yet"':''}
          onchange="cbSet('${wl.id}',this.value)"></td>
      <td class="rt mono">${money(rate)}</td>
      <td class="rt mono">${q?money(q*rate*(1+gst/100)):'—'}
        ${overWo?'<small style="color:var(--warn)">past the WO quantity</small>':''}</td></tr>`;
  }).join('');
  el.innerHTML=`<div class="pad" style="border-bottom:1px solid var(--line);display:flex;gap:9px;align-items:center;flex-wrap:wrap">
      <button class="btn sm" onclick="cbFillPrn()">Bill everything drawn</button>
      <button class="btn sm" onclick="TMP.bill={};cbDraw()">Clear</button>
      <div class="sp"></div>
      ${spread?`<span class="tag warn">${spread} line(s): the items under them imply different quantities</span>`:''}</div>
    <div class="tw"><table><thead><tr><th>Sl No</th><th style="min-width:220px">Work order line</th><th>Unit</th>
      <th class="rt">WO qty</th><th class="rt">Drawn</th><th class="rt">Billed so far</th>
      <th class="rt">Can bill</th><th class="rt">Billing now</th><th class="rt">Rate</th><th class="rt">Amount</th></tr></thead>
      <tbody>${rows}</tbody>
      <tfoot><tr><th colspan="9" class="rt">Bill value incl. GST</th><th class="rt mono">${money(val)}</th></tr></tfoot>
    </table></div>`;
  const g=document.getElementById('cb_go');
  if(g)g.disabled=!Object.keys(TMP.bill||{}).length;
};
saveCb=function(){
  const b=DB.boqs.find(x=>x.id===TMP.boq),wo=cbWo(b);
  const wolines=[];let base=0;
  wo.lines.forEach(wl=>{
    const q=+(TMP.bill||{})[wl.id]||0;
    if(q<=0)return;
    const rate=n2((+wl.supplyRate||0)+(+wl.instRate||0)), gst=+wl.supplyGst||18;
    base+=q*rate;
    wolines.push({woLine:wl.id,sno:wl.sno||'',name:wl.name||lineName(wl),qty:n2(q),rate,gst,uom:wl.uom||''});
  });
  if(!wolines.length)return toast('Measure at least one work order line','bad');
  const ra=(DB.clientbills||[]).filter(x=>x.boq===b.id).length+1;
  const bill={id:uid('RA'),by:DB.session.user,no:doc(DB,'RA'),ra,date:V('cb_d'),boq:b.id,site:b.site,branch:b.branch,
    retPct:+V('cb_r'),wolines,lines:[],appr:newAppr('CLIENTBILL'),
    amount:n2(wolines.reduce((a,l)=>a+l.qty*l.rate*(1+l.gst/100),0)),
    retention:n2(base*(+V('cb_r')||0)/100)};
  DB.clientbills.push(bill);
  log('CLIENTBILL',bill.no,'Raised RA '+ra,`${site(b.site).name} · ${wolines.length} work order line(s)`);
  const rec=reconRaise(b,bill);
  save();Sheet.close();
  toast(rec?`RA bill sent · ${rec.no} raised — the site has ${rec.lines.length} item(s) to count`
           :'RA bill sent for approval','ok');
  render();
  if(rec)setTimeout(()=>reconView(rec.id),300);
};

/* ============================================================
   THE RECONCILIATION SHEET
   cumulative indented − cumulative billed = should be at the store
   ============================================================ */
function billedItemQty(b,prodId,make){
  let q=0;
  (DB.clientbills||[]).forEach(x=>{
    if(x.boq!==b.id||isRejected(x))return;
    (x.wolines||[]).forEach(wl=>{
      cbItems(b,wl.woLine).forEach(l=>{
        if(l.prod!==prodId||(l.make||'')!==(make||''))return;
        q+=(+l.itemQty||0)*(+wl.qty||0);
      });
    });
  });
  return n2(q);
}
function reconRows(b){
  const seen={};
  (b.lines||[]).forEach(l=>{seen[l.prod+'||'+(l.make||'')]={prod:l.prod,make:l.make||'',uom:l.uom||prod(l.prod).uom||''}});
  return Object.values(seen).map(x=>{
    const ind=n2((b.lines||[]).filter(l=>l.prod===x.prod&&(l.make||'')===x.make)
      .reduce((a,l)=>a+indentedQty(b.id,l.id),0));
    const billed=billedItemQty(b,x.prod,x.make);
    return {...x,indented:ind,billed,should:n2(ind-billed)};
  }).filter(x=>x.indented>0);
}
/* raised automatically when a bill goes out, and handed to the site */
function reconRaise(b,bill){
  const rows=reconRows(b).filter(x=>x.should>0.001);
  if(!rows.length)return null;
  const r={id:uid('RC'),no:doc(DB,'RC'),date:today(),boq:b.id,site:b.site,branch:b.branch,
    bill:bill?bill.id:null,billNo:bill?bill.no:'—',by:DB.session.user,status:'COUNTING',
    lines:rows.map(x=>({prod:x.prod,make:x.make,uom:x.uom,indented:x.indented,billed:x.billed,
      should:x.should,avail:null}))};
  DB.recons.push(r);
  log('RECON',r.no,'Raised for physical count',`${site(b.site).name} · ${rows.length} item(s) to count`);
  return r;
}
function reconManual(){
  const boqs=scoped(DB.boqs).filter(b=>b.kind==='BOQ'&&b.status==='LOCKED'&&reconRows(b).some(x=>x.should>0.001));
  if(!boqs.length)return toast('Nothing to reconcile — every BOQ is billed up to what it drew','bad');
  const r=reconRaise(boqs[0],null);
  if(!r)return toast('Nothing outstanding on that BOQ','bad');
  save();toast(`${r.no} raised — ${r.lines.length} item(s) to count`,'ok');render();reconView(r.id);
}
const reconMissing=r=>n2((r.lines||[]).reduce((a,l)=>a+(l.avail==null?0:Math.max(0,n2(l.should-l.avail))),0));
const reconCounted=r=>(r.lines||[]).filter(l=>l.avail!=null).length;
const reconMine=r=>r.status==='COUNTING'&&(canEdit('stock')||canEdit('consume')||canEdit('issue'));

function reconSet(id,ix,v){
  const r=(DB.recons||[]).find(x=>x.id===id);if(!r||r.status!=='COUNTING')return;
  const l=r.lines[ix];if(!l)return;
  const s=String(v==null?'':v).trim();
  if(s===''){l.avail=null}
  else{let q=+s;if(!isFinite(q)||q<0)q=0;
    if(q>l.should){q=l.should;toast(`Only ${qty(l.should)} should be there — a bigger count means something else needs looking at`,'bad')}
    l.avail=n2(q);}
  save();reconView(id);
}
function reconAllHere(id){
  const r=(DB.recons||[]).find(x=>x.id===id);if(!r||r.status!=='COUNTING')return;
  r.lines.forEach(l=>l.avail=l.should);save();reconView(id);
}
function reconSubmit(id){
  const r=(DB.recons||[]).find(x=>x.id===id);if(!r)return;
  const un=(r.lines||[]).filter(l=>l.avail==null).length;
  if(un)return toast(`${un} item(s) not counted yet — every line needs a figure, zero included`,'bad');
  const miss=(r.lines||[]).filter(l=>n2(l.should-l.avail)>0.001);
  /* the count becomes the site's stock, so the ledger agrees with the shelf */
  r.adjust=r.lines.map(l=>({prod:l.prod,make:l.make,
    qty:n2(l.avail-stockAt(r.site,l.prod,l.make))})).filter(x=>x.qty);
  if(!miss.length){
    r.status='CLEAR';r.closed=today();r.submitted=today();r.submittedBy=DB.session.user;
    r.appr=newAppr('RECON');approve(r,'Counted in full — nothing missing');
    log('RECON',r.no,'Counted — nothing missing',site(r.site).name);
    save();Sheet.close();toast(`${r.no} — everything accounted for, no missing report needed`,'ok');render();return;
  }
  if(!confirm(`${miss.length} item(s) cannot be accounted for.\n\nA missing report goes to the GM for approval. Continue?`))return;
  r.status='SUBMITTED';r.submitted=today();r.submittedBy=DB.session.user;
  r.appr=newAppr('RECON');
  log('RECON',r.no,'Missing report sent for approval',
    `${miss.length} item(s), ${qty(reconMissing(r))} unit(s) unaccounted at ${site(r.site).name}`);
  save();Sheet.close();
  toast(`${r.no} sent to the GM — ${miss.length} item(s) unaccounted for`,'ok');render();
}
/* when the GM signs it, the count becomes the stock */
const __approve21=approve;
approve=function(d,note){
  __approve21(d,note);
  if(d&&d.appr&&d.appr.type==='RECON'&&isApproved(d)&&d.status!=='CLEAR'){
    d.status='APPROVED';d.approvedOn=today();
    log('RECON',d.no,'Approved by the GM',
      `${qty(reconMissing(d))} unit(s) written off against ${site(d.site).name} · site stock set to the physical count`);
  }
};

                   placeholder="count" onchange="reconSet('${r.id}',${ix},this.value)">`
               :`<span class="mono">${l.avail==null?'—':qty(l.avail)}</span>`}</td>
             <td class="rt mono" style="color:${m>0.001?'var(--bad)':(m!=null?'var(--ok)':'var(--muted)')}">
               ${m==null?'—':(m>0.001?'<b>'+qty(m)+'</b>':'nil')}</td></tr>`}).join('')}
         </tbody>
         <tfoot><tr><th colspan="6" class="rt">Unaccounted for</th>
           <th class="rt mono" style="color:${miss>0?'var(--bad)':'var(--ok)'}">${qty(miss)}</th></tr></tfoot>

/* ============================================================
   v22 — one physical count, at store closing.

   The reconciliation had grown its own counting screen, which was a
   mistake: it asked the storekeeper to walk the store twice, once
   for the reconciliation and once for the closure audit, and the
   two counts could disagree. There is only ever one shelf.

   So the closure audit is now the single count, and it carries the
   reconciliation with it. The sheet shows both bases side by side:

       Book        what the ledger thinks is there
       Should be   drawn on indents, less what has been billed

   The storekeeper counts once and writes one figure. It is always
   submitted for sign-off — whether it matched or not, because a
   count that agreed is exactly as worth recording as one that did
   not, and an audit nobody signed proves nothing.

   On sign-off two things happen. Stock is set to the count. And the
   missing report is generated from what the count could not account
   for against the reconciliation, carrying the GM's signature.
   ============================================================ */

/* ---------- the reconciliation basis for a site ---------- */
function reconBasis(siteId){
  const m={};
  scoped(DB.boqs).filter(b=>b.kind==='BOQ'&&b.status==='LOCKED'&&b.site===siteId).forEach(b=>{
    reconRows(b).forEach(x=>{
      const k=x.prod+'||'+(x.make||'');
      const e=m[k]=m[k]||{prod:x.prod,make:x.make||'',uom:x.uom,indented:0,billed:0,should:0};
      e.indented=n2(e.indented+x.indented);
      e.billed=n2(e.billed+x.billed);
      e.should=n2(e.should+x.should);
    });
  });
  return m;
}

/* ---------- the count: book and reconciliation on one sheet ---------- */
startAudit=function(id){
  const p=pendingIn(id);
  if(p.length)return toast(`Acknowledge the ${p.length} movement(s) still coming in first`,'bad');
  const basis=reconBasis(id);
  const book={};
  siteStockRows(id).forEach(r=>{book[r.prod+'||'+(r.make||'')]=r});
  /* an item can be on one basis and not the other — drawn but never
     posted to stock, or in stock with nothing outstanding — so the
     sheet is the union, not either one */
  const keys=[...new Set([...Object.keys(book),...Object.keys(basis)])];
  const lines=keys.map(k=>{
    const b=book[k], r=basis[k];
    const prodId=(b||r).prod, make=(b||r).make||'';
    return {prod:prodId,make,
      systemQty:b?n2(b.bal):0,
      indented:r?r.indented:0, billed:r?r.billed:0, should:r?r.should:0,
      /* a negative book figure is a posting error, not stock — the count
         starts at zero rather than at a quantity that cannot exist */
      avail:b?Math.max(0,n2(b.bal)):0, remark:''};
  }).sort((a,b)=>pname(a.prod).localeCompare(pname(b.prod)));
  const a={id:uid('AU'),no:doc(DB,'AUD'),site:id,branch:site(id).branch,date:today(),by:DB.session.user,
    status:'COUNTING',round:auditsFor(id).length+1,appr:newAppr('AUDIT'),amount:0,lines};
  DB.audits.push(a);
  log('AUDIT',a.no,'Started at '+site(id).name,
    `${lines.length} item(s) — ${Object.keys(basis).length} carrying an unbilled balance`);
  save();auditSheet(a.id);
};

auditSheet=function(id){
  const a=DB.audits.find(x=>x.id===id);
  TMP={audit:id,lines:a.lines.map(l=>({...l}))};
  Sheet.open('Site store audit — '+site(a.site).name,a.no+' · round '+a.round,
    `<div class="banner info">▤ <div>Count the store once. Two bases are shown against your figure:
       <b>Book</b> is what the ledger thinks is there, and <b>Should be</b> is what the site drew on indents
       less what has been billed. A difference against either needs a reason.
       The sheet is submitted for sign-off <b>whether it matched or not</b> — the count is the record.</div></div>
     <div class="card"><div id="au_l"></div></div>${photoInput('au_ph')}`,
    `<button class="btn" onclick="saveAuditDraft();Sheet.close()">Save and come back</button>
     <button class="btn" onclick="auditFull()">Everything present</button>
     <button class="btn pri" onclick="submitAudit()">Submit for sign-off</button>`);
  auditDraw();
};

auditDraw=function(){
  const el=document.getElementById('au_l');if(!el)return;
  if(!TMP.lines.length){el.innerHTML=emptyBox('Nothing to count','No stock on the books and nothing drawn but unbilled.');return}
  const missVal=TMP.lines.reduce((a,l)=>a+Math.max(0,+l.systemQty-+l.avail)*lastRate(l.prod,l.make),0);
  const short=TMP.lines.filter(l=>n2(+l.should-+l.avail)>0.001);
  el.innerHTML=`<div class="tw"><table><thead><tr><th style="min-width:200px">Item</th>
      <th class="rt">Book</th><th class="rt">Indented</th><th class="rt">Billed</th><th class="rt">Should be</th>
      <th class="rt">Counted</th><th class="rt">vs book</th><th class="rt">vs should</th>
      <th style="min-width:170px">Reason</th></tr></thead><tbody>${
    TMP.lines.map((l,i)=>{
      const d=n2(+l.avail-+l.systemQty);
      const s=+l.should?n2(+l.avail-+l.should):null;
      return `<tr ${s!=null&&s<-0.001?'style="box-shadow:inset 3px 0 0 var(--bad)"':''}>
        <td><b>${esc(pname(l.prod))}</b><small class="mono">${esc(prod(l.prod).code||'')}${l.make?' · '+esc(l.make):''}</small></td>
        <td class="rt mono">${qty(l.systemQty)}</td>
        <td class="rt mono" style="color:var(--muted)">${l.indented?qty(l.indented):'—'}</td>
        <td class="rt mono" style="color:var(--muted)">${l.billed?qty(l.billed):'—'}</td>
        <td class="rt mono">${l.should?'<b>'+qty(l.should)+'</b>':'—'}</td>
        <td>${txt('au_q'+i,l.avail,'number',`onchange="auditSet(${i},'avail',this.value)" style="width:92px"`)}</td>
        <td class="rt mono" style="color:${d<0?'var(--bad)':d>0?'var(--ok)':'var(--muted)'}">${d?(d>0?'+':'')+qty(d):'—'}</td>
        <td class="rt mono" style="color:${s==null?'var(--muted)':(s<-0.001?'var(--bad)':'var(--ok)')}">
          ${s==null?'—':(s<-0.001?'<b>'+qty(s)+'</b>':(s>0.001?'+'+qty(s):'nil'))}</td>
        <td>${(d||(s!=null&&Math.abs(s)>0.001))
          ?txt('au_r'+i,l.remark,'text',`onchange="auditSet(${i},'remark',this.value)" placeholder="why"`)
          :'<span class="tag ok">matches both</span>'}</td></tr>`}).join('')
  }</tbody></table></div>
  ${short.length?`<div class="leak" style="margin:0 18px 16px"><strong>${short.length} item(s) cannot be accounted for
     against what was drawn.</strong> ${qty(short.reduce((a,l)=>a+n2(+l.should-+l.avail),0))} unit(s) —
     the missing report is generated from this the moment the GM signs the audit off.</div>`:''}
  ${missVal>0?`<div class="leak" style="margin:0 18px 16px"><strong>${money(missVal)} short against the book.</strong>
     It comes out of stock only once the audit is signed off.</div>`:''}`;
};

/* it goes for sign-off whether it matched or not */
submitAudit=function(){
  const a=DB.audits.find(x=>x.id===TMP.audit);
  const bad=TMP.lines.find(l=>{
    const d=Math.abs(+l.avail-+l.systemQty)>0.001;
    const s=+l.should&&Math.abs(+l.avail-+l.should)>0.001;
    return (d||s)&&!String(l.remark||'').trim();
  });
  if(bad)return toast('Every difference needs a reason — '+pname(bad.prod),'bad');
  a.lines=TMP.lines.map(l=>({...l}));a.photos=takePhotos('au_ph');
  a.status='SUBMITTED';a.appr=newAppr('AUDIT');
  a.amount=n2(a.lines.reduce((x,l)=>x+Math.max(0,+l.systemQty-+l.avail)*lastRate(l.prod,l.make),0));
  const short=a.lines.filter(l=>n2(+l.should-+l.avail)>0.001).length;
  log('AUDIT',a.no,'Submitted for sign-off',
    short?`${short} item(s) unaccounted against what was drawn · ${money(a.amount)} short on the book`
         :`counted in full — ${money(a.amount)} against the book`);
  save();Sheet.close();
  toast(short?`Audit submitted — ${short} item(s) will form the missing report`
             :'Audit submitted — the count matched, still going for sign-off','ok');
  render();
};

/* ---------- sign-off writes the missing report ---------- */
/* only a line that carries an unbilled balance can be missing anything;
   an item with no reconciliation basis has nothing to fall short of */
function auditMissing(a){
  return (a.lines||[]).filter(l=>+l.should>0.001)
    .map(l=>({...l,missing:n2(Math.max(0,+l.should-Math.max(0,+l.avail)))}))
    .filter(l=>l.missing>0.001);
}

/* ============================================================
   v23 — the reconciliation, as it should have been.

   Four corrections.

   The billing cap goes. A bill can be for any quantity; the work
   order figure stays on the sheet as reference, not as a gate.

   Transfers are counted, and counted separately. Site A sends
   cable to site B and never re-indents it: that quantity has to
   come off A's expected stock, or A carries a shortfall it does
   not owe. And when B receives it, that is NOT indent quantity —
   B did not draw it from procurement, it arrived from next door.
   Folding it into the indent total would have B answering twice
   for material that was only ever bought once. So:

       indented  +  received in  −  sent out  −  billed  =  should be here

   The count comes back into the reconciliation sheet. One sheet:
   the arithmetic on the left, one column for the physical figure,
   the shortfall on the right. Entering the physical quantity sets
   the site's stock to it, because the shelf outranks the ledger.

   And the site cannot be closed until the shortfall is nil on
   every line. That is the whole point of the exercise: it forces
   the difference to be found or signed away, rather than left to
   rot inside a site nobody looks at again.
   ============================================================ */

/* ---------- the reconciliation ---------- */
/* every item the site has ever drawn, plus anything that reached it
   by transfer, whether or not it was ever on a BOQ here */
function recLines(siteId){
  const m={};
  const put=(prodId,make,uom)=>{
    const k=prodId+'||'+(make||'');
    return m[k]=m[k]||{prod:prodId,make:make||'',uom:uom||prod(prodId).uom||'',
      indented:0,billed:0,inQty:0,outQty:0};
  };
  scoped(DB.boqs).filter(b=>b.kind==='BOQ'&&b.status==='LOCKED'&&b.site===siteId).forEach(b=>{
    (b.lines||[]).forEach(l=>{
      const e=put(l.prod,l.make,l.uom);
      e.indented=n2(e.indented+indentedQty(b.id,l.id));
    });
    reconRows(b).forEach(x=>{const e=put(x.prod,x.make,x.uom);e.billed=n2(e.billed+x.billed)});
  });
  (DB.transfers||[]).forEach(t=>{
    if(t.status!=='RECEIVED')return;
    if(t.fromSite!==siteId&&t.toSite!==siteId)return;
    (t.lines||[]).forEach(l=>{
      const e=put(l.prod,l.make);
      if(t.fromSite===siteId)e.outQty=n2(e.outQty+ +l.qty);
      else e.inQty=n2(e.inQty+ +l.qty);
    });
  });
  return Object.values(m).map(x=>({...x,
    /* what the system says should be standing on this site */
    final:n2(x.indented+x.inQty-x.outQty-x.billed)}))
    .filter(x=>x.indented>0||x.inQty>0||x.outQty>0)
    .sort((a,b)=>pname(a.prod).localeCompare(pname(b.prod)));
}

  if(r){r.setStock=r.setStock||[];r.setStock.push({prod:l.prod,make:l.make,qty:q,on:today()});
    const rl=(r.lines||[]).find(x=>x.prod===l.prod&&(x.make||'')===(l.make||''));
    if(rl)rl.physical=n2(rl.physical+q);}
  log('MISSING',mr.no,'Found at the site',`${pname(l.prod)} ${qty(q)} ${l.uom} put back into stock`);
  if(mr.lines.every(x=>x.missing<=0.001)){
    mr.lines=mr.lines.filter(x=>x.missing>0.001);
    if(r){r.status='CLEAR';r.closed=today()}
    mr.status='WITHDRAWN';
    log('MISSING',mr.no,'Withdrawn — everything was found','');
    save();Sheet.close();toast(`${mr.no} withdrawn — it was all there`,'ok');render();return;
  }
  save();missView(id);render();
}

/* the number that gates closing: counted short and not yet signed away */
function siteShort(siteId){
  let q=0;
  (DB.recons||[]).filter(r=>r.site===siteId&&(r.status==='COUNTING'||r.status==='SUBMITTED')).forEach(r=>{
    (r.lines||[]).forEach(l=>{if(l.physical!=null)q+=Math.max(0,n2(l.final-l.physical))});
  });
  return n2(q);
}
function siteUncounted(siteId){
  const r=recOpen(siteId);
  return r?(r.lines||[]).filter(l=>l.physical==null).length:0;
}
/* a site cannot close while anything is unaccounted for */
function siteCloseBlock(siteId){
  const r=recOpen(siteId);
  if(r&&(r.lines||[]).some(l=>l.physical==null))
    return `${siteUncounted(siteId)} item(s) on ${r.no} have not been counted yet`;

  if(pend.length)return `${pend[0].no} is still with the project GM`;
  const short=siteShort(siteId);
  if(short>0.001)return `${qty(short)} unit(s) are still unaccounted for`;
  return null;
}
