       ${st.tag==='AMEND'&&canEdit('boq')?`<button class="btn sm pri" onclick="Sheet.close();boqAmendSheet('${b.id}')">Amend it</button>`:''}</div>
     <div class="card"><div class="tw"><table><thead><tr><th>Sl No</th><th>Item Code</th><th>Description</th>
      <th>Unit</th><th class="rt">Item Qty</th><th class="rt">BOQ Qty</th><th class="rt">Est Qty</th>
      <th class="rt">Variation</th><th class="rt">Revised est</th><th>Make / status</th></tr></thead>
      <tbody>${rows}</tbody></table></div></div>`,
    `<button class="btn" onclick="Sheet.close()">Close</button>`);
};

/* ============================================================
   6. a site manager sees their own projects and no others
   ============================================================ */
/* Planning and the GM see the whole book. A project manager runs
   projects, they do not run all of them, so they are scoped to
   theirs exactly like a site engineer. */
const SEE_ALL_ROLES=['R-PLAN','R-GM'];
function myProjects(){
  const all=scoped(DB.sites).filter(s=>s.type==='SITE'&&s.status!=='CLOSED');
  if(SEE_ALL_ROLES.includes(me().role))return all;
  return all.filter(s=>siteTeam(s).includes(DB.session.user)||!s.viewers);
}
canSeeSite=function(s){
  if(s.type!=='SITE')return true;
  if(SEE_ALL_ROLES.includes(me().role))return true;
  if(!s.viewers)return true;
  return siteTeam(s).includes(DB.session.user);
};
const myIndentSites=()=>myProjects().filter(s=>{const b=matBoq(s.id);return b&&b.status==='LOCKED'});
function minePerSite(arr){
  const ids=new Set(myProjects().map(s=>s.id));
  return scoped(arr).filter(d=>!d.site||ids.has(d.site));
}

/* ============================================================
   5. the indent as a cart — draft, edit, then send
   ============================================================ */
PAGES.indent=()=>{
  if(canEdit('indent'))document.getElementById('pgActions').innerHTML=
    `<button class="btn pri" onclick="indentSheet()">＋ Raise indent</button>`;
  const mine=minePerSite(DB.indents);
  const drafts=mine.filter(i=>i.draft);
  const live=mine.filter(i=>!i.draft);
  const row=i=>{
    const b=DB.boqs.find(x=>x.id===i.boq);
    const over=i.lines.filter(l=>l.overQty>0);
    return `<tr><td><b>${esc(i.no)}</b><small>${esc(user(i.by).name)}</small></td>
      <td>${esc(site(i.site).name)}</td><td>${dmy(i.date)}</td>
      <td class="rt mono">${i.lines.length}</td>
      <td>${over.length?`<span class="tag bad">▲ ${over.length} line(s) past the estimate</span>`:'<span class="tag ok">Within estimate</span>'}</td>
      <td>${i.draft?'<span class="tag warn">Draft</span>':apprTag(i)}</td>
      <td>${i.draft?'':chainHtml(i)}</td>
      <td class="rt">${i.draft
        ? `<button class="btn sm" onclick="indentSheet('${i.id}')">Edit</button>
           <button class="btn sm bad" onclick="indentDrop('${i.id}')">✕</button>`
        : `${isApproved(i)?`<span class="tag ${i.lines.every(l=>poQtyOfIndentLine(i.id,l.id)>=+l.qty)?'ok':'warn'}">${i.lines.every(l=>poQtyOfIndentLine(i.id,l.id)>=+l.qty)?'PO done':'PO pending'}</span>`:''}
           <button class="btn sm" onclick="apprSheet('${i.id}')">Open</button>`}</td></tr>`};
  const head=['Indent','Site','Date',{t:'Lines',r:1},'Against estimate','Status','Chain',{t:'',r:1}];
  return viewBanner('indent')
    +`<div class="banner info">↗ <div>An indent is a cart: build it, <b>save it as a draft</b>, come back and change it, and send it for approval when the site is ready. Quantity is measured against each BOQ line's estimated quantity${SEE_ALL_ROLES.includes(me().role)?'':' — and you see only your own projects'}.</div></div>
    ${drafts.length?tableCard('Your drafts','Not sent anywhere yet — edit freely',head,drafts.map(row).join('')):''}
    ${tableCard('Indents','',head,live.map(row).join(''))}`;
};
function indentDrop(id){
  const i=DB.indents.find(x=>x.id===id);
  if(!confirm(`Delete draft ${i.no}?`))return;
  DB.indents=DB.indents.filter(x=>x.id!==id);save();toast('Draft deleted','ok');render();
}

indentSheet=function(editId){
  const sites=myIndentSites();
  if(!sites.length)return toast(SEE_ALL_ROLES.includes(me().role)
    ?'No locked BOQ in this branch yet':'None of your projects has a locked BOQ yet','bad');
  const d=editId?DB.indents.find(x=>x.id===editId):null;
  TMP=d?{id:d.id,site:d.site,lines:d.lines.map(l=>({...l}))}:{lines:[],site:sites[0].id};
  Sheet.open(d?'Edit draft '+d.no:'Raise an indent','Items from this site\'s BOQ',
    `<div class="row2">${field('Site',sel('in_s',sites.map(s=>({v:s.id,t:s.name})),TMP.site,
        `onchange="TMP.site=this.value;TMP.lines=[];indentDraw()" ${d?'disabled':''}`))}
      ${field('Date',txt('in_d',d?d.date:today(),'date'))}</div>
     ${field('Needed by',txt('in_need',d?d.need:addDays(today(),14),'date'))}
     <div id="in_pol"></div>
     <div class="card"><header><div><h3>Lines</h3><p id="in_boq"></p></div><div class="sp"></div>
       <button class="btn sm pri" onclick="indentAdd()">＋ Add line</button></header><div id="in_lines"></div></div>`,
    `<button class="btn" onclick="Sheet.close()">Cancel</button>
     <button class="btn" onclick="saveIndent(1)">Save draft</button>
     <button class="btn pri" onclick="saveIndent(0)">Send for approval</button>`);
  indentDraw();
};
indentAdd=function(){
  const b=matBoq(TMP.site);
  const avail=b.lines.filter(l=>!TMP.lines.some(t=>t.boqLine===l.id));
  if(!avail.length)return toast('Every BOQ line is already on this indent','bad');
  const l=avail.find(x=>estBal(b,x)>0)||avail[0];
  TMP.lines.push({id:uid('L'),boqLine:l.id,woLine:l.woLine||l.id,prod:l.prod,make:l.make||'',qty:0,overQty:0,remark:''});
  indentDraw();
};
indentSet=function(i,f,v){
  const b=matBoq(TMP.site);
  if(f==='boqLine'){const l=b.lines.find(x=>x.id===v);
    Object.assign(TMP.lines[i],{boqLine:v,woLine:l.woLine||l.id,prod:l.prod,make:l.make||'',qty:0,overQty:0});
    indentDraw();return}
  if(f==='qty'){
    const t=TMP.lines[i],l=b.lines.find(x=>x.id===t.boqLine);
    const pol=overPolicy(b),ceiling=allowedQty(b,l),free=estBal(b,l);
    let q=+v||0;
    /* a draft eats no balance, so what is left is what is left —
       adding this line's own quantity back would double-count it */
    if(ceiling!==Infinity&&q>boqBal(b,l)){
      q=Math.max(0,boqBal(b,l));     // a used-up line has nothing left, not a negative
      toast(q<=0
        ? (pol.allow?`Nothing left on this line — it is already at the ${pol.pct}% ceiling`
                    :'Nothing left on this line — the estimate is a hard stop on this BOQ')
        : (pol.allow?`Capped at ${qty(q)} — ${pol.pct}% over the estimate is the ceiling`
                    :`Capped at ${qty(q)} — the estimate is a hard stop on this BOQ`),'bad');
    }
    const over=n2(q-free);
    if(over>0&&over!==t.overQty&&pol.allow){
      const pct=estOf(l)?over/estOf(l)*100:0;
      if(!confirm(`This takes ${pname(l.prod)} ${qty(over)} past its estimate — ${pct.toFixed(1)}% over.\n\n`
        +`The BOQ will be marked "▲ Amendment due" until a BOQ amendment adds the variation quantity.\n\nRaise it anyway?`)){
        q=Math.max(0,free);
      }
    }
    t.qty=q;t.overQty=Math.max(0,n2(q-free));
    indentDraw();return}
  TMP.lines[i][f]=v;
};
indentDraw=function(){
  const b=matBoq(TMP.site),el=document.getElementById('in_lines');if(!el)return;
  const pol=overPolicy(b),st=boqState(b);
  const hdr=document.getElementById('in_boq');
  if(hdr)hdr.textContent=`Against ${b.no} — ${site(TMP.site).name}`;
  const pl=document.getElementById('in_pol');
  if(pl)pl.innerHTML=`<div class="banner ${st.tag==='AMEND'?'bad':(pol.allow?'warn':'info')}">${st.tag==='AMEND'?'▲':(pol.allow?'⚠':'▤')}
    <div>${st.tag==='AMEND'?`<b>This BOQ is already past its estimate on ${st.over.length} line(s)</b> and is waiting on an amendment. `:''}
      ${pol.allow?`This BOQ allows indenting beyond the estimate${pol.pct?` up to <b>${pol.pct}%</b>`:' with <b>no ceiling</b>'}. Anything past the estimate is flagged.`
                 :'This BOQ does not allow indenting beyond the estimate — the estimated quantity is a hard stop.'}</div></div>`;
  if(!TMP.lines.length){el.innerHTML=emptyBox('Nothing in the cart yet','Add a BOQ line to indent against.');return}
  el.innerHTML=`<div class="tw"><table><thead><tr><th style="min-width:250px">BOQ line</th>
    <th class="rt">Est qty</th><th class="rt">Variation</th><th class="rt">Left</th><th class="rt">Indent qty</th><th>Against estimate</th><th></th></tr></thead><tbody>${
    TMP.lines.map((t,i)=>{
      const l=b.lines.find(x=>x.id===t.boqLine),free=estBal(b,l),over=+t.overQty||0;
      const pct=over&&estOf(l)?over/estOf(l)*100:0;
      return `<tr><td>${sel('il_l'+i,b.lines.map(x=>({v:x.id,t:bqLabel(x)})),t.boqLine,`onchange="indentSet(${i},'boqLine',this.value)"`)}</td>
        <td class="rt mono">${qty(estOf(l))}</td>
        <td class="rt mono">${varQty(l)?`<span style="color:var(--brand)">+${qty(varQty(l))}</span>`:'—'}</td>
        <td class="rt mono" style="color:${free>0?'inherit':'var(--bad)'}">${qty(Math.max(0,free))}</td>
        <td>${txt('il_q'+i,t.qty,'number',`onchange="indentSet(${i},'qty',this.value)" style="width:96px"`)}</td>
        <td>${over>0?`<span class="tag bad">▲ ${qty(over)} over · ${pct.toFixed(1)}%</span>`
                    :'<span class="tag ok">✓ within</span>'}</td>
        <td><button class="btn sm bad" onclick="TMP.lines.splice(${i},1);indentDraw()">✕</button></td></tr>`}).join('')
  }</tbody></table></div>`;
};
saveIndent=function(asDraft){
  if(!TMP.lines.length)return toast('Add at least one line','bad');
  if(TMP.lines.some(l=>!(+l.qty>0)))return toast('Every line needs a quantity above zero','bad');
  const s=site(TMP.site),b=matBoq(TMP.site);
  const over=TMP.lines.filter(l=>+l.overQty>0);
  if(!asDraft&&over.length&&!overPolicy(b).allow)
    return toast('This BOQ does not allow going past the estimate','bad');
  const ex=TMP.id&&DB.indents.find(x=>x.id===TMP.id);
  if(ex){
    Object.assign(ex,{date:V('in_d'),need:V('in_need'),lines:TMP.lines,draft:!!asDraft});
    if(!asDraft&&!ex.appr)ex.appr=newAppr('INDENT');
    log('INDENT',ex.no,asDraft?'Draft updated':'Sent for approval',s.name);
    save();Sheet.close();
    toast(asDraft?`${ex.no} saved as a draft`:`${ex.no} sent for approval`,'ok');render();return;
  }
  const d={id:uid('IND'),no:doc(DB,'IND'),date:V('in_d'),need:V('in_need'),site:s.id,branch:s.branch,boq:b.id,
    by:DB.session.user,lines:TMP.lines,draft:!!asDraft,appr:newAppr('INDENT'),amount:0};
  DB.indents.push(d);
  log('INDENT',d.no,asDraft?'Saved as a draft':'Raised',s.name+(over.length?` · ${over.length} line(s) past the estimate`:''));
  save();Sheet.close();
  toast(asDraft?`${d.no} saved as a draft — edit it any time`:`${d.no} sent for approval`,'ok');
  if(!asDraft&&over.length)setTimeout(()=>toast(`▲ ${b.no} is now past its estimate — a BOQ amendment is due`,'bad'),900);
  render();
};
/* a draft is not in the queue and does not eat into any balance */
indentedQty=function(boqId,lineId){
  let q=0;DB.indents.forEach(i=>{if(i.boq!==boqId||i.draft||!isApproved(i))return;
    i.lines.forEach(l=>{if(l.boqLine===lineId)q+=+l.qty});});return q;
};
requestedQty=function(boqId,lineId){
  let q=0;DB.indents.forEach(i=>{if(i.boq!==boqId||i.draft||isApproved(i)||isRejected(i))return;
    i.lines.forEach(l=>{if(l.boqLine===lineId)q+=+l.qty});});return q;
};


/* ============================================================
   v12 — the indent line always shows its numbers.

   With "no ceiling" the allowance is unbounded, and the columns
   that depend on a ceiling had nothing to show. But BOQ quantity,
   estimated quantity and balance don't depend on the policy at
   all — they are facts about the line. They now show on every
   indent regardless, and the balance is shown as it really is,
   including when it has gone negative.
   ============================================================ */
indentDraw=function(){
  const b=matBoq(TMP.site),el=document.getElementById('in_lines');if(!el)return;
  const pol=overPolicy(b),st=boqState(b);
  const hdr=document.getElementById('in_boq');
  if(hdr)hdr.textContent=`Against ${b.no} — ${site(TMP.site).name}`;
  const pl=document.getElementById('in_pol');
  if(pl)pl.innerHTML=`<div class="banner ${st.tag==='AMEND'?'bad':(pol.allow?'warn':'info')}">${st.tag==='AMEND'?'▲':(pol.allow?'⚠':'▤')}
    <div>${st.tag==='AMEND'?`<b>This BOQ is already past its estimate on ${st.over.length} line(s)</b> and is waiting on an amendment. `:''}
      ${pol.allow?`This BOQ allows indenting beyond the estimate${pol.pct?` up to <b>${pol.pct}%</b>`:' with <b>no ceiling</b>'}. Anything past the estimate is still flagged and still needs an amendment.`
                 :'This BOQ does not allow indenting beyond the estimate — the estimated quantity is a hard stop.'}</div></div>`;
  if(!TMP.lines.length){el.innerHTML=emptyBox('Nothing in the cart yet','Add a BOQ line to indent against.');return}
  el.innerHTML=`<div class="tw"><table><thead><tr>
      <th style="min-width:230px">BOQ line</th>
      <th class="rt">BOQ qty</th><th class="rt">Est qty</th><th class="rt">Variation</th>
      <th class="rt">Indented</th><th class="rt">Balance</th>
      <th class="rt">Indent qty</th><th>Against estimate</th><th></th></tr></thead><tbody>${
    TMP.lines.map((t,i)=>{
      const l=b.lines.find(x=>x.id===t.boqLine);
      const est=estOf(l),used=indentedQty(b.id,l.id)+requestedQty(b.id,l.id);
      const free=n2(est-used),over=+t.overQty||0;
      const pct=over&&est?over/est*100:0;
      return `<tr><td>${sel('il_l'+i,b.lines.map(x=>({v:x.id,t:bqLabel(x)})),t.boqLine,`onchange="indentSet(${i},'boqLine',this.value)"`)}</td>
        <td class="rt mono">${qty(l.boqQty)}</td>
        <td class="rt mono"><b>${qty(est)}</b>${varQty(l)?`<small>${qty(l.estQty)} + ${qty(varQty(l))}</small>`:''}</td>
        <td class="rt mono">${varQty(l)?`<span style="color:var(--brand)">+${qty(varQty(l))}</span>`:'—'}</td>
        <td class="rt mono">${qty(used)}</td>
        <td class="rt mono" style="color:${free<0?'var(--bad)':(free>0?'inherit':'var(--muted)')}">${free<0?'▲ '+qty(-free)+' over':qty(free)}</td>
        <td>${txt('il_q'+i,t.qty,'number',`onchange="indentSet(${i},'qty',this.value)" style="width:96px"`)}</td>
        <td>${over>0?`<span class="tag bad">▲ ${qty(over)} over · ${pct.toFixed(1)}%</span>`
                    :'<span class="tag ok">✓ within</span>'}</td>
        <td><button class="btn sm bad" onclick="TMP.lines.splice(${i},1);indentDraw()">✕</button></td></tr>`}).join('')
  }</tbody><tfoot><tr><th colspan="8" style="text-align:left;font-weight:500;color:var(--muted)">
      BOQ qty is what the work order line works out to. Est qty is what Planning expects to procure, plus any variation already amended in. Balance is the estimate less everything indented and pending.
    </th><th></th></tr></tfoot></table></div>`;
};


/* ============================================================
   v13 — the over-estimate warning follows the document.

   Raising past the estimate is allowed where the BOQ says so,
   including with no ceiling. What it must never be is quiet: the
   approver has to see it before they sign, and the site manager
   has to see it on their own desk until it is regularised.

   The warning is amber where a percentage ceiling was set and it
   is still inside it, and red where no ceiling was set or the
   ceiling has been passed — a different colour, not a louder one.
   ============================================================ */
function indentOver(d){
  if(!d||!d.lines)return null;
  const over=d.lines.filter(l=>+l.overQty>0);
  if(!over.length)return null;
  const b=DB.boqs.find(x=>x.id===d.boq);
  const pol=overPolicy(b);
  let worst=0,total=0;
  over.forEach(l=>{
    const bl=b&&b.lines.find(x=>x.id===l.boqLine);
    const est=bl?estOf(bl):0;
    total+=+l.overQty;
    if(est)worst=Math.max(worst,+l.overQty/est*100);
  });
  return {lines:over,qty:n2(total),pct:n2(worst),
    /* amber inside an agreed ceiling, red where none was agreed */
    cls:(pol.allow&&pol.pct>0&&worst<=pol.pct)?'warn':'bad',
    capped:pol.allow&&pol.pct>0,pol};
}
function overChip(d){
  const o=indentOver(d);if(!o)return '';
  return `<span class="tag ${o.cls}">${o.cls==='bad'?'▲':'⚠'} ${o.pct.toFixed(1)}% past the estimate</span>`;
}

/* ---------- in the pipeline ---------- */
PAGES.approvals=()=>{
  const mine=pendingForMe();
  const all=[].concat(
    scoped(DB.indents).filter(d=>!d.draft).map(d=>({d,kind:'Indent'})),
    scoped(DB.pos).map(d=>({d,kind:'Purchase order'})),
    scoped(DB.supbills).map(d=>({d,kind:'Supplier bill'})),scoped(DB.clientbills).map(d=>({d,kind:'Client RA bill'})),
    scoped(DB.subbills).map(d=>({d,kind:'Sub-contractor bill'})),
    scoped(DB.amendments||[]).map(d=>({d,kind:'BOQ amendment'})),
    scoped(DB.audits||[]).filter(d=>d.status==='SUBMITTED').map(d=>({d,kind:'Site store audit'}))
  ).filter(x=>!isApproved(x.d));
  const flagged=all.filter(x=>indentOver(x.d));
  const row=x=>{const o=indentOver(x.d);
    return `<tr ${o?`style="box-shadow:inset 3px 0 0 var(--${o.cls==='bad'?'bad':'warn'})"`:''}>
    <td><b>${esc(x.d.no)}</b><small>${x.kind}</small></td>

    <td class="rt mono">${money(x.d.amount||0)}</td>
    <td>${o?overChip(x.d):'<span class="tag ok">✓ within estimate</span>'}</td>
    <td>${chainHtml(x.d)}</td>
    <td class="rt">${myTurn(x.d)?`<button class="btn pri sm" onclick="apprSheet('${x.d.id}')">Review</button>`
      :`<button class="btn sm" onclick="apprSheet('${x.d.id}')">Open</button>`}</td></tr>`};
  return `${mine.length?`<div class="banner info">⚑ <div><b>${mine.length} waiting on you.</b> As ${myRole().name} you're the next step on these.</div></div>`:''}
  ${flagged.length?`<div class="banner bad">▲ <div><b>${flagged.length} document(s) go past the BOQ estimate.</b> Approving one commits material the estimate does not cover, and the BOQ stays at <b>Amendment due</b> until a variation quantity is recorded against it.</div></div>`:''}
  ${tableCard('Open documents','Nothing moves to the next stage until the current one signs',
    ['Document','Site','Date',{t:'Value',r:1},'Against estimate','Approval chain',{t:'',r:1}],all.map(row).join(''))}`;
};

/* ---------- on the document the approver opens ---------- */
apprSheet=function(id){
  const d=findDoc(id);if(!d)return;
  const o=indentOver(d),b=d.boq?DB.boqs.find(x=>x.id===d.boq):null;
  const trail=d.appr.trail.length?`<table><thead><tr><th>Stage</th><th>Action</th><th>By</th><th>Date</th></tr></thead><tbody>${
    d.appr.trail.map(t=>`<tr><td>${esc(t.step)}</td><td>${t.act==='Returned'?'<span class="tag bad">Returned</span>':`<span class="tag ok">${t.act}</span>`}${t.note?`<small>${esc(t.note)}</small>`:''}</td><td>${esc(user(t.by).name)}</td><td>${dmy(t.at)}</td></tr>`).join('')
  }</tbody></table>`:'<div class="empty" style="padding:20px">No action yet.</div>';
  const lines=(d.lines||[]).map(l=>{
    const bl=b&&b.lines.find(x=>x.id===l.boqLine);
    const est=bl?estOf(bl):null,ov=+l.overQty||0;
    return `<tr ${ov?`style="box-shadow:inset 3px 0 0 var(--${o.cls==='bad'?'bad':'warn'})"`:''}>
      <td>${esc(lineName(l))}</td>
      <td class="rt mono">${est!=null?qty(est):'—'}</td>
      <td class="rt mono">${qty(l.qty||l.supplyQty||0)}</td>
      <td>${ov?`<span class="tag ${o.cls}">${o.cls==='bad'?'▲':'⚠'} ${qty(ov)} over · ${est?(ov/est*100).toFixed(1):'—'}%</span>`
              :(est!=null?'<span class="tag ok">✓ within estimate</span>':'')}</td>
      <td class="rt mono">${money(l.rate||l.supplyRate||0)}</td></tr>`}).join('');
  const body=`${o?`<div class="banner ${o.cls}">${o.cls==='bad'?'▲':'⚠'} <div>
      <b>${o.lines.length} line(s) go past the BOQ estimate — ${o.pct.toFixed(1)}% at the worst line, ${qty(o.qty)} in total.</b><br>
      ${o.capped?`This BOQ allows up to ${o.pol.pct}% over, so this is inside what was agreed — but it still needs a BOQ amendment before the estimate reads true.`
                :`<b>No ceiling was agreed on this BOQ</b>, so there is nothing capping how far past the estimate it can go. Approve only if the extra quantity is genuinely needed.`}
      </div></div>`:''}
    <div class="card" style="margin-bottom:14px"><div class="pad">
      <div class="row2"><div><label class="hint">Document</label><div><b>${esc(d.no)}</b></div></div>
      <div><label class="hint">Site</label><div>${esc(site(d.site).name||'—')}</div></div></div>
      <div style="margin-top:12px">${chainHtml(d)}</div></div></div>
    <div class="card" style="margin-bottom:14px"><header><h3>Lines</h3></header><div class="tw"><table>
      <thead><tr><th>Item</th><th class="rt">Est qty</th><th class="rt">Qty</th><th>Against estimate</th><th class="rt">Rate</th></tr></thead>
      <tbody>${lines}</tbody></table></div></div>
    ${myTurn(d)?field('Remark (optional)',`<textarea class="inp" id="ap_note" rows="3" placeholder="Reason, condition, or what to fix"></textarea>`):''}
    <div class="card"><header><h3>History</h3></header><div class="tw">${trail}</div></div>`;
  const foot=myTurn(d)
    ? `<button class="btn bad" onclick="doAppr('${id}','rej')">Return</button><button class="btn ok" onclick="doAppr('${id}','ok')">Approve</button>`
    : (isRejected(d)&&canEdit('indent')?`<button class="btn pri" onclick="doAppr('${id}','re')">Resubmit</button>`:'<button class="btn" onclick="Sheet.close()">Close</button>');
  Sheet.open(d.no,o?'Approval · past the estimate':'Approval',body,foot);
};

/* ---------- and on the site manager's own desk ---------- */
function myOverBoqs(){
  return myProjects().map(s=>boqDocOf(s.id)).filter(b=>b&&boqState(b).tag==='AMEND');
}
function overDeskBanner(){
  const boqs=myOverBoqs();
  const mineOver=minePerSite(DB.indents).filter(i=>!i.draft&&!isRejected(i)&&indentOver(i));
  if(!boqs.length&&!mineOver.length)return '';
  const worst=boqs.reduce((a,b)=>Math.max(a,boqOverLines(b).reduce((x,l)=>Math.max(x,overRun(b,l).pct),0)),0);
  return `<div class="banner bad">▲ <div>
      ${boqs.length?`<b>${boqs.length} of your BOQ(s) are past their estimate</b> — ${worst.toFixed(1)}% at the worst line. Planning has to record a variation quantity before the estimate reads true again.<br>`:''}
      ${mineOver.length?`${mineOver.length} of your indent(s) carry quantity past the estimate: ${mineOver.map(i=>esc(i.no)).join(', ')}.`:''}
    </div>
    ${boqs.map(b=>`<button class="btn sm" onclick="boqDocView('${b.id}')">${esc(site(b.site).name)}</button>`).join(' ')}</div>`;
}
const __desk=PAGES.desk;
PAGES.desk=()=>overDeskBanner()+__desk();
const __ind=PAGES.indent;
PAGES.indent=()=>{const h=__ind();return h.replace('<div class="banner info">↗',overDeskBanner()+'<div class="banner info">↗')};

/* ============================================================
   v14 — the indent is raised on the BOQ sheet itself.

   The cart was the problem: "＋ Add line", pick from a dropdown,
   repeat. The site engineer could not see what the BOQ actually
   held, so they indented what they remembered instead of what was
   estimated. Now the whole BOQ is on screen the way Planning
   prepared it — work order line, its items, Sl No, code, unit,
   make, BOQ qty, est qty, what is already indented and what is
   left — and the only thing typed is a quantity on the line.
   Nothing typed means the line is not on the indent.

   The same sheet goes out to Excel and comes back. Site staff
   work offline, on paper, in a shared sheet — so the download
   carries every BOQ line with its estimate and its balance, and
   the upload matches on Sl No:

     · Sl No already on the draft   → the sheet's quantity wins
     · Sl No not on the draft yet   → the line is added
     · quantity left blank          → the line is left alone
     · quantity of 0                → the line comes off the draft
     · Sl No not on this BOQ        → skipped and reported

   Nothing is applied until it has been shown first.
   ============================================================ */

/* ---------- the sheet, as rows ---------- */
/* the ceiling a line is measured against: the estimate on a prepared
   BOQ, and the work order quantity on a site that has only a work
   order. estOf() alone reads zero on the second kind, which made
   every line look like it was already past its estimate. */
function capBal(b,l){return n2(capQty(l)-indentedQty(b.id,l.id)-requestedQty(b.id,l.id))}
function inRow(b,l,w,n){
  const est=capQty(l), used=indentedQty(b.id,l.id)+requestedQty(b.id,l.id);
  const p=prod(l.prod)||{};
  return {line:l, id:l.id, sno:String(l.sno||n), code:p.code||'',
    name:lineName(l), uom:l.uom||p.uom||'', make:l.make||'',
    wo:w?((w.sno?w.sno+' · ':'')+(w.name||lineName(w))):'',
    estimated:l.estQty!=null,
    boqQty:+l.boqQty||0, est, used, free:n2(est-used)};
}
function inRowsOf(b){
  const wo=(b.kind==='BOQ'&&b.wo)?DB.boqs.find(x=>x.id===b.wo):null;
  const out=[];let n=0;
  const push=(l,w)=>{n++;out.push(inRow(b,l,w,n))};
  if(wo){
    wo.lines.forEach((w,i)=>{
      const kids=b.lines.filter(x=>x.woLine===w.id);
      if(!kids.length)return;
      out.push({group:true,sno:String(w.sno||i+1),name:w.name||lineName(w),
        uom:w.uom||'',boqQty:+w.boqQty||0,kids:kids.length});
      kids.forEach(l=>push(l,w));
    });
    b.lines.filter(l=>!wo.lines.some(w=>w.id===l.woLine)).forEach(l=>push(l,null));
  } else b.lines.forEach(l=>push(l,null));
  return out;
}

/* ---------- what is on the draft for a line ---------- */
function inQty(lineId){const t=TMP.lines.find(x=>x.boqLine===lineId);return t?t.qty:''}
function inOver(lineId){const t=TMP.lines.find(x=>x.boqLine===lineId);return t?+t.overQty||0:0}

/* one place where a quantity is written, whether it came from the
   keyboard or from a spreadsheet. Returns what it did with it. */
function inSetQty(lineId,v,quiet){
  const b=matBoq(TMP.site),l=b.lines.find(x=>x.id===lineId);
  if(!l)return {ok:false};
  const pol=overPolicy(b), free=capBal(b,l), ceiling=allowedQty(b,l);
  let q=+v; if(!isFinite(q)||q<0)q=0;
  let capped=0;
  if(ceiling!==Infinity&&q>boqBal(b,l)){
    capped=n2(q-Math.max(0,boqBal(b,l)));
    q=Math.max(0,boqBal(b,l));
    if(!quiet)toast(q<=0
      ? (pol.allow?`Nothing left on this line — it is already at the ${pol.pct}% ceiling`
                  :'Nothing left on this line — the estimate is a hard stop on this BOQ')
      : (pol.allow?`Capped at ${qty(q)} — ${pol.pct}% over the estimate is the ceiling`
                  :`Capped at ${qty(q)} — the estimate is a hard stop on this BOQ`),'bad');
  }
  let t=TMP.lines.find(x=>x.boqLine===lineId);
  if(q<=0){
    if(t)TMP.lines=TMP.lines.filter(x=>x!==t);
    return {ok:true,removed:!!t,qty:0,capped};
  }
  if(!t){t={id:uid('L'),boqLine:lineId,woLine:l.woLine||l.id,prod:l.prod,make:l.make||'',qty:0,overQty:0,remark:''};
    TMP.lines.push(t);}
  t.qty=q; t.overQty=Math.max(0,n2(q-free));
  /* keep the draft in BOQ order however it was filled */
  const ord={};b.lines.forEach((x,i)=>ord[x.id]=i);
  TMP.lines.sort((a,c)=>(ord[a.boqLine]||0)-(ord[c.boqLine]||0));
  return {ok:true,qty:q,over:t.overQty,capped};
}
function inType(lineId,v){
  const tw=document.getElementById('in_tw'),top=tw?tw.scrollTop:0;
  inSetQty(lineId,v);indentDraw();
  const t2=document.getElementById('in_tw');if(t2)t2.scrollTop=top;
}

/* ---------- the sheet on screen ---------- */
indentDraw=function(){
  const b=matBoq(TMP.site),el=document.getElementById('in_lines');if(!el)return;
  const pol=overPolicy(b),st=boqState(b);
  const hdr=document.getElementById('in_boq');
  if(hdr)hdr.textContent=`${b.no} — ${site(TMP.site).name} · ${b.lines.length} line(s) prepared`;
  const pl=document.getElementById('in_pol');
  if(pl)pl.innerHTML=`<div class="banner ${st.tag==='AMEND'?'bad':(pol.allow?'warn':'info')}">${st.tag==='AMEND'?'▲':(pol.allow?'⚠':'▤')}
    <div>${st.tag==='AMEND'?`<b>This BOQ is already past its estimate on ${st.over.length} line(s)</b> and is waiting on an amendment. `:''}
      ${pol.allow?`This BOQ allows indenting beyond the estimate${pol.pct?` up to <b>${pol.pct}%</b>`:' with <b>no ceiling</b>'}. Anything past the estimate is flagged and still needs an amendment.`
                 :'This BOQ does not allow indenting beyond the estimate — the estimated quantity is a hard stop.'}</div></div>`;

  const q=(TMP.filter||'').toLowerCase().trim();
  const rows=inRowsOf(b);
  const match=r=>!q||[r.sno,r.code,r.name,r.make,r.wo].join(' ').toLowerCase().includes(q);
  const wanted=r=>!TMP.onlyPicked||inQty(r.id)!=='';

  let body='',shown=0;
  for(let i=0;i<rows.length;i++){
    const r=rows[i];
    if(r.group){
      /* a work order line only appears if something under it does */
      let any=false;
      for(let j=i+1;j<rows.length&&!rows[j].group;j++)if(match(rows[j])&&wanted(rows[j]))any=true;
      if(!any)continue;
      body+=`<tr style="background:var(--line-2)"><td class="sn"><b>${esc(r.sno)}</b></td><td></td>
        <td colspan="3"><b>${esc(r.name)}</b><small>work order line · ${qty(r.boqQty)} ${esc(r.uom)}</small></td>
        <td class="rt mono"><b>${qty(r.boqQty)}</b></td><td colspan="6"></td></tr>`;
      continue;
    }
    if(!match(r)||!wanted(r))continue;
    shown++;
    const on=inQty(r.id), over=inOver(r.id);
    const pct=over&&r.est?over/r.est*100:0;
    const cls=over>0?(pol.allow&&pol.pct>0&&pct<=pol.pct?'warn':'bad'):'';
    body+=`<tr ${cls?`style="box-shadow:inset 3px 0 0 var(--${cls})"`:(on!==''?'style="background:var(--brand-soft)"':'')}>
      <td class="sn">${esc(r.sno)}</td>
      <td class="mono">${esc(r.code||'—')}</td>
      <td>${esc(r.name)}${r.make?`<small>${esc(r.make)}</small>`:''}</td>
      <td>${esc(r.uom)}</td>
      <td class="rt mono">${qty(r.boqQty)}</td>
      <td class="rt mono"><b>${qty(r.est)}</b>${varQty(r.line)?`<small>+${qty(varQty(r.line))} variation</small>`
            :(r.estimated?'':'<small>work order qty</small>')}</td>
      <td class="rt mono">${qty(r.used)}</td>
      <td class="rt mono" style="color:${r.free<0?'var(--bad)':(r.free>0?'inherit':'var(--muted)')}">${r.free<0?'▲ '+qty(-r.free)+' over':qty(r.free)}</td>
      <td><input class="inp rt" id="iq_${r.id}" type="number" min="0" step="any" style="width:96px"
            value="${on===''?'':on}" placeholder="—"
            onchange="inType('${r.id}',this.value)"></td>
      <td>${on===''?'<span class="tag" style="opacity:.45">not indented</span>'
            :(over>0?`<span class="tag ${cls}">${cls==='bad'?'▲':'⚠'} ${qty(over)} over · ${pct.toFixed(1)}%</span>`
                    :'<span class="tag ok">✓ within estimate</span>')}</td></tr>`;
  }

  const picked=TMP.lines.length, overN=TMP.lines.filter(l=>+l.overQty>0).length;
  el.innerHTML=`
    <div class="pad" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line)">
      <input class="inp" id="in_q" placeholder="Find a line — code, description or make" style="max-width:300px"
        value="${esc(TMP.filter||'')}" oninput="inFilter(this.value)">
      <button class="btn sm ${TMP.onlyPicked?'pri':''}" onclick="TMP.onlyPicked=!TMP.onlyPicked;indentDraw()">
        ${TMP.onlyPicked?'Showing what I filled':'Only what I filled'}</button>
      <div class="sp"></div>
      <span style="color:var(--muted)">${shown} line(s) shown · <b>${picked}</b> on this indent${overN?` · <span style="color:var(--bad)">${overN} past the estimate</span>`:''}</span>
    </div>
    <div class="tw" id="in_tw" style="max-height:56vh;overflow:auto"><table>
      <thead><tr><th>Sl No</th><th>Item Code</th><th style="min-width:230px">Description</th><th>Unit</th>
        <th class="rt">BOQ Qty</th><th class="rt">Est Qty</th><th class="rt">Indented</th><th class="rt">Balance</th>
        <th class="rt">Indent Qty</th><th>Against estimate</th></tr></thead>
      <tbody>${body||`<tr><td colspan="10">${emptyBox('Nothing matches','Clear the search to see the whole BOQ.')}</td></tr>`}</tbody>
    </table></div>`;
};
function inFilter(v){
  TMP.filter=v;const tw=document.getElementById('in_tw'),top=tw?tw.scrollTop:0;
  indentDraw();
  const e=document.getElementById('in_q');
  if(e){e.focus();try{e.setSelectionRange(v.length,v.length)}catch(_){}}
  const t2=document.getElementById('in_tw');if(t2)t2.scrollTop=top;
}

/* ---------- the sheet, out to Excel ----------
   The download is the screen, not a flattened version of it: the
   same heading, the same policy line, the same ten columns in the
   same order, and the work order lines still sitting above their
   own items. What comes back is recognisably what went out. */
const IN_HEAD=['Sl No','Item Code','Description','Unit','BOQ Qty','Est Qty',
               'Indented','Balance','Indent Qty','Against estimate'];
const IN_W=[{wch:8},{wch:12},{wch:54},{wch:9},{wch:11},{wch:11},{wch:11},{wch:11},{wch:12},{wch:24}];

function inStatusText(r){
  const on=inQty(r.id),over=inOver(r.id);
  if(on==='')return 'not indented';
  if(over>0){const pct=r.est?over/r.est*100:0;return `${qty(over)} over · ${pct.toFixed(1)}%`}
  return 'within estimate';
}
function inGrid(){
  const b=matBoq(TMP.site),s=site(TMP.site),pol=overPolicy(b),st=boqState(b);
  const g=[];
  g.push(['Raise an indent']);
  g.push([`${s.name} · ${b.no} · ${b.lines.length} line(s) prepared`]);
  g.push([`Indent date ${dmy(V('in_d')||today())}     Needed by ${dmy(V('in_need')||today())}`]);
  g.push([(st.tag==='AMEND'?`This BOQ is already past its estimate on ${st.over.length} line(s) and is waiting on an amendment. `:'')
    +(pol.allow?`Beyond the estimate: allowed${pol.pct?` up to ${pol.pct}%`:' with no ceiling'} — anything past it is flagged.`
               :'Beyond the estimate: not allowed — the estimated quantity is a hard stop.')]);
  g.push([]);
  const hdr=g.length;
  g.push(IN_HEAD.slice());
  const groups=[];
  inRowsOf(b).forEach(r=>{
    if(r.group){groups.push(g.length);
      g.push([r.sno,'',r.name+'   (work order line)',r.uom,r.boqQty,'','','','','']);return}
    const on=inQty(r.id);
    g.push([r.sno,r.code,r.name+(r.make?' · '+r.make:''),r.uom,
            r.boqQty,r.est,r.used,r.free,on===''?'':+on,inStatusText(r)]);
  });
  g.push([]);
  g.push(['','','Fill the Indent Qty column only. A line left blank stays as it is; a 0 takes it off the indent.']);
  g.push(['','','Sl No is what each line is matched on when this sheet is dropped back into the ERP.']);
  return {grid:g,hdr,groups};
}
function inDownload(){
  const b=matBoq(TMP.site),s=site(TMP.site),o=inGrid(),g=o.grid;
  const nm=('indent-'+s.name+'-'+b.no).replace(/[^a-z0-9]+/gi,'-').replace(/^-|-$/g,'').toLowerCase();
  if(typeof XLSX!=='undefined'){
    const ws=XLSX.utils.aoa_to_sheet(g);
    ws['!cols']=IN_W;
    /* the heading block spans the sheet the way it spans the screen */
    ws['!merges']=[0,1,2,3].map(r=>({s:{r,c:0},e:{r,c:IN_HEAD.length-1}}));
    ws['!autofilter']={ref:XLSX.utils.encode_range({s:{r:o.hdr,c:0},e:{r:o.hdr,c:IN_HEAD.length-1}})};
    ws['!freeze']={xSplit:0,ySplit:o.hdr+1};
    /* quantities read as quantities, not as text */
    for(let r=o.hdr+1;r<g.length;r++)for(let c=4;c<=8;c++){
      const cell=ws[XLSX.utils.encode_cell({r,c})];
      if(cell&&typeof cell.v==='number')cell.z='#,##0.###';
    }
    const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Indent');
    XLSX.writeFile(wb,nm+'.xlsx');
  }else{
    const csv=g.map(r=>r.map(c=>/[",\n]/.test(String(c))?'"'+String(c).replace(/"/g,'""')+'"':c).join(',')).join('\n');
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
    a.download=nm+'.csv';a.click();URL.revokeObjectURL(a.href);
  }
  toast('Sheet downloaded — fill the Indent Qty column and drop it back in','ok');
}

/* ---------- and back in ---------- */
function inDrop(e,el){e.preventDefault();el.classList.remove('hot');
  const f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];if(f)inFile(f)}
function inFile(f){
  if(!f)return;
  const ext=f.name.split('.').pop().toLowerCase(),r=new FileReader();
  if(ext==='csv'||ext==='txt'){r.onload=()=>inRead(csvGrid(r.result),f.name);r.readAsText(f);return}
  if(typeof XLSX==='undefined'){
    document.getElementById('in_imp').innerHTML=
      `<div class="banner warn">⚠ <div>The spreadsheet reader didn't load — you're probably offline. Save the sheet as <b>CSV</b> and drop that in instead; it reads exactly the same.</div></div>`;
    return;
  }
  r.onload=()=>{try{
    const wb=XLSX.read(new Uint8Array(r.result),{type:'array'});
    const sh=wb.Sheets[wb.SheetNames[0]];
    inRead(XLSX.utils.sheet_to_json(sh,{header:1,blankrows:false,defval:''}),f.name+' · '+wb.SheetNames[0]);
  }catch(err){document.getElementById('in_imp').innerHTML=
    `<div class="banner bad">✕ <div>Couldn't read that file. Try saving it as CSV.</div></div>`}};
  r.readAsArrayBuffer(f);
}
const inKey=v=>String(v==null?'':v).toLowerCase().replace(/[^a-z0-9]/g,'');
function inRead(grid,label){
  const box=document.getElementById('in_imp');
  if(!grid||!grid.length){box.innerHTML='<div class="banner bad">✕ <div>That file had nothing in it.</div></div>';return}

  /* the header row is the first one carrying an Sl No (or item code)
     and somewhere to write a quantity */
  const SNO=['slno','sno','sl','srno','serial','slno.','snumber'];
  const COD=['itemcode','code','item'];
  const QTY=['indentqty','indentquantity','qtytoindent','requiredqty','indentqty.','qty','quantity'];
  let hdr=-1,c={};
  for(let r=0;r<Math.min(grid.length,15);r++){
    const cells=grid[r].map(inKey),m={};
    cells.forEach((x,i)=>{
      if(m.sno===undefined&&SNO.includes(x))m.sno=i;
      if(m.code===undefined&&COD.includes(x))m.code=i;
      if(m.qty===undefined&&QTY.includes(x))m.qty=i;
    });
    if(m.qty!==undefined&&(m.sno!==undefined||m.code!==undefined)){hdr=r;c=m;break}
  }
  if(hdr<0){box.innerHTML=`<div class="banner bad">✕ <div>Couldn't find the columns in <b>${esc(label)}</b>.
    The sheet needs an <b>Sl No</b> column and an <b>Indent Qty</b> column — download the sheet above and fill that one in.</div></div>`;return}

  /* every line of this BOQ, findable by Sl No and by item code.
     The work order lines are on the sheet too — they carry no item
     and nothing can be indented against them, so they are known
     about only to be passed over quietly. */
  const b=matBoq(TMP.site),ix={},grp={};
  inRowsOf(b).forEach(r=>{
    if(r.group){grp[inKey(r.sno)]=r.name;return}
    ix['s'+inKey(r.sno)]=r; if(r.code)ix['c'+inKey(r.code)]=r;});

  const plan=[],skip=[];
  const seen={};
  for(let r=hdr+1;r<grid.length;r++){
    const g=grid[r];
    const sno=c.sno!==undefined?String(g[c.sno]==null?'':g[c.sno]).trim():'';
    const code=c.code!==undefined?String(g[c.code]==null?'':g[c.code]).trim():'';
    const raw=c.qty!==undefined?String(g[c.qty]==null?'':g[c.qty]).trim():'';
    if(!sno&&!code)continue;
    if(/^(total|grand|sub ?total)/i.test(sno)||/^(total|grand)/i.test(code))continue;
    const hit=ix['s'+inKey(sno)]||ix['c'+inKey(code)];
    if(!hit&&!code&&grp[inKey(sno)]!==undefined){
      /* a work order line. Blank is what it should be; a quantity
         on it means someone wrote against the heading instead of
         the item, which is worth saying out loud. */
      if(raw!=='')skip.push({sno:sno,why:'that is a work order line — put the quantity on its items'});
      continue;
    }
    if(!hit){skip.push({sno:sno||code,why:'not on this BOQ'});continue}
    if(seen[hit.id]){skip.push({sno:sno||code,why:'the same line twice — the last one wins'});}
    seen[hit.id]=1;
    if(raw===''){plan.push({row:hit,act:'blank'});continue}
    const q=parseFloat(raw.replace(/[^0-9.\-]/g,''));
    if(!isFinite(q)){skip.push({sno:sno||code,why:`"${raw}" is not a quantity`});continue}
    const on=inQty(hit.id);
    let act;
    if(q<=0)              act=on===''?'blank':'remove';
    else if(on==='')      act='new';
    else if(+on===q)      act='same';
    else                  act='override';
    plan.push({row:hit,act,qty:q,was:on});
  }
  const n=k=>plan.filter(p=>p.act===k).length;
  if(!plan.filter(p=>p.act==='new'||p.act==='override'||p.act==='remove').length){
    box.innerHTML=`<div class="banner warn">⚠ <div>Nothing to change from <b>${esc(label)}</b> —
      ${n('same')?`${n('same')} line(s) already match the draft. `:''}${n('blank')?`${n('blank')} line(s) had no quantity. `:''}
      ${skip.length?`${skip.length} row(s) didn't match a BOQ line.`:''}</div></div>`;return;
  }
  TMP.imported=plan;
  const changed=plan.filter(p=>p.act==='new'||p.act==='override'||p.act==='remove');
  box.innerHTML=`<div class="banner ok" style="align-items:flex-start">✓ <div>
      <b>${changed.length} line(s) to apply</b> from ${esc(label)} —
      ${n('new')} new, ${n('override')} changed, ${n('remove')} taken off${n('same')?`, ${n('same')} unchanged`:''}${n('blank')?`, ${n('blank')} left alone`:''}.
      ${skip.length?`<br><small>${skip.length} row(s) skipped: ${esc(skip.slice(0,3).map(s=>s.sno+' — '+s.why).join('; '))}${skip.length>3?' …':''}</small>`:''}
      <div style="margin-top:9px;display:flex;gap:8px">
        <button class="btn sm pri" onclick="inApply()">Apply to the draft</button>
        <button class="btn sm" onclick="TMP.imported=null;document.getElementById('in_imp').innerHTML=''">Cancel</button>
      </div></div></div>
    <div class="tw" style="margin-top:10px;max-height:230px;overflow:auto"><table>
      <thead><tr><th>Sl No</th><th>Description</th><th class="rt">On the draft</th><th class="rt">From the sheet</th><th>What happens</th></tr></thead>

          p.act==='new'?'added':p.act==='override'?'quantity replaced':'taken off the indent'}</span></td></tr>`).join('')}
      </tbody></table>${changed.length>60?`<div class="empty" style="padding:10px">and ${changed.length-60} more</div>`:''}</div>`;
}
function inApply(){
  if(!TMP.imported)return;
  let done=0,capped=0,over=0,off=0;
  TMP.imported.forEach(p=>{
    if(p.act==='blank'||p.act==='same')return;
    const res=inSetQty(p.row.id,p.act==='remove'?0:p.qty,true);
    if(!res.ok)return;
    if(p.act==='remove'){off++;return}
    done++;if(res.capped)capped++;if(res.over>0)over++;
  });
  TMP.imported=null;
  const box=document.getElementById('in_imp');if(box)box.innerHTML='';
  indentDraw();
  toast(`${done} line(s) written${off?`, ${off} taken off`:''}${capped?` · ${capped} capped at the ceiling`:''}`,'ok');
  if(over)setTimeout(()=>toast(`▲ ${over} line(s) are past the estimate — they are flagged on the sheet`,'bad'),800);
}

/* ============================================================
   v15 — following a requirement all the way to site.

   Two things were missing once an indent was approved.

   One: it went onward as itself. Six indents from four sites
   asking for the same cable meant the store picked six times and
   the buyer negotiated six times. Store and Procurement need the
   same requirement added up by item, not by the piece of paper it
   arrived on.

   Two: nobody could say where a requirement had got to. The
   documents each knew their own part — the PO knew it was ordered,
   the GRN knew it arrived, the challan knew it was sent — and no
   screen put them end to end. So the site chased the buyer, the
   buyer chased the store, and the answer was a phone call.

   This screen reads those documents and shows the whole line:

     approved → on order → at store → in transit → delivered

   and it says partial or full at every stage, for each department,
   with the remaining quantity spelled out — which is the only
   number a follow-up call is actually about.
   ============================================================ */

NAV.find(g=>g.g==='Store').items.push(['track','Fulfilment','◷']);
SECTIONS.find(s=>s.id==='store').screens.splice(2,0,'track');
TITLES.track=['Fulfilment','Every approved requirement from indent to delivery — combined by item'];

let TRK={lens:'store',q:''};
const trkKey=l=>l.prod+'||'+(l.make||'');
const trkStores=()=>scoped(DB.sites).filter(s=>s.type==='STORE');

/* ---------- what each indent line has actually had done to it ---------- */
function trkPoLines(indentId,lineId){
  const out=[];
  DB.pos.forEach(p=>{if(isRejected(p))return;
    (p.lines||[]).forEach(l=>{if(l.indent===indentId&&l.indentLine===lineId)out.push({po:p,line:l})});});
  return out;
}
/* everything that has landed at a site, by item — challans and
   transfers in, not returns out */
function trkArrivals(siteId){
  const m={};
  allMoves().filter(x=>x.kind!=='return'&&x.toSite===siteId).forEach(x=>
    (x.lines||[]).forEach(l=>{
      const k=l.prod+'||'+(l.make||'');
      const b=m[k]=m[k]||{delivered:0,transit:0};
      b[x.status==='RECEIVED'?'delivered':'transit']=n2(b[x.status==='RECEIVED'?'delivered':'transit']+ +l.qty);
    }));
  return m;
}

/* One row per indent line, with the stage quantities filled in.
   A challan does not name the indent it satisfies, so arrivals are
   allocated by item against the oldest open requirement first —
   the same order a storekeeper would work in. */
function trkRows(){
  const rows=[];
  const inds=minePerSite(DB.indents).filter(i=>!i.draft&&!isRejected(i))
    .sort((a,b)=>String(a.date).localeCompare(String(b.date)));
  const pool={};
  inds.forEach(i=>{
    (i.lines||[]).forEach(l=>{
      const pls=trkPoLines(i.id,l.id);
      const ordered=n2(pls.reduce((a,x)=>a+ +x.line.qty,0));
      const received=n2(pls.reduce((a,x)=>a+grnQtyOfPoLine(x.po.id,x.line.id),0));
      const q=+l.qty||0;
      let del=0,tr=0;
      if(isApproved(i)){
        pool[i.site]=pool[i.site]||trkArrivals(i.site);
        const k=trkKey(l),b=pool[i.site][k]||{delivered:0,transit:0};
        del=Math.min(q,b.delivered); b.delivered=n2(b.delivered-del);
        tr =Math.min(q-del,b.transit); b.transit=n2(b.transit-tr);
        pool[i.site][k]=b;
      }
      rows.push({ind:i,line:l,qty:q,ordered,received:n2(received),
        delivered:n2(del),transit:n2(tr),pending:n2(q-del-tr),pos:pls});
    });
  });
  return rows;
}

/* the stage a line has reached, and how far through it is */
/* The stage worth showing is the one somebody can act on. Material
   that has arrived at the store but not gone out is the store's move,
   even when the rest of the line is still on order — otherwise the
   row says "chase Procurement" while a pallet sits in the shed. */
function trkStage(r){
  const q=r.qty||0,e=0.001;
  const atStore=n2(Math.max(0,r.received-r.delivered-r.transit));
  if(!isApproved(r.ind))     return {k:0,t:'Awaiting approval',cls:'warn',who:'Approver',ready:0};
  if(r.delivered>=q-e)       return {k:5,t:'Delivered at site',cls:'ok',who:'—',ready:0};
  if(atStore>e)              return {k:3,t:`At store, ${qty(atStore)} to issue`,cls:'warn',who:'Store',ready:atStore};
  if(r.transit>0)            return {k:4,t:'In transit to site',cls:'warn',who:'Site',ready:0};
  if(r.ordered>=q-e)         return {k:2,t:'On order',cls:'warn',who:'Procurement',ready:0};
  if(r.ordered>0)            return {k:2,t:'Part ordered',cls:'bad',who:'Procurement',ready:0};
  return {k:1,t:'With store & procurement',cls:'bad',who:'Store / Procurement',ready:0};
}
const trkFill=r=>{
  const q=r.qty||0,e=0.001;
  if(r.delivered>=q-e&&q>0)return {t:'Full',cls:'ok'};
  if(r.delivered>0)        return {t:'Partial',cls:'warn'};
  return {t:'Not started',cls:'bad'};
};
function trkPips(r){
  const on=trkStage(r).k;
  return `<span class="trkpips" title="approved · ordered · at store · in transit · delivered">${
    [1,2,3,4,5].map(k=>`<i class="${k<=on?(on===5?'done':'now'):''}"></i>`).join('')}</span>`;
}

/* ---------- the same requirement, added up by item ---------- */
function trkCombined(){
  const m={};
  trkRows().filter(r=>isApproved(r.ind)&&r.pending>0.001).forEach(r=>{
    const k=trkKey(r.line);
    const x=m[k]=m[k]||{prod:r.line.prod,make:r.line.make||'',need:0,onOrder:0,transit:0,
      inds:[],sites:{},need_by:null};
    x.need=n2(x.need+r.pending);
    x.onOrder=n2(x.onOrder+Math.max(0,n2(r.ordered-r.received)));
    x.transit=n2(x.transit+r.transit);
    if(!x.inds.some(i=>i.id===r.ind.id))x.inds.push(r.ind);
    x.sites[r.ind.site]=n2((x.sites[r.ind.site]||0)+r.pending);
    const nb=r.ind.need||r.ind.date;
    if(nb&&(!x.need_by||String(nb)<String(x.need_by)))x.need_by=nb;
  });
  return Object.values(m).map(x=>{
    const inStore=n2(trkStores().reduce((a,s)=>a+stockAt(s.id,x.prod,x.make),0));
    const canIssue=n2(Math.min(x.need,inStore));
    return {...x,inStore,canIssue,
      /* what nobody has covered yet: not in a store, not on a PO, not moving */
      toBuy:n2(Math.max(0,x.need-canIssue-x.onOrder-x.transit))};
  }).sort((a,b)=>String(a.need_by||'').localeCompare(String(b.need_by||''))||b.toBuy-a.toBuy);
}

/* What the buy list should be valued at: what this item has actually
   been costing us, not the number somebody typed into the item master
   when it was created. Falls back to the master rate when we have
   never bought it. */
function trkRate(x){const l=lastRate(x.prod,x.make);return l>0?l:(+prod(x.prod).rate||0)}
function trkRateSrc(x){return lastRate(x.prod,x.make)>0?'average purchase rate':'master rate'}

/* ---------- the screen ---------- */
const TRK_LENS=[['store','For the store','▥'],['buy','For procurement','▣'],
                ['ind','By indent','↗'],['po','By purchase order','◷']];
function trkGo(l){TRK.lens=l;render()}
function trkFind(v){TRK.q=v;
  const el=document.getElementById('trk_body');if(!el)return;
  el.innerHTML=trkBody();
  const e=document.getElementById('trk_q');if(e){e.focus();try{e.setSelectionRange(v.length,v.length)}catch(_){}}
}
PAGES.track=()=>{
  const rows=trkRows().filter(r=>isApproved(r.ind));
  const open=rows.filter(r=>r.pending>0.001);
  const late=open.filter(r=>r.ind.need&&String(r.ind.need)<today());
  return viewBanner('track')
    +`<div class="banner info">◷ <div>Store and Procurement work off the <b>combined</b> requirement, not off one indent at a time — the same item wanted by four sites is one line here. Every quantity below is what is <b>still outstanding</b>, so a line leaves the screen when it is delivered.</div></div>
    ${late.length?`<div class="banner bad">▲ <div><b>${late.length} line(s) are past the date the site asked for.</b> They are marked <span class="tag bad">late</span> wherever they appear.</div></div>`:''}
    <div class="card"><header>
      <div><h3>Fulfilment</h3><p>${open.length} line(s) outstanding across ${new Set(open.map(r=>r.ind.id)).size} indent(s)</p></div>
      <div class="sp"></div>
      ${TRK_LENS.map(([k,t])=>`<button class="btn sm ${TRK.lens===k?'pri':''}" onclick="trkGo('${k}')">${t}</button>`).join(' ')}
    </header>
    <div class="pad" style="border-bottom:1px solid var(--line)">
      <input class="inp" id="trk_q" placeholder="Find an item, indent, site or supplier" style="max-width:340px"
        value="${esc(TRK.q||'')}" oninput="trkFind(this.value)">
    </div>
    <div id="trk_body">${trkBody()}</div></div>`;
};
const trkHit=(s)=>!TRK.q||String(s).toLowerCase().includes(TRK.q.toLowerCase());
const trkLate=i=>i.need&&String(i.need)<today()?'<span class="tag bad">late</span>':'';

function trkBody(){
  if(TRK.lens==='store')return trkStoreView();
  if(TRK.lens==='buy')  return trkBuyView();
  if(TRK.lens==='ind')  return trkIndView();
  return trkPoView();
}

/* --- store: one pick list, whatever it arrived on --- */
function trkStoreView(){
  const c=trkCombined().filter(x=>trkHit(pname(x.prod)+' '+x.make+' '+Object.keys(x.sites).map(s=>site(s).name).join(' ')));
  if(!c.length)return emptyBox('Nothing outstanding','Every approved requirement has reached its site.');
  const rows=c.map(x=>`<tr>
    <td>${esc(pname(x.prod))}<small class="mono">${esc(prod(x.prod).code||'')}${x.make?' · '+esc(x.make):''}</small></td>
    <td>${esc(prod(x.prod).uom||'')}</td>

    <td>${x.need_by?dmy(x.need_by):'—'}${String(x.need_by||'')<today()?' <span class="tag bad">late</span>':''}</td></tr>`).join('');
  return `<div class="pad" style="display:flex;gap:9px;align-items:center;border-bottom:1px solid var(--line)">
      <div style="color:var(--muted)">What the store can pick today, and what it cannot.</div><div class="sp"></div>
      <button class="btn sm" onclick="trkDownload('store')">⭳ Download the pick list</button>
      ${canEdit('issue')?`<button class="btn sm pri" onclick="location.hash='#issue'">Issue &amp; challan ›</button>`:''}
    </div>
    <div class="tw"><table><thead><tr><th style="min-width:230px">Item</th><th>Unit</th>
      <th class="rt">Still needed</th><th class="rt">In store</th><th class="rt">Can issue now</th>
      <th class="rt">On order</th><th class="rt">In transit</th><th class="rt">Nobody covering</th>
      <th style="min-width:180px">Wanted by</th><th>Needed by</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

/* --- procurement: one buy list, and what is already covered --- */
function trkBuyView(){
  const c=trkCombined().filter(x=>trkHit(pname(x.prod)+' '+x.make));
  const buy=c.filter(x=>x.toBuy>0.001);
  if(!c.length)return emptyBox('Nothing outstanding','Every approved requirement has reached its site.');
  const rows=c.map(x=>`<tr ${x.toBuy>0?'style="box-shadow:inset 3px 0 0 var(--bad)"':''}>
    <td>${esc(pname(x.prod))}<small class="mono">${esc(prod(x.prod).code||'')}${x.make?' · '+esc(x.make):''}</small></td>
    <td>${esc(prod(x.prod).uom||'')}</td>
    <td class="rt mono"><b>${qty(x.need)}</b><small>${x.inds.length} indent(s)</small></td>
    <td class="rt mono">${x.canIssue?qty(x.canIssue):'—'}</td>
    <td class="rt mono">${x.onOrder?qty(x.onOrder):'—'}</td>

    <td class="rt mono">${x.toBuy&&trkRate(x)?money(x.toBuy*trkRate(x)):'—'}

    <td>${x.need_by?dmy(x.need_by):'—'}${String(x.need_by||'')<today()?' <span class="tag bad">late</span>':''}</td>

  return `<div class="pad" style="display:flex;gap:9px;align-items:center;border-bottom:1px solid var(--line)">
      <div style="color:var(--muted)"><b>${buy.length}</b> item(s) need buying — the rest is in a store or already on a PO.</div>

      ${canEdit('po')?`<button class="btn sm pri" onclick="location.hash='#po'">Purchase orders ›</button>`:''}
    </div>
    <div class="tw"><table><thead><tr><th style="min-width:230px">Item</th><th>Unit</th>

      <th style="min-width:200px">Asked by</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

/* --- by indent: the site's own question, answered --- */
function trkIndView(){
  const rows=trkRows();
  const byInd={};
  rows.forEach(r=>{(byInd[r.ind.id]=byInd[r.ind.id]||{ind:r.ind,rows:[]}).rows.push(r)});
  const list=Object.values(byInd)
    .filter(g=>trkHit(g.ind.no+' '+site(g.ind.site).name+' '+g.rows.map(r=>pname(r.line.prod)).join(' ')))
    .sort((a,b)=>String(b.ind.date).localeCompare(String(a.ind.date)));
  if(!list.length)return emptyBox('No indents','Nothing has been sent for approval yet.');
  return list.map(g=>{
    const tot=g.rows.reduce((a,r)=>a+r.qty,0), del=g.rows.reduce((a,r)=>a+r.delivered,0);
    const pct=tot?Math.round(del/tot*100):0;
    const open=g.rows.filter(r=>r.pending>0.001);
    const worst=open.reduce((a,r)=>{const s=trkStage(r);return s.k<a.k?s:a},{k:9,t:'Delivered',who:'—'});
    return `<div class="card" style="margin:12px 14px">
      <header><div><h3>${esc(g.ind.no)}</h3>
        <p>${esc(site(g.ind.site).name)} · raised ${dmy(g.ind.date)}${g.ind.need?` · needed by ${dmy(g.ind.need)}`:''} ${trkLate(g.ind)}</p></div>
        <div class="sp"></div>
        <span class="tag ${pct>=100?'ok':(pct>0?'warn':'bad')}">${pct>=100?'Delivered in full':(pct>0?`Partial · ${pct}% delivered`:'Nothing delivered yet')}</span>
        ${open.length?`<span class="tag">${open.length} line(s) open · with ${esc(worst.who)}</span>`:''}
        <button class="btn sm" onclick="apprSheet('${g.ind.id}')">Open</button></header>
      <div class="tw"><table><thead><tr><th style="min-width:210px">Item</th><th class="rt">Indented</th>
        <th class="rt">Ordered</th><th class="rt">At store</th><th class="rt">In transit</th>
        <th class="rt">Delivered</th><th class="rt">Still to come</th><th>Stage</th><th>Fulfilled</th></tr></thead>
        <tbody>${g.rows.map(r=>{const st=trkStage(r),f=trkFill(r);
          return `<tr><td>${esc(lineName(r.line))}<small>${esc(r.line.make||'')}</small></td>
            <td class="rt mono">${qty(r.qty)}</td>
            <td class="rt mono">${r.ordered?qty(r.ordered):'—'}</td>
            <td class="rt mono">${r.received?qty(r.received):'—'}</td>
            <td class="rt mono">${r.transit?qty(r.transit):'—'}</td>
            <td class="rt mono">${r.delivered?qty(r.delivered):'—'}</td>
            <td class="rt mono" style="color:${r.pending>0?'var(--bad)':'var(--ok)'}"><b>${r.pending>0?qty(r.pending):'nil'}</b></td>
            <td>${trkPips(r)} <span class="tag ${st.cls}">${st.t}</span>${r.pending>0?`<small>with ${esc(st.who)}</small>`:''}</td>
            <td><span class="tag ${f.cls}">${f.t}</span></td></tr>`}).join('')}
        </tbody></table></div></div>`;
  }).join('');
}

/* --- by PO: procurement's own follow-up, until it is at the store --- */
function trkPoView(){
  const pos=scoped(DB.pos).filter(p=>!isRejected(p))
    .filter(p=>trkHit(p.no+' '+sup(p.sup).name+' '+site(p.site).name))
    .sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  if(!pos.length)return emptyBox('No purchase orders','Nothing has been ordered yet.');
  const rows=pos.map(p=>{
    const ord=n2((p.lines||[]).reduce((a,l)=>a+ +l.qty,0));
    const got=n2((p.lines||[]).reduce((a,l)=>a+grnQtyOfPoLine(p.id,l.id),0));
    const pend=n2(ord-got);
    const late=p.due&&String(p.due)<today()&&pend>0.001;
    const st=!isApproved(p)?{t:'Awaiting approval',cls:'warn'}
      :pend<=0.001?{t:'Received in full',cls:'ok'}

    const short=(p.lines||[]).filter(l=>+l.qty-grnQtyOfPoLine(p.id,l.id)>0.001);
    return `<tr ${late?'style="box-shadow:inset 3px 0 0 var(--bad)"':''}>
      <td><b>${esc(p.no)}</b><small>${dmy(p.date)}</small></td>
      <td>${esc(sup(p.sup).name)}</td>
      <td>${esc(site(p.site).name)}<small>for ${esc(site(p.forSite||p.site).name)}</small></td>
      <td class="rt mono">${qty(ord)}</td><td class="rt mono">${qty(got)}</td>
      <td class="rt mono" style="color:${pend>0?'var(--bad)':'var(--ok)'}"><b>${pend>0?qty(pend):'nil'}</b></td>
      <td>${p.due?dmy(p.due):'—'}${late?` <span class="tag bad">${Math.round((new Date(today())-new Date(p.due))/864e5)} day(s) late</span>`:''}</td>
      <td><span class="tag ${st.cls}">${st.t}</span>${short.length&&isApproved(p)
        ?`<small>${short.slice(0,3).map(l=>esc(lineName(l))+' '+qty(n2(+l.qty-grnQtyOfPoLine(p.id,l.id)))).join('; ')}${short.length>3?' …':''}</small>`:''}</td>
      <td class="rt"><button class="btn sm" onclick="poView('${p.id}')">Open</button>
        ${canEdit('grn')&&isApproved(p)&&pend>0.001?`<button class="btn sm pri" onclick="grnSheet('${p.id}')">Receive</button>`:''}</td></tr>`;
  }).join('');
  return `<div class="pad" style="color:var(--muted);border-bottom:1px solid var(--line)">
      A purchase order stays here until everything on it is at the store. What is short is named on the row.</div>

      <th class="rt">Ordered</th><th class="rt">Received</th><th class="rt">Pending</th>
      <th>Due</th><th style="min-width:200px">Status</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

/* ============================================================
   v16 — RA lines, and an amendment that actually moves the BOQ.

   Two things a contracting BOQ has always needed and this one
   could not express.

   RA. Some work order lines carry no quantity at all: the rate is
   agreed and whatever gets measured is what gets paid. Typing 0
   was the only way to say that, and 0 meant "nothing may be
   indented" — the opposite. So a quantity is now a number, or the
   word RA. An RA line has no ceiling, contributes nothing to the
   contract value, and everything indented against it stands as
   variation until somebody amends it into a real number.

   The amendment. There were two half-built mechanisms that never
   met: DB.amendments moved the BOQ quantity and nothing read it,
   l.varQty moved the estimate and the amendment screen only ever
   wrote that one — and silently dropped any negative you typed. So
   an amendment moved the indent ceiling but never the sanctioned
   quantity, and a reduction did nothing at all.

   Both are replaced by one rule:

       sanction = the quantity, as revised by approved amendments
       variation = max(0, committed - sanction)

   Variation is derived, never stored. That matters: a stored
   variation drifts the moment an indent is cancelled or an
   amendment is rejected, and nobody notices. Derived, it is always
   right and it corrects itself.

   On an RA line there is no sanction, so variation is the whole
   committed quantity — and an amendment REPLACES the RA rather
   than adding to it. Everywhere else B_new = B + A.
   ============================================================ */

/* ---------- a quantity is a number, or RA ---------- */
const RA='RA';
const isRA=v=>typeof v==='string'&&v.trim().toUpperCase()===RA;
const qn=v=>isRA(v)?0:(+v||0);                       // for arithmetic and money
const qshow=v=>isRA(v)?'<span class="tag ra">RA</span>':qty(qn(v));
const qtext=v=>isRA(v)?'RA':qty(qn(v));              // for spreadsheets and plain text
const raIn=v=>isRA(v)?'RA':(v===''||v==null||+v===0?'':String(v));
/* what the user typed, turned into a quantity. Blank is 0, "ra" in
   any case is RA, anything else is a number — negatives included. */
function qparse(v){
  const s=String(v==null?'':v).trim();
  if(!s)return 0;
  if(/^ra$/i.test(s))return RA;
  const n=parseFloat(s.replace(/,/g,''));
  return isFinite(n)?n:0;
}

/* ---------- money never chokes on RA ---------- */
woSupply=l=>n2(qn(l.qty)*(+l.supplyRate||0));
woInst  =l=>n2(qn(l.qty)*(+l.instRate||0));
woLineTot=l=>n2(woSupply(l)+woInst(l));
boqLineValue=function(l){
  const q=qn(sanctionOf(l));
  const s=q*(+l.supplyRate||0), i=q*(+l.instRate||0);
  return {supply:s,inst:i,base:s+i,gst:s*(+l.supplyGst||0)/100+i*(+l.instGst||0)/100};
};
childBoqQty=(r,l)=>isRA(l.boqQty)?RA:n2((+r.itemQty||0)*qn(l.boqQty));
childEstQty=function(r,l,lid){
  if(r.estManual)return isRA(r.est)?RA:n2(qn(r.est));
  const h=bqHead(lid).estQty;
  return isRA(h)?RA:n2((+r.itemQty||0)*qn(h));
};

/* ---------- sanction, estimate, variation ---------- */
/* An amendment document may be the old single-line shape or the new
   multi-line one; both are read, so nothing already recorded is lost. */
function amdLines(a){
  if(a.lines&&a.lines.length)return a.lines;
  if(a.line)return [{line:a.line,fromQty:a.fromQty,toQty:a.toQty,addQty:n2(qn(a.toQty)-qn(a.fromQty))}];
  return [];
}
function amdFor(lineId){
  return (DB.amendments||[]).filter(a=>isApproved(a)&&amdLines(a).some(x=>x.line===lineId))
    .sort((a,b)=>String(a.date).localeCompare(String(b.date)));
}
/* the sanctioned quantity: the BOQ quantity as approved amendments left it */
function sanctionOf(l){
  let q=l.boqQty;
  amdFor(l.id).forEach(a=>{const x=amdLines(a).find(y=>y.line===l.id);if(x&&x.toQty!==undefined)q=x.toQty});
  return q;
}
/* the estimate in force, which amendments move alongside the sanction */
function estQtyOf(l){
  if(l.estQty==null&&!amdFor(l.id).length)return null;
  let e=l.estQty;
  amdFor(l.id).forEach(a=>{const x=amdLines(a).find(y=>y.line===l.id);
    if(x&&x.toEst!==undefined&&x.toEst!==null)e=x.toEst});
  return e;
}
function boqOfLine(l){return DB.boqs.find(b=>(b.lines||[]).some(x=>x.id===l.id))}
/* committed = indented, pending indents included */
function committedQty(b,l){return n2(indentedQty(b.id,l.id)+requestedQty(b.id,l.id))}
/* variation = what is committed beyond what is sanctioned.
   On an RA line nothing is sanctioned, so all of it is variation. */
function variationOf(b,l){
  if(!b)return 0;
  const s=sanctionOf(l),c=committedQty(b,l);
  return isRA(s)?c:n2(Math.max(0,c-qn(s)));
}

/* the old names, kept working, now reading the derived model */
amendedQty=function(l){return qn(sanctionOf(l))};
varQty=function(l){const b=boqOfLine(l);return b?variationOf(b,l):0};
estOf=function(l){const e=estQtyOf(l);return isRA(e)?RA:n2(qn(e))};
capQty=function(l){const e=estQtyOf(l);return e==null?sanctionOf(l):(isRA(e)?RA:n2(qn(e)))};

/* ---------- what may be indented ---------- */
/* RA has no ceiling, unless the BOQ is a hard stop — in which case
   nothing uncommitted may go out at all, and RA is uncommitted by
   definition, so the line is blocked until it has been amended into
   a real quantity. */
allowedQty=function(b,l){
  const cap=capQty(l), p=overPolicy(b);
  if(isRA(cap))return p.allow?Infinity:0;
  const est=qn(cap);
  if(estQtyOf(l)==null)return est;
  if(!p.allow)return est;
  return p.pct>0?n2(est*(1+p.pct/100)):Infinity;
};
estBal=function(b,l){
  const cap=capQty(l);
  if(isRA(cap))return Infinity;
  return n2(qn(cap)-committedQty(b,l));
};
overRun=function(b,l){
  const cap=capQty(l);
  if(isRA(cap)){const c=committedQty(b,l);return {qty:c,pct:0,used:c,est:RA,ra:true}}
  const est=qn(cap);if(!est)return {qty:0,pct:0,used:committedQty(b,l),est:0};
  const used=committedQty(b,l), over=n2(used-est);
  return {qty:over>0.0001?over:0,pct:over>0?n2(over/est*100):0,used,est};
};
boqOverLines=function(b){
  return (b.kind==='BOQ'?b.lines:[]).filter(l=>overRun(b,l).qty>0);
};
boqState=function(b){
  if(b.status!=='LOCKED')return {tag:'DRAFT',cls:'warn',text:'Draft'};
  const over=boqOverLines(b);
  if(!over.length)return {tag:'LOCKED',cls:'ok',text:'Locked'};
  const ra=over.filter(l=>isRA(capQty(l)));
  const num=over.filter(l=>!isRA(capQty(l)));
  const worst=num.reduce((a,l)=>Math.max(a,overRun(b,l).pct),0);
  return {tag:'AMEND',cls:'bad',over,
    text:num.length?`▲ Amendment due · ${worst.toFixed(1)}% over`
                   :`▲ Amendment due · ${ra.length} RA line(s) indented`};
};
/* a work order line is prepared once it has items and an estimate —
   and RA is an estimate, it just is not a number */
bqCover=function(l){
  const rows=bqRows(l.id).filter(r=>r.prod&&+r.itemQty>0);
  const h=bqHead(l.id).estQty;
  return {rows:rows.length,done:rows.length>0&&(isRA(h)||qn(h)>0)};
};

/* ---------- the entry boxes ---------- */
nsSet=function(i,f,v,text){
  NS.lines[i][f]=(f==='name'||f==='uom')?v:(f==='qty'?qparse(v):(v===''?0:+v));
  if(!text)nsTot(i);else nsTot(i,true);
};
bqSet=function(lid,j,f,v){
  const r=BQ.splits[lid][j],l=bqWo().lines.find(x=>x.id===lid),k=lid+'_'+j;
  if(f==='make'){r.make=v;bqPersist();return}
  if(f==='est'){r.estManual=true;r.est=qparse(v);return}
  r.itemQty=v===''?0:+v;
  const q=document.getElementById('bq_bq_'+k);if(q)q.innerHTML=qshow(childBoqQty(r,l));
  if(!r.estManual){const e=document.getElementById('bq_es_'+k);if(e)e.value=raIn(childEstQty(r,l,lid))}
};
bqHeadEst=function(lid,v){
  bqHead(lid).estQty=qparse(v);
  const l=bqWo().lines.find(x=>x.id===lid);
  bqRows(lid).forEach((r,j)=>{if(!r.estManual){
    const e=document.getElementById('bq_es_'+lid+'_'+j);if(e)e.value=raIn(childEstQty(r,l,lid))}});
};

/* ---------- the indent sheet, now RA-aware ---------- */
inRow=function(b,l,w,n){
  const cap=capQty(l), used=committedQty(b,l);
  const p=prod(l.prod)||{};
  return {line:l, id:l.id, sno:String(l.sno||n), code:p.code||'',
    name:lineName(l), uom:l.uom||p.uom||'', make:l.make||'',
    wo:w?((w.sno?w.sno+' · ':'')+(w.name||lineName(w))):'',
    estimated:l.estQty!=null, ra:isRA(cap),
    boqQty:sanctionOf(l), est:cap, used, variation:variationOf(b,l),
    free:isRA(cap)?Infinity:n2(qn(cap)-used)};
};
inSetQty=function(lineId,v,quiet){
  const b=matBoq(TMP.site),l=b.lines.find(x=>x.id===lineId);
  if(!l)return {ok:false};
  const pol=overPolicy(b), ceiling=allowedQty(b,l), free=estBal(b,l);
  let q=qn(qparse(v)); if(!isFinite(q)||q<0)q=0;
  let capped=0;
  if(ceiling!==Infinity){
    const bal=Math.max(0,boqBal(b,l));
    if(q>bal){
      capped=n2(q-bal); q=bal;
      if(!quiet)toast(isRA(capQty(l))
        ? 'This is an RA line and the BOQ is a hard stop — it has to be amended to a quantity before anything can be indented'
        : (q<=0?(pol.allow?`Nothing left on this line — it is already at the ${pol.pct}% ceiling`
                          :'Nothing left on this line — the estimate is a hard stop on this BOQ')
               :(pol.allow?`Capped at ${qty(q)} — ${pol.pct}% over the estimate is the ceiling`
                          :`Capped at ${qty(q)} — the estimate is a hard stop on this BOQ`)),'bad');
    }
  }
  let t=TMP.lines.find(x=>x.boqLine===lineId);
  if(q<=0){
    if(t)TMP.lines=TMP.lines.filter(x=>x!==t);
    return {ok:true,removed:!!t,qty:0,capped};
  }
  if(!t){t={id:uid('L'),boqLine:lineId,woLine:l.woLine||l.id,prod:l.prod,make:l.make||'',qty:0,overQty:0,remark:''};
    TMP.lines.push(t);}
  t.qty=q;
  /* on an RA line the whole quantity is variation; elsewhere only the
     part past the estimate is */
  t.overQty=isRA(capQty(l))?q:Math.max(0,n2(q-free));
  t.ra=isRA(capQty(l))||undefined;
  const ord={};b.lines.forEach((x,i)=>ord[x.id]=i);
  TMP.lines.sort((a,c)=>(ord[a.boqLine]||0)-(ord[c.boqLine]||0));
  return {ok:true,qty:q,over:t.overQty,capped};
};

/* ============================================================
   THE AMENDMENT, ON THE SAME SHEET
   ============================================================ */
let AM={};
const amdAdd=lid=>AM.q&&AM.q[lid]!==undefined?AM.q[lid]:'';
/* what a line becomes if this amendment is approved */
function amdPreview(b,l){
  const from=sanctionOf(l), raw=amdAdd(l.id);
  const typed=String(raw).trim();
  const has=typed!=='';
  const A=has?qparse(typed):null;
  let to=from;
  if(has){
    /* RA is replaced by what was typed; a number is moved by it */
    if(isRA(from))to=A;
    else if(isRA(A))to=RA;
    else to=n2(qn(from)+qn(A));
  }
  const committed=committedQty(b,l);
  const varNow=isRA(from)?committed:n2(Math.max(0,committed-qn(from)));
  const varThen=isRA(to)?committed:n2(Math.max(0,committed-qn(to)));
  /* the estimate travels with the sanction: replaced on an RA line,
     moved by the same amount on a numbered one */
  const eFrom=estQtyOf(l);
  let eTo=eFrom;
  if(has&&eFrom!=null){
    if(isRA(eFrom))eTo=A;
    else if(isRA(A))eTo=RA;
    else eTo=n2(qn(eFrom)+qn(A));
  }
  return {from,to,add:A,has,committed,varNow,varThen,eFrom,eTo,
    changed:has&&String(to)!==String(from)};
}
function amdSet(lid,v){
  AM.q=AM.q||{};
  if(String(v).trim()==='')delete AM.q[lid];else AM.q[lid]=v;
  amdDraw();
}
function amdDraw(){
  const b=DB.boqs.find(x=>x.id===AM.boq),el=document.getElementById('am_lines');if(!el)return;
  const q=(AM.filter||'').toLowerCase().trim();
  const rows=inRowsOf(b);
  const match=r=>!q||[r.sno,r.code,r.name,r.make,r.wo].join(' ').toLowerCase().includes(q);
  let body='',changed=0,blocked=[];
  for(let i=0;i<rows.length;i++){
    const r=rows[i];
    if(r.group){
      let any=false;
      for(let j=i+1;j<rows.length&&!rows[j].group;j++)if(match(rows[j]))any=true;
      if(!any)continue;
      body+=`<tr style="background:var(--line-2)"><td class="sn"><b>${esc(r.sno)}</b></td>
        <td colspan="2"><b>${esc(r.name)}</b><small>work order line</small></td>
        <td class="rt mono">${qshow(r.boqQty)}</td><td colspan="5"></td></tr>`;
      continue;
    }
    if(!match(r))continue;
    const l=r.line, p=amdPreview(b,l);
    if(p.changed)changed++;
    /* a reduction below what is already committed is allowed — it just
       turns the difference into variation, and we say so out loud */
    const makesVar=p.changed&&p.varThen>p.varNow;
    const clears=p.changed&&p.varThen<p.varNow;
    body+=`<tr ${p.changed?`style="box-shadow:inset 3px 0 0 var(--${makesVar?'bad':'ok'})"`:''}>
      <td class="sn">${esc(r.sno)}</td>
      <td class="mono">${esc(r.code||'—')}</td>
      <td>${esc(r.name)}${r.make?`<small>${esc(r.make)}</small>`:''}</td>
      <td class="rt mono">${qshow(p.from)}</td>
      <td class="rt mono">${qty(p.committed)}</td>
      <td class="rt mono" style="color:${p.varNow>0?'var(--bad)':'var(--muted)'}">${p.varNow?qty(p.varNow):'—'}</td>
      <td><input class="inp rt" style="width:104px" inputmode="text"
            placeholder="${isRA(p.from)?'set a qty':'+ / −'}" value="${esc(String(amdAdd(l.id)))}"
            title="${isRA(p.from)?'this line is RA — what you type replaces it':'added to the present quantity; type a minus to reduce it'}"
            onchange="amdSet('${l.id}',this.value)"></td>
      <td class="rt mono">${p.changed?`<b>${qshow(p.to)}</b>`:'<span style="color:var(--muted)">—</span>'}</td>
      <td>${!p.changed?''
        :makesVar?`<span class="tag bad">leaves ${qty(p.varThen)} as variation</span>`
        :clears?`<span class="tag ok">clears ${qty(n2(p.varNow-p.varThen))} of variation</span>`
        :`<span class="tag">${isRA(p.from)?'RA becomes a quantity':'quantity revised'}</span>`}</td></tr>`;
  }
  el.innerHTML=`<div class="pad" style="display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--line)">
      <input class="inp" id="am_q" placeholder="Find a line" style="max-width:280px" value="${esc(AM.filter||'')}"
        oninput="AM.filter=this.value;amdDraw();document.getElementById('am_q').focus()">
      <div class="sp"></div><span style="color:var(--muted)"><b>${changed}</b> line(s) amended</span></div>
    <div class="tw" style="max-height:52vh;overflow:auto"><table>
      <thead><tr><th>Sl No</th><th>Item Code</th><th style="min-width:210px">Description</th>
        <th class="rt">Now</th><th class="rt">Indented</th><th class="rt">Variation</th>
        <th class="rt">Amend by</th><th class="rt">Becomes</th><th>Effect</th></tr></thead>
      <tbody>${body}</tbody></table></div>`;

/* the work order group row must carry RA through too — building it
   with (+w.boqQty||0) turned every rate-only line into a zero */
inRowsOf=function(b){
  const wo=(b.kind==='BOQ'&&b.wo)?DB.boqs.find(x=>x.id===b.wo):null;
  const out=[];let n=0;
  const push=(l,w)=>{n++;out.push(inRow(b,l,w,n))};
  if(wo){
    wo.lines.forEach((w,i)=>{
      const kids=b.lines.filter(x=>x.woLine===w.id);
      if(!kids.length)return;
      out.push({group:true,sno:String(w.sno||i+1),name:w.name||lineName(w),
        uom:w.uom||'',boqQty:isRA(w.boqQty)?RA:n2(qn(w.boqQty)),kids:kids.length});
      kids.forEach(l=>push(l,w));
    });
    b.lines.filter(l=>!wo.lines.some(w=>w.id===l.woLine)).forEach(l=>push(l,null));
  } else b.lines.forEach(l=>push(l,null));
  return out;
};

            placeholder="${isRA(p.from)?'set a qty':'+ / −'}" value="${esc(String(amdAdd(l.id)))}"

          :makesVar?`<span class="tag bad">leaves ${qty(p.varThen)} as variation</span>`
          :clears?`<span class="tag ok">clears ${qty(n2(p.varNow-p.varThen))} of variation</span>`
          :`<span class="tag">${isRA(p.from)?'RA becomes a quantity':'quantity revised'}</span>`}</td>`:''}
    </tr>`;
  }

  el.innerHTML=`<div class="pad" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line)">

    </div>
