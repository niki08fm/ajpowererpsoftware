PAGES.grn=()=>{
  if(canEdit('grn'))document.getElementById('pgActions').innerHTML=`<button class="btn pri" onclick="grnSheet()">＋ Receive against PO</button>`;
  const rows=scoped(DB.grns).map(g=>{const p=DB.pos.find(x=>x.id===g.po);
    return `<tr><td><b>${esc(g.no)}</b><small class="mono">Inv ${esc(g.inv)}</small></td>
      <td>${esc(p?p.no:'—')}<small>${esc(sup(g.sup).name)}</small></td><td>${esc(site(g.toSite).name)}</td>
      <td>${dmy(g.date)}</td><td class="rt mono">${qty(g.lines.reduce((a,l)=>a+ +l.qty,0))}</td>
      <td class="rt mono">${money(g.lines.reduce((a,l)=>a+l.qty*l.rate,0))}</td>
      <td class="rt"><button class="btn sm" onclick="grnView('${g.id}')">Open</button></td></tr>`}).join('');
  const open=scoped(DB.pos).filter(p=>isApproved(p)&&p.lines.some(l=>grnQtyOfPoLine(p.id,l.id)<+l.qty));
  return viewBanner('grn')+`<div class="banner info">↓ <div>Only approved POs appear, and only their unreceived balance. Short delivery is normal — the PO simply stays open until it's filled or force-closed.</div></div>
    ${open.length?`<div class="card" style="margin-bottom:14px"><header><h3>Awaiting delivery</h3><p>${open.length} approved PO(s) not fully received</p></header>
      <div class="tw"><table><thead><tr><th>PO</th><th>Supplier</th><th>Due</th><th class="rt">Ordered</th><th class="rt">Received</th><th></th></tr></thead><tbody>
      ${open.map(p=>{const o=p.lines.reduce((a,l)=>a+ +l.qty,0),g=p.lines.reduce((a,l)=>a+grnQtyOfPoLine(p.id,l.id),0);
        const late=p.due<today();
        return `<tr><td><b>${esc(p.no)}</b></td><td>${esc(sup(p.sup).name)}</td>
          <td>${dmy(p.due)} ${late?'<span class="tag bad">overdue</span>':''}</td>
          <td class="rt mono">${qty(o)}</td><td class="rt mono">${qty(g)}</td>
          <td class="rt">${canEdit('grn')?`<button class="btn sm pri" onclick="grnSheet('${p.id}')">Receive</button>`:''}</td></tr>`}).join('')}
      </tbody></table></div></div>`:''}
    ${tableCard('Goods receipts','',['GRN','Against','Store / site','Date',{t:'Qty',r:1},{t:'Value',r:1},{t:'',r:1}],rows)}`;
};
function poBal(poId,lineId){const p=DB.pos.find(x=>x.id===poId);const l=p.lines.find(x=>x.id===lineId);
  return n2(+l.qty-grnQtyOfPoLine(poId,lineId))}
function grnSheet(poId){
  const pos=scoped(DB.pos).filter(p=>isApproved(p)&&p.lines.some(l=>poBal(p.id,l.id)>0));
  if(!pos.length)return toast('Nothing pending receipt','bad');
  TMP={po:poId||pos[0].id,lines:[]};
  grnFill();
  Sheet.open('Goods receipt','Received quantity can\'t exceed the ordered balance',
    `<div class="row2">${field('Purchase order',sel('g_p',pos.map(p=>({v:p.id,t:p.no+' — '+sup(p.sup).name})),TMP.po,`onchange="TMP.po=this.value;grnFill();grnDraw()"`))}
      ${field('Receipt date',txt('g_d',today(),'date'))}</div>
     <div class="row2">${field('Supplier invoice no.',txt('g_inv','','text','placeholder="as printed on the invoice"'))}
      ${field('Invoice date',txt('g_id',today(),'date'))}</div>
     <div class="card"><header><h3>Lines</h3><p id="g_hint"></p></header><div id="g_lines"></div></div>`,
    `<button class="btn" onclick="Sheet.close()">Cancel</button><button class="btn pri" onclick="saveGrn()">Post receipt</button>`);
  grnDraw();
}
function grnFill(){const p=DB.pos.find(x=>x.id===TMP.po);
  TMP.lines=p.lines.filter(l=>poBal(p.id,l.id)>0).map(l=>({poLine:l.id,prod:l.prod,make:l.make,rate:l.rate,gst:l.gst,qty:poBal(p.id,l.id)}));}
function grnSet(i,v){const p=DB.pos.find(x=>x.id===TMP.po);const max=poBal(p.id,TMP.lines[i].poLine);
  let q=+v;if(q>max){q=max;toast(`Capped at the ordered balance of ${qty(max)}`,'bad')}TMP.lines[i].qty=q;grnDraw()}
function grnDraw(){
  const el=document.getElementById('g_lines');if(!el)return;
  const p=DB.pos.find(x=>x.id===TMP.po);
  const h=document.getElementById('g_hint');if(h)h.textContent=`Delivering to ${site(p.site).name} · rate locked to the PO`;
  if(!TMP.lines.length){el.innerHTML=emptyBox('Fully received','This PO has nothing left to receive.');return}
  el.innerHTML=`<div class="tw"><table><thead><tr><th>Item</th><th class="rt">Ordered</th><th class="rt">Balance</th>
    <th class="rt">Receiving</th><th class="rt">Rate</th><th class="rt">Value</th></tr></thead><tbody>${
    TMP.lines.map((t,i)=>{const l=p.lines.find(x=>x.id===t.poLine);
      return `<tr><td>${esc(pname(t.prod))}<small>${esc(t.make)}</small></td><td class="rt mono">${qty(l.qty)}</td>
        <td class="rt mono">${qty(poBal(p.id,t.poLine))}</td>
        <td>${txt('gl_q'+i,t.qty,'number',`onchange="grnSet(${i},this.value)" style="width:92px"`)}</td>
        <td class="rt mono">${money(t.rate)}</td><td class="rt mono">${money(t.qty*t.rate)}</td></tr>`}).join('')
  }</tbody></table></div>`;
}
function saveGrn(){
  const p=DB.pos.find(x=>x.id===TMP.po);
  const lines=TMP.lines.filter(l=>+l.qty>0);
  if(!lines.length)return toast('Enter what actually arrived','bad');
  if(!V('g_inv'))return toast('The supplier invoice number is needed','bad');
  const g={id:uid('GRN'),by:DB.session.user,no:doc(DB,'GRN'),date:V('g_d'),inv:V('g_inv'),invDate:V('g_id'),po:p.id,sup:p.sup,
    toSite:p.site,branch:p.branch,lines};
  DB.grns.push(g);log('GRN',g.no,'Posted against '+p.no,sup(p.sup).name);save();Sheet.close();
  toast('Received — stock updated at '+site(p.site).name,'ok');render();
}
function grnView(id){
  const g=DB.grns.find(x=>x.id===id);const p=DB.pos.find(x=>x.id===g.po);
  Sheet.open(g.no,`${sup(g.sup).name} · invoice ${g.inv}`,
    `<div class="card"><div class="tw"><table><thead><tr><th>Item</th><th class="rt">Received</th><th class="rt">Rate</th><th class="rt">Value</th></tr></thead>
      <tbody>${g.lines.map(l=>`<tr><td>${esc(lineName(l))}<small>${esc(l.make)}</small></td>
      <td class="rt mono">${qty(l.qty)}</td><td class="rt mono">${money(l.rate)}</td><td class="rt mono">${money(l.qty*l.rate)}</td></tr>`).join('')}</tbody></table></div></div>`);
}

/* ================= ISSUE / CHALLAN ================= */
PAGES.issue=()=>{
  if(canEdit('issue'))document.getElementById('pgActions').innerHTML=`<button class="btn pri" onclick="issueSheet()">＋ Issue to site</button>`;
  const rows=scoped(DB.issues).map(i=>`<tr><td><b>${esc(i.no)}</b></td>
    <td>${esc(site(i.fromSite).name)}</td><td>${esc(site(i.toSite).name)}</td><td>${dmy(i.date)}</td>
    <td class="rt mono">${qty(i.lines.reduce((a,l)=>a+ +l.qty,0))}</td>
    <td>${i.status==='RECEIVED'?'<span class="tag ok">Received at site</span>':'<span class="tag warn">In transit</span>'}</td>
    <td class="rt">${i.status==='DISPATCHED'&&(canEdit('issue')||canEdit('consume'))?`<button class="btn sm pri" onclick="ackSheet('issue','${i.id}')">Acknowledge</button>`:''}
      <button class="btn sm" onclick="issueView('${i.id}')">Open</button></td></tr>`).join('');
  const t=inTransit();
  return viewBanner('issue')+`<div class="banner info">⇉ <div>Material leaves the store immediately but only lands in site stock when the site acknowledges. The gap is <b>in transit</b> — the legacy build called it <span class="mono">virtual_po_in/out</span>.</div></div>
    ${t.length?`<div class="card" style="margin-bottom:14px"><header><h3>In transit</h3><p>Dispatched, not yet acknowledged</p></header>
      <div class="tw"><table><thead><tr><th>Challan</th><th>To</th><th>Item</th><th class="rt">Qty</th></tr></thead><tbody>
      ${t.map(x=>`<tr><td>${esc(x.issue.no)}</td><td>${esc(site(x.issue.toSite).name)}</td><td>${esc(lineName(x))}</td><td class="rt mono">${qty(x.qty)}</td></tr>`).join('')}
      </tbody></table></div></div>`:''}
    ${tableCard('Issue challans','',['Challan','From','To','Date',{t:'Qty',r:1},'Status',{t:'',r:1}],rows)}`;
};
function issueSheet(){
  const stores=scoped(DB.sites).filter(s=>stockRows().some(r=>r.site===s.id&&r.bal>0));
  if(!stores.length)return toast('No stock anywhere to issue','bad');
  const sites=liveSites();
  TMP={from:stores[0].id,lines:[]};
  Sheet.open('Issue to site','Quantity capped at what the store actually holds',
    `<div class="row3">${field('From',sel('is_f',stores.map(s=>({v:s.id,t:s.name})),'',`onchange="TMP.from=this.value;TMP.lines=[];issueDraw()"`))}
      ${field('To site',sel('is_t',sites.map(s=>({v:s.id,t:s.name}))))}${field('Date',txt('is_d',today(),'date'))}</div>
     <div class="card"><header><div><h3>Lines</h3></div><div class="sp"></div>
       <button class="btn sm pri" onclick="issueAdd()">＋ Add line</button></header><div id="is_lines"></div></div>`,
    `<button class="btn" onclick="Sheet.close()">Cancel</button><button class="btn pri" onclick="saveIssue()">Dispatch</button>`);
  issueDraw();
}
function storeStock(){return stockRows().filter(r=>r.site===TMP.from&&r.bal>0)}
function issueAdd(){
  const s=storeStock().filter(r=>!TMP.lines.some(t=>t.prod===r.prod&&t.make===r.make));
  if(!s.length)return toast('Everything in this store is already on the challan','bad');
  TMP.lines.push({prod:s[0].prod,make:s[0].make,qty:0});issueDraw();
}
function issueSet(i,f,v){
  if(f==='key'){const [p,m]=v.split('||');TMP.lines[i].prod=p;TMP.lines[i].make=m;TMP.lines[i].qty=0;issueDraw();return}
  const max=stockAt(TMP.from,TMP.lines[i].prod,TMP.lines[i].make);let q=+v;
  if(q>max){q=max;toast(`Only ${qty(max)} in the store`,'bad')}TMP.lines[i].qty=q;issueDraw();
}
function issueDraw(){
  const el=document.getElementById('is_lines');if(!el)return;
  const av=storeStock();
  if(!av.length){el.innerHTML=emptyBox('Store is empty','Receive material against a PO first.');return}
  if(!TMP.lines.length){el.innerHTML=emptyBox('No lines yet','Add what is going to site.');return}
  el.innerHTML=`<div class="tw"><table><thead><tr><th style="min-width:240px">Item</th><th class="rt">In store</th><th class="rt">Issue qty</th><th></th></tr></thead><tbody>${
    TMP.lines.map((t,i)=>`<tr><td>${sel('sl_p'+i,av.map(r=>({v:r.prod+'||'+r.make,t:pname(r.prod)+' · '+r.make})),t.prod+'||'+t.make,`onchange="issueSet(${i},'key',this.value)"`)}</td>
      <td class="rt mono">${qty(stockAt(TMP.from,t.prod,t.make))}</td>
      <td>${txt('sl_q'+i,t.qty,'number',`onchange="issueSet(${i},'qty',this.value)" style="width:92px"`)}</td>
      <td><button class="btn sm bad" onclick="TMP.lines.splice(${i},1);issueDraw()">✕</button></td></tr>`).join('')
  }</tbody></table></div>`;
}
function saveIssue(){
  const lines=TMP.lines.filter(l=>+l.qty>0);if(!lines.length)return toast('Enter a quantity','bad');
  const from=site(TMP.from),to=site(V('is_t'));
  const i={id:uid('DC'),by:DB.session.user,no:doc(DB,'DC'),date:V('is_d'),fromSite:from.id,toSite:to.id,branch:from.branch,lines,status:'DISPATCHED'};
  DB.issues.push(i);log('ISSUE',i.no,'Dispatched to '+to.name,'');save();Sheet.close();toast('Dispatched — in transit until the site acknowledges','ok');render();
}
function ackIssue(id){const i=DB.issues.find(x=>x.id===id);i.status='RECEIVED';i.recvDate=today();
  const n=i.lines.reduce((a,l)=>a+ +l.qty,0);
  log('ISSUE',i.no,'Acknowledged at '+site(i.toSite).name,qty(n)+' units into site stock');save();
  toast(`${qty(n)} units now in ${site(i.toSite).name} stock — ready to consume`,'ok');render()}
function issueView(id){const i=DB.issues.find(x=>x.id===id);
  Sheet.open(i.no,`${site(i.fromSite).name} → ${site(i.toSite).name}`,
    `<div class="card"><div class="tw"><table><thead><tr><th>Item</th><th class="rt">Qty</th></tr></thead><tbody>
    ${i.lines.map(l=>`<tr><td>${esc(lineName(l))}<small>${esc(l.make)}</small></td><td class="rt mono">${qty(l.qty)}</td></tr>`).join('')}
    </tbody></table></div></div>`);
}

/* ================= CONSUMPTION ================= */
PAGES.consume=()=>{
  if(canEdit('consume'))document.getElementById('pgActions').innerHTML=`<button class="btn pri" onclick="consumeSheet()">＋ Book consumption</button>`;
  const rows=scoped(DB.consumes).map(c=>`<tr><td><b>${esc(c.no)}</b><small>${esc(c.location||'')}</small></td>
    <td>${esc(site(c.site).name)}</td><td>${dmy(c.date)}</td>
    <td class="rt mono">${qty(c.lines.reduce((a,l)=>a+ +l.qty,0))}</td>
    <td class="rt mono">${money(c.lines.reduce((a,l)=>a+l.qty*lastRate(l.prod,l.make),0))}</td>
    <td class="rt"><button class="btn sm" onclick="consumeView('${c.id}')">Open</button></td></tr>`).join('');
  return viewBanner('consume')+`<div class="banner info">◍ <div>This is where cost is recognised. Material sitting in stock is not a cost yet — consumption booked against a BOQ line is. That's what makes the P&L honest.</div></div>
  ${tableCard('Consumption','',['Entry','Site','Date',{t:'Qty',r:1},{t:'Cost booked',r:1},{t:'',r:1}],rows)}`;
};
function consumeSheet(){
  const sites=liveSites().filter(s=>stockRows().some(r=>r.site===s.id&&r.bal>0));
  if(!sites.length)return toast('No site holds stock yet — issue material first','bad');
  TMP={site:sites[0].id,lines:[]};
  Sheet.open('Book consumption','Against site stock, booked to a BOQ line',
    `<div class="row3">${field('Site',sel('cs_s',sites.map(s=>({v:s.id,t:s.name})),'',`onchange="TMP.site=this.value;TMP.lines=[];consumeDraw()"`))}
      ${field('Date',txt('cs_d',today(),'date'))}${field('Location / floor',txt('cs_l','','text','placeholder="e.g. Block C, 4th floor"'))}</div>
     <div class="card"><header><div><h3>Lines</h3></div><div class="sp"></div>
       <button class="btn sm pri" onclick="consumeAdd()">＋ Add line</button></header><div id="cs_lines"></div></div>`,
    `<button class="btn" onclick="Sheet.close()">Cancel</button><button class="btn pri" onclick="saveConsume()">Book consumption</button>`);
  consumeDraw();
}
function siteStock(){return stockRows().filter(r=>r.site===TMP.site&&r.bal>0)}
function consumeAdd(){
  const s=siteStock().filter(r=>!TMP.lines.some(t=>t.prod===r.prod&&t.make===r.make));
  if(!s.length)return toast('Everything at site is already on this entry','bad');
  const b=boqOf(TMP.site);const bl=b?(b.lines.find(l=>l.prod===s[0].prod)||b.lines[0]):null;
  TMP.lines.push({prod:s[0].prod,make:s[0].make,qty:0,boqLine:bl?bl.id:''});consumeDraw();
}
function consumeSet(i,f,v){
  if(f==='key'){const [p,m]=v.split('||');const b=boqOf(TMP.site);
    const bl=b?(b.lines.find(l=>l.prod===p)||b.lines[0]):null;
    Object.assign(TMP.lines[i],{prod:p,make:m,qty:0,boqLine:bl?bl.id:''});consumeDraw();return}
  if(f==='boqLine'){TMP.lines[i].boqLine=v;return}
  const max=stockAt(TMP.site,TMP.lines[i].prod,TMP.lines[i].make);let q=+v;
  if(q>max){q=max;toast(`Only ${qty(max)} at site`,'bad')}TMP.lines[i].qty=q;consumeDraw();
}
function consumeDraw(){
  const el=document.getElementById('cs_lines');if(!el)return;
  const av=siteStock(),b=boqOf(TMP.site);
  if(!av.length){el.innerHTML=emptyBox('No stock at this site','Issue material from the store first.');return}
  if(!TMP.lines.length){el.innerHTML=emptyBox('No lines yet','Add what was used.');return}
  el.innerHTML=`<div class="tw"><table><thead><tr><th style="min-width:220px">Item</th><th class="rt">At site</th>
    <th class="rt">Used</th><th style="min-width:200px">Book to BOQ line</th><th class="rt">Cost</th><th></th></tr></thead><tbody>${
    TMP.lines.map((t,i)=>`<tr><td>${sel('cl_p'+i,av.map(r=>({v:r.prod+'||'+r.make,t:pname(r.prod)+' · '+r.make})),t.prod+'||'+t.make,`onchange="consumeSet(${i},'key',this.value)"`)}</td>
      <td class="rt mono">${qty(stockAt(TMP.site,t.prod,t.make))}</td>
      <td>${txt('cl_q'+i,t.qty,'number',`onchange="consumeSet(${i},'qty',this.value)" style="width:88px"`)}</td>
      <td>${b?sel('cl_b'+i,b.lines.map(l=>({v:l.id,t:lineName(l)+' · '+l.work})),t.boqLine,`onchange="consumeSet(${i},'boqLine',this.value)"`):'<span class="tag">no BOQ</span>'}</td>
      <td class="rt mono">${money(t.qty*lastRate(t.prod,t.make))}</td>
      <td><button class="btn sm bad" onclick="TMP.lines.splice(${i},1);consumeDraw()">✕</button></td></tr>`).join('')
  }</tbody></table></div>`;
}
function saveConsume(){
  const lines=TMP.lines.filter(l=>+l.qty>0);if(!lines.length)return toast('Enter what was used','bad');
  const s=site(TMP.site);
  const c={id:uid('CN'),by:DB.session.user,no:doc(DB,'CN'),date:V('cs_d'),site:s.id,branch:s.branch,location:V('cs_l'),lines};
  DB.consumes.push(c);log('CONSUME',c.no,'Booked at '+s.name,V('cs_l'));save();Sheet.close();toast('Consumption booked — cost now shows in the P&L','ok');render();
}
function consumeView(id){const c=DB.consumes.find(x=>x.id===id);const b=boqOf(c.site);
  Sheet.open(c.no,`${site(c.site).name} · ${c.location||'—'}`,
    `<div class="card"><div class="tw"><table><thead><tr><th>Item</th><th class="rt">Qty</th><th>BOQ line</th><th class="rt">Cost</th></tr></thead><tbody>
    ${c.lines.map(l=>{const bl=b&&b.lines.find(x=>x.id===l.boqLine);
      return `<tr><td>${esc(lineName(l))}<small>${esc(l.make)}</small></td><td class="rt mono">${qty(l.qty)}</td>
      <td>${bl?esc(pname(bl.prod)+' · '+bl.work):'—'}</td><td class="rt mono">${money(l.qty*lastRate(l.prod,l.make))}</td></tr>`}).join('')}
    </tbody></table></div></div>`);
}

/* ================= STOCK ================= */
PAGES.stock=()=>{
  const rows=stockRows().filter(r=>inScope(r.branch)||inScope(site(r.site).branch)).map(r=>
    `<tr><td>${esc(pname(r.prod))}<small>${esc(r.make)}</small></td><td>${esc(site(r.site).name)}
      <small>${site(r.site).type==='STORE'?'store':'site'}</small></td>
      <td class="rt mono">${qty(r.inQ)}</td><td class="rt mono">${qty(r.outQ)}</td>
      <td class="rt mono"><b>${qty(r.bal)}</b></td>
      <td class="rt mono">${money(r.bal*lastRate(r.prod,r.make))}</td></tr>`).join('');
  const mv=movements().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,25).map(m=>
    `<tr><td>${dmy(m.date)}</td><td><span class="tag ${m.qty>0?'ok':'warn'}">${m.kind}</span> <span class="mono">${esc(m.ref)}</span></td>
      <td>${esc(pname(m.prod))}</td><td>${esc(site(m.site).name)}</td>
      <td class="rt mono" style="color:${m.qty>0?'var(--ok)':'var(--bad)'}">${m.qty>0?'+':''}${qty(m.qty)}</td></tr>`).join('');
  const low=belowMin();
  return viewBanner('stock')+(low.length?`<div class="banner view">⚑ <div><b>${low.length} item${low.length>1?'s':''} below the reorder level.</b>
      ${esc(low.slice(0,3).map(l=>l.p.name+' (short '+qty(l.short)+' '+l.p.uom+')').join('; '))}${low.length>3?' and more':''}</div>
      <button class="btn sm" onclick="location.hash='#indent'">Raise an indent</button></div>`:'')
    +`<div class="banner info">▥ <div>Nothing here is stored — every balance is added up from receipts, issues and consumption each time you open the screen. Two reports can't disagree.</div></div>
    ${tableCard('Stock balance','',['Item','Where',{t:'In',r:1},{t:'Out',r:1},{t:'Balance',r:1},{t:'Value',r:1}],rows)}
    <div style="height:14px"></div>
    ${tableCard('Recent movements','Latest 25',['Date','Movement','Item','Where',{t:'Qty',r:1}],mv)}`;
};

/* ================= SUPPLIER BILLS ================= */
PAGES.supbill=()=>{
  if(canEdit('supbill'))document.getElementById('pgActions').innerHTML=`<button class="btn pri" onclick="sbSheet()">＋ Book supplier bill</button>`;
  const rows=scoped(DB.supbills).map(b=>`<tr><td><b>${esc(b.no)}</b><small class="mono">Inv ${esc(b.inv)}</small></td>
    <td>${esc(sup(b.sup).name)}</td><td>${esc(byId(DB.pos,b.po).no||'')}</td><td>${dmy(b.date)}</td>
    <td class="rt mono">${money(billValue(b))}</td><td>${apprTag(b)}</td>
    <td>${b.paid?'<span class="tag ok">Paid</span>':isApproved(b)?'<span class="tag warn">Due '+dmy(b.due)+'</span>':'<span class="tag">—</span>'}</td>
    <td class="rt">${isApproved(b)&&!b.paid&&canEdit('supbill')?`<button class="btn sm ok" onclick="payBill('${b.id}')">Mark paid</button>`:''}
      <button class="btn sm" onclick="apprSheet('${b.id}')">Open</button></td></tr>`).join('');
  return viewBanner('supbill')+`<div class="banner info">₹ <div>Rate is taken from the PO and can't be edited, and quantity is capped at <b>received − already billed</b>. A supplier can't invoice more than they delivered.</div></div>

function sbSet(i,v){const max=sbBal(TMP.po,TMP.lines[i].poLine);let q=+v;

function sbDraw(){

    TMP.lines.map((t,i)=>`<tr><td>${esc(pname(t.prod))}<small>${esc(t.make)}</small></td>

  }</tbody><tfoot><tr><th colspan="5" class="rt">Bill value incl. GST</th>

}
function saveSb(){

function markRecv(id){const b=DB.clientbills.find(x=>x.id===id);b.received=true;b.recvOn=today();
  log('CLIENTBILL',b.no,'Payment received',money(clientBillValue(b)));save();toast('Marked received','ok');render()}
function cbBal(boqId,lineId,leg){const b=DB.boqs.find(x=>x.id===boqId);const l=b.lines.find(x=>x.id===lineId);
  return n2(amendedQty(l)-clientBilledQty(boqId,lineId,leg))}
function cbSheet(){
  const boqs=scoped(DB.boqs).filter(b=>b.status==='LOCKED'&&b.lines.some(l=>cbBal(b.id,l.id,'sup')>0||cbBal(b.id,l.id,'inst')>0));
  if(!boqs.length)return toast('Nothing left to bill','bad');
  TMP={boq:boqs[0].id,lines:[]};cbFill();
  Sheet.open('Raise RA bill','Measured quantity against the BOQ',
    `<div class="row3">${field('BOQ',sel('cb_b',boqs.map(b=>({v:b.id,t:b.no+' — '+site(b.site).name})),'',`onchange="TMP.boq=this.value;cbFill();cbDraw()"`))}
      ${field('Bill date',txt('cb_d',today(),'date'))}${field('Retention %',txt('cb_r',5,'number'))}</div>
     <div class="card"><header><h3>Measured quantity</h3><p>Rates are the contract rates and can't be changed</p></header><div id="cb_lines"></div></div>`,
    `<button class="btn" onclick="Sheet.close()">Cancel</button><button class="btn pri" onclick="saveCb()">Send for approval</button>`);
  cbDraw();
}
function cbFill(){const b=DB.boqs.find(x=>x.id===TMP.boq);
  TMP.lines=b.lines.map(l=>({boqLine:l.id,prod:l.prod,supplyQty:0,instQty:0,supplyRate:l.supplyRate,instRate:l.instRate||0,gst:l.supplyGst}));}
function cbSet(i,f,v){const l=TMP.lines[i];const leg=f==='supplyQty'?'sup':'inst';
  const max=cbBal(TMP.boq,l.boqLine,leg);let q=+v;
  if(q>max){q=max;toast(`Capped at the BOQ balance of ${qty(max)}`,'bad')}l[f]=q;cbDraw()}
function cbDraw(){
  const el=document.getElementById('cb_lines');if(!el)return;
  const b=DB.boqs.find(x=>x.id===TMP.boq);
  el.innerHTML=`<div class="tw"><table><thead><tr><th style="min-width:180px">Item</th><th class="rt">BOQ</th>
    <th class="rt">Supply bal.</th><th class="rt">Supply now</th><th class="rt">Inst. bal.</th><th class="rt">Inst. now</th><th class="rt">Amount</th></tr></thead><tbody>${
    TMP.lines.map((t,i)=>{const l=b.lines.find(x=>x.id===t.boqLine);
      const amt=(t.supplyQty*t.supplyRate+t.instQty*t.instRate)*(1+t.gst/100);
      return `<tr><td>${esc(pname(t.prod))}<small>${esc(l.work)}</small></td><td class="rt mono">${qty(l.boqQty)}</td>
        <td class="rt mono">${qty(cbBal(b.id,l.id,'sup'))}</td>
        <td>${txt('cbl_s'+i,t.supplyQty,'number',`onchange="cbSet(${i},'supplyQty',this.value)" style="width:84px"`)}</td>
        <td class="rt mono">${qty(cbBal(b.id,l.id,'inst'))}</td>
        <td>${txt('cbl_i'+i,t.instQty,'number',`onchange="cbSet(${i},'instQty',this.value)" style="width:84px"`)}</td>
        <td class="rt mono">${money(amt)}</td></tr>`}).join('')
  }</tbody><tfoot><tr><th colspan="6" class="rt">Bill value incl. GST</th>
    <th class="rt mono">${money(TMP.lines.reduce((a,l)=>a+(l.supplyQty*l.supplyRate+l.instQty*l.instRate)*(1+l.gst/100),0))}</th></tr></tfoot></table></div>`;
}
function saveCb(){
  const lines=TMP.lines.filter(l=>+l.supplyQty>0||+l.instQty>0);
  if(!lines.length)return toast('Measure at least one line','bad');
  const b=DB.boqs.find(x=>x.id===TMP.boq);
  const ra=DB.clientbills.filter(x=>x.boq===b.id).length+1;
  const bill={id:uid('RA'),by:DB.session.user,no:doc(DB,'RA'),ra,date:V('cb_d'),boq:b.id,site:b.site,branch:b.branch,
    retPct:+V('cb_r'),lines,appr:newAppr('CLIENTBILL'),amount:0,retention:0};
  bill.amount=clientBillValue(bill);
  bill.retention=n2(lines.reduce((a,l)=>a+l.supplyQty*l.supplyRate+l.instQty*l.instRate,0)*(+V('cb_r'))/100);
  DB.clientbills.push(bill);log('CLIENTBILL',bill.no,'Raised RA '+ra,site(b.site).name);
  save();Sheet.close();toast('RA bill sent for approval','ok');render();
}

function swoBal(woId,lineIdx){const w=DB.subwos.find(x=>x.id===woId);let b=0;

function sbillSet(i,v){const max=swoBal(TMP.wo,TMP.lines[i].idx);let q=+v;

      const r=scoped(DB.sites).filter(s=>s.type==='SITE').map(s=>{const p=sitePnl(s.id);

/* ============================================================
   CHARTS — hand-drawn SVG, no library, no CDN. Same tokens as
   the rest of the UI so they sit inside the Keka-style cards.
   ============================================================ */
const PAL=['#00877B','#179765','#D58D25','#D74745','#065F74','#7C3AED','#179765','#8F8F97'];
const short=v=>{const a=Math.abs(v);
  if(a>=1e7)return '₹'+(v/1e7).toFixed(2)+' Cr';
  if(a>=1e5)return '₹'+(v/1e5).toFixed(2)+' L';
  if(a>=1e3)return '₹'+(v/1e3).toFixed(1)+'k';return '₹'+Math.round(v)};
function niceMax(v){if(v<=0)return 10;const p=Math.pow(10,Math.floor(Math.log10(v)));const n=v/p;
  return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p}
function svg(w,h,inner,cls){return `<svg viewBox="0 0 ${w} ${h}" class="${cls||''}" style="width:100%;height:auto;display:block" role="img">${inner}</svg>`}
function gridY(x0,x1,y0,y1,max,fmt){
  let g='';for(let i=0;i<=4;i++){const y=y1-(y1-y0)*i/4;const v=max*i/4;
    g+=`<line x1="${x0}" x2="${x1}" y1="${y}" y2="${y}" stroke="var(--line-2)" stroke-width="1"/>
        <text x="${x0-8}" y="${y+4}" text-anchor="end" font-size="10" fill="var(--faint)">${fmt?fmt(v):Math.round(v)}</text>`}
  return g}

/* area / line chart with multiple series */
function cArea(labels,series,opt){
  opt=opt||{};const w=720,h=opt.h||230,x0=64,x1=w-14,y0=16,y1=h-30;
  const max=niceMax(Math.max(1,...series.flatMap(s=>s.data)));
  const X=i=>x0+(x1-x0)*(labels.length<2?.5:i/(labels.length-1));
  const Y=v=>y1-(y1-y0)*(v/max);
  let body=gridY(x0,x1,y0,y1,max,opt.fmt||short);
  series.forEach((s,si)=>{
    const c=s.color||PAL[si];
    const pts=s.data.map((v,i)=>`${X(i)},${Y(v)}`).join(' ');
    body+=`<polygon points="${X(0)},${y1} ${pts} ${X(labels.length-1)},${y1}" fill="${c}" opacity=".08"/>
           <polyline points="${pts}" fill="none" stroke="${c}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
    body+=s.data.map((v,i)=>`<circle cx="${X(i)}" cy="${Y(v)}" r="3.5" fill="#fff" stroke="${c}" stroke-width="2"><title>${s.name} · ${labels[i]}: ${(opt.fmt||short)(v)}</title></circle>`).join('');
  });
  body+=labels.map((l,i)=>`<text x="${X(i)}" y="${h-9}" text-anchor="middle" font-size="10.5" fill="var(--muted)" font-weight="600">${esc(l)}</text>`).join('');
  return svg(w,h,body)+legend(series);
}
/* grouped vertical bars */
function cBars(labels,series,opt){
  opt=opt||{};const w=720,h=opt.h||230,x0=64,x1=w-14,y0=16,y1=h-30;
  const max=niceMax(Math.max(1,...series.flatMap(s=>s.data)));
  const band=(x1-x0)/Math.max(1,labels.length), bw=Math.min(26,(band-10)/series.length);
  const Y=v=>y1-(y1-y0)*(v/max);
  let body=gridY(x0,x1,y0,y1,max,opt.fmt||short);
  series.forEach((s,si)=>{const c=s.color||PAL[si];
    body+=s.data.map((v,i)=>{const x=x0+band*i+band/2-(bw*series.length)/2+bw*si;
      const y=Y(v);return `<rect x="${x}" y="${y}" width="${bw}" height="${Math.max(0,y1-y)}" rx="4" fill="${c}"><title>${s.name} · ${labels[i]}: ${(opt.fmt||short)(v)}</title></rect>`}).join('')});
  body+=labels.map((l,i)=>`<text x="${x0+band*i+band/2}" y="${h-9}" text-anchor="middle" font-size="10.5" fill="var(--muted)" font-weight="600">${esc(l)}</text>`).join('');
  return svg(w,h,body)+legend(series);
}
/* horizontal bars — rankings */
function cHBar(items,opt){
  opt=opt||{};const w=720,rowH=30,h=Math.max(60,items.length*rowH+14),x0=opt.labelW||200,x1=w-90;
  const max=Math.max(1,...items.map(i=>i.value));
  let body='';
  items.forEach((it,i)=>{const y=10+i*rowH,bw=(x1-x0)*(it.value/max);
    body+=`<text x="${x0-10}" y="${y+15}" text-anchor="end" font-size="11.5" fill="var(--ink-2)" font-weight="600">${esc(it.name.length>30?it.name.slice(0,29)+'…':it.name)}</text>
      <rect x="${x0}" y="${y+4}" width="${x1-x0}" height="15" rx="7" fill="var(--line-2)"/>
      <rect x="${x0}" y="${y+4}" width="${Math.max(3,bw)}" height="15" rx="7" fill="${it.color||PAL[i%PAL.length]}"><title>${esc(it.name)}: ${(opt.fmt||short)(it.value)}</title></rect>
      <text x="${x1+8}" y="${y+16}" font-size="11" fill="var(--ink)" font-weight="700">${(opt.fmt||short)(it.value)}</text>`});
  return svg(w,h,body);
}
/* donut with legend */
function cDonut(items,opt){
  opt=opt||{};const size=190,r=72,ir=46,cx=95,cy=95;
  const tot=items.reduce((a,i)=>a+i.value,0)||1;let a0=-Math.PI/2,body='';
  items.forEach((it,i)=>{const a1=a0+2*Math.PI*(it.value/tot);const c=it.color||PAL[i%PAL.length];
    const p=(rr,a)=>`${cx+rr*Math.cos(a)},${cy+rr*Math.sin(a)}`;
    const large=(a1-a0)>Math.PI?1:0;
    body+=`<path d="M ${p(r,a0)} A ${r} ${r} 0 ${large} 1 ${p(r,a1)} L ${p(ir,a1)} A ${ir} ${ir} 0 ${large} 0 ${p(ir,a0)} Z" fill="${c}"><title>${esc(it.name)}: ${(opt.fmt||short)(it.value)} (${Math.round(it.value/tot*100)}%)</title></path>`;
    a0=a1});
  body+=`<text x="${cx}" y="${cy-2}" text-anchor="middle" font-size="15" font-weight="800" fill="var(--ink)">${(opt.fmt||short)(tot)}</text>
         <text x="${cx}" y="${cy+15}" text-anchor="middle" font-size="10" font-weight="700" fill="var(--faint)">${esc(opt.label||'TOTAL')}</text>`;
  const leg=`<div class="chlegend">${items.map((it,i)=>`<span><i style="background:${it.color||PAL[i%PAL.length]}"></i>${esc(it.name)} <b>${Math.round(it.value/tot*100)}%</b></span>`).join('')}</div>`;
  return `<div class="donutwrap">${svg(size,size,body)}${leg}</div>`;
}
/* waterfall — P&L bridge */
function cWaterfall(items,opt){
  opt=opt||{};const w=720,h=opt.h||250,x0=64,x1=w-14,y0=18,y1=h-42;
  let run=0,peak=0;items.forEach(i=>{if(i.total)peak=Math.max(peak,Math.abs(i.value));else{run+=i.value;peak=Math.max(peak,Math.abs(run))}});
  const max=niceMax(peak);const Y=v=>y1-(y1-y0)*(v/max);
  const band=(x1-x0)/items.length,bw=Math.min(58,band-18);
  let body=gridY(x0,x1,y0,y1,max,short);run=0;
  items.forEach((it,i)=>{const x=x0+band*i+band/2-bw/2;
    let top,bot,c;
    if(it.total){top=Y(Math.max(0,it.value));bot=Y(0);c=it.value>=0?'#179765':'#D74745'}
    else{const s=run;run+=it.value;top=Y(Math.max(s,run));bot=Y(Math.min(s,run));c=it.value>=0?(it.color||'#00877B'):'#D74745'}
    body+=`<rect x="${x}" y="${top}" width="${bw}" height="${Math.max(2,bot-top)}" rx="5" fill="${c}" opacity="${it.total?1:.9}"><title>${esc(it.name)}: ${short(it.value)}</title></rect>
      <text x="${x+bw/2}" y="${top-6}" text-anchor="middle" font-size="10.5" font-weight="700" fill="var(--ink)">${short(it.value)}</text>
      <text x="${x+bw/2}" y="${h-22}" text-anchor="middle" font-size="10.5" fill="var(--muted)" font-weight="600">${esc(it.name)}</text>`;
    if(!it.total&&i<items.length-1)body+=`<line x1="${x+bw}" x2="${x0+band*(i+1)+band/2-bw/2}" y1="${Y(run)}" y2="${Y(run)}" stroke="var(--faint)" stroke-dasharray="3 3"/>`;
  });
  return svg(w,h,body);
}
/* funnel — the document spine, by value */
function cFunnel(stages){
  const w=720,rowH=44,h=stages.length*rowH+10,max=Math.max(1,...stages.map(s=>s.value));
  let body='';
  stages.forEach((s,i)=>{const y=6+i*rowH,bw=(w-190)*(s.value/max);
    const drop=i?stages[i-1].value?Math.round((1-s.value/stages[i-1].value)*100):0:0;
    body+=`<text x="150" y="${y+22}" text-anchor="end" font-size="12" font-weight="700" fill="var(--ink-2)">${esc(s.name)}</text>
      <rect x="160" y="${y+6}" width="${Math.max(4,bw)}" height="26" rx="6" fill="${PAL[i%PAL.length]}" opacity="${1-i*0.07}"><title>${esc(s.name)}: ${short(s.value)}</title></rect>
      <text x="${160+Math.max(4,bw)+10}" y="${y+24}" font-size="11.5" font-weight="700" fill="var(--ink)">${short(s.value)}</text>
      ${i&&drop>0?`<text x="${w-8}" y="${y+24}" text-anchor="end" font-size="10.5" font-weight="700" fill="var(--faint)">−${drop}%</text>`:''}`});
  return svg(w,h,body);
}
function legend(series){return `<div class="chlegend">${series.map((s,i)=>`<span><i style="background:${s.color||PAL[i]}"></i>${esc(s.name)}</span>`).join('')}</div>`}
function chartCard(title,sub,body,extra){
  return `<div class="card"><header><div><h3>${title}</h3>${sub?`<p>${sub}</p>`:''}</div><div class="sp"></div>${extra||''}</header><div class="pad">${body}</div></div>`}

/* ---------------- analytics ---------------- */
function lastMonths(n){const out=[],d=new Date();d.setDate(1);
  for(let i=n-1;i>=0;i--){const x=new Date(d.getFullYear(),d.getMonth()-i,1);
    out.push({key:x.toISOString().slice(0,7),label:x.toLocaleDateString('en-IN',{month:'short'})})}
  return out}
const mKey=d=>String(d||'').slice(0,7);
function trend(n){
  const M=lastMonths(n),idx={};M.forEach((m,i)=>idx[m.key]=i);
  const z=()=>M.map(()=>0);
  const billed=z(),cost=z(),purchase=z(),indent=z(),po=z();
  scoped(DB.clientbills).filter(b=>!isRejected(b)).forEach(b=>{const i=idx[mKey(b.date)];if(i!=null)
    billed[i]+=b.lines.reduce((a,l)=>a+(+l.supplyQty||0)*l.supplyRate+(+l.instQty||0)*(+l.instRate||0),0)});
  scoped(DB.consumes).forEach(c=>{const i=idx[mKey(c.date)];if(i!=null)
    cost[i]+=c.lines.reduce((a,l)=>a+l.qty*lastRate(l.prod,l.make),0)});
  scoped(DB.subbills).filter(b=>!isRejected(b)).forEach(b=>{const i=idx[mKey(b.date)];if(i!=null)
    cost[i]+=b.lines.reduce((a,l)=>a+l.qty*l.rate,0)});
  scoped(DB.grns).forEach(g=>{const i=idx[mKey(g.date)];if(i!=null)purchase[i]+=g.lines.reduce((a,l)=>a+l.qty*l.rate,0)});
  scoped(DB.indents).forEach(d=>{const i=idx[mKey(d.date)];if(i!=null)indent[i]+=d.lines.reduce((a,l)=>a+l.qty*(prod(l.prod).rate||0),0)});
  scoped(DB.pos).forEach(p=>{const i=idx[mKey(p.date)];if(i!=null)po[i]+=poBase(p)});
  return {labels:M.map(m=>m.label),billed,cost,purchase,indent,po};
}
function spendByCategory(){
  const m={};scoped(DB.grns).forEach(g=>g.lines.forEach(l=>{
    const c=byId(DB.cats,prod(l.prod).cat).name||'Other';m[c]=(m[c]||0)+l.qty*l.rate}));
  return Object.entries(m).map(([name,value])=>({name,value})).sort((a,b)=>b.value-a.value)}
function topSuppliers(){
  const m={};scoped(DB.grns).forEach(g=>{const n=sup(g.sup).name||'—';
    m[n]=(m[n]||0)+g.lines.reduce((a,l)=>a+l.qty*l.rate,0)});
  return Object.entries(m).map(([name,value])=>({name,value})).sort((a,b)=>b.value-a.value).slice(0,6)}
function funnelStages(){
  let ind=0,po=0,grn=0,sb=0,cn=0;
  scoped(DB.indents).filter(isApproved).forEach(d=>ind+=d.lines.reduce((a,l)=>a+l.qty*(prod(l.prod).rate||0),0));
  scoped(DB.pos).filter(isApproved).forEach(p=>po+=poBase(p));
  scoped(DB.grns).forEach(g=>grn+=g.lines.reduce((a,l)=>a+l.qty*l.rate,0));
  scoped(DB.consumes).forEach(c=>cn+=c.lines.reduce((a,l)=>a+l.qty*lastRate(l.prod,l.make),0));
  scoped(DB.supbills).filter(b=>!isRejected(b)).forEach(b=>sb+=b.lines.reduce((a,l)=>a+l.qty*l.rate,0));
  return [{name:'Indent approved',value:ind},{name:'Ordered',value:po},{name:'Received',value:grn},
          {name:'Supplier billed',value:sb},{name:'Consumed at site',value:cn}];
}
function stockValueByLocation(){
  const m={};stockRows().filter(r=>r.bal>0&&inScope(site(r.site).branch)).forEach(r=>{
    const n=site(r.site).name;m[n]=(m[n]||0)+r.bal*lastRate(r.prod,r.make)});
  return Object.entries(m).map(([name,value])=>({name,value})).sort((a,b)=>b.value-a.value)}
function ageing(){
  const b={'Not due':0,'0–30 days':0,'31–60 days':0,'60+ days':0};
  scoped(DB.supbills).filter(x=>isApproved(x)&&!x.paid).forEach(x=>{
    const days=Math.floor((new Date(today())-new Date(x.due))/864e5);const v=billValue(x);
    if(days<0)b['Not due']+=v;else if(days<=30)b['0–30 days']+=v;else if(days<=60)b['31–60 days']+=v;else b['60+ days']+=v});
  return Object.entries(b).map(([name,value],i)=>({name,value,color:['#179765','#00877B','#D58D25','#D74745'][i]}))}
function estimateVariance(){
  return scoped(DB.boqs).map(b=>{const contract=boqValue(b);
    const est=b.lines.reduce((a,l)=>a+l.boqQty*((+l.estRate||0)+(+l.instRate||0)),0);
    return {name:site(b.site).name,contract,est,gap:contract-est}});
}

/* ---------------- project P&L (rebuilt) ---------------- */
let pnlSite=null;
PAGES.pnl=()=>{
  const sites=scoped(DB.sites).filter(s=>s.type==='SITE');
  if(!sites.length)return viewBanner('pnl')+emptyBox('No sites','Add a site and a BOQ first.');
  if(!sites.find(s=>s.id===pnlSite))pnlSite=sites[0].id;
  const s=site(pnlSite),p=sitePnl(pnlSite),b=boqOf(pnlSite),t=trend(6);
  document.getElementById('pgActions').innerHTML=sel('pnl_s',sites.map(x=>({v:x.id,t:x.name})),pnlSite,'onchange="pnlSite=this.value;render()" style="max-width:260px"');

  const bridge=[{name:'Billed',value:p.billed,color:'#00877B'},{name:'Material',value:-p.matCost},
    {name:'Sub-contract',value:-p.subCost},{name:'Margin',value:p.margin,total:true}];
  const bySite=sites.map(x=>({s:x,p:sitePnl(x.id)}));
  const marginBars=cBars(bySite.map(x=>x.s.name.split('—')[0].trim().slice(0,12)),
    [{name:'Billed',data:bySite.map(x=>x.p.billed),color:'#00877B'},
     {name:'Cost',data:bySite.map(x=>x.p.cost),color:'#D74745'}],{h:220});
  const ev=estimateVariance();
  const varBars=cHBar(ev.map(v=>({name:v.name,value:v.gap,color:v.gap>=0?'#179765':'#D74745'})),{labelW:210});

  /* month-by-month for this site */
  const M=lastMonths(6),idx={};M.forEach((m,i)=>idx[m.key]=i);
  const bl=M.map(()=>0),cs=M.map(()=>0);
  DB.clientbills.filter(x=>x.site===pnlSite&&!isRejected(x)).forEach(x=>{const i=idx[mKey(x.date)];if(i!=null)
    bl[i]+=x.lines.reduce((a,l)=>a+(+l.supplyQty||0)*l.supplyRate+(+l.instQty||0)*(+l.instRate||0),0)});
  DB.consumes.filter(x=>x.site===pnlSite).forEach(x=>{const i=idx[mKey(x.date)];if(i!=null)
    cs[i]+=x.lines.reduce((a,l)=>a+l.qty*lastRate(l.prod,l.make),0)});
  DB.subbills.filter(x=>x.site===pnlSite&&!isRejected(x)).forEach(x=>{const i=idx[mKey(x.date)];if(i!=null)
    cs[i]+=x.lines.reduce((a,l)=>a+l.qty*l.rate,0)});

  /* top BOQ lines by consumed cost */
  const lineCost=b?b.lines.map(l=>{
    let c=0;DB.consumes.filter(x=>x.site===pnlSite).forEach(x=>x.lines.forEach(y=>{if(y.boqLine===l.id)c+=y.qty*lastRate(y.prod,y.make)}));
    const billedQ=clientBilledQty(b.id,l.id,'sup');
    return {l,cost:c,rev:billedQ*l.supplyRate+clientBilledQty(b.id,l.id,'inst')*(+l.instRate||0)}})
    .sort((x,y)=>y.cost-x.cost).slice(0,6):[];

  const kpi=[
    ['Contract value',money(p.contract),b?b.no:'no BOQ'],
    ['Billed',money(p.billed),p.contract?Math.round(p.billed/p.contract*100)+'% of contract':'—'],
    ['Cost booked',money(p.cost),`${short(p.matCost)} material · ${short(p.subCost)} sub-contract`],
    ['Margin',money(p.margin),p.billed?Math.round(p.margin/p.billed*100)+'% on billed value':'—']
  ].map(k=>`<div class="card kpi"><label>${k[0]}</label><b>${k[1]}</b><small>${k[2]}</small></div>`).join('');

  return viewBanner('pnl')+`<div class="banner info">◨ <div>Cost lands when material is <b>consumed</b>, not when it's received — buying a year's cable in April doesn't wipe out April's margin. Open PO value sits separately as commitment (${short(p.committed)}).</div></div>
  <div class="grid g4" style="margin-bottom:14px">${kpi}</div>
  <div class="grid g2" style="margin-bottom:14px;grid-template-columns:1.4fr 1fr">
    ${chartCard('Margin bridge',`${esc(s.name)} — billed down to margin`,cWaterfall(bridge))}
    ${chartCard('Cost split','What the money was spent on',cDonut([
      {name:'Material consumed',value:p.matCost,color:'#00877B'},
      {name:'Sub-contract',value:p.subCost,color:'#D58D25'}].filter(x=>x.value>0),{label:'COST'}))}
  </div>
  <div class="grid g2" style="margin-bottom:14px">
    ${chartCard('Month by month',`Billing and cost at ${esc(s.name)}`,
      cArea(M.map(m=>m.label),[{name:'Billed',data:bl,color:'#00877B'},{name:'Cost',data:cs,color:'#D74745'}],{h:220}))}
    ${chartCard('All sites compared','Billed against cost',marginBars)}
  </div>
  <div class="grid g2">
    ${chartCard('Contract against internal estimate','Positive means the contract rate beats the estimate — the legacy build carried both rates on every BOQ line, so this comes free',varBars)}
    ${tableCard('Heaviest BOQ lines','By cost consumed at this site',
      ['BOQ line',{t:'Cost',r:1},{t:'Revenue billed',r:1},{t:'Margin',r:1}],
      lineCost.map(x=>`<tr><td><b>${esc(pname(x.l.prod))}</b><small>${esc(x.l.work)} · ${esc(x.l.make)}</small></td>
        <td class="rt mono">${money(x.cost)}</td><td class="rt mono">${money(x.rev)}</td>
        <td class="rt mono" style="color:${x.rev-x.cost>=0?'var(--ok)':'var(--bad)'}">${money(x.rev-x.cost)}</td></tr>`).join(''))}
  </div>`;
};

/* ---------------- demo history so the trends have something to show -------- */
function seedHistory(){
  if(DB.seeded)return;DB.seeded=true;
  const admin=DB.session.user;DB.session.user='U1';
  const mk=(m,d)=>{const x=new Date();x.setMonth(x.getMonth()-m);x.setDate(d);return x.toISOString().slice(0,10)};
  /* BOQs for the other two sites */
  [['ST2','PRE/EL/2026/07',[[1,1800,690],[4,320,5900],[10,90,3750],[11,1400,720]]],
   ['ST3','PAN/EL/2026/22',[[0,1600,1310],[2,2600,102],[8,700,340],[11,900,720]]]].forEach(([sid,wo,rows])=>{
    if(boqOf(sid))return;const s=site(sid);
    const b={id:uid('BOQ'),no:doc(DB,'BOQ'),date:mk(6,3),site:sid,branch:s.branch,woNo:wo,status:'LOCKED',
      lines:rows.map(([pi,q,r])=>({id:uid('L'),prod:DB.products[pi].id,make:DB.makes[pi%DB.makes.length],
        work:DB.works[0],boqQty:q,supplyRate:r,supplyGst:18,instRate:Math.round(r*0.09),instGst:18,
        estRate:Math.round(r*0.70)}))};
    DB.boqs.push(b);});
  /* five months of activity on every locked BOQ */
  const done=(a)=>{a.appr.state='APPROVED';a.appr.step=chainOf(a).length;
    a.appr.trail=chainOf(a).map(s=>({step:s.label,by:'U1',at:a.date,act:'Approved',note:''}));return a};
  DB.boqs.forEach(b=>{
    const s=site(b.site);const store=DB.sites.find(x=>x.type==='STORE'&&x.branch===s.branch)||DB.sites.find(x=>x.type==='STORE');
    const supl=DB.suppliers.filter(x=>x.type==='SUPPLIER');
    for(let m=5;m>=0;m--){
      const frac=[.11,.14,.12,.16,.13,.15][m]||.12;
      const iLines=b.lines.map(l=>({id:uid('L'),boqLine:l.id,prod:l.prod,make:l.make,
        qty:n2(Math.max(1,Math.round(l.boqQty*frac)))})).filter(l=>l.qty>0);
      if(!iLines.length)continue;
      const ind=done({id:uid('IND'),no:doc(DB,'IND'),date:mk(m,4),need:mk(m,18),site:b.site,branch:b.branch,boq:b.id,
        by:'U2',lines:iLines,appr:newAppr('INDENT'),amount:0});DB.indents.push(ind);
      const sp=supl[m%supl.length];
      const po=done({id:uid('PO'),no:doc(DB,'PO'),date:mk(m,7),due:mk(m,20),sup:sp.id,indent:ind.id,site:store.id,
        forSite:b.site,branch:b.branch,appr:newAppr('PO'),amount:0,
        lines:iLines.map(l=>{const bl=b.lines.find(x=>x.id===l.boqLine);
          return {id:uid('L'),indent:ind.id,indentLine:l.id,prod:l.prod,make:l.make,qty:l.qty,
            rate:Math.round((bl.estRate||prod(l.prod).rate)*(0.95+((m*7)%9)/100)),gst:18}})});
      po.amount=poValue(po);DB.pos.push(po);
      const grnLines=po.lines.map(l=>({poLine:l.id,prod:l.prod,make:l.make,rate:l.rate,gst:l.gst,
        qty:n2(l.qty*(m===0?0.72:1))})).filter(l=>l.qty>0);
      DB.grns.push({id:uid('GRN'),no:doc(DB,'GRN'),date:mk(m,11),inv:'INV-'+(1000+m*3),invDate:mk(m,10),
        po:po.id,sup:sp.id,toSite:store.id,branch:b.branch,lines:grnLines});
      DB.issues.push({id:uid('DC'),no:doc(DB,'DC'),date:mk(m,13),fromSite:store.id,toSite:b.site,branch:b.branch,
        status:'RECEIVED',recvDate:mk(m,14),
        lines:grnLines.map(l=>({prod:l.prod,make:l.make,qty:n2(l.qty*0.95)}))});
      const CF=[0.90,0.72,0.68,0.75,0.70];
      DB.consumes.push({id:uid('CN'),no:doc(DB,'CN'),date:mk(m,22),site:b.site,branch:b.branch,
        location:'Block '+String.fromCharCode(64+m),
        lines:grnLines.map((l,li)=>({prod:l.prod,make:l.make,qty:n2(l.qty*CF[li%CF.length]),
          boqLine:(b.lines.find(x=>x.prod===l.prod)||b.lines[0]).id}))});
      if(m>0){const sb=done({id:uid('SB'),no:doc(DB,'SB'),date:mk(m,15),inv:'SI-'+(500+m*4),invDate:mk(m,12),
        due:mk(m-1>0?m-1:0,12),po:po.id,sup:sp.id,site:b.site,branch:b.branch,
        lines:grnLines.map(l=>({poLine:l.poLine,prod:l.prod,make:l.make,rate:l.rate,gst:l.gst,qty:l.qty})),
        appr:newAppr('SUPBILL'),paid:m>2,amount:0});sb.amount=billValue(sb);DB.supbills.push(sb);}
      {
        const cbLines=b.lines.map(l=>({boqLine:l.id,prod:l.prod,supplyQty:n2(Math.round(l.boqQty*frac*0.8)),
          instQty:n2(Math.round(l.boqQty*frac*0.6)),supplyRate:l.supplyRate,instRate:l.instRate||0,gst:18}));
        const ra=done({id:uid('RA'),no:doc(DB,'RA'),ra:6-m,date:mk(m,26),boq:b.id,site:b.site,branch:b.branch,
          retPct:5,lines:cbLines,appr:newAppr('CLIENTBILL'),amount:0,retention:0});
        ra.amount=clientBillValue(ra);
        ra.retention=n2(cbLines.reduce((a,l)=>a+l.supplyQty*l.supplyRate+l.instQty*l.instRate,0)*0.05);
        DB.clientbills.push(ra);}
    }
    /* an approved indent nobody has ordered yet, plus a comparison awaiting a decision —
       this is what procurement should actually see when they sit down */
    const openLines=b.lines.slice(0,3).map(l=>({id:uid('L'),boqLine:l.id,prod:l.prod,make:l.make,
      qty:n2(Math.max(1,Math.round(l.boqQty*0.06)))}));
    if(openLines.length){
      const oi=done({id:uid('IND'),no:doc(DB,'IND'),date:mk(0,3),need:addDays(today(),12),site:b.site,
        branch:b.branch,boq:b.id,by:'U2',lines:openLines,appr:newAppr('INDENT'),amount:0});
      DB.indents.push(oi);
      const two=DB.suppliers.filter(x=>x.type==='SUPPLIER').slice(0,2).map(x=>x.id);
      if(two.length===2)DB.quotes.push({id:uid('QT'),no:doc(DB,'CMP'),date:mk(0,5),indent:oi.id,site:b.site,
        branch:b.branch,suppliers:two,selected:null,reason:'',
        lines:openLines.map(l=>{const bl=b.lines.find(x=>x.id===l.boqLine);const base=(bl&&+bl.estRate)||prod(l.prod).rate;
          const rates={};two.forEach((sp,k)=>rates[sp]=Math.round(base*(k?1.06:0.98)));
          return {prod:l.prod,make:l.make,qty:l.qty,indentLine:l.id,rates}})});
    }
    /* one challan still in transit, so the in-transit view has something */
    const left=stockRows().filter(r=>r.site===store.id&&r.bal>0).slice(0,2);
    if(left.length)DB.issues.push({id:uid('DC'),no:doc(DB,'DC'),date:mk(0,24),fromSite:store.id,toSite:b.site,
      branch:b.branch,status:'DISPATCHED',lines:left.map(r=>({prod:r.prod,make:r.make,qty:n2(Math.min(r.bal,r.bal*0.5))}))});
    /* one sub-contract per site */
    const con=DB.suppliers.filter(x=>x.type==='CONTRACTOR')[0];
    const wo={id:uid('SWO'),no:doc(DB,'SWO'),date:mk(4,5),site:b.site,branch:b.branch,sup:con.id,
      title:'Cable laying, termination and testing',
      lines:b.lines.slice(0,2).map(l=>({boqLine:l.id,prod:l.prod,qty:n2(Math.round(l.boqQty*0.4)),rate:l.instRate||60}))};
    DB.subwos.push(wo);
    const cb=done({id:uid('CB'),no:doc(DB,'CBIL'),date:mk(2,20),wo:wo.id,sup:con.id,site:b.site,branch:b.branch,
      lines:wo.lines.map((l,i)=>({idx:i,prod:l.prod,rate:l.rate,qty:n2(l.qty*0.5)})),
      retPct:5,tdsPct:2,appr:newAppr('SUBBILL'),amount:0,retention:0,tds:0});
    const gross=cb.lines.reduce((a,l)=>a+l.qty*l.rate,0);
    cb.amount=gross;cb.retention=n2(gross*0.05);cb.tds=n2(gross*0.02);DB.subbills.push(cb);
  });
  DB.session.user=admin;
  log('SYSTEM','—','Demo history generated','six months across every site');
  save();
}
/* ============================================================
   EXPENSES & PAYMENTS — the cost heads the legacy build kept in
   site_expense / expense_type_master, wired into project costing.
   ============================================================ */
const EXP_HEADS=['Labour & wages','Site establishment','Travel & transport','Petty cash','Machinery hire','Statutory & other'];
function ensureExpenses(){if(!DB.expenses)DB.expenses=[];if(!DB.payments)DB.payments=[]}
function siteExpense(siteId){ensureExpenses();
  return DB.expenses.filter(e=>e.site===siteId&&e.status!=='REJECTED').reduce((a,e)=>a+ +e.amount,0)}
function expenseByHead(){ensureExpenses();const m={};
  DB.expenses.filter(e=>inScope(e.branch)&&e.status!=='REJECTED').forEach(e=>m[e.head]=(m[e.head]||0)+ +e.amount);
  return Object.entries(m).map(([name,value])=>({name,value})).sort((a,b)=>b.value-a.value)}

PAGES.accounts=()=>{
  ensureExpenses();
  if(canEdit('accounts'))document.getElementById('pgActions').innerHTML=
    `<button class="btn" onclick="expSheet()">Record expense</button><button class="btn pri" onclick="payQueue()">Release payment</button>`;
  const due=scoped(DB.supbills).filter(b=>isApproved(b)&&!b.paid);
  const subDue=scoped(DB.subbills).filter(b=>isApproved(b)&&!b.paid);
  const payable=due.reduce((a,b)=>a+billValue(b),0)+subDue.reduce((a,b)=>a+(b.amount-b.retention-b.tds),0);
  const recv=scoped(DB.clientbills).filter(b=>isApproved(b)&&!b.received);
  const overdue=recv.filter(b=>b.date<addDays(today(),-30));
  const exp=DB.expenses.filter(e=>inScope(e.branch));
  const kpi=[['Payable now',money(payable),`${due.length+subDue.length} document${due.length+subDue.length===1?'':'s'} cleared for payment`],
    ['Receivable from clients',money(recv.reduce((a,b)=>a+clientBillValue(b),0)),
      overdue.length?`${money(overdue.reduce((a,b)=>a+clientBillValue(b),0))} over 30 days`:'all current'],
    ['Site expenses booked',money(exp.filter(e=>e.status!=='REJECTED').reduce((a,e)=>a+ +e.amount,0)),`${exp.length} entries across ${EXP_HEADS.length} heads`]
  ].map(k=>`<div class="card kpi"><label>${k[0]}</label><small>${k[2]}</small><b>${k[1]}</b></div>`).join('');

  const rows=[].concat(
    due.map(b=>({party:sup(b.sup).name,type:'Supplier bill',ref:b.no,due:b.due,amt:billValue(b),tds:0,
      blocked:sbBal(b.po,b.lines[0].poLine)<0,id:b.id,kind:'sup'})),
    subDue.map(b=>({party:sup(b.sup).name,type:'Contractor bill',ref:b.no,due:addDays(b.date,15),
      amt:b.amount,tds:b.tds,ret:b.retention,id:b.id,kind:'sub'}))
  ).sort((a,b)=>String(a.due).localeCompare(String(b.due)));
  const queue=rows.map(r=>`<tr><td><b>${esc(r.party)}</b><small>${r.type}</small></td>
    <td class="mono">${esc(r.ref)}</td><td>${dmy(r.due)}${r.due<today()?' <span class="tag bad">overdue</span>':''}</td>
    <td class="rt mono">${money(r.amt)}</td><td class="rt mono">${r.ret?money(r.ret):'—'}</td>
    <td class="rt mono">${r.tds?money(r.tds):'—'}</td>
    <td class="rt mono"><b>${money(r.amt-(r.tds||0)-(r.ret||0))}</b></td>
    <td class="rt">${canEdit('accounts')?`<button class="btn sm ok" onclick="pay('${r.kind}','${r.id}')">Pay</button>`:'<span class="tag ok">Cleared</span>'}</td></tr>`).join('');

  const expRows=exp.slice(0,12).map(e=>`<tr><td><b>${esc(e.head)}</b><small>${esc(e.note||'')}</small></td>

let reconSite=null;
PAGES.recon=()=>{
  const sites=scoped(DB.sites).filter(s=>s.type==='SITE'&&boqOf(s.id));
  if(!sites.length)return viewBanner('recon')+emptyBox('Nothing to reconcile','A site needs a BOQ and some consumption first.');
  if(!sites.find(s=>s.id===reconSite))reconSite=sites[0].id;
  document.getElementById('pgActions').innerHTML=sel('rc_s',sites.map(s=>({v:s.id,t:s.name})),reconSite,'onchange="reconSite=this.value;render()" style="max-width:280px"');
  const b=boqOf(reconSite);
  const rows=b.lines.map(l=>{
    const used=consumedQty(reconSite,l.id);
    const billed=clientBilledQty(b.id,l.id,'sup');
    const gap=n2(used-billed);
    const gapVal=n2(gap*l.supplyRate);
    const pct=billed?Math.abs(gap)/billed*100:(used?100:0);
    const verdict=Math.abs(gap)<0.001?['ok','Matched']:gap<0?['info','Billed ahead of use']:
      pct<=3?['ok','Within tolerance']:pct<=10?['warn','Work in progress']:['bad','Investigate'];
    return {l,used,billed,gap,gapVal,verdict,pct};
  });
  const flagged=rows.filter(r=>r.verdict[0]==='bad');
  const totalGap=rows.reduce((a,r)=>a+(r.gap>0?r.gapVal:0),0);
  const body=rows.map(r=>`<tr><td><b>${esc(pname(r.l.prod))}</b><small>${esc(r.l.make)} · ${esc(r.l.work)}</small></td>
    <td>${esc(prod(r.l.prod).uom)}</td>
    <td class="rt mono">${qty(r.used)}</td><td class="rt mono">${qty(r.billed)}</td>
    <td class="rt mono" style="color:${r.gap>0?'var(--red-ink)':r.gap<0?'var(--blue)':'var(--muted)'}">${r.gap>0?'+':''}${qty(r.gap)}</td>
    <td class="rt mono">${money(Math.abs(r.gapVal))}</td>
    <td><span class="tag ${r.verdict[0]}">${r.verdict[1]}</span></td></tr>`).join('');
  return viewBanner('recon')+`<div class="banner info">⇄ <div>Consumption comes from what the site actually booked against each BOQ line. Billed quantity comes from certified RA bills. A gap is either work in progress that hasn't been measured yet, or material going somewhere the bills don't account for.</div></div>
    ${tableCard('Material reconciliation — '+esc(site(reconSite).name),'Used at site against billed to client',
      ['Material','UOM',{t:'Used at site',r:1},{t:'Billed to client',r:1},{t:'Gap',r:1},{t:'Gap value',r:1},'Assessment'],body)}
    <div style="height:20px"></div>
    <div class="card"><div class="pad">
      ${flagged.length?`<div class="leak"><strong>${flagged.length} line${flagged.length>1?'s':''} more than 10% ahead of billing</strong> — ${esc(flagged.map(f=>pname(f.l.prod).split('—')[1]||'').join(', ').trim())}. Breakage or unmeasured work are the usual causes, but each needs a site note before the final bill.</div>`
        :`<div class="leak good"><strong>Every line reconciles within tolerance.</strong> ${money(totalGap)} of material is used but not yet billed, which is normal work in progress.</div>`}
    </div></div>`;
};

function spineHtml(){
  const st=funnelStages(),top=Math.max(1,st[0].value);
  const tone=['','','','warn','green'];
  return `<div class="spine">${st.map((s,i)=>{
    const pct=Math.round(s.value/top*100);
    return `<button class="stage" data-tone="${tone[i]||''}" onclick="location.hash='#${['indent','po','grn','supbill','consume'][i]}'">
      <div class="bar"><div class="fill" style="height:${pct}%"></div></div>
      <div class="name">${s.name}</div><div class="amt num">${short(s.value)}</div>
      <div class="pct num">${pct}%${i?' · −'+short(st[i-1].value-s.value):''}</div></button>`}).join('')}</div>`;
}
function leakage(){
  let recvNotBilled=0,cnt=0;
  scoped(DB.pos).forEach(p=>p.lines.forEach(l=>{const bal=sbBal(p.id,l.id);
    if(bal>0){recvNotBilled+=bal*l.rate;cnt++}}));
  let usedNotBilled=0;
  scoped(DB.boqs).forEach(b=>b.lines.forEach(l=>{
    const g=consumedQty(b.site,l.id)-clientBilledQty(b.id,l.id,'sup');
    if(g>0)usedNotBilled+=g*l.supplyRate}));
  return {recvNotBilled,cnt,usedNotBilled};
}
function ageingBands(){
  const bands=['0–7 days','8–15 days','16–30 days','30+ days'];
  const put=(arr,d)=>{const days=Math.floor((new Date(today())-new Date(d))/864e5);
    arr[days<=7?0:days<=15?1:days<=30?2:3]++};
  const ind=[0,0,0,0],po=[0,0,0,0],sb=[0,0,0,0],ra=[0,0,0,0];
  scoped(DB.indents).filter(d=>!isApproved(d)).forEach(d=>put(ind,d.date));
  scoped(DB.pos).filter(d=>isApproved(d)&&d.lines.some(l=>poBal(d.id,l.id)>0)).forEach(d=>put(po,d.date));
  scoped(DB.supbills).filter(d=>isApproved(d)&&!d.paid).forEach(d=>put(sb,d.date));
  scoped(DB.clientbills).filter(d=>isApproved(d)&&!d.received).forEach(d=>put(ra,d.date));
  return {bands,series:[{name:'Indents awaiting approval',data:ind},{name:'POs awaiting delivery',data:po},
    {name:'Supplier bills unpaid',data:sb},{name:'Client bills uncollected',data:ra}]};
}
function stuckTable(){
  const rows=[];
  let v=0,c=0;scoped(DB.indents).filter(isApproved).forEach(i=>i.lines.forEach(l=>{const b=indentBal(i.id,l.id);
    if(b>0){v+=b*(prod(l.prod).rate||0);c++}}));
  if(c)rows.push(['Indented, not ordered','Purchase hasn\'t raised the PO',c,v,'Purchase']);
  v=0;c=0;scoped(DB.pos).filter(isApproved).forEach(p=>p.lines.forEach(l=>{const b=poBal(p.id,l.id);
    if(b>0){v+=b*l.rate;c++}}));
  if(c)rows.push(['Ordered, not received','Supplier hasn\'t delivered',c,v,'Store']);
  const lk=leakage();
  if(lk.cnt)rows.push(['Received, not billed by supplier','No supplier invoice against the receipt',lk.cnt,lk.recvNotBilled,'Accounts']);
  if(lk.usedNotBilled>0)rows.push(['Used at site, not billed to client','Not measured into an RA bill yet','—',lk.usedNotBilled,'PM']);
  const unpaid=scoped(DB.supbills).filter(b=>isApproved(b)&&!b.paid);
  if(unpaid.length)rows.push(['Approved, not paid','Sitting in the payment queue',unpaid.length,unpaid.reduce((a,b)=>a+billValue(b),0),'Accounts']);
  const pend=[].concat(scoped(DB.indents),scoped(DB.pos),scoped(DB.supbills),scoped(DB.clientbills)).filter(d=>d.appr&&!isApproved(d)&&!isRejected(d));

    pend.length,pend.reduce((a,d)=>a+(d.amount||0),0),'Approvers']);
  return rows;
}

let pnlTab='statement';
function pnlStatement(siteId){
  ensureExpenses();
  const b=boqOf(siteId),p=sitePnl(siteId);
  let gross=0,ret=0;
  DB.clientbills.filter(x=>x.site===siteId&&!isRejected(x)).forEach(x=>{
    gross+=x.lines.reduce((a,l)=>a+(+l.supplyQty||0)*l.supplyRate+(+l.instQty||0)*(+l.instRate||0),0);
    ret+=+x.retention||0});
  /* budget = what the same physical work should have cost at BOQ estimate rates */
  let matAct=0,matBud=0;
  DB.consumes.filter(c=>c.site===siteId).forEach(c=>c.lines.forEach(l=>{
    matAct+=l.qty*lastRate(l.prod,l.make);
    const bl=b&&b.lines.find(x=>x.id===l.boqLine);
    matBud+=l.qty*((bl&&+bl.estRate)||prod(l.prod).rate||lastRate(l.prod,l.make))}));
  let subAct=0,subBud=0;
  DB.subbills.filter(x=>x.site===siteId&&!isRejected(x)).forEach(x=>{const wo=DB.subwos.find(w=>w.id===x.wo);
    x.lines.forEach(l=>{subAct+=l.qty*l.rate;
      const wl=wo&&wo.lines[l.idx];const bl=wl&&b&&b.lines.find(y=>y.id===wl.boqLine);
      subBud+=l.qty*((bl&&+bl.instRate)||l.rate)})});
  const wages=DB.expenses.filter(e=>e.site===siteId&&e.status!=='REJECTED'&&e.head==='Labour & wages').reduce((a,e)=>a+ +e.amount,0);
  const other=DB.expenses.filter(e=>e.site===siteId&&e.status!=='REJECTED'&&e.head!=='Labour & wages').reduce((a,e)=>a+ +e.amount,0);
  const net=gross-ret, ho=n2(gross*0.05);
  const wagesBud=n2(gross*0.10), otherBud=n2(gross*0.04);
  const dirAct=matAct+subAct+wages+other, dirBud=matBud+subBud+wagesBud+otherBud;
  return {gross,ret,net,rows:[
    {h:'Revenue'},
    {s:1,label:'Certified billing',bud:gross,act:gross,sub:`${DB.clientbills.filter(x=>x.site===siteId&&!isRejected(x)).length} RA bill(s) raised and certified`},
    {h:'Direct cost'},
    {label:'Material consumed',bud:matBud,act:matAct,sub:'Booked at consumption, valued at purchase rate; budget is the BOQ estimate rate'},
    {label:'Sub-contract',bud:subBud,act:subAct,sub:'Budget is the BOQ installation rate'},
    {label:'Labour & wages',bud:wagesBud,act:wages,sub:'Budget assumed at 10% of certified revenue'},
    {label:'Site expenses & establishment',bud:otherBud,act:other,sub:'Budget assumed at 4% of certified revenue'},
    {s:1,label:'Total direct cost',bud:dirBud,act:dirAct},
    {g:1,label:'Gross margin',bud:gross-dirBud,act:gross-dirAct},
    {h:'Indirect'},
    {label:'Head office allocation',bud:ho,act:ho,sub:'5% of certified revenue'},
    {g:1,label:'Net project margin',bud:gross-dirBud-ho,act:gross-dirAct-ho},

      ${chartCard('Contract against internal estimate','Positive means the contract rate beats the estimate',
        cHBar(ev.map(v=>({name:v.name,value:v.gap,color:v.gap>=0?'#179765':'#D74745'})),{labelW:210}))}

/* ---------------- seed expenses so costing is complete ---------------- */
function seedExpenses(){
  ensureExpenses();
  if(DB.expSeeded)return;DB.expSeeded=true;
  const mk=(m,d)=>{const x=new Date();x.setMonth(x.getMonth()-m);x.setDate(d);return x.toISOString().slice(0,10)};
  DB.sites.filter(s=>s.type==='SITE').forEach((s,si)=>{
    for(let m=5;m>=0;m--){
      const base=[30000,26000,24000][si%3];
      DB.expenses.push({id:uid('EX'),date:mk(m,26),site:s.id,branch:s.branch,head:'Labour & wages',
        amount:n2(base*(0.9+((m*13)%20)/100)),note:'Monthly wages, site workforce',by:'U5',status:'APPROVED'});
      DB.expenses.push({id:uid('EX'),date:mk(m,18),site:s.id,branch:s.branch,head:'Site establishment',
        amount:n2(base*0.11),note:'Site office, room rent, utilities',by:'U5',status:'APPROVED'});
      if(m%2===0)DB.expenses.push({id:uid('EX'),date:mk(m,12),site:s.id,branch:s.branch,head:'Travel & transport',
        amount:n2(base*0.07),note:'Material transport and site travel',by:'U2',status:'APPROVED'});
      if(m===0)DB.expenses.push({id:uid('EX'),date:mk(0,6),site:s.id,branch:s.branch,head:'Petty cash',
        amount:n2(base*0.03),note:'Consumables and tools',by:'U2',status:'PENDING'});
    }
  });
  /* a few client receipts so the cash view has movement */
  DB.clientbills.forEach((b,i)=>{if(i%3!==0&&b.date<addDays(today(),-30)){b.received=true;b.recvOn=addDays(b.date,28)}});
  log('SYSTEM','—','Expense history generated','wages, establishment, transport and petty cash');
  save();
}

   REPORT CENTRE — the rest of the catalogue. Ledgers, registers,
   dues and GST: the families the legacy build carried as Jasper
   templates, each one reading live documents.

function MORE_REPORTS(){ return [

  ['Supplier ledger','Every bill and payment against a supplier, with the running balance','Cash',()=>{
    const r=[];DB.suppliers.filter(x=>x.type==='SUPPLIER'&&inScope(x.branch)).forEach(sp=>{
      const bills=scoped(DB.supbills).filter(b=>b.sup===sp.id&&!isRejected(b));
      if(!bills.length)return;let bal=0;
      bills.sort((a,b)=>a.date.localeCompare(b.date)).forEach(b=>{
        const v=billValue(b);bal+=v;
        r.push([sp.name,b.no,dmy(b.date),'Bill',money(v),'—',money(bal)]);
        if(b.paid){bal-=v;r.push([sp.name,b.no,dmy(b.paidOn||b.date),'Payment','—',money(v),money(bal)])}});
    });
    return {head:['Supplier','Reference','Date','Entry','Debit','Credit','Balance'],rows:r}}],

  ['Client ledger','RA bills raised, amounts received and what is still outstanding','Cash',()=>{
    const r=[];DB.clients.filter(c=>inScope(c.branch)).forEach(c=>{
      const ss=DB.sites.filter(x=>x.client===c.id).map(x=>x.id);
      scoped(DB.clientbills).filter(b=>ss.includes(b.site)&&!isRejected(b))
        .sort((a,b)=>a.date.localeCompare(b.date)).forEach(b=>{
        const v=clientBillValue(b);
        r.push([c.name,site(b.site).name,b.no,dmy(b.date),money(v),money(b.retention),
          b.received?'Received '+dmy(b.recvOn):(isApproved(b)?'Outstanding':'Not certified')])});
    });
    return {head:['Client','Site','Bill','Date','Value','Retention','Status'],rows:r}}],

  ['Contractor ledger','Work order value against billed, with retention and TDS held','Cash',()=>{
    const r=scoped(DB.subwos).map(w=>{
      const bills=DB.subbills.filter(b=>b.wo===w.id&&!isRejected(b));
      const gross=bills.reduce((a,b)=>a+b.amount,0);
      return [sup(w.sup).name,w.no,site(w.site).name,money(w.lines.reduce((a,l)=>a+l.qty*l.rate,0)),
        money(gross),money(bills.reduce((a,b)=>a+b.retention,0)),money(bills.reduce((a,b)=>a+b.tds,0)),
        money(bills.filter(b=>b.paid).reduce((a,b)=>a+(b.amount-b.retention-b.tds),0))]});
    return {head:['Contractor','Work order','Site','WO value','Billed','Retention held','TDS','Paid'],rows:r}}],

  ['GST summary','Output tax on client bills against input tax on supplier bills','Cash',()=>{
    const M=lastMonths(6),idx={};M.forEach((m,i)=>idx[m.key]=i);
    const out=M.map(()=>0),inp=M.map(()=>0);
    scoped(DB.clientbills).filter(b=>!isRejected(b)).forEach(b=>{const i=idx[mKey(b.date)];if(i==null)return;
      out[i]+=b.lines.reduce((a,l)=>a+((+l.supplyQty||0)*l.supplyRate+(+l.instQty||0)*(+l.instRate||0))*(+l.gst||0)/100,0)});
    scoped(DB.supbills).filter(b=>!isRejected(b)).forEach(b=>{const i=idx[mKey(b.date)];if(i==null)return;
      inp[i]+=b.lines.reduce((a,l)=>a+l.qty*l.rate*(+l.gst||0)/100,0)});
    return {head:['Month','Output tax','Input credit','Net payable'],
      rows:M.map((m,i)=>[m.label,money(out[i]),money(inp[i]),money(out[i]-inp[i])])}}],

  ['Indent register','Every indent raised, its stage and whether it has been ordered','Procurement',()=>{
    const r=scoped(DB.indents).sort((a,b)=>b.date.localeCompare(a.date)).map(i=>{
      const done=i.lines.every(l=>indentBal(i.id,l.id)<=0.001);
      return [i.no,dmy(i.date),site(i.site).name,user(i.by).name,String(i.lines.length),
        isApproved(i)?'Approved':isRejected(i)?'Returned':'With '+((nextStep(i)||{}).label||'—'),
        isApproved(i)?(done?'Fully ordered':'Order pending'):'—']});
    return {head:['Indent','Date','Site','Raised by','Lines','Approval','PO status'],rows:r}}],

  ['Purchase order register','Every PO with ordered, received and billed quantity','Procurement',()=>{
    const r=scoped(DB.pos).sort((a,b)=>b.date.localeCompare(a.date)).map(p=>{
      const o=p.lines.reduce((a,l)=>a+ +l.qty,0),g=p.lines.reduce((a,l)=>a+grnQtyOfPoLine(p.id,l.id),0),
            b=p.lines.reduce((a,l)=>a+billedQtyOfPoLine(p.id,l.id),0);
      return [p.no,dmy(p.date),sup(p.sup).name,site(p.site).name,money(poValue(p)),
        qty(o),qty(g),qty(b),isApproved(p)?(g>=o?'Closed':'Open'):'Not approved']});
    return {head:['PO','Date','Supplier','Deliver to','Value','Ordered','Received','Billed','State'],rows:r}}],

  ['Goods receipt register','Every GRN with supplier invoice reference','Procurement',()=>{
    const r=scoped(DB.grns).sort((a,b)=>b.date.localeCompare(a.date)).map(g=>{
      const p=DB.pos.find(x=>x.id===g.po);
      return [g.no,dmy(g.date),p?p.no:'—',sup(g.sup).name,g.inv,site(g.toSite).name,
        qty(g.lines.reduce((a,l)=>a+ +l.qty,0)),money(g.lines.reduce((a,l)=>a+l.qty*l.rate,0))]});
    return {head:['GRN','Date','Against PO','Supplier','Invoice','Received at','Qty','Value'],rows:r}}],

  ['Issue & challan register','Material dispatched from store, and whether the site acknowledged','Material',()=>{
    const r=scoped(DB.issues).sort((a,b)=>b.date.localeCompare(a.date)).map(i=>
      [i.no,dmy(i.date),site(i.fromSite).name,site(i.toSite).name,String(i.lines.length),
       qty(i.lines.reduce((a,l)=>a+ +l.qty,0)),i.status==='RECEIVED'?'Received '+dmy(i.recvDate):'In transit']);
    return {head:['Challan','Date','From','To','Lines','Qty','Status'],rows:r}}],

  ['Consumption against BOQ','What each BOQ line has actually used, and what it cost','Material',()=>{
    const r=[];scoped(DB.boqs).forEach(b=>b.lines.forEach(l=>{
      const used=consumedQty(b.site,l.id);if(used<=0)return;
      let cost=0;DB.consumes.filter(c=>c.site===b.site).forEach(c=>c.lines.forEach(y=>{
        if(y.boqLine===l.id)cost+=y.qty*lastRate(y.prod,y.make)}));
      r.push([site(b.site).name,lineName(l),l.work,qty(l.boqQty),qty(used),
        (l.boqQty?Math.round(used/l.boqQty*100):0)+'%',money(cost)])}));
    return {head:['Site','BOQ line','Work','BOQ qty','Used','% used','Cost'],rows:r}}],

  ['Item movement','Every in and out for one item across stores and sites','Material',()=>{
    const r=movements().filter(m=>inScope(site(m.site).branch)).sort((a,b)=>b.date.localeCompare(a.date))
      .slice(0,120).map(m=>[dmy(m.date),pname(m.prod),m.make,site(m.site).name,m.kind,m.ref,
        (m.qty>0?'+':'')+qty(m.qty)]);
    return {head:['Date','Item','Make','Where','Movement','Reference','Qty'],rows:r}}],

  ['Work in progress','Used at site but not yet measured into a client bill','Position',()=>{
    const r=[];scoped(DB.boqs).forEach(b=>b.lines.forEach(l=>{
      const gap=consumedQty(b.site,l.id)-clientBilledQty(b.id,l.id,'sup');
      if(gap>0.001)r.push([site(b.site).name,lineName(l),qty(consumedQty(b.site,l.id)),
        qty(clientBilledQty(b.id,l.id,'sup')),qty(gap),money(gap*l.supplyRate)])}));
    return {head:['Site','BOQ line','Used','Billed','Unbilled qty','Value at contract rate'],rows:r}}],

  ['Site expenses by head','Wages, establishment and the rest, by site','Cost & margin',()=>{
    ensureExpenses();const m={};
    DB.expenses.filter(e=>inScope(e.branch)&&e.status!=='REJECTED').forEach(e=>{
      const k=e.site+'|'+e.head;m[k]=(m[k]||0)+ +e.amount});
    const r=Object.entries(m).map(([k,v])=>{const [s,h]=k.split('|');
      const p=sitePnl(s);return [site(s).name,h,money(v),p.billed?(v/p.billed*100).toFixed(1)+'%':'—']})
      .sort((a,b)=>a[0].localeCompare(b[0]));
    return {head:['Site','Cost head','Amount','% of certified billing'],rows:r}}],

  ['Budget against actual','Every site, BOQ estimate against what it really cost','Cost & margin',()=>{
    const r=scoped(DB.sites).filter(s=>s.type==='SITE'&&boqOf(s.id)).map(s=>{
      const st=pnlStatement(s.id),tot=st.rows.find(x=>x.s&&x.label==='Total direct cost')||{bud:0,act:0};
      const gm=st.rows.find(x=>x.g&&x.label==='Gross margin')||{bud:0,act:0};
      return [s.name,money(st.gross),money(tot.bud),money(tot.act),money(tot.act-tot.bud),money(gm.act),
        st.gross?(gm.act/st.gross*100).toFixed(1)+'%':'—']});
    return {head:['Site','Certified','Budget cost','Actual cost','Variance','Gross margin','%'],rows:r}}],

  ['Purchase rate variance','What we paid against the BOQ estimate rate, line by line','Cost & margin',()=>{
    const r=[];scoped(DB.pos).filter(isApproved).forEach(p=>{
      const ind=byId(DB.indents,p.indent),b=ind.boq?DB.boqs.find(x=>x.id===ind.boq):null;
      p.lines.forEach(l=>{
        const il=ind.lines&&ind.lines.find(x=>x.id===l.indentLine);
        const bl=b&&il&&b.lines.find(x=>x.id===il.boqLine);if(!bl)return;
        const est=+bl.estRate||0,v=(l.rate-est)*l.qty;
        r.push([p.no,sup(p.sup).name,lineName(l),money(est),money(l.rate),
          ((est?(l.rate-est)/est*100:0)).toFixed(1)+'%',money(v)])})});
    return {head:['PO','Supplier','Item','Estimate rate','Paid rate','Variance %','Value impact'],rows:r}}],

  ['Approval turnaround','How long each stage is taking to sign','Position',()=>{
    const all=[].concat(scoped(DB.indents),scoped(DB.pos),scoped(DB.supbills),scoped(DB.clientbills),scoped(DB.subbills));
    const m={};all.forEach(d=>(d.appr&&d.appr.trail||[]).forEach(t=>{
      if(t.act!=='Approved')return;const days=Math.max(0,Math.floor((new Date(t.at)-new Date(d.date))/864e5));
      m[t.step]=m[t.step]||{n:0,d:0};m[t.step].n++;m[t.step].d+=days}));
    const r=Object.entries(m).map(([k,v])=>[k,String(v.n),(v.d/v.n).toFixed(1)+' days']);
    const pend=all.filter(d=>d.appr&&!isApproved(d)&&!isRejected(d));
    pend.forEach(d=>{const st=(nextStep(d)||{}).label||'—';
      const days=Math.floor((new Date(today())-new Date(d.date))/864e5);
      r.push([st+' (waiting)',d.no,days+' days'])});
    return {head:['Stage','Documents','Average time held'],rows:r}}]
];}
const CORE_REPORTS=REPORTS;
REPORTS=function(){return CORE_REPORTS().concat(MORE_REPORTS().map(r=>[r[0],r[1],r[3],r[2]]))};

/* catalogue: use the category the report declares */
libCatalogue=function(){
  const R=REPORTS();
  const extra=[
    ['Material reconciliation','Material','Used at site against billed to client','recon'],
    ['Payment queue','Cash','Cleared for release with TDS and retention','accounts'],
    ['Profit & loss statement','Cost & margin','Budget against actual, down to net project margin','pnl'],
    ['Stock on hand by location','Material','Holdings and value by store and site','stock'],
    ['Approval queue','Position','Every open document and who is holding it','approvals'],
    ['Audit trail','Position','Every state change by user and document','audit']
  ];
  const cats={'Indent pending PO':'Procurement','PO pending receipt':'Procurement','Received not billed':'Procurement',
    'Supplier outstanding':'Cash','Client billing status':'Position','Site consumption':'Material',
    'Stock on hand':'Material','Contractor retention':'Cash'};
  return R.map((r,i)=>({name:r[0],cat:r[3]||cats[r[0]]||'Position',desc:r[1],idx:i}))
    .concat(extra.map(e=>({name:e[0],cat:e[1],desc:e[2],go:e[3]})));
};

/* open a report: run it, show it, allow CSV out, remember it was used */
misOpen=function(i){
  const spec=REPORTS()[i];if(!spec)return;const d=spec[2]();
  DB.recent=(DB.recent||[]).filter(x=>x!==spec[0]);DB.recent.unshift(spec[0]);
  if(DB.recent.length>6)DB.recent.length=6;save();
  window.__rep={name:spec[0],d};
  Sheet.open(spec[0],spec[1],
    `<div class="card"><div class="tw"><table><thead><tr>${d.head.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead>
      <tbody>${d.rows.map(r=>`<tr>${r.map((c,j)=>`<td class="${j>0&&/^[₹0-9+\-−]/.test(String(c))?'rt mono':''}">${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
      ${d.rows.length?'':emptyBox('Nothing to report','No document meets this condition yet.')}</div>`,
    `<button class="btn" onclick="Sheet.close()">Close</button>${d.rows.length?`<button class="btn pri" onclick="repCsv()">Download CSV</button>`:''}`);
};
function repCsv(){
  const r=window.__rep;if(!r)return;
  const esc2=v=>`"${String(v).replace(/"/g,'""').replace(/₹/g,'')}"`;
  const csv=[r.d.head.map(esc2).join(',')].concat(r.d.rows.map(row=>row.map(esc2).join(','))).join('\n');
  const a=document.createElement('a');
  a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);
  a.download=r.name.replace(/[^a-z0-9]+/gi,'_').toLowerCase()+'.csv';
  document.body.appendChild(a);a.click();a.remove();toast('Downloaded','ok');
}

libBody=function(){
  const all=libCatalogue();
  const match=r=>(libCat==='All'||r.cat===libCat)&&(!libQ||(r.name+' '+r.desc+' '+r.cat).toLowerCase().includes(libQ.toLowerCase()));
  const shown=all.filter(match);
  const card=r=>`<div class="rcard" onclick='libOpen(${JSON.stringify(JSON.stringify(r))})'>
    <div class="rname">${esc(r.name)}<button class="pin ${(DB.pins||[]).includes(r.name)?'on':''}" title="Pin"
      onclick='event.stopPropagation();libPin(${JSON.stringify(r.name)})'>★</button></div>
    <div class="rdesc">${esc(r.desc)}</div>
    <div class="pill-row"><span class="tag">${esc(r.cat)}</span>${r.go?'<span class="tag info">screen</span>':`<span class="tag brand">${(REPORTS()[r.idx][2]()).rows.length} rows</span>`}</div></div>`;
  const pinned=all.filter(r=>(DB.pins||[]).includes(r.name));
  const recent=(DB.recent||[]).map(n=>all.find(r=>r.name===n)).filter(Boolean).filter(r=>!(DB.pins||[]).includes(r.name));
  const rest=shown.filter(r=>!(DB.pins||[]).includes(r.name));
  return `${pinned.length&&!libQ&&libCat==='All'?`<div class="card" style="margin-bottom:20px"><header><div><h3>Pinned</h3>
      <p>Your regulars, whatever filter is on</p></div></header><div class="pad"><div class="rgrid">${pinned.map(card).join('')}</div></div></div>`:''}
    ${recent.length&&!libQ&&libCat==='All'?`<div class="card" style="margin-bottom:20px"><header><div><h3>Recently opened</h3></div></header>
      <div class="pad"><div class="rgrid">${recent.map(card).join('')}</div></div></div>`:''}
    <div class="card"><header><div><h3>${libCat==='All'?'All reports':esc(libCat)}</h3>
      <p>${shown.length} report${shown.length===1?'':'s'}${libQ?` matching "${esc(libQ)}"`:''}</p></div></header>
      <div class="pad">${shown.length?`<div class="rgrid">${rest.map(card).join('')}</div>`:emptyBox('No match','Try a different word, or clear the category filter.')}</div></div>`;
};

function saveSite(id){
  const name=V('st_n').trim();if(!name)return toast('Give it a name','bad');
  const key=normKey(name);
  const clash=DB.sites.find(x=>normKey(x.name)===key&&x.id!==id);
  if(clash)return toast(`Already on the list as "${clash.name}"`,'bad');
  const t=V('st_t'),branch=V('st_b');
  if(t==='SITE'&&!V('st_c'))return toast('Pick the client this site belongs to','bad');
  if(id){const s=site(id);
    Object.assign(s,{name,branch,type:t,client:t==='SITE'?V('st_c'):undefined,
      head:t==='SITE'?V('st_h'):undefined,addr:V('st_a')});
    log('SITE',s.name,'Edited','');}
  else{
    const s={id:uid(t==='SITE'?'ST':'GD'),name,branch,type:t,status:'ACTIVE',
      client:t==='SITE'?V('st_c'):undefined,head:t==='SITE'?V('st_h'):undefined,addr:V('st_a')};
    DB.sites.push(s);log('SITE',s.name,'Created',byId(DB.branches,branch).name);}
  save();Sheet.close();
  if(!id){
    /* a site created in another branch would be filtered out of the current view,
       so follow it there rather than letting it look like nothing happened */
    if(myBranches().includes(branch)&&DB.session.branch!=='ALL'&&DB.session.branch!==branch){
      DB.session.branch=branch;save();
      toast(`${name} created — switched to ${byId(DB.branches,branch).name} to show it`,'ok');
    } else toast(`${name} created${t==='SITE'?' — add its BOQ next':''}`,'ok');
    justAdded=name;location.hash='#sites';
  } else toast('Saved','ok');
  render();
}
let justAdded=null;
function toggleSite(id){const s=site(id);
  if(s.status==='CLOSED'){s.status='ACTIVE';log('SITE',s.name,'Reopened','')}
  else{
    const st=stockRows().filter(x=>x.site===id&&x.bal>0.001);
    if(st.length&&!confirm(`${st.length} item(s) still show stock at ${s.name}. Close it anyway?`))return;
    s.status='CLOSED';s.closedOn=today();log('SITE',s.name,'Closed','')}
  save();Sheet.close();toast(s.status==='CLOSED'?'Site closed':'Site reopened','ok');render();
}
