/* ============================================================
   v24 — filling an indent from another site instead of buying it.

   The transfer was modelled the wrong way round. It was treated as
   material arriving at B out of nowhere, so B's reconciliation
   added it on top of what B had indented — and B ended up answering
   for the same cable twice, once as indent and once as arrival.

   It is not a separate inflow. It is a way of filling an indent.
   B indents in the normal way. The central store looks at it and
   decides not to buy: site A has the cable sitting idle. So the
   store raises a transfer request on A, A dispatches it, and B
   acknowledges it exactly as it would acknowledge a challan from
   the store — in full or in part.

   Three things follow, and all three were wrong before:

     · the quantity comes off what Procurement still has to buy on
       that indent, because it is covered
     · it counts as fulfilment of the indent, not as a second
       arrival, so B's reconciliation does not add it twice
     · it comes off A, which drew it and no longer has it

   The one that does add separately is an ad-hoc transfer nobody
   indented for — that is a genuine extra arrival, and it still
   shows in its own column.
   ============================================================ */

/* ---------- what a transfer has covered on an indent line ---------- */
function xferQtyOfIndentLine(indId,lineId){
  let q=0;
  (DB.transfers||[]).forEach(t=>{
    if(t.status==='CANCELLED')return;
    (t.lines||[]).forEach(l=>{if(l.indent===indId&&l.indentLine===lineId)q+=+l.qty||0});
  });
  return n2(q);
}
/* a request that has been raised but not yet answered holds the
   quantity: if it did not, Procurement would buy the same cable that
   is on its way from the next site. Declining releases it again. */
function xrReserved(indId,lineId){
  let q=0;
  (DB.xreqs||[]).forEach(r=>{
    if(r.status!=='OPEN')return;
    (r.lines||[]).forEach(l=>{if(l.indent===indId&&l.indentLine===lineId)q+=+l.qty||0});
  });
  return n2(q);
}
/* Procurement only has to buy what is neither covered nor spoken for */
indentBal=function(indId,lineId){
  const i=byId(DB.indents,indId);if(!i)return 0;
  const l=(i.lines||[]).find(x=>x.id===lineId);if(!l)return 0;
  return n2(+l.qty-poQtyOfIndentLine(indId,lineId)
    -xferQtyOfIndentLine(indId,lineId)-xrReserved(indId,lineId));
};

/* a transfer raised against an indent is fulfilment, not a fresh arrival */
const xferLinked=l=>!!(l&&l.indent);
xferIn=function(siteId,prodId,make){
  let q=0;
  (DB.transfers||[]).forEach(t=>{if(t.toSite!==siteId||t.status!=='RECEIVED')return;
    (t.lines||[]).forEach(l=>{
      if(xferLinked(l))return;                 // already inside the indent total
      if(l.prod===prodId&&(l.make||'')===(make||''))q+=+l.qty||0;});});
  return n2(q);
};
/* but it is worth seeing how much of the indent came that way */
function xferInAgainstIndent(siteId,prodId,make){
  let q=0;
  (DB.transfers||[]).forEach(t=>{if(t.toSite!==siteId||t.status!=='RECEIVED')return;
    (t.lines||[]).forEach(l=>{
      if(!xferLinked(l))return;
      if(l.prod===prodId&&(l.make||'')===(make||''))q+=+l.qty||0;});});
  return n2(q);
}

/* ---------- the reconciliation stops counting it twice ---------- */
recLines=function(siteId){
  const m={};
  const put=(prodId,make,uom)=>{
    const k=prodId+'||'+(make||'');
    return m[k]=m[k]||{prod:prodId,make:make||'',uom:uom||prod(prodId).uom||'',
      indented:0,billed:0,inQty:0,byXfer:0,outQty:0};
  };
  scoped(DB.boqs).filter(b=>b.kind==='BOQ'&&b.status==='LOCKED'&&b.site===siteId).forEach(b=>{
    (b.lines||[]).forEach(l=>{
      const e=put(l.prod,l.make,l.uom);
      e.indented=n2(e.indented+indentedQty(b.id,l.id));
    });
    reconRows(b).forEach(x=>{const e=put(x.prod,x.make,x.uom);e.billed=n2(e.billed+x.billed)});
  });
  (DB.transfers||[]).forEach(t=>{
    if(t.status!=='RECEIVED')return;
    if(t.fromSite!==siteId&&t.toSite!==siteId)return;
    (t.lines||[]).forEach(l=>{
      const e=put(l.prod,l.make);
      if(t.fromSite===siteId)e.outQty=n2(e.outQty+ +l.qty);
      else if(xferLinked(l))e.byXfer=n2(e.byXfer+ +l.qty);   // already in `indented`
      else e.inQty=n2(e.inQty+ +l.qty);                      // nobody indented for it
    });
  });
  return Object.values(m).map(x=>({...x,
    final:n2(x.indented+x.inQty-x.outQty-x.billed)}))
    .filter(x=>x.indented>0||x.inQty>0||x.outQty>0||x.byXfer>0)
    .sort((a,b)=>pname(a.prod).localeCompare(pname(b.prod)));
};

/* ============================================================
   THE TRANSFER REQUEST — raised on an indent, filled by a site
   ============================================================ */
if(!DB.xreqs)DB.xreqs=[];
CHAINS.XFER=[{role:'R-PUR',label:'Procurement'}];

/* which sites hold something an indent still needs */
function xrFinders(i,l){
  const need=indentBal(i.id,l.id);
  if(need<=0.001)return [];
  return scoped(DB.sites).filter(s=>s.id!==i.site&&s.status!=='CLOSED')
    .map(s=>({site:s,have:n2(stockAt(s.id,l.prod,l.make))}))
    .filter(x=>x.have>0.001)
    .sort((a,b)=>b.have-a.have);
}
function xrSheet(indentId){
  const i=byId(DB.indents,indentId);if(!i)return;
  const open=(i.lines||[]).filter(l=>indentBal(i.id,l.id)>0.001);
  if(!open.length)return toast('Nothing left to source on this indent','bad');
  const opts={};
  open.forEach(l=>{opts[l.id]=xrFinders(i,l)});
  const any=Object.values(opts).some(a=>a.length);
  if(!any)return toast('No other site is holding any of what this indent still needs','bad');
  TMP={indent:indentId,from:'',ask:{}};
  const froms=[...new Map([].concat(...Object.values(opts)).map(x=>[x.site.id,x.site])).values()];
  Sheet.open('Fill it from another site',
    `${esc(i.no)} · ${site(i.site).name} — instead of buying it`,
    `<div class="banner info">▤ <div>Some of what this indent asks for is already standing at another site.
       Ask for it instead of raising a purchase order: the quantity comes off what Procurement has to buy,
       and it reaches ${esc(site(i.site).name)} as fulfilment of <b>this indent</b> — not as a second arrival.</div></div>
     <div class="row2">${field('Take it from',sel('xr_f',froms.map(s=>({v:s.id,t:s.name})),'',
        'onchange="TMP.from=this.value;TMP.ask={};xrDraw()"'))}
       ${field('Needed by',txt('xr_d',i.need||addDays(today(),7),'date'))}</div>
     ${field('Why',txt('xr_r','Idle stock at site — cheaper than buying','text'))}
     <div class="card"><header><div><h3>What it still needs</h3><p id="xr_hint"></p></div></header>
       <div id="xr_lines"></div></div>`,
    `<button class="btn" onclick="Sheet.close()">Cancel</button>
     <button class="btn pri" id="xr_go" onclick="xrSave()">Send the request</button>`);
  TMP.from=froms[0].id;
  const sel1=document.getElementById('xr_f');if(sel1)sel1.value=TMP.from;
  xrDraw();
}
function xrSet(lineId,v){
  const i=byId(DB.indents,TMP.indent),l=i.lines.find(x=>x.id===lineId);
  const need=n2(indentBal(i.id,lineId)+xrReserved(i.id,lineId)), have=n2(stockAt(TMP.from,l.prod,l.make));
  let q=+v||0;if(q<0)q=0;
  const cap=Math.min(need,have);
  if(q>cap){q=cap;toast(cap<=0?`${site(TMP.from).name} is not holding any of this`
    :`Capped at ${qty(cap)} — ${have<need?'that is all that site holds':'that is all the indent still needs'}`,'bad')}
  TMP.ask=TMP.ask||{};
  if(q<=0)delete TMP.ask[lineId];else TMP.ask[lineId]=q;
  xrDraw();
}
function xrDraw(){
  const el=document.getElementById('xr_lines');if(!el)return;
  const i=byId(DB.indents,TMP.indent);
  const open=(i.lines||[]).filter(l=>indentBal(i.id,l.id)>0.001);
  const h=document.getElementById('xr_hint');
  if(h)h.textContent=`${open.length} line(s) still to source · quantity capped at what ${site(TMP.from).name} holds`;
  const rows=open.map(l=>{
    const need=indentBal(i.id,l.id), have=n2(stockAt(TMP.from,l.prod,l.make));
    const q=+(TMP.ask||{})[l.id]||0;
    return `<tr ${q>0?'style="background:var(--brand-soft)"':(have<=0?'style="opacity:.5"':'')}>
      <td>${esc(pname(l.prod))}<small class="mono">${esc(prod(l.prod).code||'')}${l.make?' · '+esc(l.make):''}</small></td>
      <td>${esc(prod(l.prod).uom||'')}</td>
      <td class="rt mono">${qty(+l.qty)}</td>
      <td class="rt mono"><b>${qty(need)}</b></td>
      <td class="rt mono" style="color:${have>0?'var(--ok)':'var(--muted)'}">${qty(have)}</td>
      <td class="rt"><input class="inp rt" style="width:96px" inputmode="decimal" value="${q||''}" placeholder="—"
          ${have<=0?'disabled':''} onchange="xrSet('${l.id}',this.value)"></td>
      <td>${q>0?(q>=need-0.001?'<span class="tag ok">covers the line</span>'
        :'<span class="tag warn">part — the rest still has to be bought</span>'):''}</td></tr>`;
  }).join('');
  el.innerHTML=`<div class="pad" style="border-bottom:1px solid var(--line);display:flex;gap:9px">
      <button class="btn sm" onclick="xrFill()">Take everything they can spare</button>
      <button class="btn sm" onclick="TMP.ask={};xrDraw()">Clear</button></div>
    <div class="tw"><table><thead><tr><th style="min-width:220px">Item</th><th>Unit</th>
      <th class="rt">Indented</th><th class="rt">Still to source</th>
      <th class="rt">At ${esc(site(TMP.from).name)}</th><th class="rt">Asking for</th><th></th></tr></thead>
      <tbody>${rows}</tbody></table></div>`;
  const g=document.getElementById('xr_go');
  if(g)g.disabled=!Object.keys(TMP.ask||{}).length;
}
function xrFill(){
  const i=byId(DB.indents,TMP.indent);
  TMP.ask={};
  (i.lines||[]).forEach(l=>{
    const q=n2(Math.min(indentBal(i.id,l.id),stockAt(TMP.from,l.prod,l.make)));
    if(q>0)TMP.ask[l.id]=q;
  });
  xrDraw();
}
function xrSave(){
  const i=byId(DB.indents,TMP.indent);
  const lines=[];
  (i.lines||[]).forEach(l=>{
    const q=+(TMP.ask||{})[l.id]||0;
    if(q<=0)return;
    lines.push({indent:i.id,indentLine:l.id,prod:l.prod,make:l.make||'',qty:n2(q)});
  });
  if(!lines.length)return toast('Ask for at least one item','bad');
  const r={id:uid('XR'),no:doc(DB,'XRQ'),date:today(),by:DB.session.user,
    fromSite:TMP.from,toSite:i.site,indent:i.id,indentNo:i.no,need:V('xr_d'),reason:V('xr_r'),
    branch:site(i.site).branch,status:'OPEN',lines};
  DB.xreqs.push(r);
  log('TRANSFER',r.no,`Requested from ${site(r.fromSite).name}`,
    `${lines.length} line(s) for ${i.no} at ${site(i.site).name}`);
  save();Sheet.close();
  toast(`${r.no} sent to ${site(r.fromSite).name} — ${lines.length} line(s)`,'ok');render();
}

/* ---------- the holding site sends it ---------- */
function xrSend(id){
  const r=(DB.xreqs||[]).find(x=>x.id===id);if(!r||r.status!=='OPEN')return;
  TMP={xreq:id,send:{}};
  r.lines.forEach(l=>{TMP.send[l.indentLine]=n2(Math.min(l.qty,stockAt(r.fromSite,l.prod,l.make)))});
  Sheet.open('Send it across',`${esc(r.no)} · ${site(r.fromSite).name} → ${site(r.toSite).name}`,
    `<div class="banner info">▤ <div>This fills <b>${esc(r.indentNo)}</b> at ${esc(site(r.toSite).name)}.
       Send what you can spare — anything short stays on the indent for Procurement to buy.
       It leaves here now and lands there when they acknowledge it.</div></div>
     ${field('Date',txt('xs_d',today(),'date'))}
     <div class="card"><div id="xs_lines"></div></div>`,
    `<button class="btn" onclick="Sheet.close()">Cancel</button>
     <button class="btn" onclick="xrDecline('${id}')">Cannot spare it</button>
     <button class="btn pri" id="xs_go" onclick="xrDispatch()">Dispatch</button>`);
  xrSendDraw();
}
function xrSendSet(lineId,v){
  const r=(DB.xreqs||[]).find(x=>x.id===TMP.xreq);
  const l=r.lines.find(x=>x.indentLine===lineId);
  const have=n2(stockAt(r.fromSite,l.prod,l.make));
  let q=+v||0;if(q<0)q=0;
  const cap=Math.min(l.qty,have);
  if(q>cap){q=cap;toast(`Capped at ${qty(cap)} — ${have<l.qty?'that is all you hold':'that is all they asked for'}`,'bad')}
  TMP.send[lineId]=q;xrSendDraw();
}
function xrSendDraw(){
  const el=document.getElementById('xs_lines');if(!el)return;
  const r=(DB.xreqs||[]).find(x=>x.id===TMP.xreq);
  el.innerHTML=`<div class="tw"><table><thead><tr><th style="min-width:220px">Item</th><th>Unit</th>
      <th class="rt">Asked for</th><th class="rt">You hold</th><th class="rt">Sending</th><th></th></tr></thead>
      <tbody>${r.lines.map(l=>{
        const have=n2(stockAt(r.fromSite,l.prod,l.make)), q=+(TMP.send||{})[l.indentLine]||0;
        return `<tr><td>${esc(pname(l.prod))}<small class="mono">${esc(prod(l.prod).code||'')}${l.make?' · '+esc(l.make):''}</small></td>
          <td>${esc(prod(l.prod).uom||'')}</td>
          <td class="rt mono">${qty(l.qty)}</td>
          <td class="rt mono" style="color:${have<l.qty?'var(--warn)':'inherit'}">${qty(have)}</td>
          <td class="rt"><input class="inp rt" style="width:96px" inputmode="decimal" value="${q||''}" placeholder="—"
              onchange="xrSendSet('${l.indentLine}',this.value)"></td>
          <td>${q>=l.qty-0.001&&q>0?'<span class="tag ok">in full</span>'
            :q>0?`<span class="tag warn">${qty(n2(l.qty-q))} short — stays on the indent</span>`:''}</td></tr>`}).join('')}
      </tbody></table></div>`;
  const g=document.getElementById('xs_go');
  if(g)g.disabled=!Object.values(TMP.send||{}).some(v=>+v>0);
}
function xrDispatch(){
  const r=(DB.xreqs||[]).find(x=>x.id===TMP.xreq);
  const lines=r.lines.map(l=>({prod:l.prod,make:l.make,qty:n2(+(TMP.send||{})[l.indentLine]||0),
      indent:l.indent,indentLine:l.indentLine}))
    .filter(l=>l.qty>0.001);
  if(!lines.length)return toast('Send at least one item','bad');
  const t={id:uid('TR'),no:doc(DB,'TRF'),date:V('xs_d'),fromSite:r.fromSite,toSite:r.toSite,
    branch:site(r.fromSite).branch,reason:`Against ${r.indentNo} — ${r.reason||'transfer request'}`,
    status:'DISPATCHED',xreq:r.id,lines};
  DB.transfers.push(t);
  const full=r.lines.every(l=>n2(+(TMP.send||{})[l.indentLine]||0)>=l.qty-0.001);
  r.status=full?'SENT':'PART_SENT';r.transfer=t.id;r.sentOn=today();
  log('TRANSFER',t.no,`${site(r.fromSite).name} → ${site(r.toSite).name}`,
    `${lines.length} line(s) against ${r.indentNo}`);
  save();Sheet.close();
  toast(`${t.no} dispatched — ${site(r.toSite).name} acknowledges it against ${r.indentNo}`,'ok');render();
}
function xrDecline(id){
  const r=(DB.xreqs||[]).find(x=>x.id===id);if(!r)return;
  const why=prompt('Why can it not be spared?','Needed here');
  if(why===null)return;
  r.status='DECLINED';r.declined=today();r.declineWhy=why;
  log('TRANSFER',r.no,'Declined by '+site(r.fromSite).name,why);
  save();Sheet.close();toast(`${r.no} declined — it goes back to Procurement to buy`,'bad');render();
}

/* ---------- the receiving site acknowledges it like any challan ---------- */
function xrView(id){
  const r=(DB.xreqs||[]).find(x=>x.id===id);if(!r)return;
  const t=r.transfer?(DB.transfers||[]).find(x=>x.id===r.transfer):null;
  const mineSend=r.status==='OPEN'&&canEdit('issue');
  Sheet.open(r.no,`${site(r.fromSite).name} → ${site(r.toSite).name} · against ${esc(r.indentNo)}`,
    `<div class="banner ${r.status==='DECLINED'?'bad':(t&&t.status==='RECEIVED'?'ok':'warn')}">
       ${r.status==='DECLINED'?'▲':(t&&t.status==='RECEIVED'?'✓':'◷')}
       <div><b>${r.status==='OPEN'?`Waiting on ${esc(site(r.fromSite).name)} to send it.`
         :r.status==='DECLINED'?`Declined — ${esc(r.declineWhy||'')}. It goes back to Procurement to buy.`
         :t&&t.status==='RECEIVED'?`Acknowledged at ${esc(site(r.toSite).name)}.`
         :`Dispatched — ${esc(site(r.toSite).name)} has not acknowledged it yet.`}</b>
         This fills ${esc(r.indentNo)}, so the quantity comes off what Procurement has to buy.
         ${esc(r.reason||'')}</div>
       ${mineSend?`<button class="btn sm pri" onclick="Sheet.close();setTimeout(()=>xrSend('${r.id}'),80)">Send it</button>`:''}</div>
     <div class="card"><header><div><h3>Requested</h3><p>${r.lines.length} line(s) · needed by ${dmy(r.need)}</p></div></header>
       <div class="tw"><table><thead><tr><th style="min-width:220px">Item</th><th class="rt">Asked for</th>
         <th class="rt">Sent</th><th class="rt">Short</th></tr></thead>
         <tbody>${r.lines.map(l=>{
           const sent=t?n2((t.lines||[]).filter(x=>x.indentLine===l.indentLine).reduce((a,x)=>a+ +x.qty,0)):0;
           return `<tr><td>${esc(pname(l.prod))}<small class="mono">${esc(prod(l.prod).code||'')}${l.make?' · '+esc(l.make):''}</small></td>
             <td class="rt mono">${qty(l.qty)}</td>
             <td class="rt mono">${sent?qty(sent):'—'}</td>
             <td class="rt mono" style="color:${n2(l.qty-sent)>0.001?'var(--warn)':'var(--ok)'}">
               ${n2(l.qty-sent)>0.001?qty(n2(l.qty-sent)):'nil'}</td></tr>`}).join('')}
         </tbody></table></div></div>
     ${t?`<div class="banner info">▤ <div>Challan <b>${esc(t.no)}</b> ${dmy(t.date)} —
        ${t.status==='RECEIVED'?'acknowledged':'in transit'}. It counts as fulfilment of the indent,
        not as a separate arrival, so it is not added twice on the reconciliation.</div></div>`:''}`,
    `<button class="btn" onclick="Sheet.close()">Close</button>`);
}

/* ---------- where it lives ---------- */
PAGES.xfer=()=>{
  const rows=scoped(DB.xreqs||[]).sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  const mine=rows.filter(r=>r.status==='OPEN');
  const st=r=>r.status==='OPEN'?'<span class="tag warn">waiting to be sent</span>'
    :r.status==='DECLINED'?'<span class="tag bad">declined</span>'
    :(()=>{const t=(DB.transfers||[]).find(x=>x.id===r.transfer);
      return t&&t.status==='RECEIVED'?'<span class="tag ok">acknowledged</span>'
        :'<span class="tag warn">in transit</span>'})();
  return viewBanner('xfer')
    +`<div class="banner ${mine.length?'warn':'info'}">${mine.length?'◷':'▤'} <div>
        ${mine.length?`<b>${mine.length} request(s) waiting to be sent.</b> `:''}
        When an indent asks for something another site is already sitting on, ask for it instead of buying it.
        It reaches the site as fulfilment of <b>that indent</b> — acknowledged in full or in part like any challan —
        and the quantity comes off what Procurement has to buy.</div></div>
      ${rows.length?`<div class="card"><header><div><h3>Transfer requests</h3><p>${rows.length} request(s)</p></div></header>
        <div class="tw"><table><thead><tr><th>Request</th><th>From</th><th>To</th><th>Against</th>
          <th>Date</th><th class="rt">Lines</th><th>State</th><th></th></tr></thead>
          <tbody>${rows.map(r=>`<tr class="row-open" onclick="xrView('${r.id}')">
            <td><b>${esc(r.no)}</b></td><td>${esc(site(r.fromSite).name)}</td><td>${esc(site(r.toSite).name)}</td>
            <td class="mono">${esc(r.indentNo)}</td><td>${dmy(r.date)}</td>
            <td class="rt mono">${r.lines.length}</td><td>${st(r)}</td>
            <td class="rt">${r.status==='OPEN'&&canEdit('issue')
              ?`<button class="btn sm pri" onclick="event.stopPropagation();xrSend('${r.id}')">Send it</button>`
              :`<button class="btn sm" onclick="event.stopPropagation();xrView('${r.id}')">Open</button>`}</td></tr>`).join('')}
          </tbody></table></div></div>`
      :`<div class="card">${emptyBox('No requests yet','Raise one from an indent — the option appears when another site is holding what it needs.')}</div>`}`;
};
NAV.find(g=>g.g==='Store').items.push(['xfer','Transfer requests','⇄']);
SECTIONS.find(s=>s.id==='store').screens.push('xfer');
TITLES.xfer=['Transfer requests','Fill an indent from another site instead of buying it'];

/* the way in: from the indent itself */
const __indOpen24=indOpen;
indOpen=function(id){
  __indOpen24(id);
  const i=DB.indents.find(x=>x.id===id);if(!i)return;
  const foot=document.getElementById('shFoot');
  if(!foot||!canEdit('po'))return;
  const can=(i.lines||[]).some(l=>indentBal(i.id,l.id)>0.001&&xrFinders(i,l).length);
  if(!can)return;
  foot.insertAdjacentHTML('afterbegin',
    `<button class="btn" onclick="Sheet.close();setTimeout(()=>xrSheet('${i.id}'),80)">Fill from another site</button>`);
};
/* and from the procurement lens, where the buying decision is made */
const __trkBuy24=trkBuyView;
trkBuyView=function(){
  const h=__trkBuy24();
  const inds=scoped(DB.indents).filter(i=>isApproved(i)&&
    (i.lines||[]).some(l=>indentBal(i.id,l.id)>0.001&&xrFinders(i,l).length));
  if(!inds.length)return h;
  return `<div class="pad"><div class="banner warn">⇄ <div>
      <b>${inds.length} indent(s) ask for something another site is already holding.</b>
      Asking for it costs nothing and comes off what has to be bought.</div>
    <button class="btn sm pri" onclick="xrSheet('${inds[0].id}')">Look at ${esc(inds[0].no)}</button></div></div>`+h;
};

/* the reconciliation shows how much of the indent came across, without adding it */
const __recView24=recView;
recView=function(id){
  __recView24(id);
  const r=(DB.recons||[]).find(x=>x.id===id);if(!r)return;
  const any=(r.lines||[]).some(l=>l.byXfer>0);
  if(!any)return;
  const body=document.getElementById('shBody');if(!body)return;
  const n=n2((r.lines||[]).reduce((a,l)=>a+(l.byXfer||0),0));
  body.insertAdjacentHTML('beforeend',
    `<div class="banner info">⇄ <div><b>${qty(n)} unit(s) of what was indented arrived from another site
      rather than from a supplier.</b> That is already inside the indented figure above — it filled the indent,
      it did not arrive on top of it, so it is not counted twice.</div></div>`);
};


/* ---------------- boot ---------------- */
window.addEventListener('error',e=>console.warn('ERP:',e.message));
migratePerms();ensureNew();
render();
