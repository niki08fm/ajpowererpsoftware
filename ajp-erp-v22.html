  const clash=DB.suppliers.find(x=>normKey(x.name)===key&&x.id!==id);
  if(clash)return toast(`Already on the list as "${clash.name}"`,'bad');
  const rec={name,type:V('sp_t'),branch:V('sp_b'),gstin:V('sp_g'),terms:+V('sp_d')||30};
  if(id){Object.assign(sup(id),rec);log('SUPPLIER',name,'Edited','')}
  else{DB.suppliers.push({id:uid('SP'),...rec});log('SUPPLIER',name,'Added',rec.type)}
  save();Sheet.close();toast(id?'Saved':'Added','ok');render();
}


/* ============================================================
   DEPARTMENT DESKS
   The legacy build gave every user the same 174-table menu and
   let credential_master hide bits of it. This instead starts from
   the question each department actually asks when they sit down:
     Planning   — what has the client given us, and is it priced right?
     Site       — what do I need, and what did I use?
     Store      — what is coming in, and what goes out to site?
     Procurement— what has been approved to buy, and at what rate?
     Billing    — what work is done that the client hasn't paid for?
     Accounts   — who do we owe, who owes us, and what is blocked?
   ============================================================ */
const DEPTS={
  planning:{name:'Planning',roles:['R-PLAN'],
    line:'Price the work order, keep the item master clean, and watch estimate against actual.'},
  site:{name:'Site team',roles:['R-SITE'],
    line:'Raise what the site needs, receive it, and book what was used.'},
  store:{name:'Store',roles:['R-STORE'],
    line:'Receive against orders, issue to site, and keep the stock honest.'},
  procurement:{name:'Procurement',roles:['R-PUR'],
    line:'Turn approved indents into orders at a rate you can defend.'},
  billing:{name:'Billing',roles:['R-PM'],
    line:'Measure completed work into RA bills before it ages.'},
  accounts:{name:'Accounts',roles:['R-ACC'],
    line:'Book supplier bills, release payments, and keep the cost heads complete.'},
  management:{name:'Management',roles:['R-GM'],
    line:'Sign what is waiting, and watch where value stops moving.'}
};
function myDept(){
  if(DB.session.dept&&DEPTS[DB.session.dept])return DB.session.dept;
  const r=me().role;
  return Object.keys(DEPTS).find(k=>DEPTS[k].roles.includes(r))||'management';
}
function setDept(d){DB.session.dept=d;save();location.hash='#desk';render()}

/* one queue row = a thing someone can clear today */
function deskQueue(items){
  const live=items.filter(i=>i.n>0||i.always);
  if(!live.length)return `<div class="empty" style="padding:30px"><b>Desk is clear</b>Nothing is waiting on your department right now.</div>`;
  return `<div class="tw"><table><tbody>${live.map(i=>`<tr>
    <td style="width:64px"><span class="tag ${i.tone||'brand'}" style="font-size:15px;font-weight:700;padding:6px 13px">${i.n}</span></td>
    <td><b>${esc(i.label)}</b><small>${esc(i.sub||'')}</small></td>
    <td class="rt mono">${i.value!=null?money(i.value):''}</td>
    <td class="rt" style="width:150px">${i.act?`<button class="btn sm ${i.pri?'pri':''}" onclick="${i.act}">${esc(i.btn||'Open')}</button>`:''}</td>
  </tr>`).join('')}</tbody></table></div>`;
}
function deskCard(title,sub,items){
  return `<div class="card"><header><div><h3>${title}</h3><p>${sub}</p></div></header>${deskQueue(items)}</div>`}
function kpiRow(k){return `<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(206px,1fr));margin-bottom:20px">
  ${k.map(x=>`<div class="card kpi"><label>${x[0]}</label><small>${x[2]||''}</small><b>${x[1]}</b></div>`).join('')}</div>`}

/* ---- the numbers each department is judged on ---- */
function deskData(){
  ensureExpenses();
  const mySites=liveSites();
  const myTurnDocs=pendingForMe();
  const openPO=scoped(DB.pos).filter(p=>isApproved(p)&&p.lines.some(l=>poBal(p.id,l.id)>0));
  const overduePO=openPO.filter(p=>p.due<today());
  const transit=scoped(DB.issues).filter(i=>i.status==='DISPATCHED');
  let indUnordered=0,indLines=0;
  scoped(DB.indents).filter(isApproved).forEach(i=>i.lines.forEach(l=>{const b=indentBal(i.id,l.id);
    if(b>0){indUnordered+=b*(prod(l.prod).rate||0);indLines++}}));
  const cmpOpen=scoped(DB.quotes).filter(q=>!q.selected);
  const lk=leakage();
  const toBook=[];scoped(DB.pos).forEach(p=>p.lines.forEach(l=>{if(sbBal(p.id,l.id)>0)toBook.push(p)}));
  const unpaid=scoped(DB.supbills).filter(b=>isApproved(b)&&!b.paid);
  const subUnpaid=scoped(DB.subbills).filter(b=>isApproved(b)&&!b.paid);
  const uncollected=scoped(DB.clientbills).filter(b=>isApproved(b)&&!b.received);
  const expPending=DB.expenses.filter(e=>inScope(e.branch)&&e.status==='PENDING');
  const draftBoq=scoped(DB.boqs).filter(b=>b.status!=='LOCKED');
  const noBoq=mySites.filter(s=>!boqOf(s.id));
  const returned=scoped(DB.indents).filter(i=>isRejected(i));
  let boqLeft=0;scoped(DB.boqs).forEach(b=>b.lines.forEach(l=>{
    const bal=+l.boqQty-indentedQty(b.id,l.id)-requestedQty(b.id,l.id);
    if(bal>0)boqLeft+=bal*(+l.estRate||0)}));
  const siteStockVal=stockRows().filter(r=>r.bal>0&&site(r.site).type==='SITE'&&inScope(site(r.site).branch))
    .reduce((a,r)=>a+r.bal*lastRate(r.prod,r.make),0);
  const storeStockVal=stockRows().filter(r=>r.bal>0&&site(r.site).type==='STORE'&&inScope(site(r.site).branch))
    .reduce((a,r)=>a+r.bal*lastRate(r.prod,r.make),0);
  return {mySites,myTurnDocs,openPO,overduePO,transit,indUnordered,indLines,cmpOpen,lk,
    toBook:[...new Set(toBook)],unpaid,subUnpaid,uncollected,expPending,draftBoq,noBoq,returned,
    boqLeft,siteStockVal,storeStockVal};
}

/* one search box instead of hunting the menu */
function gsearch(q){
  const box=document.getElementById('gres');q=(q||'').trim().toLowerCase();
  if(q.length<2){box.classList.remove('on');box.innerHTML='';return}
  const hit=(t)=>t.toLowerCase().includes(q);
  const out=[];
  const screens=SECTIONS.flatMap(s=>secScreens(s)).filter(k=>hit((TITLES[k]||[k])[0]))
    .slice(0,4).map(k=>({g:'Screens',t:(TITLES[k]||[k])[0],s:secOf(k).label,go:`location.hash='#${k}'`}));
  const reps=libCatalogue().filter(r=>hit(r.name)).slice(0,4)
    .map(r=>({g:'Reports',t:r.name,s:r.cat,go:r.go?`location.hash='#${r.go}'`:`misOpen(${r.idx})`}));
  const sites=scoped(DB.sites).filter(x=>hit(x.name)).slice(0,3)
    .map(x=>({g:'Sites',t:x.name,s:byId(DB.branches,x.branch).name,go:`location.hash='#sites'`}));
  const items=DB.products.filter(x=>hit(x.name)||hit(x.code)).slice(0,4)
    .map(x=>({g:'Items',t:x.code+' — '+x.name,s:byId(DB.cats,x.cat).name,go:`itemSheet('${x.id}')`}));
  const docs=[].concat(scoped(DB.pos),scoped(DB.indents),scoped(DB.supbills),scoped(DB.clientbills))
    .filter(d=>hit(d.no)).slice(0,4).map(d=>({g:'Documents',t:d.no,s:site(d.site).name||'',go:`apprSheet('${d.id}')`}));
  [...screens,...docs,...reps,...items,...sites].forEach(x=>out.push(x));
  if(!out.length){box.innerHTML='<b class="h">No match</b><a>Nothing found for that</a>';box.classList.add('on');return}
  let html='',g='';
  out.forEach(o=>{if(o.g!==g){g=o.g;html+=`<b class="h">${g}</b>`}
    html+=`<a onmousedown="${o.go};document.getElementById('gres').classList.remove('on');document.getElementById('gq').value=''">${esc(o.t)}<small>${esc(o.s||'')}</small></a>`});
  box.innerHTML=html;box.classList.add('on');
}

/* ---------- photo attachments (downscaled, so storage survives) ---------- */
function photoInput(id){return `<div class="field"><label>Photos</label>
  <input class="inp" type="file" id="${id}" accept="image/*" multiple onchange="grabPhotos('${id}')">
  <div class="hint">Up to three. Scaled down before saving, so the file stays small.</div>
  <div id="${id}_pv" class="pill-row" style="margin-top:8px"></div></div>`}
window.__photos={};
function grabPhotos(id){
  const f=document.getElementById(id);if(!f||!f.files)return;
  window.__photos[id]=window.__photos[id]||[];
  [...f.files].slice(0,3).forEach(file=>{
    const r=new FileReader();
    r.onload=e=>{const img=new Image();
      img.onload=()=>{
        const max=340,sc=Math.min(1,max/Math.max(img.width,img.height));
        const c=document.createElement('canvas');c.width=img.width*sc;c.height=img.height*sc;
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        const d=c.toDataURL('image/jpeg',0.6);
        const arr=window.__photos[id];if(arr.length<3){arr.push(d);drawPhotos(id)}};
      img.src=e.target.result};
    r.readAsDataURL(file)});
}
function drawPhotos(id){const el=document.getElementById(id+'_pv');if(!el)return;
  el.innerHTML=(window.__photos[id]||[]).map((d,i)=>
    `<span style="position:relative;display:inline-block"><img src="${d}" style="height:54px;border-radius:6px;border:1px solid var(--line)">
     <button class="btn sm bad" style="position:absolute;top:-6px;right:-6px;padding:0 5px" onclick="window.__photos['${id}'].splice(${i},1);drawPhotos('${id}')">✕</button></span>`).join('')}
const takePhotos=id=>{const a=window.__photos[id]||[];window.__photos[id]=[];return a};
function photoStrip(arr){return (arr&&arr.length)
  ? `<div class="pill-row" style="margin-top:8px">${arr.map(d=>`<img src="${d}" style="height:70px;border-radius:6px;border:1px solid var(--line)">`).join('')}</div>`:''}

function amendSheet(){
  ensureNew();
  const boqs=scoped(DB.boqs).filter(b=>b.status==='LOCKED');
  if(!boqs.length)return toast('No locked BOQ to amend','bad');
  TMP={boq:boqs[0].id};
  Sheet.open('Request a BOQ amendment','Revising a quantity on a locked BOQ',
    field('BOQ',sel('am_b',boqs.map(b=>({v:b.id,t:b.no+' — '+site(b.site).name})),'','onchange="TMP.boq=this.value;amendLines()"'))
    +`<div id="am_l"></div>`
    +`<div class="row2">${field('Revised quantity',txt('am_q',0,'number'))}${field('Date',txt('am_d',today(),'date'))}</div>`
    +field('Reason',txt('am_r','','text','placeholder="e.g. client added two floors; drawing revision R3"'))
    +photoInput('am_ph'),
    `<button class="btn" onclick="Sheet.close()">Cancel</button><button class="btn pri" onclick="saveAmend()">Send for approval</button>`);
  amendLines();
}
function amendLines(){
  const b=DB.boqs.find(x=>x.id===TMP.boq);const el=document.getElementById('am_l');if(!el)return;
  el.innerHTML=field('BOQ line',sel('am_ln',b.lines.map(l=>({v:l.id,t:lineName(l)+' · '+l.work+' — now '+qty(amendedQty(l))})),'','onchange="amendPrefill()"'));
  amendPrefill();
}
function amendPrefill(){const b=DB.boqs.find(x=>x.id===TMP.boq);
  const l=b.lines.find(x=>x.id===V('am_ln'));const q=document.getElementById('am_q');
  if(l&&q)q.value=amendedQty(l);}
function saveAmend(){
  const b=DB.boqs.find(x=>x.id===TMP.boq);const l=b.lines.find(x=>x.id===V('am_ln'));
  const to=+V('am_q');if(!to)return toast('Enter the revised quantity','bad');
  const from=amendedQty(l);
  if(to===from)return toast('That is the quantity it already carries','bad');
  const used=Math.max(indentedQty(b.id,l.id),clientBilledQty(b.id,l.id,'sup'));
  if(to<used)return toast(`Cannot go below ${qty(used)} — that much is already indented or billed`,'bad');
  if(!V('am_r'))return toast('Give a reason — this is the audit record','bad');
  const a={id:uid('AM'),by:DB.session.user,no:doc(DB,'AMD'),date:V('am_d'),boq:b.id,line:l.id,site:b.site,branch:b.branch,
    fromQty:from,toQty:to,reason:V('am_r'),photos:takePhotos('am_ph'),appr:newAppr('AMEND'),
    amount:n2((to-from)*l.supplyRate)};
  DB.amendments.push(a);log('AMEND',a.no,`${lineName(l)} ${qty(from)} → ${qty(to)}`,a.reason);
  save();Sheet.close();toast('Amendment sent for approval','ok');render();
}

function landed(q,supId){
  const e=(q.extras&&q.extras[supId])||{freight:0,disc:0,days:30};
  const base=q.lines.reduce((a,l)=>a+(+l.rates[supId]||0)*(+l.qty),0);
  const afterDisc=base*(1-(+e.disc||0)/100);
  return {base,disc:base-afterDisc,freight:+e.freight||0,days:+e.days||30,
    total:n2(afterDisc+(+e.freight||0))};
}

   ============================================================ */
function belowMin(){
  const out=[];
  DB.products.filter(p=>+p.minQty>0).forEach(p=>{
    const held=stockRows().filter(r=>r.prod===p.id&&site(r.site).type==='STORE'&&inScope(site(r.site).branch))
      .reduce((a,r)=>a+r.bal,0);
    if(held<+p.minQty)out.push({p,held,short:n2(+p.minQty-held)});
  });
  return out.sort((a,b)=>b.short*b.p.rate-a.short*a.p.rate);
}

/* ============================================================
   E-INVOICE — IRN and e-way bill against a certified RA bill.
   The legacy build carried the full IRP JSON schema; this
   produces the same payload shape and stores the reference.
   ============================================================ */
function irnFor(b){
  const seed=(b.no+b.date).split('').reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,7);
  const hex='0123456789abcdef';let s='';
  for(let i=0;i<64;i++)s+=hex[(seed>>>(i%28))%16^(i*7+seed)%16];
  return s;
}
function einvSheet(id){
  const b=DB.clientbills.find(x=>x.id===id);const s=site(b.site);
  const cl=byId(DB.clients,s.client);const boq=DB.boqs.find(x=>x.id===b.boq);
  const val=clientBillValue(b);
  const payload={Version:'1.1',TranDtls:{TaxSch:'GST',SupTyp:'B2B'},
    DocDtls:{Typ:'INV',No:b.no,Dt:dmy(b.date)},
    SellerDtls:{Gstin:'36AAACA0000A1Z5',LglNm:'AJ Power Solutions',Loc:byId(DB.branches,b.branch).name,Pin:500081,Stcd:'36'},
    BuyerDtls:{Gstin:cl.gstin||'URP',LglNm:cl.name,Pos:'36',Loc:s.name},
    ItemList:b.lines.filter(l=>+l.supplyQty>0||+l.instQty>0).map((l,i)=>({SlNo:String(i+1),
      PrdDesc:prod(l.prod).name,HsnCd:prod(l.prod).hsn,Qty:+l.supplyQty+ +l.instQty,
      UnitPrice:l.supplyRate,TotAmt:n2(l.supplyQty*l.supplyRate+l.instQty*(+l.instRate||0)),
      GstRt:l.gst})),
    ValDtls:{AssVal:n2(b.lines.reduce((a,l)=>a+l.supplyQty*l.supplyRate+l.instQty*(+l.instRate||0),0)),TotInvVal:n2(val)}};
  const has=!!b.irn;
  Sheet.open(has?'e-Invoice registered':'Generate e-Invoice',b.no+' · '+cl.name,
    (has?`<div class="banner info" style="background:var(--ok-soft);border-color:#BFE6D3">
        <div><b>IRN</b><div class="mono" style="word-break:break-all;font-size:11.5px">${esc(b.irn)}</div>
        <div style="margin-top:6px"><b>Acknowledgement</b> ${esc(b.ackNo)} · ${dmy(b.ackDt)}
        ${b.ewb?`<br><b>e-Way bill</b> ${esc(b.ewb)} · valid to ${dmy(b.ewbTill)}`:''}</div></div></div>`
      :`<div class="banner view">Nothing has been sent to the IRP yet. Registering locks this bill — the quantities and rates cannot change afterwards.</div>`)
    +`<div class="card"><header><h3>Payload</h3><p>Exactly what would go to the IRP</p></header>
      <div class="pad"><pre class="mono" style="margin:0;font-size:11px;line-height:1.55;white-space:pre-wrap;word-break:break-word;color:var(--ink-2)">${esc(JSON.stringify(payload,null,2))}</pre></div></div>`,
    has?`<button class="btn" onclick="Sheet.close()">Close</button>${b.ewb?'':`<button class="btn pri" onclick="genEwb('${id}')">Generate e-way bill</button>`}`
      :`<button class="btn" onclick="Sheet.close()">Cancel</button><button class="btn pri" onclick="genIrn('${id}')">Register with IRP</button>`);
}
function quickIrn(id){          // register in one press — no screen in between
  const b=DB.clientbills.find(x=>x.id===id);
  if(!isApproved(b))return toast('The bill has to be certified before it can be registered','bad');
  if(b.irn)return einvSheet(id);

function seedExtras(){
  ensureNew();
  if(DB.extraSeeded)return;DB.extraSeeded=true;
  /* reorder levels on the fast-moving items */
  DB.products.forEach(p=>{if(p.minQty)return;      // a level that makes sense for what the item costs
    p.minQty=p.rate<500?200:p.rate<3000?40:p.rate<25000?4:0});
  const mk=(m,d)=>{const x=new Date();x.setMonth(x.getMonth()-m);x.setDate(d);return x.toISOString().slice(0,10)};
  /* six months of labour attendance, which is where the wage cost comes from */
  const seededWages=DB.expenses.filter(e=>e.head==='Labour & wages'&&!e.att);
  seededWages.forEach(e=>{const i=DB.expenses.indexOf(e);if(i>=0)DB.expenses.splice(i,1)});
  DB.sites.filter(s=>s.type==='SITE').forEach((s,si)=>{
    for(let m=5;m>=0;m--)for(const d of [6,14,22]){
      const rows=LABOUR.map((l,k)=>({k:l.k,count:[6,9,2,3][k]+((m+si+k)%3),rate:l.r}));
      const total=n2(rows.reduce((a,r)=>a+r.count*r.rate,0)*0.34);
      const date=mk(m,d);
      const a={id:uid('AT'),date,site:s.id,branch:s.branch,rows,total,
        note:'Block '+String.fromCharCode(65+(d%3))+' — cable pulling and termination',by:'U2'};
      DB.attendance.push(a);
      DB.expenses.push({id:uid('EX'),date,site:s.id,branch:s.branch,head:'Labour & wages',amount:total,
        note:`Attendance ${dmy(date)} — ${rows.reduce((x,r)=>x+ +r.count,0)} head`,by:'U2',status:'APPROVED',att:a.id});
    }
    /* one return of surplus and one inter-site transfer */
    const held=stockRows().filter(r=>r.site===s.id&&r.bal>1);
    const store=DB.sites.find(x=>x.type==='STORE'&&x.branch===s.branch);
    if(held.length&&store)DB.returns.push({id:uid('RT'),no:doc(DB,'RTN'),date:mk(1,26),fromSite:s.id,toSite:store.id,
      branch:s.branch,reason:'Surplus after termination',status:'RECEIVED',lines:[{prod:held[0].prod,make:held[0].make,qty:n2(held[0].bal*0.12)}]});
  });
  /* landed-cost detail on the open comparisons */
  DB.quotes.forEach(q=>{q.extras=q.extras||{};
    q.suppliers.forEach((sp,i)=>q.extras[sp]={freight:[4200,1800][i%2],disc:[1.5,3.5][i%2],days:[30,45][i%2]})});
  log('SYSTEM','—','Attendance, returns and landed-cost detail generated','');
  save();
}

/* ============================================================
   PARTIAL ACKNOWLEDGEMENT
   The receiver counts what physically arrived. Whatever is short
   goes straight back to the sender's stock — it never evaporates,
   and it never sits in a limbo nobody owns.
   ============================================================ */
function ackSheet(kind,id){
  const d=movesById(kind,id);if(!d)return;
  TMP={kind,id,ack:d.lines.map(l=>({...l,ack:l.ack==null?+l.qty:+l.ack}))};
  Sheet.open('Acknowledge receipt',`${d.no} · ${site(d.fromSite).name} → ${site(d.toSite).name}`,
    `<div class="banner info">Count what actually arrived and correct the line if it differs. Anything short returns to ${esc(site(d.fromSite).name)} automatically — they can re-send it or write it off in their own audit.</div>
     <div class="card"><div id="ack_l"></div></div>
     ${field('Note',txt('ak_n','','text','placeholder="e.g. two coils damaged in transit, sent back"'))}
     ${photoInput('ak_ph')}`,
    `<button class="btn" onclick="Sheet.close()">Cancel</button>
     <button class="btn" onclick="ackAll()">Accept everything</button>
     <button class="btn pri" onclick="saveAck()">Confirm receipt</button>`);
  ackDraw();
}
function ackSet(i,v){const l=TMP.ack[i];let q=+v;
  if(q<0)q=0;if(q> +l.qty){q=+l.qty;toast(`Only ${qty(l.qty)} was sent`,'bad')}l.ack=q;ackDraw()}
function ackAll(){TMP.ack.forEach(l=>l.ack=+l.qty);ackDraw()}
function ackDraw(){
  const el=document.getElementById('ack_l');if(!el)return;
  const short=TMP.ack.reduce((a,l)=>a+(+l.qty-+l.ack),0);
  el.innerHTML=`<div class="tw"><table><thead><tr><th>Item</th><th class="rt">Sent</th><th class="rt">Received</th><th class="rt">Short</th></tr></thead>
    <tbody>${TMP.ack.map((l,i)=>{const sh=n2(+l.qty-+l.ack);
      return `<tr><td><b>${esc(lineName(l))}</b><small>${esc(l.make)}</small></td>
        <td class="rt mono">${qty(l.qty)}</td>
        <td>${txt('ak_q'+i,l.ack,'number',`onchange="ackSet(${i},this.value)" style="width:94px"`)}</td>
        <td class="rt mono" style="color:${sh>0?'var(--bad)':'var(--muted)'}">${sh>0?qty(sh):'—'}</td></tr>`}).join('')}
    </tbody></table></div>
    ${short>0?`<div class="leak" style="margin:0 18px 16px"><strong>${qty(short)} units short.</strong> That quantity goes back into ${esc(site(movesById(TMP.kind,TMP.id).fromSite).name)} stock the moment you confirm.</div>`:''}`;
}
function saveAck(){
  const d=movesById(TMP.kind,TMP.id);
  let short=0;
  d.lines.forEach((l,i)=>{l.ack=+TMP.ack[i].ack;short+=(+l.qty-l.ack)});
  d.status=short>0?'PART':'RECEIVED';d.recvDate=today();d.ackNote=V('ak_n');
  d.ackPhotos=takePhotos('ak_ph');d.ackBy=DB.session.user;
  const got=d.lines.reduce((a,l)=>a+ +l.ack,0);
  log(TMP.kind.toUpperCase(),d.no,short>0?'Partially acknowledged at '+site(d.toSite).name:'Acknowledged at '+site(d.toSite).name,
    `${qty(got)} received, ${qty(short)} returned to ${site(d.fromSite).name}`);
  save();Sheet.close();
  toast(short>0?`${qty(got)} into ${site(d.toSite).name} · ${qty(short)} back to ${site(d.fromSite).name}`
               :`${qty(got)} units now in ${site(d.toSite).name} stock`,'ok');

}

/* ============================================================
   SITE STORE AUDIT & CLOSURE
   A site cannot close with stock on its books. The manager counts
   what is physically there, the difference is written off with a
   reason, whatever is left is moved out, and only when the site
   store reads zero does closure go to the GM.
   ============================================================ */
CHAINS.AUDIT=[{role:'R-PM',label:'Project manager'},{role:'R-GM',label:'GM'}];
function siteStockRows(id){return stockRows().filter(r=>r.site===id&&Math.abs(r.bal)>0.001)}
function siteStockQty(id){return n2(siteStockRows(id).reduce((a,r)=>a+r.bal,0))}
function auditsFor(id){return (DB.audits||[]).filter(a=>a.site===id)}
function openAudit(id){return auditsFor(id).find(a=>a.status!=='APPROVED'&&a.status!=='CANCELLED')}
function lastApprovedAudit(id){return auditsFor(id).filter(a=>a.status==='APPROVED').slice(-1)[0]}
function pendingIn(id){return allMoves().filter(m=>m.toSite===id&&m.status==='DISPATCHED')}
function pendingOut(id){return allMoves().filter(m=>m.fromSite===id&&m.status==='DISPATCHED')}
function closureStage(id){
  const s=site(id);
  if(s.status==='CLOSED')return {k:'CLOSED',t:'Closed',tone:'ok',note:'Closed on '+dmy(s.closedOn)};
  if(s.status==='CLOSE_REQUESTED')return {k:'REQUESTED',t:'With the GM',tone:'warn',note:'Store is empty and audited — waiting on approval'};
  /* until someone actually decides to close, there is nothing to do here */
  if(!s.closing)return {k:'LIVE',t:'Live',tone:'',note:siteStockQty(id)>0.001?qty(siteStockQty(id))+' units in the site store':'Nothing in the site store'};
  const a=openAudit(id);
  if(a&&a.status==='COUNTING')return {k:'COUNTING',t:'Audit in progress',tone:'warn',note:'Counting the site store'};
  if(a&&!isApproved(a))return {k:'AUDIT_REVIEW',t:'Audit with '+((nextStep(a)||{}).label||'—'),tone:'warn',note:'Missing quantities need sign-off'};
  const q=siteStockQty(id), out=pendingOut(id).length;
  if(lastApprovedAudit(id)){
    if(out)return {k:'AWAIT_ACK',t:'Waiting on the receiver',tone:'warn',note:out+' movement(s) not acknowledged'};
    if(q>0.001)return {k:'CLEARING',t:'Clear the store',tone:'warn',note:qty(q)+' units still on the books'};
    return {k:'READY',t:'Ready to close',tone:'ok',note:'Store reads zero'};
  }
  return {k:'OPEN',t:'Closing — audit the store',tone:'warn',note:'Count what is physically there to start'};
}
PAGES.closure=()=>{
  ensureNew();DB.audits=DB.audits||[];
  const sites=scoped(DB.sites).filter(s=>s.type==='SITE');
  const rows=sites.map(s=>{const st=closureStage(s.id),q=siteStockQty(s.id),a=openAudit(s.id);
    let btn='';
    if(st.k==='LIVE')btn=canEdit('closure')?`<button class="btn sm" onclick="beginClosure('${s.id}')">Close this site</button>`:'';
    else if(st.k==='OPEN'&&canEdit('closure'))btn=`<button class="btn sm pri" onclick="startAudit('${s.id}')">Start audit</button>
      <button class="btn sm" onclick="cancelClosure('${s.id}')">Cancel</button>`;
    else if(st.k==='COUNTING')btn=`<button class="btn sm pri" onclick="auditSheet('${a.id}')">Continue count</button>
      <button class="btn sm" onclick="cancelClosure('${s.id}')">Cancel</button>`;
    else if(st.k==='AUDIT_REVIEW')btn=`<button class="btn sm ${myTurn(a)?'pri':''}" onclick="apprSheet('${a.id}')">${myTurn(a)?'Review':'Open'}</button>`;
    else if(st.k==='CLEARING')btn=`<button class="btn sm pri" onclick="clearSheet('${s.id}')">Move stock out</button>`;
    else if(st.k==='AWAIT_ACK')btn=`<button class="btn sm" onclick="location.hash='#moves'">See movements</button>`;
    else if(st.k==='READY'&&canEdit('closure'))btn=`<button class="btn sm pri" onclick="requestClose('${s.id}')">Request closure</button>`;
    else if(st.k==='REQUESTED'&&['R-GM','R-PLAN'].includes(me().role))btn=`<button class="btn sm ok" onclick="approveClose('${s.id}')">Approve closure</button>`;
    const miss=auditsFor(s.id).filter(x=>x.status==='APPROVED').reduce((t,x)=>t+x.lines.reduce((y,l)=>y+Math.max(0,+l.systemQty-+l.avail)*lastRate(l.prod,l.make),0),0);
    return `<tr><td><b>${esc(s.name)}</b><small>${esc(byId(DB.clients,s.client).name||'')}</small></td>
      <td><span class="tag ${st.tone}">${st.t}</span><small>${esc(st.note)}</small></td>
      <td class="rt mono">${qty(q)}</td>
      <td class="rt mono">${money(siteStockRows(s.id).reduce((a2,r)=>a2+r.bal*lastRate(r.prod,r.make),0))}</td>
      <td class="rt mono" style="color:${miss>0?'var(--bad)':'var(--muted)'}">${miss>0?money(miss):'—'}</td>
      <td class="rt">${btn}</td></tr>`}).join('');
  const missAll=(DB.audits||[]).filter(a=>a.status==='APPROVED').flatMap(a=>a.lines
    .filter(l=>+l.systemQty-+l.avail>0.001).map(l=>({a,l})));
  const closing=sites.filter(x=>closureStage(x.id).k!=='LIVE').length;
  return viewBanner('closure')+`<div class="banner info">⌂ <div>Nothing happens here until someone decides to close a site. From that point the store has to be counted, anything missing signed off with a reason, and the balance moved to another site or the central store — closure only reaches the GM once the store reads zero.${closing?'':' No site is being closed right now.'}</div></div>
    ${tableCard('Site closure','',['Site','Stage',{t:'Units in store',r:1},{t:'Value',r:1},{t:'Written off',r:1},{t:'',r:1}],rows)}
    ${missAll.length?`<div style="height:16px"></div>${tableCard('Missing on audit','Written off after sign-off — this is the report the manager sees',
      ['Site','Item',{t:'Book',r:1},{t:'Counted',r:1},{t:'Missing',r:1},{t:'Value',r:1},'Reason'],
      missAll.map(({a,l})=>`<tr><td>${esc(site(a.site).name)}<small>${esc(a.no)}</small></td>
        <td>${esc(lineName(l))}</td><td class="rt mono">${qty(l.systemQty)}</td><td class="rt mono">${qty(l.avail)}</td>
        <td class="rt mono" style="color:var(--bad)">${qty(+l.systemQty-+l.avail)}</td>
        <td class="rt mono">${money((+l.systemQty-+l.avail)*lastRate(l.prod,l.make))}</td>
        <td><small>${esc(l.remark||'')}</small></td></tr>`).join(''))}`:''}`;
};
function beginClosure(id){
  const s=site(id);
  if(!confirm(`Start closing ${s.name}?\n\nThe site store has to be counted, anything missing signed off, and the balance moved out before it can close. Day-to-day work carries on until then.`))return;
  s.closing=true;s.closeStartedBy=DB.session.user;s.closeStartedOn=today();
  log('SITE',s.name,'Closure started','store audit required');save();
  toast('Closure started — count the site store next','ok');render();
}
function cancelClosure(id){
  const s=site(id);const a=openAudit(id);
  if(lastApprovedAudit(id))return toast('An audit has already been signed off — that cannot be undone here','bad');
  if(a){DB.audits=DB.audits.filter(x=>x.id!==a.id)}
  s.closing=false;log('SITE',s.name,'Closure cancelled','');save();
  toast(s.name+' is live again','ok');render();
}
function startAudit(id){
  const p=pendingIn(id);
  if(p.length)return toast(`Acknowledge the ${p.length} movement(s) still coming in first`,'bad');
  const a={id:uid('AU'),no:doc(DB,'AUD'),site:id,branch:site(id).branch,date:today(),by:DB.session.user,
    status:'COUNTING',round:auditsFor(id).length+1,appr:newAppr('AUDIT'),amount:0,
    lines:siteStockRows(id).map(r=>({prod:r.prod,make:r.make,systemQty:r.bal,avail:r.bal,remark:''}))};
  DB.audits.push(a);log('AUDIT',a.no,'Started at '+site(id).name,a.lines.length+' item(s) on the books');
  save();auditSheet(a.id);
}
function auditSheet(id){
  const a=DB.audits.find(x=>x.id===id);
  TMP={audit:id,lines:a.lines.map(l=>({...l}))};
  Sheet.open('Site store audit — '+site(a.site).name,a.no+' · round '+a.round,
    `<div class="banner info">Enter what is physically on the ground. Anything less than the book quantity is treated as missing and needs a reason — the manager signs it off before it comes out of stock.</div>
     <div class="card"><div id="au_l"></div></div>${photoInput('au_ph')}`,
    `<button class="btn" onclick="Sheet.close()">Save and come back</button>
     <button class="btn" onclick="auditFull()">Everything present</button>
     <button class="btn pri" onclick="submitAudit()">Submit for sign-off</button>`);
  auditDraw();
}
function auditSet(i,f,v){const l=TMP.lines[i];
  if(f==='avail'){let q=+v;if(q<0)q=0;l.avail=q}else l.remark=v;
  if(f==='avail')auditDraw();}
function auditFull(){TMP.lines.forEach(l=>{l.avail=+l.systemQty;l.remark=''});auditDraw()}
function auditDraw(){
  const el=document.getElementById('au_l');if(!el)return;
  if(!TMP.lines.length){el.innerHTML=emptyBox('Store is already empty','Nothing to count — submit to close it off.');return}
  const missVal=TMP.lines.reduce((a,l)=>a+Math.max(0,+l.systemQty-+l.avail)*lastRate(l.prod,l.make),0);
  el.innerHTML=`<div class="tw"><table><thead><tr><th>Item</th><th class="rt">Book</th><th class="rt">Counted</th>
    <th class="rt">Difference</th><th style="min-width:180px">Reason</th></tr></thead><tbody>${
    TMP.lines.map((l,i)=>{const d=n2(+l.avail-+l.systemQty);
      return `<tr><td><b>${esc(lineName(l))}</b><small>${esc(l.make)}</small></td>
        <td class="rt mono">${qty(l.systemQty)}</td>
        <td>${txt('au_q'+i,l.avail,'number',`onchange="auditSet(${i},'avail',this.value)" style="width:92px"`)}</td>
        <td class="rt mono" style="color:${d<0?'var(--bad)':d>0?'var(--ok)':'var(--muted)'}">${d?(d>0?'+':'')+qty(d):'—'}</td>
        <td>${d?txt('au_r'+i,l.remark,'text',`onchange="auditSet(${i},'remark',this.value)" placeholder="why"`):'<span class="tag ok">matches</span>'}</td></tr>`}).join('')
  }</tbody></table></div>
  ${missVal>0?`<div class="leak" style="margin:0 18px 16px"><strong>${money(missVal)} unaccounted for.</strong> It comes out of stock only once the manager signs the audit off, and it shows in the missing report against this site.</div>`:''}`;
}
function saveAuditDraft(){const a=DB.audits.find(x=>x.id===TMP.audit);a.lines=TMP.lines.map(l=>({...l}));save()}
function submitAudit(){
  const a=DB.audits.find(x=>x.id===TMP.audit);
  const bad=TMP.lines.find(l=>Math.abs(+l.avail-+l.systemQty)>0.001&&!String(l.remark||'').trim());
  if(bad)return toast('Every difference needs a reason — '+pname(bad.prod),'bad');
  a.lines=TMP.lines.map(l=>({...l}));a.photos=takePhotos('au_ph');
  a.status='SUBMITTED';a.appr=newAppr('AUDIT');
  a.amount=n2(a.lines.reduce((x,l)=>x+Math.max(0,+l.systemQty-+l.avail)*lastRate(l.prod,l.make),0));
  log('AUDIT',a.no,'Submitted for sign-off',money(a.amount)+' unaccounted');
  save();Sheet.close();toast('Audit submitted — the manager signs off the difference','ok');render();
}
/* the approval engine drives the sign-off; approving posts the adjustment */
const _approve=approve, _reject=reject;
approve=function(d,note){_approve(d,note);
  if(d.appr&&d.appr.type==='AUDIT'&&isApproved(d)){d.status='APPROVED';
    log('AUDIT',d.no,'Signed off — stock adjusted','');save()}};
reject=function(d,note){_reject(d,note);
  if(d.appr&&d.appr.type==='AUDIT'){d.status='COUNTING';d.appr=newAppr('AUDIT');
    log('AUDIT',d.no,'Sent back for a recount',note||'');save()}};

/* move whatever survived the audit somewhere it belongs */
function clearSheet(id){
  const dests=scoped(DB.sites).filter(x=>x.id!==id&&x.status!=='CLOSED');
  if(!dests.length)return toast('No open site or store to move it to','bad');
  TMP={from:id,lines:siteStockRows(id).map(r=>({prod:r.prod,make:r.make,qty:r.bal,max:r.bal}))};
  Sheet.open('Clear the site store',site(id).name+' — move the balance out',
    `<div class="banner info">Send it to another site store or the central store. It leaves here now, and lands there when they acknowledge it. Anything they short-receive comes straight back to this site, and you audit it again.</div>
     <div class="row2">${field('Send to',sel('cl_t',dests.map(x=>({v:x.id,t:x.name+(x.type==='STORE'?' (central store)':'')})))) }
      ${field('Date',txt('cl_d',today(),'date'))}</div>
     ${field('Reason',txt('cl_r','Site closure — balance transfer','text'))}
     <div class="card"><div id="cl_l"></div></div>`,
    `<button class="btn" onclick="Sheet.close()">Cancel</button><button class="btn pri" onclick="saveClear()">Dispatch</button>`);
  clearDraw();
}
function clearSet(i,v){const l=TMP.lines[i];let q=+v;if(q<0)q=0;if(q>l.max){q=l.max;toast('Only '+qty(l.max)+' on the books','bad')}l.qty=q;clearDraw()}
function clearDraw(){
  const el=document.getElementById('cl_l');if(!el)return;
  el.innerHTML=`<div class="tw"><table><thead><tr><th>Item</th><th class="rt">In store</th><th class="rt">Sending</th><th class="rt">Value</th></tr></thead>
    <tbody>${TMP.lines.map((l,i)=>`<tr><td><b>${esc(lineName(l))}</b><small>${esc(l.make)}</small></td>
      <td class="rt mono">${qty(l.max)}</td>
      <td>${txt('cl_q'+i,l.qty,'number',`onchange="clearSet(${i},this.value)" style="width:92px"`)}</td>
      <td class="rt mono">${money(l.qty*lastRate(l.prod,l.make))}</td></tr>`).join('')}</tbody></table></div>`;
}
function saveClear(){
  const lines=TMP.lines.filter(l=>+l.qty>0).map(l=>({prod:l.prod,make:l.make,qty:l.qty}));
  if(!lines.length)return toast('Nothing selected to send','bad');
  const f=site(TMP.from),t=site(V('cl_t'));
  const rec={id:uid('TR'),no:doc(DB,'TRF'),date:V('cl_d'),fromSite:f.id,toSite:t.id,branch:f.branch,
    reason:V('cl_r'),status:'DISPATCHED',lines,closure:true};
  DB.transfers.push(rec);
  log('TRANSFER',rec.no,`${f.name} → ${t.name}`,'site closure balance transfer');
  save();Sheet.close();toast(`Dispatched to ${t.name} — they acknowledge before it counts as theirs`,'ok');render();
}
function requestClose(id){
  const s=site(id);
  if(siteStockQty(id)>0.001)return toast('The store still shows stock','bad');
  if(!lastApprovedAudit(id))return toast('The store has to be audited first','bad');
  if(pendingOut(id).length)return toast('Something you sent is still unacknowledged','bad');
  s.status='CLOSE_REQUESTED';s.closeReqBy=DB.session.user;s.closeReqOn=today();
  log('SITE',s.name,'Closure requested','store audited and empty');save();
  toast('Sent to the GM for approval','ok');render();
}
function approveClose(id){
  const s=site(id);s.status='CLOSED';s.closedOn=today();
  log('SITE',s.name,'Closed','approved by '+me().name);save();toast(s.name+' is closed','ok');render();
}

/* ============================================================
   COMPANY VIEW — one line per site: where the project has got to,
   what has been billed, and what margin it is making.
   ============================================================ */
const STAGES=[{k:'BOQ',t:'BOQ priced and locked'},{k:'IND',t:'Requirements indented'},
  {k:'PO',t:'Ordered from suppliers'},{k:'GRN',t:'Material received'},
  {k:'USE',t:'Consumed at site'},{k:'BILL',t:'Billed to the client'}];
function siteProgress(id){
  const b=boqOf(id);const p=sitePnl(id);
  const pct=(a,t)=>t>0?Math.max(0,Math.min(100,a/t*100)):0;
  let tot=0,ind=0;
  if(b)b.lines.forEach(l=>{const r=(+l.estRate||prod(l.prod).rate||0);
    tot+=amendedQty(l)*r;ind+=indentedQty(b.id,l.id)*r});
  let indVal=0,ordVal=0;
  DB.indents.filter(i=>i.site===id&&isApproved(i)).forEach(i=>i.lines.forEach(l=>{
    const r=prod(l.prod).rate||0;indVal+=l.qty*r;ordVal+=(l.qty-indentBal(i.id,l.id))*r}));
  let poVal=0,grnVal=0;
  DB.pos.filter(x=>(x.forSite||x.site)===id&&isApproved(x)).forEach(x=>x.lines.forEach(l=>{
    poVal+=l.qty*l.rate;grnVal+=grnQtyOfPoLine(x.id,l.id)*l.rate}));
  const v=[b?(b.status==='LOCKED'?100:40):0, pct(ind,tot), pct(ordVal,indVal),
           pct(grnVal,poVal), pct(p.matCost,grnVal), pct(p.billed,p.contract)];
  return {v,p,b};
}
function trackerHtml(id){
  const {v}=siteProgress(id);
  const now=v.findIndex(x=>x<99.5);
  return `<div class="track">${STAGES.map((st,i)=>{
    const done=v[i]>=99.5, active=i===now&&v[i]>0.5, idle=v[i]<0.5;
    const cls=done?'done':(active?'now':(idle?'idle':''));
    const face=done?'✓':(idle?'':Math.round(v[i])+'');
    return (i?`<span class="lnk ${v[i-1]>=99.5?'done':''}"></span>`:'')
      +`<span class="node ${cls}" style="--p:${Math.round(v[i])}" title="${esc(st.t)} — ${Math.round(v[i])}%">
          <span class="ring"></span><span class="core">${face}</span></span>`}).join('')}</div>`;
}
PAGES.dashboard=()=>{
  ensureNew();
  const sites=scoped(DB.sites).filter(s=>s.type==='SITE');
  const rows=sites.map(s=>({s,d:sitePnl(s.id)}));
  const T=rows.reduce((a,r)=>({contract:a.contract+r.d.contract,billed:a.billed+r.d.billed,cost:a.cost+r.d.cost}),
    {contract:0,billed:0,cost:0});
  const t=trend(6),pend=pendingForMe().length;
  let toBill=0;scoped(DB.boqs).forEach(b=>b.lines.forEach(l=>{
    const g=consumedQty(b.site,l.id)-clientBilledQty(b.id,l.id,'sup');if(g>0)toBill+=g*l.supplyRate}));

  const head=tiles([
    {ic:'▤',label:'Order book',value:short(T.contract),sub:sites.length+' live site'+(sites.length===1?'':'s'),go:"location.hash='#boq'"},
    {ic:'₹',label:'Billed to clients',value:short(T.billed),sub:T.contract?Math.round(T.billed/T.contract*100)+'% of the order book':'nothing billed',tone:'g',go:"location.hash='#clientbill'"},
    {ic:'◍',label:'Cost to date',value:short(T.cost),sub:'material, sub-contract, wages',tone:'i',go:"location.hash='#pnl'"},
    {ic:'◨',label:'Gross margin',value:T.billed?((T.billed-T.cost)/T.billed*100).toFixed(1)+'%':'—',sub:short(T.billed-T.cost)+' on billed work',tone:(T.billed-T.cost)>=0?'g':'b',go:"location.hash='#pnl'"},
    {ic:'✓',label:'Waiting on you',value:String(pend),sub:pend?'documents to sign':'nothing pending',tone:pend?'w':'g',go:"location.hash='#approvals'"}]);

  const siteRows=rows.map(({s,d})=>{
    const pct=d.contract?Math.round(d.billed/d.contract*100):0;
    const flags=[s.closing?'<span class="tag bad">closing</span>':'',
      allMoves().filter(m=>m.toSite===s.id&&m.status==='DISPATCHED').length?'<span class="tag info">in transit</span>':''].filter(Boolean).join(' ');
    return `<tr>
      <td style="min-width:200px"><b>${esc(s.name)}</b><small>${esc(byId(DB.clients,s.client).name||'')} · ${esc(byId(DB.branches,s.branch).name)}</small>
        ${flags?`<div class="pill-row" style="margin-top:5px">${flags}</div>`:''}</td>
      <td>${trackerHtml(s.id)}</td>
      <td class="rt"><b class="mono">${money(d.billed)}</b><small class="mono">${pct}% of ${short(d.contract)}</small></td>
      <td class="rt mono" style="color:${d.margin>=0?'var(--ok)':'var(--bad)'}">${d.billed?((d.margin/d.billed)*100).toFixed(1)+'%':'—'}
        <small class="mono">${short(d.margin)}</small></td>
      <td class="rt"><button class="btn sm" onclick="siteView('${s.id}')">Open ›</button></td></tr>`}).join('');

  const branchRows=DB.branches.filter(b=>myBranches().includes(b.id)&&(DB.session.branch==='ALL'||DB.session.branch===b.id))
    .map(b=>{const rs=rows.filter(r=>r.s.branch===b.id);
      const c=rs.reduce((a,r)=>a+r.d.contract,0),bl=rs.reduce((a,r)=>a+r.d.billed,0),co=rs.reduce((a,r)=>a+r.d.cost,0);
      return `<tr><td><b>${esc(b.name)}</b><small>${rs.length} site${rs.length===1?'':'s'}</small></td>
        <td class="rt mono">${short(c)}</td><td class="rt mono">${short(bl)}</td>
        <td class="rt mono" style="color:${bl-co>=0?'var(--ok)':'var(--bad)'}">${bl?((bl-co)/bl*100).toFixed(1)+'%':'—'}</td></tr>`}).join('');

  return head
    +`<div class="card" style="margin-bottom:16px"><header><div><h3>All sites</h3>
        <p>Where each project has reached, what it has billed, and what it is making</p></div>
        <div class="sp"></div><span class="viewall" onclick="location.hash='#pnl'">Profit &amp; loss ›</span></header>
      <div class="tracklegend">${STAGES.map(x=>`<span><i class="idle"></i>${esc(x.k==='BOQ'?'BOQ':x.k==='IND'?'Indent':x.k==='PO'?'Order':x.k==='GRN'?'Receive':x.k==='USE'?'Consume':'Bill')}</span>`).join('')}
        <span style="margin-left:auto"><i></i>done</span><span><i class="part"></i>part done, pulsing where it is now</span></div>
      <div class="tw"><table><thead><tr><th>Site</th><th>Stage</th><th class="rt">Billed</th><th class="rt">Margin</th><th></th></tr></thead>
        <tbody>${siteRows||''}</tbody>
        ${siteRows?`<tfoot><tr><th>Total</th><th></th><th class="rt mono">${money(T.billed)}</th>
          <th class="rt mono">${T.billed?((T.billed-T.cost)/T.billed*100).toFixed(1)+'%':'—'}</th><th></th></tr></tfoot>`:''}
      </table></div>${siteRows?'':emptyBox('No sites yet','Add a site and price its BOQ to see it here.')}</div>
    <div class="grid g2" style="grid-template-columns:1.5fr 1fr">
      ${chartCard('Billing against cost','Cumulative across every site in view',
        cArea(t.labels,[{name:'Billed',data:cumulative(t.billed),color:'#00877B'},
                        {name:'Cost',data:cumulative(t.cost),color:'#D74745'}],{h:210}))}
      <div class="stack">
        ${tableCard('By branch','',['Branch',{t:'Contract',r:1},{t:'Billed',r:1},{t:'Margin',r:1}],branchRows)}
        ${toBill>0?`<div class="card"><header><h3>Worth chasing</h3></header><div class="pad">
          <div class="leak"><strong>${short(toBill)} of finished work is not on a bill yet.</strong>
          Material already consumed at site, priced at the contract rate.</div>
          <button class="btn pri sm" style="margin-top:12px" onclick="location.hash='#recon'">Open reconciliation</button></div></div>`:''}
      </div>
    </div>`;
};

/* ============================================================
   e-INVOICE WIZARD — the same registration, walked through:
   check the invoice, validate the lines, send it to the IRP,
   collect the IRN, then the e-way bill if goods are moving.
   ============================================================ */
const EWSTEPS=[{k:'Invoice'},{k:'Lines'},{k:'Send'},{k:'IRN'},{k:'e-Way'}];
function einvWizard(id,step){
  const b=DB.clientbills.find(x=>x.id===id);if(!b)return;
  WZ={id,step:step==null?(b.irn?3:0):step};
  drawWiz();
}
let WZ={};
function wizBar(){
  return `<div class="wiz">${EWSTEPS.map((st,i)=>{
    const cls=i<WZ.step?'done':(i===WZ.step?'on':'');
    return (i?`<span class="wlnk ${i<=WZ.step?'done':''}"></span>`:'')
      +`<span class="wstep ${cls}"><span class="b">${i<WZ.step?'✓':i+1}</span><small>${st.k}</small></span>`}).join('')}</div>`;
}
function einvChecks(b){
  const s=site(b.site),cl=byId(DB.clients,s.client);
  const out=[
    {ok:!!isApproved(b),t:'Bill is certified',s:isApproved(b)?'Approved through PM and Accounts':'It must clear approval before the IRP will accept it'},
    {ok:!!cl.gstin,warn:!cl.gstin,t:'Buyer GSTIN',s:cl.gstin?cl.name+' · '+cl.gstin:'Not on file — it would go as URP (unregistered)'},
    {ok:true,t:'Seller GSTIN',s:'AJ Power Solutions · 36AAACA0000A1Z5'},
    {ok:!!b.no&&!!b.date,t:'Document number and date',s:b.no+' dated '+dmy(b.date)},
    {ok:clientBillValue(b)>0,t:'Invoice value',s:money(clientBillValue(b))+' including GST'},
    {ok:!b.irn,warn:!!b.irn,t:'Not already registered',s:b.irn?'This bill already carries an IRN':'No IRN against this bill yet'}
  ];
  return out;
}
function einvLineChecks(b){
  return b.lines.filter(l=>+l.supplyQty>0||+l.instQty>0).map(l=>{
    const p=prod(l.prod);const q=n2(+l.supplyQty+ +l.instQty);
    const bad=[];if(!p.hsn)bad.push('no HSN');if(!(+l.gst>=0))bad.push('no GST rate');if(!(q>0))bad.push('no quantity');
    return {ok:!bad.length,t:p.code+' — '+p.name,
      s:bad.length?bad.join(', '):`HSN ${p.hsn} · ${qty(q)} ${p.uom} · GST ${l.gst}% · ${money(l.supplyQty*l.supplyRate+l.instQty*(+l.instRate||0))}`};
  });
}
function qrBlock(seedStr){
  let h=0;for(const c of String(seedStr))h=(h*31+c.charCodeAt(0))>>>0;
  let cells='';
  for(let i=0;i<441;i++){
    const r=Math.floor(i/21),c=i%21;
    const finder=(r<7&&c<7)||(r<7&&c>13)||(r>13&&c<7);
    let on;
    if(finder){const rr=r%14,cc=c%14;const x=Math.min(rr,6),y=Math.min(cc,6);
      on=(x===0||x===6||y===0||y===6||(x>1&&x<5&&y>1&&y<5));}
    else{h=(h*1103515245+12345)>>>0;on=((h>>>16)&1)===1}
    cells+=`<i class="${on?'':'o'}"></i>`;
  }
  return `<div class="qr">${cells}</div>`;
}
function drawWiz(){
  const b=DB.clientbills.find(x=>x.id===WZ.id);
  const s=site(b.site),cl=byId(DB.clients,s.client);
  let body='',foot='';
  const back=(WZ.step>0&&WZ.step<3)?`<button class="btn" onclick="einvWizard('${b.id}',${WZ.step-1})">Back</button>`:'';

  if(WZ.step===0){
    const c=einvChecks(b);const blocked=c.some(x=>!x.ok&&!x.warn);
    body=`<div class="card"><header><h3>Check the invoice</h3><p>Everything the portal will look at before it accepts anything</p></header>
      <div class="pad">${c.map(x=>`<div class="chk ${x.ok?'pass':(x.warn?'warn':'fail')}">
        <span class="m">${x.ok?'✓':(x.warn?'!':'✕')}</span><div><b>${esc(x.t)}</b><small>${esc(x.s)}</small></div></div>`).join('')}</div></div>`;
    foot=`<button class="btn" onclick="Sheet.close()">Cancel</button>
      <button class="btn pri" ${blocked?'disabled':''} onclick="einvWizard('${b.id}',1)">Next — check the lines</button>`;
  }
  else if(WZ.step===1){
    const c=einvLineChecks(b);const blocked=c.some(x=>!x.ok)||!c.length;
    body=`<div class="card"><header><h3>Validate the lines</h3><p>Each line needs an HSN code, a quantity and a GST rate</p></header>
      <div class="pad">${c.length?c.map(x=>`<div class="chk ${x.ok?'pass':'fail'}">
        <span class="m">${x.ok?'✓':'✕'}</span><div><b>${esc(x.t)}</b><small>${esc(x.s)}</small></div></div>`).join('')
        :'<div class="empty"><b>No billable lines</b>Nothing measured on this bill.</div>'}</div></div>`;
    foot=`${back}<button class="btn pri" ${blocked?'disabled':''} onclick="einvWizard('${b.id}',2)">Next — review the payload</button>`;
  }
  else if(WZ.step===2){
    body=`<div class="banner info">This is exactly what gets posted to the Invoice Registration Portal. Once it is accepted the quantities and rates on this bill are locked.</div>
      <div class="card"><header><h3>Ready to send</h3><p>${esc(b.no)} · ${esc(cl.name)} · ${money(clientBillValue(b))}</p></header>
      <div class="pad"><pre class="mono" style="margin:0;font-size:11px;line-height:1.55;white-space:pre-wrap;word-break:break-word;color:var(--ink-2);max-height:300px;overflow:auto">${esc(JSON.stringify(einvPayload(b),null,2))}</pre></div></div>`;
    foot=`${back}<button class="btn pri" onclick="wizSubmit('${b.id}')">Submit to the IRP</button>`;
  }
  else if(WZ.step===3){
    body=`<div class="card"><header><h3>Registered</h3><p>The portal accepted it and issued an IRN</p></header>
      <div class="pad" style="display:flex;gap:22px;flex-wrap:wrap;align-items:flex-start">
        <div>${qrBlock(b.irn)}<div style="font-size:10.5px;color:var(--muted);margin-top:8px;text-align:center">Signed QR — prints on the invoice</div></div>
        <div style="flex:1;min-width:240px">
          <div class="chk pass"><span class="m">✓</span><div><b>IRN</b><small class="mono" style="word-break:break-all">${esc(b.irn)}</small></div></div>
          <div class="chk pass"><span class="m">✓</span><div><b>Acknowledgement</b><small>${esc(b.ackNo)} · ${dmy(b.ackDt)}</small></div></div>

/* ============================================================
   SITE CLOSURE, REWORKED
   Closing only becomes available once the client has been billed
   in full. Then: move the store out first, wait for the receivers
   to acknowledge, and whatever is left over IS the missing report.
   The manager accepts it or sends it back. Only then does the site
   close.  Sequence: Bill 100% → Clear store → Acknowledged →
   Missing report → Manager → Closed.
   ============================================================ */
function billedPct(id){const p=sitePnl(id);return p.contract?(p.billed/p.contract*100):0}
function closureMoves(id){return allMoves().filter(m=>m.fromSite===id&&m.closure)}
function openReport(id){return (DB.audits||[]).find(a=>a.site===id&&a.status!=='APPROVED')}
function lastReport(id){return (DB.audits||[]).filter(a=>a.site===id&&a.status==='APPROVED').slice(-1)[0]}

closureStage=function(id){
  const s=site(id), q=siteStockQty(id), pct=billedPct(id);
  if(s.status==='CLOSED')return {k:'CLOSED',t:'Closed',tone:'ok',pc:100,note:'Closed on '+dmy(s.closedOn)};
  if(s.status==='CLOSE_REQUESTED')return {k:'REQUESTED',t:'With the GM',tone:'warn',pc:90,note:'Store is empty — waiting on approval'};
  if(!s.closing){
    if(pct>=99.5)return {k:'CAN_CLOSE',t:'Fully billed',tone:'ok',pc:10,note:'The client has been billed in full — the site can be closed'};
    return {k:'LIVE',t:'Live',tone:'',pc:0,note:Math.round(pct)+'% billed · closing opens at 100%'};
  }
  if(pendingOut(id).length)return {k:'AWAIT_ACK',t:'Waiting on acknowledgement',tone:'warn',pc:45,
    note:pendingOut(id).length+' transfer(s) not yet acknowledged by the receiver'};
  const r=openReport(id);
  if(r&&r.status==='COUNTING')return {k:'MISSING',t:'Missing report — add reasons',tone:'warn',pc:60,
    note:qty(r.lines.reduce((a,l)=>a+ +l.systemQty,0))+' units unaccounted for'};
  if(r)return {k:'REVIEW',t:'With '+((nextStep(r)||{}).label||'the manager'),tone:'warn',pc:75,
    note:'Missing report submitted for a decision'};
  if(q>0.001)return {k:'CLEARING',t:'Clear the store',tone:'warn',pc:30,
    note:qty(q)+' units still in the site store'};
  if(!lastReport(id)&&closureMoves(id).length===0)return {k:'CLEARING',t:'Clear the store',tone:'warn',pc:30,note:'Store already empty — confirm and close'};
  return {k:'READY',t:'Ready to close',tone:'ok',pc:85,note:'Store reads zero'};
};

PAGES.closure=()=>{
  ensureNew();DB.audits=DB.audits||[];
  const sites=scoped(DB.sites).filter(s=>s.type==='SITE');
  const rows=sites.map(s=>{
    const st=closureStage(s.id),q=siteStockQty(s.id),r=openReport(s.id),pct=billedPct(s.id);
    let btn='';
    if(st.k==='LIVE')btn=`<span class="tag">${Math.round(pct)}% billed</span>`;
    else if(st.k==='CAN_CLOSE')btn=canEdit('closure')?`<button class="btn sm pri" onclick="beginClosure('${s.id}')">Close this site</button>`:'';
    else if(st.k==='CLEARING')btn=`${q>0.001?`<button class="btn sm pri" onclick="clearSheet('${s.id}')">Move stock out</button>`:''}
      ${q>0.001&&closureMoves(s.id).length?`<button class="btn sm" onclick="makeMissing('${s.id}')">Generate missing report</button>`:''}
      <button class="btn sm" onclick="cancelClosure('${s.id}')">Cancel</button>`;
    else if(st.k==='AWAIT_ACK')btn=`<button class="btn sm" onclick="location.hash='#moves'">See transfers</button>`;
    else if(st.k==='MISSING')btn=`<button class="btn sm pri" onclick="missingSheet('${r.id}')">Open missing report</button>`;
    else if(st.k==='REVIEW')btn=`<button class="btn sm ${myTurn(r)?'pri':''}" onclick="apprSheet('${r.id}')">${myTurn(r)?'Decide':'Open'}</button>`;
    else if(st.k==='READY')btn=canEdit('closure')?`<button class="btn sm pri" onclick="requestClose('${s.id}')">Request closure</button>`:'';
    else if(st.k==='REQUESTED'&&['R-GM','R-PLAN'].includes(me().role))btn=`<button class="btn sm ok" onclick="approveClose('${s.id}')">Approve closure</button>`;
    const written=(DB.audits||[]).filter(a=>a.site===s.id&&a.status==='APPROVED')
      .reduce((t,a)=>t+a.lines.reduce((y,l)=>y+Math.max(0,+l.systemQty-+l.avail)*lastRate(l.prod,l.make),0),0);
    return `<tr><td><b>${esc(s.name)}</b><small>${esc(byId(DB.clients,s.client).name||'')}</small></td>
      <td style="min-width:190px">${closeTrack(s.id)}</td>
      <td><span class="tag ${st.tone}">${st.t}</span><small>${esc(st.note)}</small></td>
      <td class="rt mono">${qty(q)}</td>
      <td class="rt mono" style="color:${written>0?'var(--bad)':'var(--muted)'}">${written>0?money(written):'—'}</td>
      <td class="rt">${btn}</td></tr>`}).join('');
  const missAll=(DB.audits||[]).filter(a=>a.status==='APPROVED').flatMap(a=>a.lines
    .filter(l=>+l.systemQty-+l.avail>0.001).map(l=>({a,l})));
  return viewBanner('closure')+`<div class="banner info">⌂ <div>A site can be closed once the client has been billed in full. From there: move the store out to another site or the central store, wait for them to acknowledge it, and whatever is still on the books becomes the missing report. The manager accepts it or sends it back — the site closes only after that.</div></div>
    ${tableCard('Site closure','',['Site','Closure','Stage',{t:'In store',r:1},{t:'Written off',r:1},{t:'',r:1}],rows)}
    ${missAll.length?`<div style="height:16px"></div>${tableCard('Written off on closure','Accepted by the manager',
      ['Site','Item',{t:'Qty',r:1},{t:'Value',r:1},'Reason'],
      missAll.map(({a,l})=>`<tr><td>${esc(site(a.site).name)}<small>${esc(a.no)}</small></td>
        <td>${esc(lineName(l))}</td><td class="rt mono">${qty(+l.systemQty-+l.avail)}</td>
        <td class="rt mono">${money((+l.systemQty-+l.avail)*lastRate(l.prod,l.make))}</td>
        <td><small>${esc(l.remark||'')}</small></td></tr>`).join(''))}`:''}`;
};
/* a five-bubble closure strip, same language as the project tracker */
const CLOSE_STEPS=[{k:'Billed',at:10},{k:'Clear',at:30},{k:'Ack',at:45},{k:'Missing',at:60},{k:'Closed',at:100}];
function closeTrack(id){
  const st=closureStage(id);
  return `<div class="track">${CLOSE_STEPS.map((x,i)=>{
    const done=st.pc>x.at, now=st.pc>=x.at&&st.pc<=(CLOSE_STEPS[i+1]?CLOSE_STEPS[i+1].at:101)&&!done;
    const cls=done?'done':(now?'now':'idle');
    return (i?`<span class="lnk ${st.pc>x.at?'done':''}"></span>`:'')
      +`<span class="node ${cls}" style="--p:${done?100:(now?60:0)}" title="${esc(x.k)} — ${esc(st.t)}">
         <span class="ring"></span><span class="core">${done?'✓':''}</span></span>`}).join('')}</div>`;
}
/* whatever survived the transfers becomes the missing report */
function makeMissing(id){
  if(pendingOut(id).length)return toast('Wait for the receiver to acknowledge first','bad');
  const rows=siteStockRows(id);
  if(!rows.length)return toast('The store already reads zero','bad');
  if(openReport(id))return missingSheet(openReport(id).id);
  const a={id:uid('AU'),no:doc(DB,'MIS'),site:id,branch:site(id).branch,date:today(),by:DB.session.user,
    status:'COUNTING',round:auditsFor(id).length+1,appr:newAppr('AUDIT'),amount:0,
    lines:rows.map(r=>({prod:r.prod,make:r.make,systemQty:r.bal,avail:0,remark:''}))};
  DB.audits.push(a);
  log('MISSING',a.no,'Missing report raised at '+site(id).name,qty(rows.reduce((x,r)=>x+r.bal,0))+' units unaccounted');
  save();missingSheet(a.id);
}
function missingSheet(id){
  const a=DB.audits.find(x=>x.id===id);
  TMP={rep:id,lines:a.lines.map(l=>({...l}))};
  Sheet.open('Missing report — '+site(a.site).name,a.no+' · everything left after the transfers',
    `<div class="banner view">These are the quantities the site store still shows after everything was moved out and acknowledged. Give each one a reason. The manager decides whether to write it off or send it back to you.</div>
     <div class="card"><div id="ms_l"></div></div>${photoInput('ms_ph')}`,
    `<button class="btn" onclick="Sheet.close()">Save and come back</button>
     <button class="btn pri" onclick="submitMissing()">Send to the manager</button>`);

}
function missingSet(i,f,v){const l=TMP.lines[i];
  if(f==='avail'){let q=+v;if(q<0)q=0;if(q>+l.systemQty)q=+l.systemQty;l.avail=q}else l.remark=v;
  if(f==='avail')missingDraw();}
function missingDraw(){
  const el=document.getElementById('ms_l');if(!el)return;
  const val=TMP.lines.reduce((a,l)=>a+Math.max(0,+l.systemQty-+l.avail)*lastRate(l.prod,l.make),0);
  el.innerHTML=`<div class="tw"><table><thead><tr><th>Item</th><th class="rt">On the books</th>
    <th class="rt">Found after all</th><th class="rt">Missing</th><th style="min-width:190px">Reason</th></tr></thead><tbody>${
    TMP.lines.map((l,i)=>{const miss=n2(+l.systemQty-+l.avail);
      return `<tr><td><b>${esc(lineName(l))}</b><small>${esc(l.make)}</small></td>
        <td class="rt mono">${qty(l.systemQty)}</td>
        <td>${txt('ms_a'+i,l.avail,'number',`onchange="missingSet(${i},'avail',this.value)" style="width:86px"`)}</td>
        <td class="rt mono" style="color:${miss>0?'var(--bad)':'var(--ok)'}">${miss>0?qty(miss):'—'}</td>
        <td>${miss>0?txt('ms_r'+i,l.remark,'text',`onchange="missingSet(${i},'remark',this.value)" placeholder="what happened to it"`)
          :'<span class="tag ok">accounted for</span>'}</td></tr>`}).join('')
  }</tbody></table></div>
  <div class="leak" style="margin:0 18px 16px"><strong>${money(val)} to be written off.</strong>

}
function submitMissing(){
  const a=DB.audits.find(x=>x.id===TMP.rep);
  const bad=TMP.lines.find(l=>(+l.systemQty-+l.avail)>0.001&&!String(l.remark||'').trim());

/* manager decision: accept writes it off, reject sends it back to the site */
approve=function(d,note){_approve(d,note);

  if(d.appr&&d.appr.type==='AUDIT'){d.status='COUNTING';d.appr=newAppr('AUDIT');
    log('MISSING',d.no,'Sent back to the site',note||'');save()}};
beginClosure=function(id){

  s.closing=true;s.closeStartedBy=DB.session.user;s.closeStartedOn=today();

};
cancelClosure=function(id){
  const s=site(id);const r=openReport(id);

requestClose=function(id){

/* ============================================================
   SITE VIEW — the pipeline in the middle, everything that has

function siteTimeline(id){
  const out=[];const add=(d,tag,label,sub)=>out.push({d,tag,label,sub});
  const b=boqOf(id);
  if(b)add(b.date,'BOQ',b.no+(b.status==='LOCKED'?' locked':' drafted'),money(boqValue(b))+' contract');
  DB.indents.filter(x=>x.site===id).forEach(x=>add(x.date,'Indent',x.no,
    x.lines.length+' line(s) · '+(isApproved(x)?'approved':isRejected(x)?'returned':'with '+((nextStep(x)||{}).label||'—'))));
  DB.pos.filter(x=>(x.forSite||x.site)===id).forEach(x=>add(x.date,'PO',x.no,sup(x.sup).name+' · '+money(poValue(x))));
  DB.grns.filter(x=>x.toSite===id).forEach(x=>add(x.date,'GRN',x.no,'received at site'));
  allMoves().filter(m=>m.toSite===id||m.fromSite===id).forEach(m=>add(m.date,
    m.toSite===id?'In':'Out',m.no,(m.toSite===id?'from '+site(m.fromSite).name:'to '+site(m.toSite).name)
    +' · '+(m.status==='DISPATCHED'?'in transit':m.status==='PART'?'part received':'received')));
  DB.consumes.filter(x=>x.site===id).forEach(x=>add(x.date,'Used',x.no,x.location||'consumption booked'));
  DB.clientbills.filter(x=>x.site===id).forEach(x=>add(x.date,'Bill',x.no,money(clientBillValue(x))+(x.irn?' · IRN registered':'')));
  (DB.audits||[]).filter(x=>x.site===id).forEach(x=>add(x.date,'Missing',x.no,
    x.status==='APPROVED'?'written off '+money(x.amount||0):'report '+x.status.toLowerCase()));
  (DB.attendance||[]).filter(x=>x.site===id).slice(-4).forEach(x=>add(x.date,'Labour',
    x.rows.reduce((a,r)=>a+ +r.count,0)+' head',money(x.total)));
  return out.sort((x,y)=>y.d.localeCompare(x.d)).slice(0,22);
}

/* ============================================================
   v4 — CLICK-THROUGH FLOW
   Company → Site → Stage → Document → line detail.
   Each level shows the least it can and hands you a way down.
   The menu still exists, but nobody has to use it to work.
   ============================================================ */
let FLOW={site:null,stage:null,doc:null};
function goFlow(o){FLOW={...FLOW,...o};if(o.site===null){FLOW.stage=null;FLOW.doc=null}
  if(o.stage!==undefined&&o.doc===undefined)FLOW.doc=null;
  location.hash='#flow';render();if(window.scrollTo)window.scrollTo(0,0);}
const FSTAGES=[
  {k:'BOQ',   t:'Work order & BOQ', ic:'▤'},
  {k:'IND',   t:'Indents',          ic:'↗'},
  {k:'PO',    t:'Orders',           ic:'▣'},
  {k:'GRN',   t:'Received',         ic:'↓'},
  {k:'USE',   t:'Consumed',         ic:'◍'},
  {k:'BILL',  t:'Client bills',     ic:'₹'},
  {k:'CLOSE', t:'Closure',          ic:'⌂'}
];
/* what sits at each stage for one site */
function stageDocs(id,k){
  if(k==='BOQ'){const b=boqOf(id);return (b?[{d:b,no:b.no,date:b.date,val:boqValue(b),
      state:b.status==='LOCKED'?['ok','Locked']:['warn','Draft'],sub:b.lines.length+' line(s) · WO '+b.woNo,type:'boq'}]:[])
    .concat((DB.amendments||[]).filter(a=>a.site===id).map(a=>({d:a,no:a.no,date:a.date,val:a.amount||0,
      state:isApproved(a)?['ok','Approved']:isRejected(a)?['bad','Returned']:['warn','With '+((nextStep(a)||{}).label||'—')],
      sub:'amendment · '+a.reason,type:'appr'})));}
  if(k==='IND')return DB.indents.filter(x=>x.site===id).map(x=>({d:x,no:x.no,date:x.date,
    val:x.lines.reduce((a,l)=>a+l.qty*(prod(l.prod).rate||0),0),
    state:isApproved(x)?(x.lines.every(l=>indentBal(x.id,l.id)<=0.001)?['ok','Ordered']:['info','Awaiting PO'])
      :isRejected(x)?['bad','Returned']:['warn','With '+((nextStep(x)||{}).label||'—')],
    sub:x.lines.length+' line(s) · raised by '+user(x.by).name,type:'appr'}));
  if(k==='PO')return DB.pos.filter(x=>(x.forSite||x.site)===id).map(x=>{
    const o=x.lines.reduce((a,l)=>a+ +l.qty,0),g=x.lines.reduce((a,l)=>a+grnQtyOfPoLine(x.id,l.id),0);
    return {d:x,no:x.no,date:x.date,val:poValue(x),
      state:!isApproved(x)?['warn','With '+((nextStep(x)||{}).label||'—')]:(g>=o?['ok','Received']:['info',Math.round(g/o*100)+'% received']),
      sub:sup(x.sup).name+' · due '+dmy(x.due),type:'appr'}});
  if(k==='GRN')return [].concat(
    DB.grns.filter(x=>x.toSite===id).map(x=>({d:x,no:x.no,date:x.date,
      val:x.lines.reduce((a,l)=>a+l.qty*l.rate,0),state:['ok','Received'],
      sub:sup(x.sup).name+' · invoice '+x.inv,type:'grn'})),
    allMoves().filter(m=>m.toSite===id).map(m=>({d:m,no:m.no,date:m.date,
      val:m.lines.reduce((a,l)=>a+l.qty*lastRate(l.prod,l.make),0),
      state:m.status==='DISPATCHED'?['warn','In transit']:m.status==='PART'?['bad','Part received']:['ok','Received'],
      sub:'from '+site(m.fromSite).name,type:'move',kind:m.kind})));
  if(k==='USE')return DB.consumes.filter(x=>x.site===id).map(x=>({d:x,no:x.no,date:x.date,
    val:x.lines.reduce((a,l)=>a+l.qty*lastRate(l.prod,l.make),0),state:['ok','Booked'],
    sub:x.location||'consumption',type:'use'}));
  if(k==='BILL')return DB.clientbills.filter(x=>x.site===id).map(x=>({d:x,no:x.no,date:x.date,val:clientBillValue(x),
    state:!isApproved(x)?['warn','With '+((nextStep(x)||{}).label||'—')]:x.received?['ok','Received']:x.irn?['info','IRN registered']:['info','Certified'],
    sub:'RA '+x.ra+(x.irn?' · IRN':'')+' · retention '+money(x.retention),type:'appr'}));
  return (DB.audits||[]).filter(x=>x.site===id).map(x=>({d:x,no:x.no,date:x.date,val:x.amount||0,
    state:x.status==='APPROVED'?['bad','Written off']:['warn','Missing report'],sub:'closure',type:'appr'}));
}
function stageMeta(id,k){
  const docs=stageDocs(id,k), {v}=siteProgress(id);
  const pct=v[FSTAGES.findIndex(x=>x.k===k)]||0;
  const open=docs.filter(x=>x.state[0]==='warn').length;
  return {docs,pct,open,val:docs.reduce((a,x)=>a+x.val,0)};
}
const FACTIONS={IND:['Raise an indent','indentSheet()'],PO:['Raise a purchase order','poSheet()'],
  GRN:['Receive against a PO','grnSheet()'],USE:['Book consumption','consumeSheet()'],
  BILL:['Raise an RA bill','cbSheet()'],BOQ:['Amend the BOQ','amendSheet()'],CLOSE:['Open closure','location.hash=\'#closure\'']};

PAGES.flow=()=>{
  ensureNew();
  const crumbs=[`<a onclick="goFlow({site:null})">Company</a>`];
  if(FLOW.site)crumbs.push(`<i>›</i><a onclick="goFlow({site:'${FLOW.site}',stage:null})">${esc(site(FLOW.site).name)}</a>`);
  if(FLOW.stage)crumbs.push(`<i>›</i><a onclick="goFlow({stage:'${FLOW.stage}',doc:null})">${esc((FSTAGES.find(x=>x.k===FLOW.stage)||{}).t)}</a>`);
  if(FLOW.doc)crumbs.push(`<i>›</i><b>${esc(FLOW.doc)}</b>`);
  const bar=`<div class="crumb">${crumbs.join('')}</div>`;
  document.getElementById('pgTitle').textContent=FLOW.site?site(FLOW.site).name:'Company';
  document.getElementById('pgSub').textContent=FLOW.site
    ?(FLOW.stage?(FSTAGES.find(x=>x.k===FLOW.stage)||{}).t:'Click a stage to see what sits there')
    :'Click a site to follow it through';
  if(FLOW.doc)return bar+flowDoc();
  if(FLOW.stage)return bar+flowStage();
  if(FLOW.site)return bar+flowSite();
  return bar+flowCompany();
};

/* level 0 — every site, nothing more than you need */
function flowCompany(){
  const sites=scoped(DB.sites).filter(s=>s.type==='SITE');
  const rows=sites.map(s=>{const p=sitePnl(s.id);const pct=p.contract?Math.round(p.billed/p.contract*100):0;
    const st=closureStage(s.id);
    return `<tr class="row-open" onclick="goFlow({site:'${s.id}',stage:null})">
      <td><b>${esc(s.name)}</b><small>${esc(byId(DB.clients,s.client).name||'')} · ${esc(byId(DB.branches,s.branch).name)}</small></td>
      <td>${trackerHtml(s.id)}</td>
      <td class="rt"><b class="mono">${money(p.billed)}</b><small class="mono">${pct}% of ${short(p.contract)}</small></td>
      <td class="rt mono" style="color:${p.margin>=0?'var(--ok)':'var(--bad)'}">${p.billed?((p.margin/p.billed)*100).toFixed(1)+'%':'—'}</td>
      <td>${st.k==='LIVE'?'':`<span class="tag ${st.tone}">${st.t}</span>`}</td>
      <td class="rt"><span class="viewall">Open ›</span></td></tr>`}).join('');
  let contract=0,billed=0,cost=0;sites.forEach(s=>{const p=sitePnl(s.id);contract+=p.contract;billed+=p.billed;cost+=p.cost});
  const pend=pendingForMe().length;
  return tiles([
    {ic:'▤',label:'Order book',value:short(contract),sub:sites.length+' live site'+(sites.length===1?'':'s')},
    {ic:'₹',label:'Billed',value:short(billed),sub:contract?Math.round(billed/contract*100)+'% of the order book':'—',tone:'g'},
    {ic:'◨',label:'Margin',value:billed?((billed-cost)/billed*100).toFixed(1)+'%':'—',sub:short(billed-cost),tone:(billed-cost)>=0?'g':'b'},
    {ic:'✓',label:'Waiting on you',value:String(pend),sub:pend?'documents to sign':'nothing pending',tone:pend?'w':'g',go:"location.hash='#approvals'"}])
    +`<div class="card"><header><div><h3>Sites</h3><p>Click one to follow it stage by stage</p></div></header>
      <div class="tw"><table><thead><tr><th>Site</th><th>Stage</th><th class="rt">Billed</th><th class="rt">Margin</th><th></th><th></th></tr></thead>
      <tbody>${rows}</tbody></table></div>${rows?'':emptyBox('No sites','Add one under Planning.')}</div>`;
}

  const pct=p.contract?Math.round(p.billed/p.contract*100):0;
  const cards=FSTAGES.map((x,i)=>{const m=stageMeta(id,x.k);

    return `<button class="dcard" onclick="goFlow({stage:'${x.k}'})">
      <div class="top"><span class="node ${done?'done':(now?'now':(m.pct>0.5?'':'idle'))}" style="--p:${Math.round(m.pct)}">
        <span class="ring"></span><span class="core">${done?'✓':(m.pct>0.5?Math.round(m.pct):'')}</span></span>
        <span class="nm">${x.t}</span></div>
      <div class="vv">${m.docs.length?short(m.val):'—'}</div>

    {ic:'▤',label:'Contract',value:short(p.contract),sub:b?b.no:'no BOQ'},

    {ic:'◍',label:'Cost',value:short(p.cost),sub:'material, labour, sub-contract',tone:'i'},
    {ic:'◨',label:'Margin',value:p.billed?((p.margin/p.billed)*100).toFixed(1)+'%':'—',sub:short(p.margin),tone:p.margin>=0?'g':'b',
      go:`Sheet.close();pnlSite='${id}';location.hash='#pnl'`}])
    +`<div class="card" style="margin-bottom:16px"><header><div><h3>Follow the work</h3>
        <p>Each stage shows what has passed through it — click one to see the documents</p></div>
        <div class="sp"></div>${st.k!=='LIVE'?`<span class="tag ${st.tone}">${st.t}</span>`:''}</header>
      <div class="pad"><div class="drill">${cards}</div>
      ${st.k!=='LIVE'?`<div class="leak ${st.k==='CLOSED'?'good':''}" style="margin-top:14px"><strong>${esc(st.t)}.</strong> ${esc(st.note)}
        <button class="btn sm" style="margin-left:10px" onclick="location.hash='#closure'">Open closure</button></div>`:''}
      </div></div>
     <div class="grid g2">
       <div class="card"><header><h3>Remarks</h3></header><div class="pad">
         <div style="display:flex;gap:8px"><input class="inp" id="fn_t" placeholder="Note something against this site">
           <button class="btn pri" onclick="addFlowNote('${id}')">Add</button></div>
         ${notes.length?`<div style="margin-top:12px">${notes.map(n=>`<div class="chk"><span class="m" style="background:var(--brand-soft);color:var(--brand)">•</span>
           <div><b>${esc(n.text)}</b><small>${esc(user(n.by).name)} · ${new Date(n.at).toLocaleDateString('en-IN',{dateStyle:'medium'})}</small></div></div>`).join('')}</div>`

function addFlowNote(id){const t=V('fn_t').trim();if(!t)return toast('Write the remark first','bad');

/* level 2 — the documents sitting at that stage */
function flowStage(){
  const id=FLOW.site,k=FLOW.stage,m=stageMeta(id,k),st=FSTAGES.find(x=>x.k===k);
  const act=FACTIONS[k];
  const rows=m.docs.sort((a,b)=>String(b.date).localeCompare(String(a.date))).map(x=>
    `<tr class="row-open" onclick="goFlow({doc:'${esc(x.no)}'})">
      <td><b>${esc(x.no)}</b><small>${esc(x.sub)}</small></td>
      <td>${dmy(x.date)}</td>
      <td class="rt mono">${x.val?money(x.val):'—'}</td>
      <td><span class="tag ${x.state[0]}">${esc(x.state[1])}</span></td>
      <td class="rt"><span class="viewall">Open ›</span></td></tr>`).join('');
  return `<div class="card"><header><div><h3>${esc(st.t)}</h3>
      <p>${m.docs.length} document(s) · ${short(m.val)}${m.open?' · '+m.open+' waiting on someone':''}</p></div>
      <div class="sp"></div>${act?`<button class="btn pri sm" onclick="${act[1]}">${esc(act[0])}</button>`:''}</header>
    <div class="tw"><table><thead><tr><th>Document</th><th>Date</th><th class="rt">Value</th><th>Status</th><th></th></tr></thead>
      <tbody>${rows}</tbody></table></div>
    ${rows?'':emptyBox('Nothing here yet',act?'Use the button above to create the first one.':'Nothing has reached this stage.')}</div>`;
}

/* level 3 — the document itself */
function flowDoc(){
  const id=FLOW.site,k=FLOW.stage;
  const x=stageDocs(id,k).find(y=>y.no===FLOW.doc);
  if(!x)return emptyBox('Not found','That document is no longer at this stage.');
  const d=x.d;
  let lines='';
  if(k==='BOQ'&&x.type==='boq')lines=d.lines.map(l=>`<tr><td><b>${esc(lineName(l))}</b><small>${esc(l.make)} · ${esc(l.work)}</small></td>
    <td class="rt mono">${qty(amendedQty(l))}</td><td class="rt mono">${qty(indentedQty(d.id,l.id))}</td>
    <td class="rt mono">${qty(consumedQty(id,l.id))}</td><td class="rt mono">${qty(clientBilledQty(d.id,l.id,'sup'))}</td>
    <td class="rt mono">${money(boqLineValue(l).base)}</td></tr>`).join('');
  else if(d.lines)lines=d.lines.map(l=>{
      const q=l.qty!=null?l.qty:(+(l.supplyQty||0)+ +(l.instQty||0));
      const r=l.rate!=null?l.rate:(l.supplyRate||lastRate(l.prod,l.make));
      return `<tr><td><b>${esc(lineName(l))}</b><small>${esc(l.make||'')}</small></td>
        <td class="rt mono">${qty(q)}${l.ack!=null&&+l.ack!==+l.qty?`<small>${qty(l.ack)} received</small>`:''}</td>
        <td class="rt mono">${money(r)}</td><td class="rt mono">${money(q*r)}</td></tr>`}).join('');
  const head=(k==='BOQ'&&x.type==='boq')
    ? '<tr><th>Line</th><th class="rt">BOQ</th><th class="rt">Indented</th><th class="rt">Used</th><th class="rt">Billed</th><th class="rt">Value</th></tr>'
    : '<tr><th>Item</th><th class="rt">Qty</th><th class="rt">Rate</th><th class="rt">Amount</th></tr>';
  const chain=d.appr?`<div class="pad" style="border-bottom:1px solid var(--line-2)">${chainHtml(d)}</div>`:'';
  const acts=[];
  if(d.appr&&myTurn(d))acts.push(`<button class="btn bad" onclick="doAppr('${d.id}','rej')">Return</button>`,
    `<button class="btn ok" onclick="doAppr('${d.id}','ok')">Approve</button>`);
  if(x.type==='move'&&d.status==='DISPATCHED')acts.push(`<button class="btn pri" onclick="ackSheet('${x.kind}','${d.id}')">Acknowledge receipt</button>`);
  if(k==='BILL'&&isApproved(d))acts.push(`<button class="btn ${d.irn?'':'pri'}" onclick="einvWizard('${d.id}',null)">${d.irn?'e-Invoice':'Register e-Invoice'}</button>`);
  if(k==='BOQ'&&x.type==='boq'&&d.status==='LOCKED'&&canEdit('amend'))acts.push(`<button class="btn" onclick="amendSheet()">Amend</button>`);
  const trail=d.appr&&d.appr.trail.length?`<div class="card" style="margin-top:16px"><header><h3>Approval history</h3></header>
    <div class="tw"><table><thead><tr><th>Stage</th><th>Action</th><th>By</th><th>Date</th></tr></thead><tbody>
    ${d.appr.trail.map(t=>`<tr><td>${esc(t.step)}</td>
      <td>${t.act==='Returned'?'<span class="tag bad">Returned</span>':`<span class="tag ok">${esc(t.act)}</span>`}${t.note?`<small>${esc(t.note)}</small>`:''}</td>
      <td>${esc(user(t.by).name)}</td><td>${dmy(t.at)}</td></tr>`).join('')}</tbody></table></div></div>`:'';
  return `<div class="card"><header><div><h3>${esc(x.no)}</h3><p>${esc(x.sub)} · ${dmy(x.date)}</p></div>
      <div class="sp"></div><span class="tag ${x.state[0]}">${esc(x.state[1])}</span></header>
    ${chain}
    <div class="tw"><table><thead>${head}</thead><tbody>${lines}</tbody></table></div>
    ${acts.length?`<div class="pad" style="display:flex;gap:9px;justify-content:flex-end;border-top:1px solid var(--line-2)">${acts.join('')}</div>`:''}
    ${d.photos&&d.photos.length?`<div class="pad">${photoStrip(d.photos)}</div>`:''}</div>${trail}`;
}
/* the site view button now walks the flow instead of opening a sheet */
siteView=function(id){goFlow({site:id,stage:null,doc:null})};

/* ============================================================
   MY DESK — personal, not departmental.
   Two questions only: what has been sent to me, and what of mine
   is still moving. Plus the handful of things my role can start.
   ============================================================ */
const mineRaised=d=>d.by===DB.session.user;
function mySites(){return scoped(DB.sites).filter(s=>s.type==='SITE'&&
  (s.head===DB.session.user||['R-GM','R-PLAN','R-ACC','R-PUR'].includes(me().role)))}
function myDocs(){return [].concat(DB.indents,DB.pos,DB.supbills,DB.clientbills,DB.subbills,
  DB.amendments||[],DB.audits||[]).filter(d=>d&&d.appr&&inScope(d.branch))}

function inboxGroups(){
  ensureNew();const g=[];
  const sign=pendingForMe();
  if(sign.length)g.push({t:'Needs your signature',tone:'w',items:sign.map(m=>({
    label:m.d.no+' — '+m.kind,sub:site(m.d.site).name+' · '+(m.d.amount?money(m.d.amount):''),
    act:`apprSheet('${m.d.id}')`,btn:'Review'}))});

  const back=myDocs().filter(d=>mineRaised(d)&&isRejected(d));
  if(back.length)g.push({t:'Sent back to you',tone:'b',items:back.map(d=>({
    label:d.no,sub:((d.appr.trail.slice(-1)[0]||{}).note)||'returned for a change',
    act:`apprSheet('${d.id}')`,btn:'Open'}))});

  /* only the people who actually receive material: store, site staff, and a site's own head */
  const headOf=scoped(DB.sites).filter(s=>s.head===DB.session.user).map(s=>s.id);
  const receiver=canEdit('issue')||canEdit('consume');
  const inbound=allMoves().filter(m=>m.status==='DISPATCHED'&&inScope(m.branch)&&
    (headOf.includes(m.toSite)||receiver));
  if(inbound.length)g.push({t:'Arriving — needs your receipt',tone:'w',items:inbound.map(m=>({
    label:m.no+' — '+site(m.toSite).name,
    sub:`${qty(m.lines.reduce((a,l)=>a+ +l.qty,0))} units from ${site(m.fromSite).name}, sent ${dmy(m.date)}`,
    act:`ackSheet('${m.kind}','${m.id}')`,btn:'Acknowledge'}))});

  const rk=DB.remarks.filter(r=>r.status==='OPEN');
  if(rk.length&&['R-PM','R-GM','R-PLAN'].includes(me().role))
    g.push({t:'Remarks raised to you',tone:'',items:rk.map(r=>({label:user(r.by).name+' — '+r.mod,
      sub:r.text,act:"location.hash='#remarks'",btn:'Open'}))});

  const exp=(DB.expenses||[]).filter(e=>e.status==='PENDING'&&(canEdit('accounts')||e.by===DB.session.user));
  if(exp.length)g.push({t:canEdit('accounts')?'Expenses to approve':'Your expenses awaiting approval',tone:'',
    items:exp.slice(0,5).map(e=>({label:e.head+' — '+money(e.amount),sub:site(e.site).name+' · '+dmy(e.date),
      act:"location.hash='#accounts'",btn:canEdit('accounts')?'Decide':'View'}))});

  const done=myDocs().filter(d=>mineRaised(d)&&isApproved(d)&&
    (d.appr.trail.slice(-1)[0]||{}).at>=addDays(today(),-7));
  if(done.length)g.push({t:'Cleared in the last week',tone:'g',items:done.slice(0,5).map(d=>({
    label:d.no,sub:'approved '+dmy((d.appr.trail.slice(-1)[0]||{}).at),act:`apprSheet('${d.id}')`,btn:'Open'}))});

/* ---- the duplicate guard, tightened ----------------------------
   A client work order writes "300mm" where the item master says
   "300 mm", and the two were becoming separate items. Splitting a
   word wherever digits meet letters folds them onto one key, which
   also catches "MCB32A" against "MCB 32 A". ------------------- */
function normKey(s){
  const raw=String(s||'').toLowerCase()
    .replace(/[^a-z0-9]+/g,' ')
    .replace(/(\d)([a-z])/g,'$1 $2').replace(/([a-z])(\d)/g,'$1 $2')
    .trim().split(' ').filter(Boolean);
  const t=[];let run=[];
  const flush=()=>{if(run.length>1)t.push(run.join(''));else if(run.length)t.push(run[0]);run=[]};
  raw.forEach(w=>{if(w.length===1)run.push(w);else{flush();t.push(w)}});flush();
  return t.sort().join(' ');
}
